name: WB FBS automatic freshness repair

on:
  workflow_run:
    workflows:
      - WB FBS GitHub bridge health
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  repair_stale_clients:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch an idempotent current-day recovery only for stale books
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime as dt, io, json, os, re, time, urllib.request, zipfile

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          run_id = os.environ["SOURCE_RUN_ID"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + token,
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.read()

          logs_url = f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/logs"
          archive = zipfile.ZipFile(io.BytesIO(get(logs_url)))
          log_text = "\n".join(
              archive.read(name).decode("utf-8", errors="replace")
              for name in archive.namelist() if name.endswith(".txt")
          )
          failures = re.findall(r"FBS_HEALTH_FAILED=([^\r\n]+)", log_text)
          if not failures:
              print("FBS_AUTO_REPAIR=not_applicable")
              raise SystemExit(0)

          failed = ",".join(failures)
          stale = {
              client for client in ("SANYCH", "AIR", "HOZYAYUSHKA")
              if re.search(
                  rf"(?:^|[, ]){client}:(?:FBS_BOOK_LAGS_WB|FBS_BOOK_LATEST_ORDER_MISSING)(?:$|[, ])",
                  failed,
              )
          }
          if not stale:
              print("FBS_AUTO_REPAIR=not_applicable")
              raise SystemExit(0)

          runs_url = f"https://api.github.com/repos/{repo}/actions/runs?per_page=100"
          runs = json.loads(get(runs_url)).get("workflow_runs", [])
          mutation_names = {
              "WB FBS GitHub recovery",
              "WB FBS Sanych targeted recovery",
              "WB FBS retry failed recovery windows",
              "WB FBS supply sync via GitHub",
          }
          active_mutation = next((
              item for item in runs
              if item.get("name") in mutation_names
              and item.get("status") in {"queued", "in_progress", "pending", "waiting", "requested"}
          ), None)
          if active_mutation:
              print(
                  "FBS_AUTO_REPAIR=deferred_active_mutation "
                  + active_mutation.get("name", "unknown")
                  + " run=" + str(active_mutation.get("id", "unknown"))
              )
              raise SystemExit(0)

          today = dt.datetime.now(dt.timezone.utc).date().isoformat()
          targets = {
              "AIR": (
                  "wb-fbs-github-recovery.yml",
                  {"client": "AIR", "lookback_days": "7", "start_date": today, "end_date": today},
              ),
              "HOZYAYUSHKA": (
                  "wb-fbs-github-recovery.yml",
                  {"client": "HOZYAYUSHKA", "lookback_days": "7", "start_date": today, "end_date": today},
              ),
              "SANYCH": (
                  "wb-fbs-sanych-targeted-recovery.yml",
                  {"start_date": today, "end_date": today, "include_live": "true"},
              ),
          }
          for client in sorted(stale):
              workflow, inputs = targets[client]
              payload = json.dumps({"ref": "mainggg", "inputs": inputs}).encode("utf-8")
              url = f"https://api.github.com/repos/{repo}/actions/workflows/{workflow}/dispatches"
              request = urllib.request.Request(
                  url, data=payload,
                  headers={**headers, "Content-Type": "application/json"},
                  method="POST",
              )
              for attempt in range(1, 4):
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          if response.status not in (201, 204):
                              raise RuntimeError("DISPATCH_HTTP_" + str(response.status))
                      print("FBS_AUTO_REPAIR_DISPATCHED=" + client + " date=" + today)
                      break
                  except Exception as error:
                      if attempt == 3:
                          raise SystemExit("FBS_AUTO_REPAIR_DISPATCH_FAILED=" + client + ":" + type(error).__name__)
                      time.sleep(attempt * 5)
          PY
