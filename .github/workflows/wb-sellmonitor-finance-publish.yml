name: WB Sellmonitor finance summaries

on:
  workflow_dispatch:
  push:
    branches: [mainggg]
    paths:
      - ".github/workflows/wb-sellmonitor-finance-publish.yml"
  schedule:
    - cron: "47 * * * *"

permissions:
  contents: read

concurrency:
  group: wb-sellmonitor-finance-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WEBAPP_DEPLOYMENT_ID: AKfycbyU_OXpFYqvBx0KDuGCgEHsnzkts_fnJzVe8DM8crRDD1A_fr5DqOfVfW_PYJriaXU_jw
      WEBHOOK_SECRET: ${{ secrets.SELLMONITOR_GITHUB_WEBHOOK_SECRET }}
    steps:
      - name: Check configured authorization
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WEBAPP_DEPLOYMENT_ID"
          test -n "$WEBHOOK_SECRET"
          echo "::add-mask::$WEBHOOK_SECRET"

      - name: Publish and verify all WB finance summaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request

          url = "https://script.google.com/macros/s/" + os.environ["WEBAPP_DEPLOYMENT_ID"] + "/exec"
          body = json.dumps({
              "token": os.environ["WEBHOOK_SECRET"],
              "action": "publish_wb_inner_periods"
          }).encode("utf-8")
          result = None
          last = None
          for attempt in range(1, 5):
              req = urllib.request.Request(
                  url, data=body,
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=240) as response:
                      result = json.loads(response.read().decode("utf-8"))
              except (urllib.error.URLError, TimeoutError, json.JSONDecodeError) as exc:
                  last = type(exc).__name__ + ": " + str(exc)[:240]
              else:
                  if isinstance(result, dict) and result.get("ok") is True:
                      break
                  last = json.dumps({
                      "action": result.get("action") if isinstance(result, dict) else None,
                      "reason": result.get("reason") if isinstance(result, dict) else None,
                      "stores": [
                          {"store": x.get("store"), "error": x.get("error"), "ok": x.get("ok")}
                          for x in (result.get("stores") or [])
                      ] if isinstance(result, dict) else [],
                  }, ensure_ascii=False)[:1200]
                  if isinstance(result, dict) and result.get("ok") is False:
                      break
              if attempt < 4:
                  time.sleep(15 * attempt)
          if not result or result.get("ok") is not True:
              raise SystemExit("WB finance publication failed: " + str(last))
          expected = {"AIR", "Хозяюшка", "Саныч"}
          stores = result.get("stores") or []
          actual = {
              x.get("store") for x in stores
              if x.get("ok") is True
              and all(
                  isinstance(x.get(period), dict)
                  and int(x[period].get("verified", -1)) == int(x[period].get("rows", -2))
                  for period in ("day", "week", "month")
              )
          }
          if actual != expected:
              raise SystemExit("WB summary readback acceptance failed: " + json.dumps(stores, ensure_ascii=False))
          for store in stores:
              print(
                  "STORE=" + str(store.get("store"))
                  + " OK=" + str(store.get("ok"))
                  + " SOURCE_ROWS=" + str(store.get("source_rows"))
                  + " SOURCE_PERIOD=" + str(store.get("source_min")) + ".." + str(store.get("source_max"))
                  + " DAY=" + str(store.get("day", {}).get("rows")) + "/" + str(store.get("day", {}).get("verified"))
                  + " WEEK=" + str(store.get("week", {}).get("rows")) + "/" + str(store.get("week", {}).get("verified"))
                  + " MONTH=" + str(store.get("month", {}).get("rows")) + "/" + str(store.get("month", {}).get("verified"))
                  + " ARCHIVED=" + str(sum(store.get(k, {}).get("archived_rows", 0) for k in ("day", "week", "month")))
                  + " SHA256=" + str("/".join(store.get(k, {}).get("sha256", "") for k in ("day", "week", "month")))
              )
          PY
