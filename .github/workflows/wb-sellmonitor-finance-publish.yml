# RNP matrices refreshed from verified summary facts; deployment-safe single-store check
name: WB Sellmonitor finance summaries

on:
  workflow_dispatch:
  push:
    branches: [mainggg]
    paths:
      - ".github/workflows/wb-sellmonitor-finance-publish.yml"
  schedule:
    - cron: "58 * * * *"

permissions:
  contents: read

concurrency:
  group: sellmonitor-summary-publish-serial
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      WEBAPP_DEPLOYMENT_ID: AKfycbyU_OXpFYqvBx0KDuGCgEHsnzkts_fnJzVe8DM8crRDD1A_fr5DqOfVfW_PYJriaXU_jw
      WEBHOOK_SECRET: ${{ secrets.SELLMONITOR_GITHUB_WEBHOOK_SECRET }}
      PUBLISH_ONLY_STORE: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[air-only]') && 'air_wb' || github.event_name == 'push' && contains(github.event.head_commit.message, '[hozyayushka-only]') && 'hozyayushka_wb' || github.event_name == 'push' && contains(github.event.head_commit.message, '[sanych-only]') && 'sanych_wb' || '' }}
    steps:
      - name: Check configured authorization
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WEBAPP_DEPLOYMENT_ID"
          test -n "$WEBHOOK_SECRET"
          echo "::add-mask::$WEBHOOK_SECRET"

      - name: Publish and verify all WB finance summaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import http.client, json, os, time, urllib.error, urllib.request

          url = "https://script.google.com/macros/s/" + os.environ["WEBAPP_DEPLOYMENT_ID"] + "/exec"
          selected_store = os.environ.get("PUBLISH_ONLY_STORE", "").strip()
          expected = (selected_store,) if selected_store in ("air_wb", "hozyayushka_wb", "sanych_wb") else ("air_wb", "hozyayushka_wb", "sanych_wb")
          print("PUBLISH_SCOPE=" + (selected_store or "all_stores"))
          verified = []
          errors = []
          for store_id in expected:
              body = json.dumps({
                  "token": os.environ["WEBHOOK_SECRET"],
                  "action": "publish_wb_inner_periods",
                  "store": store_id,
              }).encode("utf-8")
              result = None
              last = None
              for attempt in range(1, 4):
                  req = urllib.request.Request(
                      url, data=body,
                      headers={"Content-Type": "application/json"},
                      method="POST",
                  )
                  last_exception_type = None
                  try:
                      with urllib.request.urlopen(req, timeout=420) as response:
                          result = json.loads(response.read().decode("utf-8"))
                  except (urllib.error.URLError, http.client.HTTPException, OSError, json.JSONDecodeError) as exc:
                      last = type(exc).__name__ + ": " + str(exc)[:240]
                      last_exception_type = type(exc).__name__
                  else:
                      if isinstance(result, dict) and result.get("ok") is True:
                          break
                      last = json.dumps({
                          "action": result.get("action") if isinstance(result, dict) else None,
                          "store": store_id,
                          "stores": [
                              {"store": x.get("store"), "error": x.get("error"), "ok": x.get("ok")}
                              for x in (result.get("stores") or [])
                          ] if isinstance(result, dict) else [],
                      }, ensure_ascii=False)[:1200]
                      if isinstance(result, dict) and result.get("ok") is False:
                          store_errors = result.get("stores") or []
                          retryable = any(
                              any(marker in str(item.get("error", "")).lower() for marker in (
                                  "service spreadsheets failed while accessing document",
                                  "service spreadsheets timed out while accessing document",
                              ))
                              for item in store_errors if isinstance(item, dict)
                          )
                          if not retryable:
                              break
                          if attempt < 3:
                              delay = 15 * attempt
                              print("WB_FINANCE_RETRY=store:" + store_id + ";attempt:" + str(attempt + 1) + "/3;wait:" + str(delay) + "s;reason:spreadsheet_access_timeout", flush=True)
                              time.sleep(delay)
                              continue
                  if last_exception_type and attempt < 3:
                      delay = 15 * attempt
                      print("WB_FINANCE_RETRY=store:" + store_id + ";attempt:" + str(attempt + 1) + "/3;wait:" + str(delay) + "s;reason:" + last_exception_type, flush=True)
                      time.sleep(delay)
                      continue
              if not isinstance(result, dict) or result.get("ok") is not True:
                  message = "WB finance publication failed for " + store_id + ": " + str(last)
                  errors.append(message)
                  print("STORE=" + store_id + " OK=no ERROR=" + str(last))
                  continue
              stores = result.get("stores") or []
              if len(stores) != 1 or not isinstance(stores[0], dict):
                  message = "WB store result count mismatch for " + store_id
                  errors.append(message)
                  print("STORE=" + store_id + " OK=no ERROR=" + message)
                  continue
              item = stores[0]
              if item.get("ok") is not True:
                  message = "WB store failed for " + store_id + ": " + json.dumps(item, ensure_ascii=False)
                  errors.append(message)
                  print("STORE=" + store_id + " OK=no ERROR=" + message)
                  continue
              if not all(
                  isinstance(item.get(period), dict)
                  and int(item[period].get("verified", -1)) == int(item[period].get("rows", -2))
                  and bool(item[period].get("sha256"))
                  for period in ("day", "week", "month")
              ):
                  message = "WB summary readback mismatch for " + store_id + ": " + json.dumps(item, ensure_ascii=False)
                  errors.append(message)
                  print("STORE=" + store_id + " OK=no ERROR=" + message)
                  continue
              verified.append(item)
              print(
                  "STORE=" + str(item.get("store"))
                  + " OK=yes SOURCE_ROWS=" + str(item.get("source_rows"))
                  + " SOURCE_PERIOD=" + str(item.get("source_min")) + ".." + str(item.get("source_max"))
                  + " DAY=" + str(item["day"]["rows"]) + "/" + str(item["day"]["verified"])
                  + " WEEK=" + str(item["week"]["rows"]) + "/" + str(item["week"]["verified"])
                  + " MONTH=" + str(item["month"]["rows"]) + "/" + str(item["month"]["verified"])
                  + " ARCHIVED=" + str(sum(item.get(p, {}).get("archived_rows", 0) for p in ("day", "week", "month")))
                  + " SHA256=" + str("/".join(item[p]["sha256"] for p in ("day", "week", "month")))
              )
              time.sleep(5)
          actual = {item.get("store") for item in verified}
          expected_names = {{"air_wb":"AIR","hozyayushka_wb":"Хозяюшка","sanych_wb":"Саныч"}[selected_store]} if selected_store in ("air_wb","hozyayushka_wb","sanych_wb") else {"AIR", "Хозяюшка", "Саныч"}
          if actual != expected_names:
              errors.append("WB summary stores readback acceptance failed: " + repr(actual))
          if errors:
              raise SystemExit("; ".join(errors))
          PY
