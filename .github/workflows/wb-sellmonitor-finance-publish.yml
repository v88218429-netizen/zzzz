# Retry Sanych with header-first, one-call date formatting from worker 1.3.77
# Retry Sanych after source-month filtering and bulk date-axis insertion
# Targeted Sanych retry after row-chunk optimization [sanych-only]
# Split finance phases; queue Hozyayushka single-store readback verification v7
# Queue a focused Hoz metadata-boundary verification after the worker fix.
# Queue Sanych 2026-only chunked-source revalidation after the worker fix.
# Queue AIR readback revalidation after the transient bridge disconnect.
name: WB Sellmonitor finance summaries

on:
  workflow_dispatch:
  push:
    branches: [mainggg]
    paths:
      - ".github/workflows/wb-sellmonitor-finance-publish.yml"
  schedule:
    - cron: "58 * * * *"

permissions:
  contents: read

concurrency:
  group: wb-finance-summary-mutations
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      WEBAPP_DEPLOYMENT_ID: AKfycbyU_OXpFYqvBx0KDuGCgEHsnzkts_fnJzVe8DM8crRDD1A_fr5DqOfVfW_PYJriaXU_jw
      WEBHOOK_SECRET: ${{ secrets.SELLMONITOR_GITHUB_WEBHOOK_SECRET }}
      PUBLISH_ONLY_STORE: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[air-only]') && 'air_wb' || github.event_name == 'push' && contains(github.event.head_commit.message, '[hozyayushka-only]') && 'hozyayushka_wb' || github.event_name == 'push' && contains(github.event.head_commit.message, '[sanych-only]') && 'sanych_wb' || '' }}
    steps:
      - name: Check configured authorization
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WEBAPP_DEPLOYMENT_ID"
          test -n "$WEBHOOK_SECRET"
          echo "::add-mask::$WEBHOOK_SECRET"

      - name: Publish and verify all WB finance summaries in bounded phases
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import http.client, json, os, time, urllib.error, urllib.request
          from datetime import date

          url = "https://script.google.com/macros/s/" + os.environ["WEBAPP_DEPLOYMENT_ID"] + "/exec"
          selected_store = os.environ.get("PUBLISH_ONLY_STORE", "").strip()
          expected = (selected_store,) if selected_store in ("air_wb", "hozyayushka_wb", "sanych_wb") else ("air_wb", "hozyayushka_wb", "sanych_wb")
          today = date.today()
          end_year, end_month = today.year, today.month + 1
          if end_month == 13:
              end_year, end_month = end_year + 1, 1
          months = []
          year, month = 2026, 9
          while (year, month) <= (end_year, end_month):
              months.append(f"rnp_day_{year}_{month:02d}")
              month += 1
              if month == 13:
                  year, month = year + 1, 1
          phases = ("summary",) + tuple(months) + ("rnp_week", "rnp_month", "dashboard")
          print("PUBLISH_SCOPE=" + (selected_store or "all_stores"), flush=True)
          verified = []
          errors = []
          for store_id in expected:
              store_result = {"store_id": store_id}
              for phase in phases:
                  body = json.dumps({
                      "token": os.environ["WEBHOOK_SECRET"],
                      "action": "publish_wb_inner_periods",
                      "store": store_id,
                      "phase": phase,
                  }).encode("utf-8")
                  result = None
                  last = None
                  for attempt in range(1, 3):
                      req = urllib.request.Request(
                          url, data=body,
                          headers={"Content-Type": "application/json"},
                          method="POST",
                      )
                      try:
                          with urllib.request.urlopen(req, timeout=420) as response:
                              result = json.loads(response.read().decode("utf-8"))
                      except (urllib.error.URLError, http.client.HTTPException, OSError, json.JSONDecodeError) as exc:
                          last = type(exc).__name__ + ": " + str(exc)[:240]
                          if attempt < 2:
                              print("WB_FINANCE_PHASE_RETRY=store:" + store_id + ";phase:" + phase + ";attempt:2/2;wait:30s;reason:" + type(exc).__name__, flush=True)
                              time.sleep(30)
                              continue
                          break
                      if isinstance(result, dict) and result.get("ok") is True:
                          stores = result.get("stores") or []
                          if len(stores) != 1 or not isinstance(stores[0], dict):
                              last = "WB store result count mismatch"
                              break
                          item = stores[0]
                          if item.get("ok") is not True:
                              last = json.dumps(item, ensure_ascii=False)[:1200]
                              break
                          last = None
                          break
                      last = json.dumps(result if isinstance(result, dict) else {"result": str(result)}, ensure_ascii=False)[:1200]
                      details = json.dumps(result, ensure_ascii=False).lower()
                      retryable = any(marker in details for marker in (
                          "timed out", "timeout", "remote end closed", "connection reset",
                          "connection refused", "temporarily unavailable", "service spreadsheets",
                      ))
                      if retryable and attempt < 2:
                          print("WB_FINANCE_PHASE_RETRY=store:" + store_id + ";phase:" + phase + ";attempt:2/2;wait:30s;reason:bridge_or_spreadsheet_transient", flush=True)
                          time.sleep(30)
                          continue
                      break
                  if last:
                      errors.append("WB finance phase failed for " + store_id + "/" + phase + ": " + last)
                      print("STORE=" + store_id + " PHASE=" + phase + " OK=no ERROR=" + last, flush=True)
                      break
                  item = result["stores"][0]
                  if phase == "summary":
                      for period in ("day", "week", "month"):
                          data = item.get(period)
                          if not isinstance(data, dict) or int(data.get("verified", -1)) != int(data.get("rows", -2)) or not data.get("sha256"):
                              last = "WB summary readback mismatch in " + period + ": " + json.dumps(item, ensure_ascii=False)[:1200]
                              break
                      if last:
                          errors.append("WB finance summary readback failed for " + store_id + ": " + last)
                          print("STORE=" + store_id + " PHASE=summary OK=no ERROR=" + last, flush=True)
                          break
                      store_result.update({
                          "source_rows": item.get("source_rows"),
                          "source_min": item.get("source_min"),
                          "source_max": item.get("source_max"),
                          "summary": {p: {"rows": item[p]["rows"], "verified": item[p]["verified"], "sha256": item[p]["sha256"]} for p in ("day", "week", "month")},
                      })
                  elif phase.startswith("rnp_"):
                      rnp = item.get("rnp") or {}
                      grain = "day" if phase.startswith("rnp_day_") else phase[4:]
                      matrices = rnp.get("matrices") or []
                      if rnp.get("ok") is not True or rnp.get("readback") is not True or len(matrices) != 1 or matrices[0].get("sheet") != {"day":"01_Дни","week":"02_Недели","month":"03_Месяцы"}[grain]:
                          last = "RNP matrix readback mismatch: " + json.dumps(rnp, ensure_ascii=False)[:1200]
                          errors.append("WB finance RNP readback failed for " + store_id + "/" + grain + ": " + last)
                          print("STORE=" + store_id + " PHASE=" + phase + " OK=no ERROR=" + last, flush=True)
                          break
                      store_result.setdefault("rnp", {}).setdefault(grain, []).append(matrices[0])
                  else:
                      dashboard = item.get("dashboard") or {}
                      if dashboard.get("ok") is not True:
                          last = "dashboard readback failed: " + json.dumps(dashboard, ensure_ascii=False)[:1200]
                          errors.append("WB finance dashboard failed for " + store_id + ": " + last)
                          print("STORE=" + store_id + " PHASE=dashboard OK=no ERROR=" + last, flush=True)
                          break
                      store_result["dashboard"] = dashboard
                  print("STORE=" + store_id + " PHASE=" + phase + " OK=yes", flush=True)
              if store_id in expected and not any(e.startswith("WB finance phase failed for " + store_id) or e.startswith("WB finance summary readback failed for " + store_id) or e.startswith("WB finance RNP readback failed for " + store_id) or e.startswith("WB finance dashboard failed for " + store_id) for e in errors):
                  if all(k in store_result for k in ("summary", "rnp", "dashboard")) and all(k in store_result["rnp"] for k in ("day", "week", "month")):
                      verified.append(store_result)
                      print("STORE=" + store_id + " OK=yes SOURCE_ROWS=" + str(store_result["source_rows"]) + " SOURCE_PERIOD=" + str(store_result["source_min"]) + ".." + str(store_result["source_max"]) + " DASHBOARD_OK=yes", flush=True)
          if errors or len(verified) != len(expected):
              raise SystemExit("WB finance phased publication incomplete: " + json.dumps({"verified": len(verified), "expected": len(expected), "errors": errors}, ensure_ascii=False))
          print("WB_FINANCE_PHASED_PUBLICATION_OK stores=" + str(len(verified)), flush=True)
          PY
