# Retry Sanych with header-first, one-call date formatting from worker 1.3.77
# Queue AIR publication after the Sanych recovery check [air-only] [no-token-seed]
# Queue Hozyayushka publication after AIR [hozyayushka-only] [no-token-seed]
# Retry Sanych after source-month filtering and bulk date-axis insertion
# Targeted Sanych retry after row-chunk optimization [sanych-only]
# Split finance phases; queue Hozyayushka single-store readback verification v7
# Queue a focused Hoz metadata-boundary verification after the worker fix.
# Queue Sanych 2026-only chunked-source revalidation after the worker fix.
# Queue AIR readback revalidation after the transient bridge disconnect.
name: WB Sellmonitor finance summaries

on:
  workflow_dispatch:
    inputs:
      store:
        description: Кабинет
        type: choice
        options: [all, air_wb, hozyayushka_wb, sanych_wb]
        default: all
        required: true
      resume_phase:
        description: Фаза продолжения после сбоя
        type: string
        default: summary
        required: true
      resume_attempt:
        description: Число автоматических повторов
        type: choice
        options: ["0", "1"]
        default: "0"
        required: true
  push:
    branches: [mainggg]
    paths:
      - ".github/workflows/wb-sellmonitor-finance-publish.yml"
  schedule:
    - cron: "58 * * * *"

permissions:
  contents: read

concurrency:
  group: wb-bridge-production-mutations
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    outputs:
      resume_phase: ${{ steps.publish.outputs.resume_phase }}
      resume_store: ${{ steps.publish.outputs.resume_store }}
    if: ${{ (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[skip-finance-publish]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      WEBAPP_DEPLOYMENT_ID: AKfycbyU_OXpFYqvBx0KDuGCgEHsnzkts_fnJzVe8DM8crRDD1A_fr5DqOfVfW_PYJriaXU_jw
      WEBHOOK_SECRET: ${{ secrets.SELLMONITOR_GITHUB_WEBHOOK_SECRET }}
      PUBLISH_ONLY_STORE: ${{ github.event_name == 'workflow_dispatch' && inputs.store != 'all' && inputs.store || github.event_name == 'push' && contains(github.event.head_commit.message, '[air-only]') && 'air_wb' || github.event_name == 'push' && contains(github.event.head_commit.message, '[hozyayushka-only]') && 'hozyayushka_wb' || github.event_name == 'push' && contains(github.event.head_commit.message, '[sanych-only]') && 'sanych_wb' || '' }}
      RESUME_ATTEMPT: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_attempt || '0' }}
      RESUME_PHASE: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_phase || github.event_name == 'push' && format('push:{0}', github.event.head_commit.message) || 'summary' }}
    steps:
      - name: Check configured authorization
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WEBAPP_DEPLOYMENT_ID"
          test -n "$WEBHOOK_SECRET"
          echo "::add-mask::$WEBHOOK_SECRET"

      - name: Publish and verify all WB finance summaries in bounded phases
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, http.client, json, os, time, urllib.error, urllib.request
          from datetime import date

          url = "https://script.google.com/macros/s/" + os.environ["WEBAPP_DEPLOYMENT_ID"] + "/exec"
          selected_store = os.environ.get("PUBLISH_ONLY_STORE", "").strip()
          resume_phase_input = os.environ.get("RESUME_PHASE", "summary").strip() or "summary"
          if resume_phase_input.startswith("push:"):
              marker_prefix = "[resume-phase:"
              marker_start = resume_phase_input.find(marker_prefix)
              marker_end = resume_phase_input.find("]", marker_start + len(marker_prefix)) if marker_start >= 0 else -1
              resume_phase = resume_phase_input[marker_start + len(marker_prefix):marker_end] if marker_end > marker_start else "summary"
          else:
              resume_phase = resume_phase_input
          expected = (selected_store,) if selected_store in ("air_wb", "hozyayushka_wb", "sanych_wb") else ("air_wb", "hozyayushka_wb", "sanych_wb")
          today = date.today()
          end_year, end_month = today.year, today.month
          if end_month == 13:
              end_year, end_month = end_year + 1, 1
          months = []
          sanych_chunks = []
          year, month = 2026, 9
          while (year, month) <= (end_year, end_month):
              months.append(f"rnp_day_{year}_{month:02d}")
              next_year = year + 1 if month == 12 else year
              next_month = 1 if month == 12 else month + 1
              month_days = (date(next_year, next_month, 1) - date(year, month, 1)).days
              for start_day in range(1, month_days + 1, 7):
                  end_day = min(start_day + 6, month_days)
                  sanych_chunks.append(f"rnp_day_{year}_{month:02d}_{start_day:02d}_{end_day:02d}")
              month += 1
              if month == 13:
                  year, month = year + 1, 1
          print("PUBLISH_SCOPE=" + (selected_store or "all_stores"), flush=True)
          verified = []
          errors = []
          failed_phases = []
          summary_header_written = False
          def checkpoint_resume(store_id, phase):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output_file:
                  output_file.write("resume_store=" + str(store_id) + "\n")
                  output_file.write("resume_phase=" + str(phase) + "\n")

          for store_index, store_id in enumerate(expected):
              daily_phases = sanych_chunks if store_id == "sanych_wb" else months
              phases = ("summary",) + tuple(daily_phases) + ("rnp_week", "rnp_month", "dashboard")
              store_result = {"store_id": store_id}
              phase_start = phases.index(resume_phase) if resume_phase in phases else 0
              phases = phases[phase_start:]
              # A resumed process re-checks the compact source summary before validating all phases.
              if resume_phase != "summary":
                  phases = ["summary"] + phases
              print("RESUME_FROM=store:" + store_id + ";phase:" + (phases[0] if phases else "complete"), flush=True)
              for phase_index, phase in enumerate(phases):
                  checkpoint_resume(store_id, phase)
                  body = json.dumps({
                      "token": os.environ["WEBHOOK_SECRET"],
                      "action": "publish_wb_inner_periods",
                      "store": store_id,
                      "phase": phase,
                  }).encode("utf-8")
                  result = None
                  last = None
                  for attempt in range(1, 5):
                      req = urllib.request.Request(
                          url, data=body,
                          headers={"Content-Type": "application/json"},
                          method="POST",
                      )
                      try:
                          with urllib.request.urlopen(req, timeout=420) as response:
                              raw = response.read().decode("utf-8")
                              if not raw.strip():
                                  raise json.JSONDecodeError("empty response", raw, 0)
                              result = json.loads(raw)
                      except urllib.error.HTTPError as exc:
                          detail = exc.read(1200).decode("utf-8", "replace").replace("\\n", " ")[:600]
                          last = "HTTP_" + str(exc.code) + ":" + detail
                          retryable_http = exc.code == 429 or exc.code in (500, 502, 503, 504)
                          if retryable_http and attempt < 4:
                              retry_after = exc.headers.get("Retry-After", "")
                              try:
                                  delay = min(120, max(1, int(retry_after)))
                              except (TypeError, ValueError):
                                  delay = min(60, 15 * (2 ** (attempt - 1)))
                              print("WB_FINANCE_PHASE_RETRY=store:" + store_id + ";phase:" + phase + ";attempt:" + str(attempt + 1) + "/4;wait:" + str(delay) + "s;reason:HTTP_" + str(exc.code), flush=True)
                              time.sleep(delay)
                              continue
                          break
                      except (urllib.error.URLError, http.client.HTTPException, OSError, json.JSONDecodeError) as exc:
                          last = type(exc).__name__ + ": " + str(exc)[:240]
                          if attempt < 4:
                              delay = min(60, 15 * (2 ** (attempt - 1)))
                              print("WB_FINANCE_PHASE_RETRY=store:" + store_id + ";phase:" + phase + ";attempt:" + str(attempt + 1) + "/4;wait:" + str(delay) + "s;reason:" + type(exc).__name__, flush=True)
                              time.sleep(delay)
                              continue
                          break
                      if isinstance(result, dict) and result.get("ok") is True:
                          stores = result.get("stores") or []
                          if len(stores) != 1 or not isinstance(stores[0], dict):
                              last = "WB store result count mismatch"
                              break
                          item = stores[0]
                          if item.get("ok") is not True:
                              last = json.dumps(item, ensure_ascii=False)[:1200]
                              break
                          last = None
                          break
                      last = json.dumps(result if isinstance(result, dict) else {"result": str(result)}, ensure_ascii=False)[:1200]
                      details = json.dumps(result, ensure_ascii=False).lower()
                      retryable = any(marker in details for marker in (
                          "timed out", "timeout", "remote end closed", "connection reset",
                          "connection refused", "temporarily unavailable", "service spreadsheets",
                          "429", "too many requests", "rate limit", "502", "503", "504", "empty response",
                      ))
                      if retryable and attempt < 4:
                          delay = min(60, 15 * (2 ** (attempt - 1)))
                          print("WB_FINANCE_PHASE_RETRY=store:" + store_id + ";phase:" + phase + ";attempt:" + str(attempt + 1) + "/4;wait:" + str(delay) + "s;reason:bridge_or_spreadsheet_transient", flush=True)
                          time.sleep(delay)
                          continue
                      break
                  if last:
                      errors.append("WB finance phase failed for " + store_id + "/" + phase + ": " + last)
                      failed_phases.append((store_id, phase))
                      print("STORE=" + store_id + " PHASE=" + phase + " OK=no ERROR=" + last, flush=True)
                      break
                  item = result["stores"][0]
                  if phase == "summary":
                      for period in ("day", "week", "month"):
                          data = item.get(period)
                          if not isinstance(data, dict) or int(data.get("verified", -1)) != int(data.get("rows", -2)) or not data.get("sha256"):
                              last = "WB summary readback mismatch in " + period + ": " + json.dumps(item, ensure_ascii=False)[:1200]
                              break
                      if last:
                          errors.append("WB finance summary readback failed for " + store_id + ": " + last)
                          failed_phases.append((store_id, phase))
                          print("STORE=" + store_id + " PHASE=summary OK=no ERROR=" + last, flush=True)
                          break
                      store_result.update({
                          "source_rows": item.get("source_rows"),
                          "source_min": item.get("source_min"),
                          "source_max": item.get("source_max"),
                          "summary": {p: {"rows": item[p]["rows"], "verified": item[p]["verified"], "sha256": item[p]["sha256"]} for p in ("day", "week", "month")},
                      })
                  elif phase.startswith("rnp_"):
                      rnp = item.get("rnp") or {}
                      grain = "day" if phase.startswith("rnp_day_") else phase[4:]
                      matrices = rnp.get("matrices") or []
                      expected_latest = None
                      source_max = item.get("source_max")
                      if source_max and grain == "week":
                          source_day = date.fromisoformat(str(source_max))
                          expected_latest = (source_day - __import__("datetime").timedelta(days=source_day.weekday())).isoformat()
                      elif source_max and grain == "month":
                          expected_latest = str(source_max)[:7] + "-01"
                      elif source_max and grain == "day":
                          expected_latest = str(source_max)
                      latest_matches = len(matrices) == 1 and (expected_latest is None or matrices[0].get("max") == expected_latest)
                      if rnp.get("ok") is not True or rnp.get("readback") is not True or len(matrices) != 1 or matrices[0].get("sheet") != {"day":"01_Дни","week":"02_Недели","month":"03_Месяцы"}[grain] or not latest_matches:
                          last = "RNP matrix readback mismatch: " + json.dumps(rnp, ensure_ascii=False)[:1200]
                          errors.append("WB finance RNP readback failed for " + store_id + "/" + grain + ": " + last)
                          failed_phases.append((store_id, phase))
                          print("STORE=" + store_id + " PHASE=" + phase + " OK=no ERROR=" + last, flush=True)
                          break
                      store_result.setdefault("rnp", {}).setdefault(grain, []).append(matrices[0])
                  else:
                      dashboard = item.get("dashboard") or {}
                      if dashboard.get("ok") is not True:
                          last = "dashboard readback failed: " + json.dumps(dashboard, ensure_ascii=False)[:1200]
                          errors.append("WB finance dashboard failed for " + store_id + ": " + last)
                          failed_phases.append((store_id, phase))
                          print("STORE=" + store_id + " PHASE=dashboard OK=no ERROR=" + last, flush=True)
                          break
                      store_result["dashboard"] = dashboard
                  source_facts = {
                      "ids": item.get("source_ids") or [],
                      "rows": item.get("source_rows"),
                      "min": item.get("source_min"),
                      "max": item.get("source_max"),
                  }
                  source_version = hashlib.sha256(json.dumps(source_facts, sort_keys=True, ensure_ascii=False).encode("utf-8")).hexdigest()
                  verification = "readback=verified"
                  if phase == "summary":
                      verification = "day=" + str(item["day"].get("verified")) + "/" + str(item["day"].get("rows")) + ";week=" + str(item["week"].get("verified")) + "/" + str(item["week"].get("rows")) + ";month=" + str(item["month"].get("verified")) + "/" + str(item["month"].get("rows"))
                  elif phase.startswith("rnp_"):
                      verification = "matrix_readback=" + str((item.get("rnp") or {}).get("readback")) + ";matrices=" + str(len((item.get("rnp") or {}).get("matrices") or []))
                  else:
                      verification = "dashboard=" + str((item.get("dashboard") or {}).get("ok"))
                  next_action = phases[phase_index + 1] if phase_index + 1 < len(phases) else "этапы магазина завершены"
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as checkpoint_file:
                      if not summary_header_written:
                          checkpoint_file.write("### Контроль публикации WB\n\n| Кабинет | Период | Фаза | Версия источника | Итог | Проверка чтением | Следующее действие |\n|---|---|---|---|---|---|---|\n")
                          summary_header_written = True
                      checkpoint_file.write("| " + store_id + " | " + str(item.get("source_min")) + "–" + str(item.get("source_max")) + " | " + phase + " | " + source_version + " | VERIFIED | " + verification + " | " + next_action + " |\n")
                  next_phase = phases[phase_index + 1] if phase_index + 1 < len(phases) else "complete"
                  checkpoint_resume(store_id, next_phase)
                  phase_item = (result.get("stores") or [{}])[0] if isinstance(result, dict) else {}
                  if phase_item.get("no_source_data"):
                      print("STORE=" + store_id + " PHASE=" + phase + " STATUS=NO_SOURCE_DATA", flush=True)
                  else:
                      print("STORE=" + store_id + " PHASE=" + phase + " OK=yes", flush=True)
              if store_id in expected and not any(e.startswith("WB finance phase failed for " + store_id) or e.startswith("WB finance summary readback failed for " + store_id) or e.startswith("WB finance RNP readback failed for " + store_id) or e.startswith("WB finance dashboard failed for " + store_id) for e in errors):
                  if all(k in store_result for k in ("summary", "rnp", "dashboard")) and all(k in store_result["rnp"] for k in ("day", "week", "month")):
                      verified.append(store_result)
                      print("STORE=" + store_id + " OK=yes SOURCE_ROWS=" + str(store_result["source_rows"]) + " SOURCE_PERIOD=" + str(store_result["source_min"]) + ".." + str(store_result["source_max"]) + " DASHBOARD_OK=yes", flush=True)
                      if store_index + 1 < len(expected):
                          checkpoint_resume(expected[store_index + 1], "summary")
                      else:
                          checkpoint_resume(store_id, "complete")
          if errors or len(verified) != len(expected):
              retry_phase = failed_phases[0][1] if failed_phases else "summary"
              retry_store = failed_phases[0][0] if failed_phases else (expected[0] if expected else "all")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output_file:
                  output_file.write("resume_phase=" + retry_phase + "\n")
                  output_file.write("resume_store=" + retry_store + "\n")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as checkpoint_file:
                  checkpoint_file.write("\n| all | current | " + retry_phase + " | unknown | RETRY_REQUIRED | этап не прошёл проверку | повторить с этой фазы |\n")
              raise SystemExit("WB finance phased publication incomplete: " + json.dumps({"verified": len(verified), "expected": len(expected), "errors": errors}, ensure_ascii=False))
          print("WB_FINANCE_PHASED_PUBLICATION_OK stores=" + str(len(verified)), flush=True)
          PY

  recover:
    needs: publish
    if: ${{ always() && (needs.publish.result == 'failure' || needs.publish.result == 'cancelled') && (github.event_name != 'workflow_dispatch' || inputs.resume_attempt == '0') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Queue one serialized recovery attempt
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECOVERY_STORE: ${{ needs.publish.outputs.resume_store || (github.event_name == 'workflow_dispatch' && inputs.store != 'all' && inputs.store || github.event_name == 'push' && contains(github.event.head_commit.message, '[air-only]') && 'air_wb' || github.event_name == 'push' && contains(github.event.head_commit.message, '[hozyayushka-only]') && 'hozyayushka_wb' || github.event_name == 'push' && contains(github.event.head_commit.message, '[sanych-only]') && 'sanych_wb' || 'all') }}
          RECOVERY_REF: ${{ github.ref_name }}
          RECOVERY_PHASE: ${{ needs.publish.outputs.resume_phase || 'summary' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          payload = {
              "ref": os.environ["RECOVERY_REF"],
              "inputs": {"store": os.environ["RECOVERY_STORE"], "resume_phase": os.environ["RECOVERY_PHASE"], "resume_attempt": "1"},
          }
          url = "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"] + "/actions/workflows/wb-sellmonitor-finance-publish.yml/dispatches"
          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              if response.status != 204:
                  raise SystemExit("WB_RECOVERY_DISPATCH_HTTP_" + str(response.status))
          print("WB_AUTOMATIC_RECOVERY=queued; attempt=1; store=" + os.environ["RECOVERY_STORE"])
          PY
