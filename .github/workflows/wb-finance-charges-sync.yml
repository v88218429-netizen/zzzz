name: WB finance charges sync

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [mainggg]
    paths:
      - "wb_worker/github_finance_charges_sync.py"
      - ".github/workflows/wb-finance-charges-sync.yml"

permissions:
  contents: write

concurrency:
  group: wb-finance-charges-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mainggg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime
        run: python -m pip install --disable-pip-version-check httpx

      - name: Pull WB finance charges
        env:
          WB_API_TOKEN_AP: ${{ secrets.WB_API_TOKEN_AP }}
          WB_API_TOKEN_AA: ${{ secrets.WB_API_TOKEN_AA }}
          WB_API_TOKEN_YV: ${{ secrets.WB_API_TOKEN_YV }}
          FINANCE_LOOKBACK_DAYS: "30"
          FINANCE_MIN_REQUEST_INTERVAL_SEC: "61"
          FINANCE_GITHUB_OUT: "${{ runner.temp }}/wb-finance"
        run: python wb_worker/github_finance_charges_sync.py

      - name: Encrypt finance export
        id: archive
        shell: bash
        env:
          STATE_SECRET: ${{ secrets.SELLMONITOR_GITHUB_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          test -n "$STATE_SECRET"
          test -s "$RUNNER_TEMP/wb-finance/charges_all.csv"
          test -s "$RUNNER_TEMP/wb-finance/penalties_sheet.csv"
          mkdir -p "$RUNNER_TEMP/wb-finance-publish/state"
          tar -czf "$RUNNER_TEMP/finance.tar.gz" -C "$RUNNER_TEMP" wb-finance
          openssl enc -aes-256-cbc -salt -pbkdf2 \
            -pass env:STATE_SECRET \
            -in "$RUNNER_TEMP/finance.tar.gz" \
            -out "$RUNNER_TEMP/wb-finance-publish/state/finance.tar.gz.enc"
          printf '%s\n' \
            '# WB finance encrypted snapshot' \
            '' \
            '> Finance detail rows are encrypted; this branch contains no plain CSV data or API tokens.' \
            > "$RUNNER_TEMP/wb-finance-publish/README.md"
          git worktree add --detach "$RUNNER_TEMP/wb-finance-state-branch" HEAD
          git -C "$RUNNER_TEMP/wb-finance-state-branch" switch --orphan finance-state-next
          git -C "$RUNNER_TEMP/wb-finance-state-branch" rm -rf . >/dev/null 2>&1 || true
          cp -R "$RUNNER_TEMP/wb-finance-publish/." "$RUNNER_TEMP/wb-finance-state-branch/"
          git -C "$RUNNER_TEMP/wb-finance-state-branch" config user.name "wb-finance-bot"
          git -C "$RUNNER_TEMP/wb-finance-state-branch" config user.email "wb-finance-bot@users.noreply.github.com"
          git -C "$RUNNER_TEMP/wb-finance-state-branch" add README.md state/finance.tar.gz.enc
          git -C "$RUNNER_TEMP/wb-finance-state-branch" commit -m "finance: encrypted rolling export"
          git -C "$RUNNER_TEMP/wb-finance-state-branch" push origin HEAD:finance-state --force
