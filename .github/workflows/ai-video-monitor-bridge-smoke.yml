name: AI Video Monitor - Google bridge smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet google-auth requests
      - name: Check original Google Sheet via deployed Apps Script
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          python - <<'PY'
          from ai_video_monitor_autonomous import Sheets
          import os, json, requests
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from pathlib import Path
          cfg = json.loads(os.environ["CLASPRC_JSON"])["tokens"]["default"]
          auth = Credentials(token=cfg.get("access_token"), refresh_token=cfg.get("refresh_token"),
              token_uri="https://oauth2.googleapis.com/token",
              client_id=cfg.get("client_id"), client_secret=cfg.get("client_secret"))
          auth.refresh(Request())
          script_id = "1RlfYnnnC9Hd8uZFeELF39TZOWxPK_gP-8qFrdge4PsYY-uoJzKC7oi49"
          deploy_id = json.loads(Path("google_apps_script_ai_monitor/bridge_deployment.json").read_text())["deploymentId"]
          meta = requests.get("https://script.googleapis.com/v1/projects/"+script_id+
              "/deployments/"+deploy_id, headers={"Authorization":"Bearer "+auth.token}, timeout=30)
          print("BRIDGE_DEPLOYMENT_META="+str(meta.status_code))
          if meta.ok:
              obj=meta.json()
              print("BRIDGE_ENTRYPOINTS="+json.dumps(obj.get("entryPoints",[]), ensure_ascii=False)[:900])
          else:
              print("BRIDGE_META_ERROR="+str(meta.json().get("error",{}).get("status","unknown")))
          sh = Sheets()
          result = sh.bridge({"op": "ping"})
          print("BRIDGE_PING=OK", result.get("service"))
          rows = sh.get("Задания", "A1:C3")
          assert len(rows) >= 2, "No tasks in original Sheet"
          assert rows[0][0] == "ID", "Unexpected original task header"
          print("BRIDGE_READ=OK", "rows="+str(len(rows)), "first_task="+str(rows[1][0]))
          # No-op write to the exact existing header, then read back.
          # Exercises actual write access without introducing test records.
          result=sh.bridge({"op":"write","data":[{"range":"'Задания'!A1","values":[["ID"]]}]})
          assert result["updatedCells"] == 1
          assert sh.get("Задания","A1:A1") == [["ID"]]
          print("BRIDGE_WRITE_READBACK=OK cells=1")
          PY
