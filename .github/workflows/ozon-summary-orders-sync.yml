name: Ozon summary orders sync

on:
  workflow_dispatch:
  push:
    branches: [mainggg]
    paths:
      - ".github/workflows/ozon-summary-orders-sync.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_run:
    workflows:
      - Sellmonitor GitHub worker deploy
    types: [completed]
    branches: [mainggg]

permissions:
  contents: read

concurrency:
  group: sellmonitor-summary-publish-serial
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WEBAPP_DEPLOYMENT_ID: AKfycbyU_OXpFYqvBx0KDuGCgEHsnzkts_fnJzVe8DM8crRDD1A_fr5DqOfVfW_PYJriaXU_jw
      WEBHOOK_SECRET: ${{ secrets.SELLMONITOR_GITHUB_WEBHOOK_SECRET }}
    steps:
      - name: Check configured authorization
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WEBAPP_DEPLOYMENT_ID"
          test -n "$WEBHOOK_SECRET"
          echo "::add-mask::$WEBHOOK_SECRET"

      - name: Check Ozon Seller API secret configuration
        shell: bash
        env:
          OZON_DOM_CLIENT_ID: ${{ secrets.OZON_SELLER_DOM_CLIENT_ID }}
          OZON_DOM_API_KEY: ${{ secrets.OZON_SELLER_DOM_API_KEY }}
          OZON_HOZYAYUSHKA_CLIENT_ID: ${{ secrets.OZON_SELLER_HOZYAYUSHKA_CLIENT_ID }}
          OZON_HOZYAYUSHKA_API_KEY: ${{ secrets.OZON_SELLER_HOZYAYUSHKA_API_KEY }}
        run: |
          python - <<'PY'
          import os
          names = (
              "OZON_DOM_CLIENT_ID",
              "OZON_DOM_API_KEY",
              "OZON_HOZYAYUSHKA_CLIENT_ID",
              "OZON_HOZYAYUSHKA_API_KEY",
          )
          for name in names:
              value = os.environ.get(name, "")
              if value:
                  print("::add-mask::" + value)
              print(name + "=" + ("configured" if value else "missing"))
          PY

      - name: Probe current Ozon Seller API access
        continue-on-error: true
        shell: bash
        env:
          OZON_DOM_CLIENT_ID: ${{ secrets.OZON_SELLER_DOM_CLIENT_ID }}
          OZON_DOM_API_KEY: ${{ secrets.OZON_SELLER_DOM_API_KEY }}
          OZON_HOZYAYUSHKA_CLIENT_ID: ${{ secrets.OZON_SELLER_HOZYAYUSHKA_CLIENT_ID }}
          OZON_HOZYAYUSHKA_API_KEY: ${{ secrets.OZON_SELLER_HOZYAYUSHKA_API_KEY }}
        run: |
          python - <<'PY'
          import datetime, json, os, time, urllib.error, urllib.request
          until = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0)
          since = until - datetime.timedelta(days=60)
          window = {"since": since.isoformat().replace("+00:00", "Z"), "to": until.isoformat().replace("+00:00", "Z")}
          stores = (
              ("DOM", "OZON_DOM_CLIENT_ID", "OZON_DOM_API_KEY"),
              ("HOZYAYUSHKA", "OZON_HOZYAYUSHKA_CLIENT_ID", "OZON_HOZYAYUSHKA_API_KEY"),
          )
          methods = (
              ("FBO", "/v3/posting/fbo/list", {"dir":"ASC","filter":dict(window), "limit":100,"offset":0,"with":{"analytics_data":True,"financial_data":True}}),
              ("FBS", "/v4/posting/fbs/list", {"dir":"ASC","filter":dict(window,status=""),"limit":100,"cursor":"","with":{"analytics_data":True,"financial_data":True}}),
          )
          failures = 0
          for store, client_key, api_key in stores:
              client, key = os.environ.get(client_key, ""), os.environ.get(api_key, "")
              if client: print("::add-mask::" + client)
              if key: print("::add-mask::" + key)
              if not client or not key:
                  print(f"OZON_API_{store}_credentials=missing")
                  failures += 2
                  continue
              for label, endpoint, body in methods:
                  result = None
                  code = 0
                  detail = ""
                  for attempt in range(3):
                      req = urllib.request.Request(
                          "https://api-seller.ozon.ru" + endpoint,
                          data=json.dumps(body).encode(),
                          headers={"Client-Id":client,"Api-Key":key,"Content-Type":"application/json"},
                          method="POST",
                      )
                      try:
                          with urllib.request.urlopen(req, timeout=45) as response:
                              code = response.status
                              result = json.loads(response.read().decode())
                          break
                      except urllib.error.HTTPError as exc:
                          code = exc.code
                          detail = exc.read(1000).decode("utf-8", "replace").replace("\\n", " ")[:600]
                          if code not in (429,500,502,503,504) or attempt == 2: break
                      except (urllib.error.URLError, TimeoutError, json.JSONDecodeError):
                          if attempt == 2: break
                      time.sleep(2 ** attempt)
                  if code != 200 or not isinstance(result, dict):
                      print(f"OZON_API_{store}_{label}=http_{code};detail={detail}")
                      failures += 1
                      continue
                  records = result.get("postings")
                  if records is None:
                      records = result.get("result")
                  if isinstance(records, dict):
                      records = records.get("postings") or records.get("items") or []
                  count = len(records) if isinstance(records, list) else 0
                  print(f"OZON_API_{store}_{label}=ok;rows={count};has_next={bool(result.get('has_next'))}")
          if failures == 4:
              raise SystemExit("OZON_SELLER_API_ALL_METHODS_FAILED")
          PY

      - name: Fetch all Ozon Seller API pages, publish and verify both summaries
        shell: bash
        env:
          OZON_DOM_CLIENT_ID: ${{ secrets.OZON_SELLER_DOM_CLIENT_ID }}
          OZON_DOM_API_KEY: ${{ secrets.OZON_SELLER_DOM_API_KEY }}
          OZON_HOZYAYUSHKA_CLIENT_ID: ${{ secrets.OZON_SELLER_HOZYAYUSHKA_CLIENT_ID }}
          OZON_HOZYAYUSHKA_API_KEY: ${{ secrets.OZON_SELLER_HOZYAYUSHKA_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime, json, os, time, urllib.error, urllib.request
          from zoneinfo import ZoneInfo

          MOSCOW = ZoneInfo("Europe/Moscow")
          UTC = datetime.timezone.utc
          COVERAGE_FROM = "2026-09-01"
          now = datetime.datetime.now(UTC).replace(microsecond=0)
          coverage_to = now.astimezone(MOSCOW).date().isoformat()
          until = now.isoformat().replace("+00:00", "Z")
          since = datetime.datetime(2026, 9, 1, tzinfo=UTC).isoformat().replace("+00:00", "Z")
          stores = (
              ("1", "DOM", "OZON_DOM_CLIENT_ID", "OZON_DOM_API_KEY"),
              ("2", "HOZYAYUSHKA", "OZON_HOZYAYUSHKA_CLIENT_ID", "OZON_HOZYAYUSHKA_API_KEY"),
          )

          def api_post(endpoint, body, headers):
              last = None
              for attempt in range(3):
                  print(f"OZON_API_REQUEST={endpoint};attempt={attempt + 1}", flush=True)\n                  req = urllib.request.Request(
                      "https://api-seller.ozon.ru" + endpoint,
                      data=json.dumps(body, separators=(",", ":")).encode("utf-8"),
                      headers=headers,
                      method="POST",
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=30) as response:
                          parsed = json.loads(response.read().decode("utf-8"))
                          if not isinstance(parsed, dict):
                              raise RuntimeError("OZON_API_NON_OBJECT_RESPONSE:" + endpoint)
                          result = parsed.get("result", parsed)\n                          page_rows = result.get("postings") if isinstance(result, dict) else None\n                          page_has_next = result.get("has_next", parsed.get("has_next", False)) if isinstance(result, dict) else parsed.get("has_next", False)\n                          page_cursor = result.get("cursor") or result.get("next_cursor") if isinstance(result, dict) else None\n                          print(f"OZON_API_RESPONSE={endpoint};rows={len(page_rows) if isinstance(page_rows, list) else -1};has_next={bool(page_has_next)};cursor={bool(page_cursor)}", flush=True)\n                          return parsed
                  except urllib.error.HTTPError as exc:
                      detail = exc.read(1200).decode("utf-8", "replace").replace("\\n", " ")[:600]
                      last = f"HTTP_{exc.code}:{detail}"
                      if exc.code not in (429, 500, 502, 503, 504) or attempt == 2:
                          raise RuntimeError("OZON_API_REQUEST_FAILED:" + endpoint + ":" + last)
                      retry_after = exc.headers.get("Retry-After")
                      delay = min(60, int(retry_after)) if retry_after and retry_after.isdigit() else 2 ** attempt
                  except (urllib.error.URLError, TimeoutError, json.JSONDecodeError, ConnectionError, OSError) as exc:
                      last = type(exc).__name__ + ":" + str(exc)[:240]
                      if attempt == 4:
                          raise RuntimeError("OZON_API_REQUEST_FAILED:" + endpoint + ":" + last)
                      delay = 2 ** attempt
                  time.sleep(delay)
              raise RuntimeError("OZON_API_RETRY_EXHAUSTED:" + endpoint + ":" + str(last))

          def page_parts(response):
              result = response.get("result", response)
              if not isinstance(result, dict):
                  raise RuntimeError("OZON_API_INVALID_PAGE_SHAPE")
              postings = result.get("postings")
              if not isinstance(postings, list):
                  raise RuntimeError("OZON_API_POSTINGS_MISSING")
              return result, postings, bool(result.get("has_next", response.get("has_next", False)))

          records_by_key = {}
          completed_accounts = []
          store_page_counts = {}
          store_posting_counts = {}
          for cabinet, label, client_var, key_var in stores:
              client, key = os.environ.get(client_var, ""), os.environ.get(key_var, "")
              if not client or not key:
                  raise RuntimeError("OZON_API_CREDENTIALS_MISSING:" + label)
              print("::add-mask::" + client)
              print("::add-mask::" + key)
              headers = {"Client-Id": client, "Api-Key": key, "Content-Type": "application/json"}
              window = {"since": since, "to": until}
              store_pages = 0
              store_postings = 0

              offset = 0
              while True:
                  response = api_post("/v3/posting/fbo/list", {
                      "dir": "ASC", "filter": dict(window), "limit": 100, "offset": offset,
                      "with": {"analytics_data": False, "financial_data": False},
                  }, headers)
                  page, postings, has_next = page_parts(response)
                  store_pages += 1
                  store_postings += len(postings)
                  for posting in postings:
                      timestamp = posting.get("in_process_at") or posting.get("created_at")
                      posting_number = str(posting.get("posting_number") or "").strip()
                      order_id = str(posting.get("order_id") or "").strip()
                      if not timestamp or not posting_number or not order_id:
                          raise RuntimeError("OZON_FBO_REQUIRED_POSTING_FIELDS_MISSING:" + label)
                      day = datetime.datetime.fromisoformat(str(timestamp).replace("Z", "+00:00")).astimezone(MOSCOW).date().isoformat()
                      if not COVERAGE_FROM <= day <= coverage_to:
                          continue
                      products = posting.get("products")
                      if not isinstance(products, list) or not products:
                          raise RuntimeError("OZON_FBO_PRODUCTS_MISSING:" + label)
                      for product in products:
                          offer = str(product.get("offer_id") or "").strip()
                          sku = str(product.get("sku") or "").strip()
                          title = str(product.get("name") or "").strip()
                          qty = float(product.get("quantity") or 0)
                          if not offer or not sku or not title or not qty.is_integer() or qty <= 0:
                              raise RuntimeError("OZON_FBO_PRODUCT_ID_OR_QUANTITY_MISSING:" + label)
                          row_key = (cabinet, day, posting_number, order_id, offer, sku, title)
                          records_by_key[row_key] = records_by_key.get(row_key, 0) + int(qty)
                  if not has_next:
                      break
                  if not postings:
                      raise RuntimeError("OZON_FBO_EMPTY_PAGE_WITH_NEXT:" + label)
                  offset += len(postings)
                  if store_pages >= 5000:
                      raise RuntimeError("OZON_FBO_PAGE_GUARD:" + label)

              cursor = ""
              seen_cursors = set()
              while True:
                  body = {
                      "dir": "ASC", "filter": dict(window, status=""), "limit": 100, "cursor": cursor,
                      "with": {"analytics_data": False, "financial_data": False},
                  }
                  response = api_post("/v4/posting/fbs/list", body, headers)
                  page, postings, has_next = page_parts(response)
                  store_pages += 1
                  store_postings += len(postings)
                  for posting in postings:
                      timestamp = posting.get("in_process_at") or posting.get("created_at")
                      posting_number = str(posting.get("posting_number") or "").strip()
                      order_id = str(posting.get("order_id") or "").strip()
                      if not timestamp or not posting_number or not order_id:
                          raise RuntimeError("OZON_FBS_REQUIRED_POSTING_FIELDS_MISSING:" + label)
                      day = datetime.datetime.fromisoformat(str(timestamp).replace("Z", "+00:00")).astimezone(MOSCOW).date().isoformat()
                      if not COVERAGE_FROM <= day <= coverage_to:
                          continue
                      products = posting.get("products")
                      if not isinstance(products, list) or not products:
                          raise RuntimeError("OZON_FBS_PRODUCTS_MISSING:" + label)
                      for product in products:
                          offer = str(product.get("offer_id") or "").strip()
                          sku = str(product.get("sku") or "").strip()
                          title = str(product.get("name") or "").strip()
                          qty = float(product.get("quantity") or 0)
                          if not offer or not sku or not title or not qty.is_integer() or qty <= 0:
                              raise RuntimeError("OZON_FBS_PRODUCT_ID_OR_QUANTITY_MISSING:" + label)
                          row_key = (cabinet, day, posting_number, order_id, offer, sku, title)
                          records_by_key[row_key] = records_by_key.get(row_key, 0) + int(qty)
                  if not has_next:
                      break
                  if not postings:
                      raise RuntimeError("OZON_FBS_EMPTY_PAGE_WITH_NEXT:" + label)
                  next_cursor = str(page.get("cursor") or page.get("next_cursor") or response.get("cursor") or response.get("next_cursor") or "").strip()
                  if not next_cursor or next_cursor == cursor or next_cursor in seen_cursors:
                      raise RuntimeError("OZON_FBS_CURSOR_MISSING_OR_REPEATED:" + label)
                  seen_cursors.add(next_cursor)
                  cursor = next_cursor
                  if store_pages >= 5000:
                      raise RuntimeError("OZON_FBS_PAGE_GUARD:" + label)

              completed_accounts.append(cabinet)
              store_page_counts[label] = store_pages
              store_posting_counts[label] = store_postings
              print(f"OZON_API_{label}_COMPLETE=true;pages={store_pages};postings={store_postings}")

          if sorted(completed_accounts) != ["1", "2"] or not records_by_key:
              raise RuntimeError("OZON_API_BOTH_CABINETS_AND_NONEMPTY_HISTORY_REQUIRED")
          records = [
              {"cabinet": key[0], "day": key[1], "posting": key[2], "order": key[3],
               "offer": key[4], "sku": key[5], "title": key[6], "qty": qty}
              for key, qty in sorted(records_by_key.items())
          ]
          payload = {
              "token": os.environ["WEBHOOK_SECRET"],
              "action": "publish_ozon_api_orders",
              "source": "ozon_seller_api",
              "complete": True,
              "completed_accounts": completed_accounts,
              "exported_at": now.isoformat().replace("+00:00", "Z"),
              "coverage_from": COVERAGE_FROM,
              "coverage_to": coverage_to,
              "records": records,
          }
          body = json.dumps(payload, ensure_ascii=False, separators=(",", ":")).encode("utf-8")
          print(f"OZON_API_EXPORT_COMPLETE=true;records={len(records)};bytes={len(body)};coverage={COVERAGE_FROM}..{coverage_to}")
          url = "https://script.google.com/macros/s/" + os.environ["WEBAPP_DEPLOYMENT_ID"] + "/exec"
          req = urllib.request.Request(url, data=body, headers={"Content-Type": "application/json"}, method="POST")
          try:
              with urllib.request.urlopen(req, timeout=420) as response:
                  result = json.loads(response.read().decode("utf-8"))
          except (urllib.error.URLError, TimeoutError, json.JSONDecodeError) as exc:
              raise RuntimeError("OZON_API_PUBLISH_REQUEST_FAILED:" + type(exc).__name__ + ":" + str(exc)[:300])
          if not isinstance(result, dict) or result.get("action") != "publish_ozon_api_orders":
              print("OZON_API_PUBLISH_ROUTE_UNAVAILABLE=" + json.dumps(result, ensure_ascii=False)[:700])
              raise SystemExit("OZON_API_PUBLISH_ROUTE_UNAVAILABLE_PRESERVE")
          if result.get("ok") is not True:
              raise SystemExit("OZON_API_PUBLISH_FAILED_PRESERVED:" + json.dumps({
                  "reason": result.get("reason"), "stores": result.get("stores"),
                  "error": result.get("error")
              }, ensure_ascii=False)[:1400])
          stores = result.get("stores") or []
          expected = {"ДОМ", "Хозяюшка"}
          readback = {item.get("store") for item in stores if item.get("ok") is True and item.get("readback") is True}
          if readback != expected:
              raise SystemExit("OZON_API_READBACK_ACCEPTANCE_FAILED:" + json.dumps(stores, ensure_ascii=False)[:1400])
          print("OZON_API_PUBLISH_OK=true")
          for item in stores:
              print("STORE=" + str(item.get("store")) + " OK=" + str(item.get("ok"))
                    + " SOURCE_ROWS=" + str(item.get("source_rows"))
                    + " PERIOD=" + str(item.get("source_min")) + ".." + str(item.get("source_max"))
                    + " DAILY_ROWS=" + str(item.get("daily_rows"))
                    + " SKU_ROWS=" + str(item.get("sku_rows"))
                    + " ARCHIVED_ROWS=" + str(item.get("archived_rows"))
                    + " READBACK=" + str(item.get("readback"))
                    + " SHA256=" + str(item.get("sha256")))
          PY
