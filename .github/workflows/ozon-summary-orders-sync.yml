name: Ozon summary orders sync
# Verify the 1.3.84 full-page freshness labels and chart date axis through the existing scheduled publication path.

on:
  workflow_dispatch:
    inputs:
      resume_store:
        description: Кабинет из контрольной точки
        type: choice
        options: [all, ДОМ, Хозяюшка]
        default: all
        required: true
      resume_phase:
        description: Фаза продолжения
        type: choice
        options: [source, orders, finance]
        default: source
        required: true
      resume_attempt:
        description: Ограниченный повтор после сбоя
        type: choice
        options: ["0", "1"]
        default: "0"
        required: true
  workflow_run:
    workflows: ["Sellmonitor GitHub worker deploy"]
    types: [completed]
    branches: [mainggg]
  push:
    branches: [mainggg]
    paths:
      - ".github/workflows/ozon-summary-orders-sync.yml"
  # Часовое обновление Seller API; изменение этого файла запускает штатную проверку публикации.
  # Повторная выгрузка после исправления подсчёта SKU в неделях и месяцах.
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: ozon-summary-orders-bounded
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    outputs:
      resume_store: ${{ steps.publish.outputs.resume_store }}
      resume_phase: ${{ steps.publish.outputs.resume_phase }}
    if: ${{ (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && !(github.event_name == 'push' && contains(fromJSON('["Serialize Ozon publication after worker deployment","Repair Ozon finance journal and resume checkpoint","Gate Ozon runs to relevant worker changes","Fix Ozon scope gate output newlines","Fix Ozon finance publication store labels"]'), github.event.head_commit.message)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WEBAPP_DEPLOYMENT_ID: AKfycbyU_OXpFYqvBx0KDuGCgEHsnzkts_fnJzVe8DM8crRDD1A_fr5DqOfVfW_PYJriaXU_jw
      WEBHOOK_SECRET: ${{ secrets.SELLMONITOR_GITHUB_WEBHOOK_SECRET }}
      RESUME_ATTEMPT: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_attempt || '0' }}
    steps:
      - name: Check configured authorization
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WEBAPP_DEPLOYMENT_ID"
          test -n "$WEBHOOK_SECRET"
          echo "::add-mask::$WEBHOOK_SECRET"

      - name: Check Ozon Seller API secret configuration
        shell: bash
        env:
          OZON_DOM_CLIENT_ID: ${{ secrets.OZON_SELLER_DOM_CLIENT_ID }}
          OZON_DOM_API_KEY: ${{ secrets.OZON_SELLER_DOM_API_KEY }}
          OZON_HOZYAYUSHKA_CLIENT_ID: ${{ secrets.OZON_SELLER_HOZYAYUSHKA_CLIENT_ID }}
          OZON_HOZYAYUSHKA_API_KEY: ${{ secrets.OZON_SELLER_HOZYAYUSHKA_API_KEY }}
        run: |
          python - <<'PY'
          import os
          names = (
              "OZON_DOM_CLIENT_ID",
              "OZON_DOM_API_KEY",
              "OZON_HOZYAYUSHKA_CLIENT_ID",
              "OZON_HOZYAYUSHKA_API_KEY",
          )
          for name in names:
              value = os.environ.get(name, "")
              if value:
                  print("::add-mask::" + value)
              print(name + "=" + ("configured" if value else "missing"))
          PY

      - name: Check whether deployment changed Ozon logic
        id: deploy_scope
        if: ${{ github.event_name == 'workflow_run' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          output = os.environ["GITHUB_OUTPUT"]
          def decide(run, phase, reason):
              with open(output, "a", encoding="utf-8") as f:
                  f.write("run=" + run + "\n")
                  f.write("resume_phase=" + phase + "\n")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
                  f.write("### Проверка запуска Ozon после выпуска\n\n" + reason + "\n")
              print("OZON_DEPLOY_SCOPE=run:" + run + ";phase:" + phase + ";reason:" + reason, flush=True)
          url = "https://api.github.com/repos/" + os.environ["GH_REPOSITORY"] + "/commits/" + os.environ["DEPLOY_SHA"]
          request = urllib.request.Request(url, headers={
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "X-GitHub-Api-Version": "2022-11-28",
          })
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  commit = json.loads(response.read().decode("utf-8"))
              files = commit.get("files")
              if not isinstance(files, list):
                  decide("false", "source", "BLOCKED_EXTERNAL: GitHub не вернул список файлов коммита; плановое расписание сохранит следующую попытку.")
                  raise SystemExit(0)
              phase = None
              touched = []
              for item in files:
                  name = str(item.get("filename") or "")
                  patch = str(item.get("patch") or "")
                  if name.endswith("sellmonitor_github_worker/patch_master.py") and any(k in patch for k in ("OZON_FINANCE", "OZON_SUMMARY", "OZON_COVERAGE", "OZON_GRAPH_LABEL")):
                      phase = "finance"
                      touched.append(name)
                  if name.endswith("sellmonitor_github_worker/SELLMONITOR_GITHUB_WORKER.gs") and any(k in patch for k in ("SMC_OZON_SUMMARY", "sellmonitorGithubPublishOzon", "publish_ozon_summary_orders", "publish_ozon_api_finance")):
                      phase = "source"
                      touched.append(name)
              if phase:
                  decide("true", phase, "OZON_CODE_CHANGED: " + ", ".join(sorted(set(touched))))
              else:
                  decide("false", "source", "OZON_CODE_UNCHANGED: выпуск касался другого участка; полный сбор заказов не запускается.")
          except SystemExit:
              raise
          except Exception as exc:
              decide("false", "source", "SCOPE_CHECK_UNAVAILABLE: " + type(exc).__name__ + "; будет использовано штатное часовое расписание.")
          PY

      - name: Fetch all Ozon Seller API pages, publish and verify both summaries
        id: publish
        if: ${{ github.event_name != 'workflow_run' || steps.deploy_scope.outputs.run == 'true' }}
        shell: bash
        env:
          RESUME_STORE: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_store || 'all' }}
          RESUME_PHASE: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_phase || steps.deploy_scope.outputs.resume_phase || 'source' }}
          RESUME_ATTEMPT: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_attempt || '0' }}
          OZON_DOM_CLIENT_ID: ${{ secrets.OZON_SELLER_DOM_CLIENT_ID }}
          OZON_DOM_API_KEY: ${{ secrets.OZON_SELLER_DOM_API_KEY }}
          OZON_HOZYAYUSHKA_CLIENT_ID: ${{ secrets.OZON_SELLER_HOZYAYUSHKA_CLIENT_ID }}
          OZON_HOZYAYUSHKA_API_KEY: ${{ secrets.OZON_SELLER_HOZYAYUSHKA_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime, hashlib, json, os, time, urllib.error, urllib.request
          from zoneinfo import ZoneInfo

          MOSCOW = ZoneInfo("Europe/Moscow")
          UTC = datetime.timezone.utc
          COVERAGE_FROM = "2026-09-01"
          now = datetime.datetime.now(UTC).replace(microsecond=0)
          coverage_to = now.astimezone(MOSCOW).date().isoformat()
          until = now.isoformat().replace("+00:00", "Z")
          since = datetime.datetime(2026, 9, 1, tzinfo=MOSCOW).astimezone(UTC).isoformat().replace("+00:00", "Z")
          stores = (
              ("1", "DOM", "OZON_DOM_CLIENT_ID", "OZON_DOM_API_KEY"),
              ("2", "HOZYAYUSHKA", "OZON_HOZYAYUSHKA_CLIENT_ID", "OZON_HOZYAYUSHKA_API_KEY"),
          )

          resume_store = os.environ.get("RESUME_STORE", "all")
          resume_phase = os.environ.get("RESUME_PHASE", "source")
          checkpoint_header_written = False
          def checkpoint(phase, store, state, source_version="pending", readback="pending", next_action=""):
              global checkpoint_header_written
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  f.write("resume_phase=" + phase + "\n")
                  f.write("resume_store=" + store + "\n")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
                  if not checkpoint_header_written:
                      f.write("### Контроль публикации Ozon\n\n| Кабинет | Период | Фаза | Версия источника | Состояние | Проверка чтением | Следующее действие |\n|---|---|---|---|---|---|---|\n")
                      checkpoint_header_written = True
                  f.write("| " + store + " | " + COVERAGE_FROM + "–" + coverage_to + " | " + phase + " | " + source_version + " | " + state + " | " + readback + " | " + next_action + " |\n")
              print("OZON_CHECKPOINT=store=" + store + ";period=" + COVERAGE_FROM + ".." + coverage_to + ";phase=" + phase + ";source=" + source_version + ";state=" + state + ";readback=" + readback + ";next=" + next_action, flush=True)
          if resume_phase not in {"source", "orders", "finance"}:
              raise SystemExit("INVALID_RESUME_PHASE:" + resume_phase)
          if resume_store not in {"all", "ДОМ", "Хозяюшка"}:
              raise SystemExit("INVALID_RESUME_STORE:" + resume_store)
          checkpoint(resume_phase, resume_store, "RUNNING", until, "not_written", "продолжить с сохранённой фазы " + resume_phase)
          api_context = {"store": "", "flow": "", "page": 0}

          def api_post(endpoint, body, headers):
              last = None
              for attempt in range(5):
                  if attempt > 0:
                      print("OZON_API_RETRY=store="+str(api_context["store"])+";flow="+str(api_context["flow"])+";page="+str(api_context["page"])+";endpoint="+endpoint+";attempt="+str(attempt+1), flush=True)
                  req = urllib.request.Request(
                      "https://api-seller.ozon.ru" + endpoint,
                      data=json.dumps(body, separators=(",", ":")).encode("utf-8"),
                      headers=headers,
                      method="POST",
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=30) as response:
                          parsed = json.loads(response.read().decode("utf-8"))
                          if not isinstance(parsed, dict):
                              raise RuntimeError("OZON_API_NON_OBJECT_RESPONSE:" + endpoint)
                          result = parsed.get("result", parsed)
                          page_rows = result.get("postings") if isinstance(result, dict) else None
                          page_has_next = result.get("has_next", parsed.get("has_next", False)) if isinstance(result, dict) else parsed.get("has_next", False)
                          page_cursor = result.get("cursor") or result.get("next_cursor") if isinstance(result, dict) else None
                          if api_context["page"] == 1 or api_context["page"] % 50 == 0:
                              print("OZON_API_PROGRESS=store="+str(api_context["store"])+";flow="+str(api_context["flow"])+";page="+str(api_context["page"])+";endpoint="+endpoint+";rows="+str(len(page_rows) if isinstance(page_rows,list) else -1)+";has_next="+str(bool(page_has_next))+";cursor="+str(bool(page_cursor)), flush=True)
                          return parsed
                  except urllib.error.HTTPError as exc:
                      detail = exc.read(1200).decode("utf-8", "replace").replace("\\n", " ")[:600]
                      last = f"HTTP_{exc.code}:{detail}"
                      if exc.code not in (429, 500, 502, 503, 504) or attempt == 4:
                          raise RuntimeError("OZON_API_REQUEST_FAILED:" + api_context["store"] + ":" + api_context["flow"] + ":" + str(api_context["page"]) + ":" + endpoint + ":" + last)
                      retry_after = exc.headers.get("Retry-After")
                      delay = min(60, int(retry_after)) if retry_after and retry_after.isdigit() else 2 ** attempt
                  except (urllib.error.URLError, TimeoutError, json.JSONDecodeError, ConnectionError, OSError) as exc:
                      last = type(exc).__name__ + ":" + str(exc)[:240]
                      if attempt == 4:
                          raise RuntimeError("OZON_API_REQUEST_FAILED:" + api_context["store"] + ":" + api_context["flow"] + ":" + str(api_context["page"]) + ":" + endpoint + ":" + last)
                      delay = 2 ** attempt
                  time.sleep(delay)
              raise RuntimeError("OZON_API_RETRY_EXHAUSTED:" + endpoint + ":" + str(last))

          def page_parts(response):
              result = response.get("result", response)
              if not isinstance(result, dict):
                  raise RuntimeError("OZON_API_INVALID_PAGE_SHAPE")
              postings = result.get("postings")
              if not isinstance(postings, list):
                  raise RuntimeError("OZON_API_POSTINGS_MISSING")
              return result, postings, bool(result.get("has_next", response.get("has_next", False)))

          if resume_phase != "finance":
              records_by_key = {}
              completed_accounts = []
              store_page_counts = {}
              store_posting_counts = {}
              for cabinet, label, client_var, key_var in stores:
                  client, key = os.environ.get(client_var, ""), os.environ.get(key_var, "")
                  if not client or not key:
                      raise RuntimeError("OZON_API_CREDENTIALS_MISSING:" + label)
                  print("::add-mask::" + client)
                  print("::add-mask::" + key)
                  headers = {"Client-Id": client, "Api-Key": key, "Content-Type": "application/json"}
                  window = {"since": since, "to": until}
                  store_pages = 0
                  store_postings = 0
                  duplicate_postings = 0
                  seen_fbo_postings = {}
                  seen_fbs_postings = {}

                  def register_posting(flow, posting, timestamp, posting_number, order_id):
                      global duplicate_postings
                      products = posting.get("products")
                      signature = json.dumps(
                          [timestamp, order_id, sorted([
                              [str(p.get("offer_id") or ""), str(p.get("sku") or ""),
                               str(p.get("name") or ""), str(p.get("quantity") or "")]
                              for p in products if isinstance(p, dict)
                          ]) if isinstance(products, list) else None],
                          ensure_ascii=False, separators=(",", ":"),
                      )
                      seen = seen_fbo_postings if flow == "FBO" else seen_fbs_postings
                      prior = seen.get(posting_number)
                      if prior is not None:
                          if prior != signature:
                              raise RuntimeError("OZON_" + flow + "_POSTING_CHANGED_DURING_PAGINATION:" + label)
                          duplicate_postings += 1
                          return False
                      seen[posting_number] = signature
                      return True

                  def posting_day(timestamp, flow):
                      try:
                          parsed = datetime.datetime.fromisoformat(str(timestamp).replace("Z", "+00:00"))
                          if parsed.tzinfo is None:
                              raise ValueError("timezone missing")
                          return parsed.astimezone(MOSCOW).date().isoformat()
                      except (TypeError, ValueError) as exc:
                          raise RuntimeError("OZON_" + flow + "_INVALID_POSTING_TIMESTAMP:" + label + ":" + str(exc)[:120])

                  cursor = ""
                  seen_fbo_cursors = set()
                  while True:
                      api_context.update({"store": label, "flow": "FBO", "page": store_pages + 1})
                      response = api_post("/v3/posting/fbo/list", {
                          "dir": "DESC", "filter": dict(window), "limit": 100, "cursor": cursor,
                          "with": {"analytics_data": False, "financial_data": False},
                      }, headers)
                      page, postings, has_next = page_parts(response)
                      store_pages += 1
                      store_postings += len(postings)
                      page_dates = []
                      for posting in postings:
                          timestamp = posting.get("in_process_at") or posting.get("created_at")
                          if not timestamp:
                              raise RuntimeError("OZON_FBO_REQUIRED_POSTING_FIELDS_MISSING:" + label)
                          day = posting_day(timestamp, "FBO")
                          page_dates.append(day)
                          if day < COVERAGE_FROM or day > coverage_to:
                              continue
                          posting_number = str(posting.get("posting_number") or "").strip()
                          order_id = str(posting.get("order_id") or "").strip()
                          if not posting_number or not order_id:
                              raise RuntimeError("OZON_FBO_REQUIRED_POSTING_FIELDS_MISSING:" + label)
                          if not register_posting("FBO", posting, str(timestamp), posting_number, order_id):
                              continue
                          products = posting.get("products")
                          if not isinstance(products, list) or not products:
                              raise RuntimeError("OZON_FBO_PRODUCTS_MISSING:" + label)
                          for product in products:
                              offer = str(product.get("offer_id") or "").strip()
                              sku = str(product.get("sku") or "").strip()
                              title = str(product.get("name") or "").strip()
                              qty = float(product.get("quantity") or 0)
                              if not offer or not sku or not title or not qty.is_integer() or qty <= 0:
                                  raise RuntimeError("OZON_FBO_PRODUCT_ID_OR_QUANTITY_MISSING:" + label)
                              row_key = (cabinet, day, posting_number, order_id, offer, sku, title)
                              records_by_key[row_key] = records_by_key.get(row_key, 0) + int(qty)
                      if page_dates:
                          page_oldest, page_newest = min(page_dates), max(page_dates)
                          retained = sum(COVERAGE_FROM <= day <= coverage_to for day in page_dates)
                          outside = len(page_dates) - retained
                          print(f"OZON_API_{label}_FBO_PAGE_DATES={page_oldest}..{page_newest};retained={retained};outside={outside}")
                          if outside:
                              raise RuntimeError("OZON_FBO_FILTER_DATES_OUTSIDE_COVERAGE:" + label + ":" + page_oldest + ".." + page_newest)
                      if not has_next:
                          break
                      if not postings:
                          raise RuntimeError("OZON_FBO_EMPTY_PAGE_WITH_NEXT:" + label)
                      next_cursor = str(page.get("cursor") or page.get("next_cursor") or response.get("cursor") or response.get("next_cursor") or "").strip()
                      if not next_cursor or next_cursor == cursor or next_cursor in seen_fbo_cursors:
                          raise RuntimeError("OZON_FBO_CURSOR_MISSING_OR_REPEATED:" + label)
                      seen_fbo_cursors.add(next_cursor)
                      cursor = next_cursor
                      if store_pages >= 5000:
                          raise RuntimeError("OZON_FBO_PAGE_GUARD:" + label)

                  cursor = ""
                  seen_cursors = set()
                  previous_fbs_oldest = None
                  while True:
                      api_context.update({"store": label, "flow": "FBS", "page": store_pages + 1})
                      body = {
                          "dir": "DESC", "filter": dict(window, status=""), "limit": 100, "cursor": cursor,
                          "with": {"analytics_data": False, "financial_data": False},
                      }
                      response = api_post("/v4/posting/fbs/list", body, headers)
                      page, postings, has_next = page_parts(response)
                      store_pages += 1
                      store_postings += len(postings)
                      page_dates = []
                      for posting in postings:
                          timestamp = posting.get("in_process_at") or posting.get("created_at")
                          if not timestamp:
                              raise RuntimeError("OZON_FBS_REQUIRED_POSTING_FIELDS_MISSING:" + label)
                          day = posting_day(timestamp, "FBS")
                          page_dates.append(day)
                          if day < COVERAGE_FROM or day > coverage_to:
                              continue
                          posting_number = str(posting.get("posting_number") or "").strip()
                          order_id = str(posting.get("order_id") or "").strip()
                          if not posting_number or not order_id:
                              raise RuntimeError("OZON_FBS_REQUIRED_POSTING_FIELDS_MISSING:" + label)
                          if not register_posting("FBS", posting, str(timestamp), posting_number, order_id):
                              continue
                          products = posting.get("products")
                          if not isinstance(products, list) or not products:
                              raise RuntimeError("OZON_FBS_PRODUCTS_MISSING:" + label)
                          for product in products:
                              offer = str(product.get("offer_id") or "").strip()
                              sku = str(product.get("sku") or "").strip()
                              title = str(product.get("name") or "").strip()
                              qty = float(product.get("quantity") or 0)
                              if not offer or not sku or not title or not qty.is_integer() or qty <= 0:
                                  raise RuntimeError("OZON_FBS_PRODUCT_ID_OR_QUANTITY_MISSING:" + label)
                              row_key = (cabinet, day, posting_number, order_id, offer, sku, title)
                              records_by_key[row_key] = records_by_key.get(row_key, 0) + int(qty)
                      if page_dates:
                          page_oldest, page_newest = min(page_dates), max(page_dates)
                          retained = sum(COVERAGE_FROM <= day <= coverage_to for day in page_dates)
                          outside = len(page_dates) - retained
                          print(f"OZON_API_{label}_FBS_PAGE_DATES={page_oldest}..{page_newest};retained={retained};outside={outside}")
                          if outside:
                              raise RuntimeError("OZON_FBS_FILTER_DATES_OUTSIDE_COVERAGE:" + label + ":" + page_oldest + ".." + page_newest)
                      if not has_next:
                          break
                      if not postings:
                          raise RuntimeError("OZON_FBS_EMPTY_PAGE_WITH_NEXT:" + label)
                      next_cursor = str(page.get("cursor") or page.get("next_cursor") or response.get("cursor") or response.get("next_cursor") or "").strip()
                      if not next_cursor or next_cursor == cursor or next_cursor in seen_cursors:
                          raise RuntimeError("OZON_FBS_CURSOR_MISSING_OR_REPEATED:" + label)
                      seen_cursors.add(next_cursor)
                      cursor = next_cursor
                      if store_pages >= 5000:
                          raise RuntimeError("OZON_FBS_PAGE_GUARD:" + label)

                  completed_accounts.append(cabinet)
                  store_page_counts[label] = store_pages
                  store_posting_counts[label] = store_postings
                  print(f"OZON_API_{label}_COMPLETE=true;pages={store_pages};postings={store_postings};duplicate_postings_skipped={duplicate_postings}")

              if sorted(completed_accounts) != ["1", "2"] or not records_by_key:
                  raise RuntimeError("OZON_API_BOTH_CABINETS_AND_NONEMPTY_HISTORY_REQUIRED")
              records = [
                  {"cabinet": key[0], "day": key[1], "posting": key[2], "order": key[3],
                   "offer": key[4], "sku": key[5], "title": key[6], "qty": qty}
                  for key, qty in sorted(records_by_key.items())
              ]
          else:
              records_by_key = {}
              completed_accounts = ["1", "2"]
              store_page_counts = {}
              store_posting_counts = {}
              records = []

          # Read-only check for the currently supported Ozon accrual endpoint; keep order publication independent.
          finance_probe_day = "2026-10-31"
          for cabinet, label, client_var, key_var in stores:
              api_context = {"store": label, "flow": "FINANCE_PROBE", "page": 1}
              finance_headers = {
                  "Client-Id": os.environ[client_var],
                  "Api-Key": os.environ[key_var],
                  "Content-Type": "application/json",
              }
              try:
                  probe_rows = []
                  probe_cursor = ""
                  seen_probe_cursors = set()
                  probe_pages = 0
                  while True:
                      probe_response = api_post(
                          "/v1/finance/accrual/by-day",
                          {"last_id": probe_cursor, "date": finance_probe_day},
                          finance_headers,
                      )
                      probe_result = probe_response.get("result", probe_response)
                      page_rows = probe_result.get("accruals") if isinstance(probe_result, dict) else None
                      if not isinstance(page_rows, list):
                          raise RuntimeError("OZON_FINANCE_PROBE_INVALID_ACCRUALS")
                      probe_rows.extend(page_rows)
                      probe_pages += 1
                      next_cursor = str(probe_result.get("last_id") or "").strip()
                      if not next_cursor:
                          break
                      if next_cursor == probe_cursor or next_cursor in seen_probe_cursors:
                          raise RuntimeError("OZON_FINANCE_PROBE_CURSOR_REPEATED")
                      seen_probe_cursors.add(next_cursor)
                      probe_cursor = next_cursor
                      if probe_pages >= 50:
                          raise RuntimeError("OZON_FINANCE_PROBE_PAGE_GUARD")
                  def safe_keys(value):
                      return sorted(value.keys()) if isinstance(value, dict) else []
                  sample = next((x for x in probe_rows if isinstance(x, dict)), {})
                  posting = sample.get("posting") if isinstance(sample, dict) else {}
                  products = posting.get("products") if isinstance(posting, dict) else []
                  product = next((x for x in products or [] if isinstance(x, dict)), {})
                  commission = product.get("commission") if isinstance(product, dict) else {}
                  delivery = product.get("delivery") if isinstance(product, dict) else {}
                  services = delivery.get("services") if isinstance(delivery, dict) else []
                  item_fees = sample.get("item_fees") if isinstance(sample, dict) else {}
                  fee_groups = item_fees.get("fees") if isinstance(item_fees, dict) else []
                  fee_group = next((x for x in fee_groups or [] if isinstance(x, dict)), {})
                  fee_items = fee_group.get("fees") if isinstance(fee_group, dict) else []
                  fee_item = next((x for x in fee_items or [] if isinstance(x, dict)), {})
                  non_item = sample.get("non_item_fee") if isinstance(sample, dict) else {}
                  category_counts = {}
                  for accrual in probe_rows:
                      category = str(accrual.get("accrued_category") or "<empty>") if isinstance(accrual, dict) else "<invalid>"
                      category_counts[category] = category_counts.get(category, 0) + 1
                  schema = {
                      "accrual": safe_keys(sample),
                      "posting": safe_keys(posting),
                      "product": safe_keys(product),
                      "commission": safe_keys(commission),
                      "delivery": safe_keys(delivery),
                      "delivery_service": safe_keys(next((x for x in services or [] if isinstance(x, dict)), {})),
                      "item_fees": safe_keys(item_fees),
                      "fee_group": safe_keys(fee_group),
                      "fee_item": safe_keys(fee_item),
                      "non_item_fee": safe_keys(non_item),
                  }
                  print(
                      "OZON_FINANCE_PROBE=store=" + label
                      + ";day=" + finance_probe_day
                      + ";status=AVAILABLE"
                      + ";pages=" + str(probe_pages)
                      + ";rows=" + str(len(probe_rows))
                      + ";categories=" + json.dumps(category_counts, ensure_ascii=True, sort_keys=True)
                      + ";schema=" + json.dumps(schema, ensure_ascii=True, sort_keys=True)[:1800],
                      flush=True,
                  )
              except Exception as exc:
                  print(
                      "OZON_FINANCE_PROBE=store=" + label
                      + ";day=" + finance_probe_day
                      + ";status=UNAVAILABLE"
                      + ";error_class=" + type(exc).__name__,
                      flush=True,
                  )

          url = "https://script.google.com/macros/s/" + os.environ["WEBAPP_DEPLOYMENT_ID"] + "/exec"
          exported_at = now.isoformat().replace("+00:00", "Z")
          accepted_actions = {"publish_ozon_api_orders", "publish_ozon_summary_orders"}
          store_jobs = (("1", "ДОМ"), ("2", "Хозяюшка"))
          if resume_phase == "finance":
              active_store_jobs = ()
          elif resume_store == "Хозяюшка":
              active_store_jobs = store_jobs[1:]
          else:
              active_store_jobs = store_jobs
          expected_order_stores = {store_name for _, store_name in active_store_jobs}
          records_by_cabinet = {cabinet: [] for cabinet, _ in store_jobs}
          for record in records:
              records_by_cabinet[record["cabinet"]].append(record)
          published = {}
          failures = []
          for cabinet, store_name in active_store_jobs:
              checkpoint("orders", store_name, "RUNNING", exported_at + ":" + str(len(records)), "not_written", "записать кабинет и перечитать листы")
              store_records = records_by_cabinet[cabinet]
              if not store_records:
                  failures.append(store_name + ":EMPTY_COMPLETE_EXPORT")
                  print("STORE=" + store_name + " OK=false ERROR=EMPTY_COMPLETE_EXPORT", flush=True)
                  continue
              payload = {
                  "token": os.environ["WEBHOOK_SECRET"],
                  "action": "publish_ozon_api_orders",
                  "source": "ozon_seller_api",
                  "complete": True,
                  "completed_accounts": completed_accounts,
                  "exported_at": exported_at,
                  "coverage_from": COVERAGE_FROM,
                  "coverage_to": coverage_to,
                  "records": store_records,
              }
              body = json.dumps(payload, ensure_ascii=False, separators=(",", ":")).encode("utf-8")
              source_digest = hashlib.sha256(body).hexdigest()
              print(f"OZON_API_STORE_EXPORT=store={store_name};records={len(store_records)};bytes={len(body)};coverage={COVERAGE_FROM}..{coverage_to};source_sha256={source_digest}", flush=True)
              result = None
              publish_error = None
              for attempt in range(1, 6):
                  req = urllib.request.Request(url, data=body, headers={"Content-Type": "application/json"}, method="POST")
                  try:
                      with urllib.request.urlopen(req, timeout=420) as response:
                          response_text = response.read().decode("utf-8").strip()
                      if not response_text:
                          raise json.JSONDecodeError("empty Apps Script response", "", 0)
                      result = json.loads(response_text)
                      break
                  except urllib.error.HTTPError as exc:
                      if exc.code not in {408, 425, 429, 500, 502, 503, 504}:
                          publish_error = "HTTPError:" + str(exc.code)
                          break
                      publish_error = "HTTPError:" + str(exc.code)
                  except (urllib.error.URLError, TimeoutError, ConnectionError, OSError, json.JSONDecodeError) as exc:
                      publish_error = type(exc).__name__ + ":" + str(exc)[:240]
                  if attempt < 5:
                      delay = min(10 * (2 ** (attempt - 1)), 120)
                      print(f"OZON_API_STORE_RETRY=store={store_name};attempt:{attempt+1}/5;after:{publish_error};wait:{delay}s", flush=True)
                      time.sleep(delay)
              if result is None:
                  failures.append(store_name + ":" + str(publish_error))
                  print("STORE=" + store_name + " OK=false ERROR=" + str(publish_error), flush=True)
                  continue
              if not isinstance(result, dict) or result.get("action") not in accepted_actions:
                  failures.append(store_name + ":INVALID_ACTION_RESPONSE")
                  print("STORE=" + store_name + " OK=false ERROR=INVALID_ACTION_RESPONSE", flush=True)
                  continue
              if result.get("source_fallback_used") is True:
                  failures.append(store_name + ":SOURCE_FALLBACK_USED")
                  print("STORE=" + store_name + " OK=false ERROR=SOURCE_FALLBACK_USED", flush=True)
                  continue
              store_result = next((item for item in (result.get("stores") or []) if item.get("store") == store_name), None)
              if not store_result or store_result.get("ok") is not True or store_result.get("readback") is not True:
                  failures.append(store_name + ":" + json.dumps(store_result or result, ensure_ascii=False)[:1200])
                  print("STORE=" + store_name + " OK=false ERROR=READBACK_FAILED", flush=True)
                  continue
              if int(store_result.get("source_rows") or 0) <= 0 or not store_result.get("source_min") or not store_result.get("source_max") or not store_result.get("sha256"):
                  failures.append(store_name + ":INCOMPLETE_READBACK")
                  print("STORE=" + store_name + " OK=false ERROR=INCOMPLETE_READBACK", flush=True)
                  continue
              published[store_name] = store_result
              print("STORE=" + store_name + " OK=true SOURCE_ROWS=" + str(store_result.get("source_rows"))
                    + " PERIOD=" + str(store_result.get("source_min")) + ".." + str(store_result.get("source_max"))
                    + " DAILY_ROWS=" + str(store_result.get("daily_rows"))
                    + " SKU_ROWS=" + str(store_result.get("sku_rows"))
                    + " ARCHIVED_ROWS=" + str(store_result.get("archived_rows"))
                    + " READBACK=" + str(store_result.get("readback"))
                    + " SHA256=" + str(store_result.get("sha256")), flush=True)
              if not failures:
                  completed_count = len(published)
                  if completed_count < len(active_store_jobs):
                      next_store = active_store_jobs[completed_count][1]
                      checkpoint("orders", next_store, "RUNNING", exported_at + ":" + str(len(records)), "previous_store_readback=true", "продолжить со следующего кабинета")
                  else:
                      checkpoint("finance", "all", "RUNNING", exported_at + ":" + str(len(records)), "order_readback=true", "проверить финансовый источник")
          if failures:
              failed_name = failures[0].split(":", 1)[0]
              failed_store = failed_name if failed_name in {"ДОМ", "Хозяюшка"} else (resume_store if resume_store != "all" else "ДОМ")
              checkpoint("orders", failed_store, "RETRY_REQUIRED", exported_at + ":" + str(len(records)), "readback=false", "повторить только неподтверждённый кабинет")
              raise SystemExit("OZON_API_STORE_PUBLISH_FAILED:" + json.dumps(failures, ensure_ascii=False)[:2400])
          if expected_order_stores - set(published):
              raise SystemExit("OZON_API_ORDER_READBACK_REQUIRED:" + json.dumps(sorted(expected_order_stores - set(published)), ensure_ascii=False))
          from decimal import Decimal, InvalidOperation
          checkpoint("finance", "all", "RUNNING", exported_at + ":" + str(len(records)), "order_readback=true", "получить финансовую историю")
          finance_days = []
          finance_ok_accounts = []
          finance_failures = []
          first_day = datetime.date.fromisoformat(COVERAGE_FROM)
          last_day = datetime.date.fromisoformat(coverage_to)

          def finance_amount(value, store, day):
              if isinstance(value, dict):
                  currency = str(value.get("currency") or "").strip().upper()
                  if currency not in {"RUB", "RUR", "643"}:
                      raise RuntimeError("OZON_FINANCE_CURRENCY_UNSUPPORTED:" + store + ":" + day + ":" + (currency or "MISSING"))
                  amount_object = value
                  currency = str(amount_object.get("currency") or "").strip().upper()
                  if currency not in {"RUB", "RUR", "643"}:
                      raise RuntimeError("OZON_FINANCE_CURRENCY_UNSUPPORTED:" + store + ":" + day + ":" + (currency or "MISSING"))
                  value = amount_object.get("amount")
                  if value is None or value == "":
                      value = amount_object.get("value")
              if value is None or value == "":
                  raise RuntimeError("OZON_FINANCE_AMOUNT_MISSING:" + store + ":" + day)
              raw = str(value).strip()
              if raw.lower().startswith("value:"):
                  raw = raw.split(":", 1)[1].strip().strip('"')
              if "," in raw and "." not in raw:
                  raw = raw.replace(",", ".")
              try:
                  amount = Decimal(raw)
              except InvalidOperation:
                  raise RuntimeError("OZON_FINANCE_AMOUNT_INVALID:" + store + ":" + day)
              if not amount.is_finite():
                  raise RuntimeError("OZON_FINANCE_AMOUNT_NONFINITE:" + store + ":" + day)
              return amount.quantize(Decimal("0.01"))

          for cabinet, label, client_var, key_var in stores:
              store_daily = []
              try:
                  headers = {
                      "Client-Id": os.environ[client_var],
                      "Api-Key": os.environ[key_var],
                      "Content-Type": "application/json",
                  }
                  day = first_day
                  finance_pages = 0
                  finance_rows = 0
                  category_totals = {k: Decimal("0.00") for k in ("ITEM", "POSTING", "NON_ITEM", "OTHER")}
                  while day <= last_day:
                      day_key = day.isoformat()
                      cursor = ""
                      seen_cursors = set()
                      day_rows = 0
                      day_unknown_categories = 0
                      missing_amount_rows = 0
                      missing_amount_categories = {}
                      missing_amount_samples = []
                      day_totals = {k: Decimal("0.00") for k in ("ITEM", "POSTING", "NON_ITEM", "OTHER")}
                      while True:
                          finance_pages += 1
                          api_context.update({"store": label, "flow": "FINANCE", "page": finance_pages})
                          response = api_post(
                              "/v1/finance/accrual/by-day",
                              {"last_id": cursor, "date": day_key},
                              headers,
                          )
                          result_page = response.get("result", response)
                          accruals = result_page.get("accruals") if isinstance(result_page, dict) else None
                          if not isinstance(accruals, list):
                              raise RuntimeError("OZON_FINANCE_ACCRUALS_MISSING:" + label + ":" + day_key)
                          for accrual in accruals:
                              if not isinstance(accrual, dict):
                                  raise RuntimeError("OZON_FINANCE_INVALID_ROW:" + label + ":" + day_key)
                              total_raw = accrual.get("total_amount")
                              raw_category = str(accrual.get("accrued_category") or "").strip().upper()
                              try:
                                  amount = finance_amount(total_raw, label, day_key)
                              except RuntimeError as amount_error:
                                  if not str(amount_error).startswith("OZON_FINANCE_AMOUNT_MISSING:"):
                                      raise
                                  missing_amount_rows += 1
                                  missing_amount_categories[raw_category or "<empty>"] = missing_amount_categories.get(raw_category or "<empty>", 0) + 1
                                  if len(missing_amount_samples) < 3:
                                      nested = {}
                                      for field in ("posting", "item_fees", "non_item_fee", "container_fees"):
                                          item = accrual.get(field)
                                          nested[field] = {
                                              "keys": sorted(item.keys()) if isinstance(item, dict) else [],
                                              "type": type(item).__name__,
                                          }
                                          if field == "posting" and isinstance(item, dict):
                                              products = item.get("products")
                                              nested[field]["product_count"] = len(products) if isinstance(products, list) else None
                                          if field == "item_fees" and isinstance(item, dict):
                                              groups = item.get("fees")
                                              nested[field]["group_count"] = len(groups) if isinstance(groups, list) else None
                                      missing_amount_samples.append({
                                          "category": raw_category or "<empty>",
                                          "total_amount_keys": sorted(total_raw.keys()) if isinstance(total_raw, dict) else [],
                                          "nested": nested,
                                      })
                                  continue
                              category = raw_category if raw_category in ("ITEM", "POSTING", "NON_ITEM") else "OTHER"
                              day_totals[category] += amount
                              if category == "OTHER":
                                  day_unknown_categories += 1
                              day_rows += 1
                              finance_rows += 1
                          next_cursor = str(result_page.get("last_id") or "").strip()
                          if not next_cursor:
                              break
                          if next_cursor == cursor or next_cursor in seen_cursors:
                              raise RuntimeError("OZON_FINANCE_CURSOR_REPEATED:" + label + ":" + day_key)
                          seen_cursors.add(next_cursor)
                          cursor = next_cursor
                          if len(seen_cursors) >= 50:
                              raise RuntimeError("OZON_FINANCE_PAGE_GUARD:" + label + ":" + day_key)
                      if missing_amount_rows:
                          print("OZON_FINANCE_AMOUNT_GAPS=store="+label+";day="+day_key+";rows="+str(missing_amount_rows)+";categories="+json.dumps(missing_amount_categories,sort_keys=True)+";samples="+json.dumps(missing_amount_samples,ensure_ascii=True,sort_keys=True),flush=True)
                          raise RuntimeError("OZON_FINANCE_AMOUNT_MISSING_SUMMARY:" + label + ":" + day_key + ":" + str(missing_amount_rows))
                      total = sum(day_totals.values(), Decimal("0.00"))
                      category_totals = {k: category_totals[k] + day_totals[k] for k in category_totals}
                      store_daily.append({
                          "cabinet": cabinet,
                          "day": day_key,
                          "rows": day_rows,
                          "total": str(total),
                          "item": str(day_totals["ITEM"]),
                          "posting": str(day_totals["POSTING"]),
                          "non_item": str(day_totals["NON_ITEM"]),
                          "other": str(day_totals["OTHER"]),
                          "unknown_categories": day_unknown_categories,
                      })
                      day += datetime.timedelta(days=1)
                  finance_days.extend(store_daily)
                  finance_ok_accounts.append(cabinet)
                  print("OZON_FINANCE_SOURCE=store="+label+";status=complete;days="+str(len(store_daily))+";rows="+str(finance_rows)+";pages="+str(finance_pages)+";coverage="+COVERAGE_FROM+".."+coverage_to+";category_sums="+json.dumps({k:str(v) for k,v in category_totals.items()},sort_keys=True),flush=True)
              except Exception as exc:
                  finance_failures.append(label + ":" + type(exc).__name__ + ":" + str(exc)[:240])
                  print("OZON_FINANCE_SOURCE=store="+label+";status=retry_required;error_class="+type(exc).__name__+";reason="+str(exc)[:220],flush=True)

          finance_published = {}
          for cabinet, label, client_var, key_var in stores:
              if cabinet not in finance_ok_accounts:
                  continue
              daily = [row for row in finance_days if row["cabinet"] == cabinet]
              payload = {
                  "token": os.environ["WEBHOOK_SECRET"],
                  "action": "publish_ozon_api_finance",
                  "source": "ozon_seller_api_accrual",
                  "complete": True,
                  "completed_accounts": [cabinet],
                  "coverage_from": COVERAGE_FROM,
                  "coverage_to": coverage_to,
                  "exported_at": exported_at,
                  "daily": daily,
              }
              body = json.dumps(payload, ensure_ascii=False, separators=(",", ":")).encode("utf-8")
              result = None
              publish_error = None
              for attempt in range(1, 6):
                  req = urllib.request.Request(url, data=body, headers={"Content-Type": "application/json"}, method="POST")
                  try:
                      with urllib.request.urlopen(req, timeout=420) as response:
                          response_text = response.read().decode("utf-8").strip()
                      if not response_text:
                          raise json.JSONDecodeError("empty Apps Script response", "", 0)
                      result = json.loads(response_text)
                      break
                  except urllib.error.HTTPError as exc:
                      publish_error = "HTTPError:" + str(exc.code)
                      if exc.code not in {408, 425, 429, 500, 502, 503, 504}:
                          break
                  except (urllib.error.URLError, TimeoutError, ConnectionError, OSError, json.JSONDecodeError) as exc:
                      publish_error = type(exc).__name__ + ":" + str(exc)[:180]
                  if attempt < 5:
                      delay = min(10 * (2 ** (attempt - 1)), 120)
                      print("OZON_FINANCE_PUBLISH_RETRY=store="+label+";attempt="+str(attempt+1)+"/5;wait="+str(delay)+"s;cause="+str(publish_error),flush=True)
                      time.sleep(delay)
              expected_store_name = {"DOM": "ДОМ", "HOZYAYUSHKA": "Хозяюшка"}.get(label)
              item = next((x for x in (result or {}).get("stores", []) if x.get("store") == expected_store_name), None) if isinstance(result, dict) else None
              if not isinstance(result, dict) or result.get("ok") is not True or not item or item.get("readback") is not True:
                  finance_failures.append(label + ":PUBLISH_READBACK_FAILED:" + json.dumps(item or result, ensure_ascii=False)[:500])
                  print("OZON_FINANCE_PUBLISH=store="+label+";status=retry_required;readback=false",flush=True)
                  continue
              finance_published[label] = item
              print("OZON_FINANCE_PUBLISH=store="+label+";status=verified;days="+str(item.get("days"))+";periods="+str(item.get("periods"))+";accrual_rows="+str(item.get("accrual_rows"))+";archive_rows="+str(item.get("archived_rows"))+";readback=true;daily_sha256="+str(item.get("daily_sha256"))+";period_sha256="+str(item.get("period_sha256")),flush=True)

          if finance_failures:
              checkpoint("finance", "all", "RETRY_REQUIRED", exported_at + ":" + str(len(records)), "finance_readback_incomplete", "повторить финансовый этап")
              raise SystemExit("OZON_FINANCE_SYNC_RETRY_REQUIRED:" + json.dumps(finance_failures, ensure_ascii=False)[:1800])
          if set(finance_published) != {label for _, label, _, _ in stores}:
              checkpoint("finance", "all", "RETRY_REQUIRED", exported_at + ":" + str(len(records)), "finance_readback_incomplete", "повторить финансовый этап")
              raise SystemExit("OZON_FINANCE_BOTH_STORE_READBACKS_REQUIRED:" + json.dumps(sorted(finance_published), ensure_ascii=False))
          print("OZON_FINANCE_PUBLISH_OK=true;stores=2;coverage="+COVERAGE_FROM+".."+coverage_to,flush=True)
          checkpoint("complete", "all", "VERIFIED", exported_at + ":" + str(len(records)), "orders_and_finance_readback=true", "ожидать следующего штатного запуска")

          PY

  recover:
    needs: publish
    if: ${{ always() && (needs.publish.result == 'failure' || needs.publish.result == 'cancelled') && (github.event_name != 'workflow_dispatch' || inputs.resume_attempt == '0') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Queue one serialized recovery attempt
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECOVERY_REF: ${{ github.ref_name }}
          RECOVERY_STORE: ${{ needs.publish.outputs.resume_store || 'all' }}
          RECOVERY_PHASE: ${{ needs.publish.outputs.resume_phase || 'source' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          payload = {
              "ref": os.environ["RECOVERY_REF"],
              "inputs": {
                  "resume_store": os.environ["RECOVERY_STORE"],
                  "resume_phase": os.environ["RECOVERY_PHASE"],
                  "resume_attempt": "1",
              },
          }
          request = urllib.request.Request(
              "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"] + "/actions/workflows/ozon-summary-orders-sync.yml/dispatches",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 204:
                  raise SystemExit("RECOVERY_DISPATCH_FAILED:HTTP_" + str(response.status))
          print("OZON_RECOVERY_DISPATCHED=store:" + os.environ["RECOVERY_STORE"] + ";phase:" + os.environ["RECOVERY_PHASE"] + ";attempt:1", flush=True)
          PY
