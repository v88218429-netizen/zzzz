                        body = json.dumps(payload, ensure_ascii=False, separators=(",", ":")).encode("utf-8")
                        result = None
                        publish_error = None
                        for attempt in range(1, 6):
                            req = urllib.request.Request(url, data=body, headers={"Content-Type": "application/json"}, method="POST")
                            try:
                                with urllib.request.urlopen(req, timeout=420) as response:
                                    response_text = response.read().decode("utf-8").strip()
                                if not response_text:
                                    raise json.JSONDecodeError("empty Apps Script response", "", 0)
                                result = json.loads(response_text)
                                break
                            except urllib.error.HTTPError as exc:
                                publish_error = "HTTPError:" + str(exc.code)
                                if exc.code not in {408, 425, 429, 500, 502, 503, 504}:
                                    break
                            except (urllib.error.URLError, TimeoutError, ConnectionError, OSError, json.JSONDecodeError) as exc:
                                publish_error = type(exc).__name__ + ":" + str(exc)[:180]
                            if attempt < 5:
                                delay = min(10 * (2 ** (attempt - 1)), 120)
                                print("OZON_FINANCE_PUBLISH_RETRY=store="+label+";attempt="+str(attempt+1)+"/5;wait="+str(delay)+"s;cause="+str(publish_error),flush=True)
                                time.sleep(delay)
                        item = next((x for x in (result or {}).get("stores", []) if x.get("store") == label), None) if isinstance(result, dict) else None
                        if not isinstance(result, dict) or result.get("ok") is not True or not item or item.get("readback") is not True:
                            finance_failures.append(label + ":PUBLISH_READBACK_FAILED:" + json.dumps(item or result, ensure_ascii=False)[:500])
                            print("OZON_FINANCE_PUBLISH=store="+label+";status=retry_required;readback=false",flush=True)
                            continue
                        finance_published[label] = item
                        print("OZON_FINANCE_PUBLISH=store="+label+";status=verified;days="+str(item.get("days"))+";periods="+str(item.get("periods"))+";accrual_rows="+str(item.get("accrual_rows"))+";archive_rows="+str(item.get("archived_rows"))+";readback=true;daily_sha256="+str(item.get("daily_sha256"))+";period_sha256="+str(item.get("period_sha256")),flush=True)

                    if finance_failures:
                        raise SystemExit("OZON_FINANCE_SYNC_RETRY_REQUIRED:" + json.dumps(finance_failures, ensure_ascii=False)[:1800])
                    if set(finance_published) != {"ДОМ", "Хозяюшка"}:
                        raise SystemExit("OZON_FINANCE_BOTH_STORE_READBACKS_REQUIRED:" + json.dumps(sorted(finance_published), ensure_ascii=False))
                    print("OZON_FINANCE_PUBLISH_OK=true;stores=2;coverage="+COVERAGE_FROM+".."+coverage_to,flush=True)

