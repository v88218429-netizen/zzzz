name: Ozon summary orders sync

on:
  workflow_dispatch:
  push:
    branches: [mainggg]
    paths:
      - ".github/workflows/ozon-summary-orders-sync.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_run:
    workflows:
      - Sellmonitor GitHub worker deploy
    types: [completed]
    branches: [mainggg]

permissions:
  contents: read

concurrency:
  group: ozon-summary-orders-sync
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WEBAPP_DEPLOYMENT_ID: AKfycbyU_OXpFYqvBx0KDuGCgEHsnzkts_fnJzVe8DM8crRDD1A_fr5DqOfVfW_PYJriaXU_jw
      WEBHOOK_SECRET: ${{ secrets.SELLMONITOR_GITHUB_WEBHOOK_SECRET }}
    steps:
      - name: Check configured authorization
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WEBAPP_DEPLOYMENT_ID"
          test -n "$WEBHOOK_SECRET"
          echo "::add-mask::$WEBHOOK_SECRET"

      - name: Check Ozon Seller API secret configuration
        shell: bash
        env:
          OZON_DOM_CLIENT_ID: ${{ secrets.OZON_SELLER_DOM_CLIENT_ID }}
          OZON_DOM_API_KEY: ${{ secrets.OZON_SELLER_DOM_API_KEY }}
          OZON_HOZYAYUSHKA_CLIENT_ID: ${{ secrets.OZON_SELLER_HOZYAYUSHKA_CLIENT_ID }}
          OZON_HOZYAYUSHKA_API_KEY: ${{ secrets.OZON_SELLER_HOZYAYUSHKA_API_KEY }}
        run: |
          python - <<'PY'
          import os
          names = (
              "OZON_DOM_CLIENT_ID",
              "OZON_DOM_API_KEY",
              "OZON_HOZYAYUSHKA_CLIENT_ID",
              "OZON_HOZYAYUSHKA_API_KEY",
          )
          for name in names:
              value = os.environ.get(name, "")
              if value:
                  print("::add-mask::" + value)
              print(name + "=" + ("configured" if value else "missing"))
          PY

      - name: Probe current Ozon Seller API access
        continue-on-error: true
        shell: bash
        env:
          OZON_DOM_CLIENT_ID: ${{ secrets.OZON_SELLER_DOM_CLIENT_ID }}
          OZON_DOM_API_KEY: ${{ secrets.OZON_SELLER_DOM_API_KEY }}
          OZON_HOZYAYUSHKA_CLIENT_ID: ${{ secrets.OZON_SELLER_HOZYAYUSHKA_CLIENT_ID }}
          OZON_HOZYAYUSHKA_API_KEY: ${{ secrets.OZON_SELLER_HOZYAYUSHKA_API_KEY }}
        run: |
          python - <<'PY'
          import datetime, json, os, time, urllib.error, urllib.request
          until = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0)
          since = until - datetime.timedelta(days=60)
          window = {"since": since.isoformat().replace("+00:00", "Z"), "to": until.isoformat().replace("+00:00", "Z")}
          stores = (
              ("DOM", "OZON_DOM_CLIENT_ID", "OZON_DOM_API_KEY"),
              ("HOZYAYUSHKA", "OZON_HOZYAYUSHKA_CLIENT_ID", "OZON_HOZYAYUSHKA_API_KEY"),
          )
          methods = (
              ("FBO", "/v3/posting/fbo/list", {"dir":"ASC","filter":dict(window), "limit":1000,"offset":0,"with":{"analytics_data":True,"financial_data":True}}),
              ("FBS", "/v4/posting/fbs/list", {"dir":"ASC","filter":dict(window,status=""),"limit":100,"cursor":"","with":{"analytics_data":True,"financial_data":True}}),
          )
          failures = 0
          for store, client_key, api_key in stores:
              client, key = os.environ.get(client_key, ""), os.environ.get(api_key, "")
              if client: print("::add-mask::" + client)
              if key: print("::add-mask::" + key)
              if not client or not key:
                  print(f"OZON_API_{store}_credentials=missing")
                  failures += 2
                  continue
              for label, endpoint, body in methods:
                  result = None
                  code = 0
                  detail = ""
                  for attempt in range(3):
                      req = urllib.request.Request(
                          "https://api-seller.ozon.ru" + endpoint,
                          data=json.dumps(body).encode(),
                          headers={"Client-Id":client,"Api-Key":key,"Content-Type":"application/json"},
                          method="POST",
                      )
                      try:
                          with urllib.request.urlopen(req, timeout=45) as response:
                              code = response.status
                              result = json.loads(response.read().decode())
                          break
                      except urllib.error.HTTPError as exc:
                          code = exc.code
                          detail = exc.read(1000).decode("utf-8", "replace").replace("\\n", " ")[:600]
                          if code not in (429,500,502,503,504) or attempt == 2: break
                      except (urllib.error.URLError, TimeoutError, json.JSONDecodeError):
                          if attempt == 2: break
                      time.sleep(2 ** attempt)
                  if code != 200 or not isinstance(result, dict):
                      print(f"OZON_API_{store}_{label}=http_{code};detail={detail}")
                      failures += 1
                      continue
                  records = result.get("postings")
                  if records is None:
                      records = result.get("result")
                  if isinstance(records, dict):
                      records = records.get("postings") or records.get("items") or []
                  count = len(records) if isinstance(records, list) else 0
                  print(f"OZON_API_{store}_{label}=ok;rows={count};has_next={bool(result.get('has_next'))}")
          if failures == 4:
              raise SystemExit("OZON_SELLER_API_ALL_METHODS_FAILED")
          PY

      - name: Publish and verify both Ozon summaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request

          url = "https://script.google.com/macros/s/" + os.environ["WEBAPP_DEPLOYMENT_ID"] + "/exec"
          token = os.environ["WEBHOOK_SECRET"]

          def post(action, timeout=90):
              payload=json.dumps({"token":token,"action":action}).encode("utf-8")
              req=urllib.request.Request(url,data=payload,headers={"Content-Type":"application/json"},method="POST")
              with urllib.request.urlopen(req,timeout=timeout) as response:
                  return json.loads(response.read().decode("utf-8"))

          def print_export_diagnostic(result, attempt):
              diagnostic=(result.get("export_diagnostic") or {}) if isinstance(result,dict) else {}
              print("OZON_SOURCE_STATUS="+str(result.get("source_status") or ""))
              print("OZON_SOURCE_LAST_SUCCESS="+str(result.get("source_last_success") or result.get("source_updated") or ""))
              for key,label in (("job","JOB"),("in_progress","IN_PROGRESS"),("last_attempt_at","LAST_ATTEMPT_AT"),("continuation_pending","CONTINUATION_PENDING"),("last_error","LAST_ERROR")):
                  value=diagnostic.get(key)
                  print("OZON_EXPORT_"+label+"="+str(value or "").replace("\\\\n"," ")[:400])
              print(f"OZON_PUBLISH_ATTEMPT={attempt}/8")

          def needs_resume(result):
              # Existing order activity can be readable while the exporter heartbeat is red.
              reason=str((result or {}).get("reason") or "")
              status=str((result or {}).get("source_status") or "").lower()
              last_success=str((result or {}).get("source_last_success") or "")
              return ("OZON_SOURCE_EXPORT_NOT_VERIFIED" in reason
                      or "red" in status
                      or not last_success)

          result=None
          last=None
          continuation_accepted=False
          for attempt in range(1,9):
              try:
                  result=post("publish_ozon_summary_orders",timeout=90)
              except (urllib.error.URLError,TimeoutError,json.JSONDecodeError) as exc:
                  last=type(exc).__name__+": "+str(exc)[:240]
                  print("OZON_PUBLISH_REQUEST_ERROR="+last)
              else:
                  if isinstance(result,dict) and result.get("ok") is True and not needs_resume(result):
                      break
                  last=json.dumps({
                      "reason":result.get("reason") if isinstance(result,dict) else None,
                      "source_status":result.get("source_status") if isinstance(result,dict) else None,
                      "source_last_success":result.get("source_last_success") if isinstance(result,dict) else None,
                      "stores":[{"store":x.get("store"),"ok":x.get("ok"),"error":x.get("error")} for x in (result.get("stores") or [])] if isinstance(result,dict) else []
                  },ensure_ascii=False)[:1200]
                  if needs_resume(result) and not continuation_accepted:
                      print_export_diagnostic(result,attempt)
                      resume_result=None
                      resume_error=None
                      for resume_attempt in range(1,4):
                          try:
                              resume_result=post("resume_ozon_export",timeout=180)
                          except (urllib.error.URLError,TimeoutError,json.JSONDecodeError) as exc:
                              resume_error=type(exc).__name__+": "+str(exc)[:240]
                              print("OZON_CONTINUATION_REQUEST_ERROR="+resume_error)
                          else:
                              body=resume_result.get("result") or {}
                              outcome=body.get("continuation_result") or {}
                              resumed=outcome.get("started_fresh_export") is True or outcome.get("continued_existing_export") is True
                              safe={k:outcome.get(k) for k in ("ok","started_fresh_export","continuation_pending","continued_existing_export","result_type","skipped","error_code","reason") if k in outcome}
                              print("OZON_CONTINUATION_ATTEMPT="+str(resume_attempt)+"/3")
                              print("OZON_CONTINUATION_OUTCOME="+json.dumps(safe,ensure_ascii=False)[:700])
                              if resume_result.get("ok") is True and body.get("called") is True and outcome.get("ok") is True and resumed:
                                  continuation_accepted=True
                                  print("OZON_CONTINUATION_ACCEPTED=true")
                                  break
                              resume_error=str(safe or resume_result.get("error") or "continuation_not_accepted")
                              if outcome.get("skipped")!="script_lock_busy":
                                  break
                          if resume_attempt<3:
                              time.sleep(20*resume_attempt)
                      if not continuation_accepted:
                          last="OZON_CONTINUATION_FAILED: "+str(resume_error or last)
                          print("OZON_CONTINUATION_ACCEPTED=false")
                          break
                  elif isinstance(result,dict) and result.get("ok") is False and not needs_resume(result):
                      break
                  if needs_resume(result):
                      print_export_diagnostic(result,attempt)
              # The exporter is asynchronous. Do not republish the same source snapshot
              # repeatedly in this run: that only duplicates journal entries. The next
              # scheduled run will verify the exporter heartbeat and publish once fresh.
              if continuation_accepted:
                  print("OZON_CONTINUATION_SCHEDULED=true; waiting for next scheduled verification")
                  break
              if attempt<8:
                  time.sleep(min(60,15*attempt))

          if not result or result.get("ok") is not True:
              raise SystemExit("Ozon summary publication failed after bounded source recovery: "+str(last))
          stores=result.get("stores") or []
          expected={"ДОМ","Хозяюшка"}
          actual={x.get("store") for x in stores if x.get("ok") is True and x.get("readback") is True}
          if actual!=expected:
              raise SystemExit("Ozon summary readback acceptance failed: "+json.dumps(stores,ensure_ascii=False))
          print("OZON_SOURCE_RECOVERED_BY_CONTINUATION="+str(continuation_accepted).lower())
          print("SOURCE_UPDATED="+str(result.get("source_updated")))
          print("SOURCE_ROWS="+str(result.get("source_rows")))
          for store in stores:
              print("STORE="+str(store.get("store"))
                    +" OK="+str(store.get("ok"))
                    +" SOURCE_ROWS="+str(store.get("source_rows"))
                    +" PERIOD="+str(store.get("source_min"))+".."+str(store.get("source_max"))
                    +" DAILY_ROWS="+str(store.get("daily_rows"))
                    +" SKU_ROWS="+str(store.get("sku_rows"))
                    +" ARCHIVED_ROWS="+str(store.get("archived_rows"))
                    +" READBACK="+str(store.get("readback"))
                    +" SHA256="+str(store.get("sha256")))
          source_status=str(result.get("source_status") or "")
          source_last_success=str(result.get("source_last_success") or "")
          if "red" in source_status.lower() or not source_last_success:
              raise SystemExit("OZON_SOURCE_NOT_HEALTHY: summaries were republished from an unverified source; see source status above")
          PY
