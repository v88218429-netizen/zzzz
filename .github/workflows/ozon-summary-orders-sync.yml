          def finance_amount(value, store, day):
              if isinstance(value, dict):
                  currency = str(value.get("currency") or value.get("currency_code") or value.get("currencyCode") or "").strip().upper()
                  if currency not in {"RUB", "RUR", "643"}:
                      raise RuntimeError("OZON_FINANCE_CURRENCY_UNSUPPORTED:" + store + ":" + day + ":" + (currency or "MISSING"))
                  amount_value = value.get("amount")
                  if amount_value is None or amount_value == "":
                      amount_value = value.get("value")
                  if amount_value is None and "units" in value and "nanos" in value:
                      try:
                          amount_value = Decimal(str(value.get("units"))) + Decimal(str(value.get("nanos"))) / Decimal("1000000000")
                      except (InvalidOperation, TypeError, ValueError):
                          raise RuntimeError("OZON_FINANCE_AMOUNT_INVALID:" + store + ":" + day)
                  value = amount_value
              if value is None or value == "":
                  raise RuntimeError("OZON_FINANCE_AMOUNT_MISSING:" + store + ":" + day)
              raw = str(value).strip()
              if raw.lower().startswith("value:"):
                  raw = raw.split(":", 1)[1].strip().strip('"')
              if "," in raw and "." not in raw:
                  raw = raw.replace(",", ".")
              try:
                  amount = Decimal(raw)
              except InvalidOperation:
                  raise RuntimeError("OZON_FINANCE_AMOUNT_INVALID:" + store + ":" + day)
              if not amount.is_finite():
                  raise RuntimeError("OZON_FINANCE_AMOUNT_NONFINITE:" + store + ":" + day)
              return amount.quantize(Decimal("0.01"))

          for cabinet, label, client_var, key_var in finance_store_jobs:
              store_name = store_label_by_cabinet[cabinet]
              finance_request_key = finance_request_keys[cabinet]
              checkpoint("finance", store_name, "RUNNING", finance_request_key, "source_not_read", "получить все дневные начисления кабинета")
              store_daily = []
              try:
                  headers = {
                      "Client-Id": os.environ[client_var],
                      "Api-Key": os.environ[key_var],
                      "Content-Type": "application/json",
                  }
                  day = first_day
                  finance_pages = 0
                  finance_rows = 0
                  category_totals = {k: Decimal("0.00") for k in ("ITEM", "POSTING", "NON_ITEM", "OTHER")}
                  while day <= last_day:
                      day_key = day.isoformat()
                      cursor = ""
                      seen_cursors = set()
                      day_rows = 0
                      day_unknown_categories = 0
                      missing_amount_rows = 0
                      missing_amount_categories = {}
                      missing_amount_samples = []
                      day_totals = {k: Decimal("0.00") for k in ("ITEM", "POSTING", "NON_ITEM", "OTHER")}
                      while True:
                          finance_pages += 1
                          api_context.update({"store": label, "flow": "FINANCE", "page": finance_pages})
                          response = api_post(
                              "/v1/finance/accrual/by-day",
                              {"last_id": cursor, "date": day_key},
                              headers,
                          )
                          result_page = response.get("result", response)
                          accruals = result_page.get("accruals") if isinstance(result_page, dict) else None
                          if not isinstance(accruals, list):
                              raise RuntimeError("OZON_FINANCE_ACCRUALS_MISSING:" + label + ":" + day_key)
                          for accrual in accruals:
                              if not isinstance(accrual, dict):
                                  raise RuntimeError("OZON_FINANCE_INVALID_ROW:" + label + ":" + day_key)
                              # Reconcile store/category totals from top-level total_amount only; nested item_fees are SKU diagnostics and are never added again.
                              total_raw = accrual.get("total_amount")
                              raw_category = str(accrual.get("accrued_category") or "").strip().upper()
                              try:
                                  amount = finance_amount(total_raw, label, day_key)
                              except RuntimeError as amount_error:
                                  if not str(amount_error).startswith("OZON_FINANCE_AMOUNT_MISSING:"):
                                      raise
                                  missing_amount_rows += 1
                                  missing_amount_categories[raw_category or "<empty>"] = missing_amount_categories.get(raw_category or "<empty>", 0) + 1
                                  if len(missing_amount_samples) < 3:
                                      nested = {}
                                      for field in ("posting", "item_fees", "non_item_fee", "container_fees"):
                                          item = accrual.get(field)
                                          nested[field] = {
                                              "keys": sorted(item.keys()) if isinstance(item, dict) else [],
                                              "type": type(item).__name__,
                                          }
                                          if field == "posting" and isinstance(item, dict):
                                              products = item.get("products")
                                              nested[field]["product_count"] = len(products) if isinstance(products, list) else None
                                          if field == "item_fees" and isinstance(item, dict):
                                              groups = item.get("fees")
                                              nested[field]["group_count"] = len(groups) if isinstance(groups, list) else None
                                      missing_amount_samples.append({
                                          "category": raw_category or "<empty>",
                                          "total_amount_keys": sorted(total_raw.keys()) if isinstance(total_raw, dict) else [],
                                          "nested": nested,
                                      })
                                  continue
                              category = raw_category if raw_category in ("ITEM", "POSTING", "NON_ITEM") else "OTHER"
                              day_totals[category] += amount
                              if category == "OTHER":
                                  day_unknown_categories += 1
                              day_rows += 1
                              finance_rows += 1
                          next_cursor = str(result_page.get("last_id") or "").strip()
                          if not next_cursor:
                              break
                          if next_cursor == cursor or next_cursor in seen_cursors:
                              raise RuntimeError("OZON_FINANCE_CURSOR_REPEATED:" + label + ":" + day_key)
                          seen_cursors.add(next_cursor)
                          cursor = next_cursor
                          if len(seen_cursors) >= 50:
                              raise RuntimeError("OZON_FINANCE_PAGE_GUARD:" + label + ":" + day_key)
                      if missing_amount_rows:
                          print("OZON_FINANCE_AMOUNT_GAPS=store="+label+";day="+day_key+";rows="+str(missing_amount_rows)+";categories="+json.dumps(missing_amount_categories,sort_keys=True)+";samples="+json.dumps(missing_amount_samples,ensure_ascii=True,sort_keys=True),flush=True)
                          raise RuntimeError("OZON_FINANCE_AMOUNT_MISSING_SUMMARY:" + label + ":" + day_key + ":" + str(missing_amount_rows))
                      total = sum(day_totals.values(), Decimal("0.00"))
                      category_totals = {k: category_totals[k] + day_totals[k] for k in category_totals}
                      store_daily.append({
                          "cabinet": cabinet,
                          "day": day_key,
                          "rows": day_rows,
                          "total": str(total),
                          "item": str(day_totals["ITEM"]),
                          "posting": str(day_totals["POSTING"]),
                          "non_item": str(day_totals["NON_ITEM"]),
                          "other": str(day_totals["OTHER"]),
                          "unknown_categories": day_unknown_categories,
                      })
                      day += datetime.timedelta(days=1)
                  finance_days.extend(store_daily)
                  finance_ok_accounts.append(cabinet)
                  finance_exported_at_by_cabinet[cabinet] = datetime.datetime.now(UTC).replace(microsecond=0).isoformat().replace("+00:00", "Z")
                  finance_fields = ("cabinet", "day", "rows", "total", "item", "posting", "non_item", "other", "unknown_categories")
                  canonical_finance_rows = sorted(
                      [[stable_source_value(row.get(field)) for field in finance_fields] for row in store_daily],
                      key=lambda row: row[1],
                  )
                  finance_digest = hashlib.sha256(
                      json.dumps(canonical_finance_rows, ensure_ascii=False, separators=(",", ":")).encode("utf-8")
                  ).hexdigest()
                  finance_source_key = (
                      "ozon-finance-v2|cabinet=" + cabinet + "|period=" + COVERAGE_FROM + ".." + coverage_to
                      + "|sha256=" + finance_digest
                  )
                  finance_source_keys[cabinet] = finance_source_key
                  checkpoint("finance", store_name, "RUNNING", finance_source_key, "source_readback=true;write_pending", "опубликовать и перечитать фактический диапазон")
                  category_digest = hashlib.sha256(json.dumps({k: str(v) for k, v in category_totals.items()}, sort_keys=True, separators=(",", ":")).encode("utf-8")).hexdigest()
                  print("OZON_FINANCE_SOURCE=store="+label+";status=complete;days="+str(len(store_daily))+";rows="+str(finance_rows)+";pages="+str(finance_pages)+";coverage="+COVERAGE_FROM+".."+coverage_to+";source_key="+finance_source_key+";category_sums_sha256="+category_digest,flush=True)
              except Exception as exc:
                  finance_failures.append(label + ":" + type(exc).__name__ + ":" + str(exc)[:240])
                  checkpoint("finance", store_name, "RETRY_REQUIRED", finance_source_keys.get(cabinet, finance_request_key), "source_readback=false", "повторить получение только этого кабинета")
                  print("OZON_FINANCE_SOURCE=store="+label+";status=retry_required;error_class="+type(exc).__name__+";reason="+str(exc)[:220],flush=True)

          finance_published = {}
          for cabinet, label, client_var, key_var in finance_store_jobs:
              if cabinet not in finance_ok_accounts:
                  continue
              daily = [row for row in finance_days if row["cabinet"] == cabinet]
              finance_source_key = finance_source_keys[cabinet]
              finance_store_name = store_label_by_cabinet[cabinet]
              checkpoint("finance", finance_store_name, "RUNNING", finance_source_key, "source_readback=true;not_written", "записать дневные и периодные итоги, затем перечитать")
              payload = {
                  "token": os.environ["WEBHOOK_SECRET"],
                  "action": "publish_ozon_api_finance",
                  "source": "ozon_seller_api_accrual",
                  "complete": True,
                  "completed_accounts": [cabinet],
                  "coverage_from": COVERAGE_FROM,
                  "coverage_to": coverage_to,
                  "exported_at": finance_exported_at_by_cabinet[cabinet],
                  "source_key": finance_source_key,
                  "daily": daily,
              }
              body = json.dumps(payload, ensure_ascii=False, separators=(",", ":")).encode("utf-8")
              result = None
              publish_error = None
              for attempt in range(1, 6):
                  req = urllib.request.Request(url, data=body, headers={"Content-Type": "application/json"}, method="POST")
                  try:
                      with urllib.request.urlopen(req, timeout=420) as response:
                          response_text = response.read().decode("utf-8").strip()
                      if not response_text:
                          raise json.JSONDecodeError("empty Apps Script response", "", 0)
                      result = json.loads(response_text)
                      break
                  except urllib.error.HTTPError as exc:
                      publish_error = "HTTPError:" + str(exc.code)
                      if exc.code not in {408, 425, 429, 500, 502, 503, 504}:
                          break
                  except (urllib.error.URLError, TimeoutError, ConnectionError, OSError, json.JSONDecodeError) as exc:
                      publish_error = type(exc).__name__ + ":" + str(exc)[:180]
                  if attempt < 5:
                      delay = min(10 * (2 ** (attempt - 1)), 120)
                      print("OZON_FINANCE_PUBLISH_RETRY=store="+label+";attempt="+str(attempt+1)+"/5;wait="+str(delay)+"s;cause="+str(publish_error),flush=True)
                      time.sleep(delay)
              expected_store_name = {"DOM": "ДОМ", "HOZYAYUSHKA": "Хозяюшка"}.get(label)
              item = next((x for x in (result or {}).get("stores", []) if x.get("store") == expected_store_name), None) if isinstance(result, dict) else None
              item_audit = item.get("grid_audit") or [] if isinstance(item, dict) else []
              for audit in item_audit:
                  print("OZON_FINANCE_GRID_AUDIT=" + json.dumps(audit, ensure_ascii=False, sort_keys=True), flush=True)
              if not isinstance(result, dict) or result.get("ok") is not True or not item or item.get("readback") is not True or item.get("source_key") != finance_source_key:
                  finance_failures.append(label + ":PUBLISH_READBACK_FAILED:" + json.dumps(item or result, ensure_ascii=False)[:900])
                  print("OZON_FINANCE_PUBLISH=store="+label+";status=retry_required;readback="+str(bool(item and item.get("readback")))+";expected_source_key="+finance_source_key+";actual_source_key="+str((item or {}).get("source_key") if isinstance(item,dict) else None)+";detail="+json.dumps(item or result,ensure_ascii=False)[:1000],flush=True)
                  continue
              finance_published[label] = item
              print("OZON_FINANCE_PUBLISH=store="+label+";status=verified;source_key="+finance_source_key+";days="+str(item.get("days"))+";periods="+str(item.get("periods"))+";accrual_rows="+str(item.get("accrual_rows"))+";archive_rows="+str(item.get("archived_rows"))+";readback=true;daily_sha256="+str(item.get("daily_sha256"))+";period_sha256="+str(item.get("period_sha256"))+";grid_cells_before="+str(item.get("grid_cells_before"))+";grid_cells_after="+str(item.get("grid_cells_after")),flush=True)
              checkpoint("finance", finance_store_name, "VERIFIED", finance_source_key, "readback=true;daily_sha256="+str(item.get("daily_sha256"))+";period_sha256="+str(item.get("period_sha256")), "кабинет и фактический диапазон подтверждены")

          if finance_failures:
              failed_labels = []
              for failure in finance_failures:
                  candidate = failure.split(":", 1)[0]
                  if candidate in {"DOM", "HOZYAYUSHKA"} and candidate not in failed_labels:
                      failed_labels.append(candidate)
              if not failed_labels:
                  failed_labels = [label for _, label, _, _ in finance_store_jobs]
              failed_cabinets = [cabinet for cabinet, label, _, _ in finance_store_jobs if label in failed_labels]
              failed_names = [store_label_by_cabinet[cabinet] for cabinet in ("1", "2") if cabinet in failed_cabinets]
              failed_store = ",".join(failed_names) or "all"
              failed_keys = [finance_source_keys.get(cabinet) or finance_request_keys.get(cabinet, "") for cabinet in failed_cabinets]
              checkpoint("finance", failed_store, "RETRY_REQUIRED", ";".join(k for k in failed_keys if k), "finance_readback_incomplete", "повторить только неподтверждённые кабинеты")
              raise SystemExit("OZON_FINANCE_SYNC_RETRY_REQUIRED:" + json.dumps(finance_failures, ensure_ascii=False)[:1800])
          expected_finance_labels = {label for _, label, _, _ in finance_store_jobs}
          if set(finance_published) != expected_finance_labels:
              missing_labels = sorted(expected_finance_labels - set(finance_published))
              failed_cabinets = [cabinet for cabinet, label, _, _ in finance_store_jobs if label in missing_labels]
              failed_names = [store_label_by_cabinet[cabinet] for cabinet in ("1", "2") if cabinet in failed_cabinets]
              failed_keys = [finance_source_keys.get(cabinet) or finance_request_keys.get(cabinet, "") for cabinet in failed_cabinets]
              checkpoint("finance", ",".join(failed_names) or "all", "RETRY_REQUIRED", ";".join(k for k in failed_keys if k), "finance_readback_incomplete", "повторить недостающие кабинеты")
              raise SystemExit("OZON_FINANCE_STORE_READBACKS_REQUIRED:" + json.dumps(missing_labels, ensure_ascii=False))
          verified_keys = sorted(
              [str(item.get("source_key")) for item in published.values() if item.get("source_key")]
              + [str(item.get("source_key")) for item in finance_published.values() if item.get("source_key")]
          )
          cycle_digest = hashlib.sha256(json.dumps(verified_keys, ensure_ascii=False, separators=(",", ":")).encode("utf-8")).hexdigest()
          cycle_key = "ozon-cycle-v2|period=" + COVERAGE_FROM + ".." + coverage_to + "|sha256=" + cycle_digest
          print("OZON_FINANCE_PUBLISH_OK=true;stores="+str(len(finance_published))+";coverage="+COVERAGE_FROM+".."+coverage_to,flush=True)
          final_readback = "finance_readback=true;orders_preverified_by_recovery_parent=true" if resume_phase == "finance" else "orders_and_finance_readback=true"
          checkpoint("complete", "all", "VERIFIED", cycle_key, final_readback, "ожидать следующего штатного запуска")

          PY

  recover:
    needs: publish
    if: ${{ always() && (needs.publish.result == 'failure' || needs.publish.result == 'cancelled') && (github.event_name != 'workflow_dispatch' || inputs.resume_attempt != '5') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Queue bounded serialized recovery attempt
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECOVERY_REF: ${{ github.ref_name }}
          RECOVERY_STORE: ${{ needs.publish.outputs.resume_store || 'all' }}
          RECOVERY_PHASE: ${{ needs.publish.outputs.resume_phase || 'source' }}
          RECOVERY_ATTEMPT: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_attempt || '0' }}
          RECOVERY_SOURCE_KEY: ${{ needs.publish.outputs.resume_source_key || '' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.request
          attempt = int(os.environ.get('RECOVERY_ATTEMPT', '0'))
          if attempt >= 5:
              print('OZON_RECOVERY=exhausted;attempt=' + str(attempt), flush=True)
              raise SystemExit('OZON_RECOVERY_ATTEMPTS_EXHAUSTED')
          delay = min(30 * (2 ** attempt), 900)
          print('OZON_RECOVERY_WAIT=seconds:' + str(delay) + ';attempt:' + str(attempt + 1), flush=True)
          time.sleep(delay)
          next_attempt = str(attempt + 1)
          payload = {
              "ref": os.environ["RECOVERY_REF"],
              "inputs": {
                  "resume_store": os.environ["RECOVERY_STORE"],
                  "resume_phase": os.environ["RECOVERY_PHASE"],
                  "resume_attempt": next_attempt,
                  "resume_source_key": os.environ.get("RECOVERY_SOURCE_KEY", ""),
              },
          }
          request = urllib.request.Request(
              "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"] + "/actions/workflows/ozon-summary-orders-sync.yml/dispatches",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 204:
                  raise SystemExit("RECOVERY_DISPATCH_FAILED:HTTP_" + str(response.status))
          print("OZON_RECOVERY_DISPATCHED=store:" + os.environ["RECOVERY_STORE"] + ";phase:" + os.environ["RECOVERY_PHASE"] + ";attempt:" + next_attempt, flush=True)
          PY
