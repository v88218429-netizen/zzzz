name: WB search snapshot sync

on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"
  push:
    branches: [mainggg]
    paths:
      - "wb_worker/github_search_snapshot_sync.py"
      - ".github/workflows/wb-search-snapshot-sync.yml"

permissions:
  contents: read

concurrency:
  group: wb-search-snapshot-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mainggg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bridge client dependency
        run: python -m pip install --disable-pip-version-check httpx

      - name: Generate factual WB search snapshots independently
        id: collect
        env:
          WB_API_TOKEN_AA: ${{ secrets.WB_API_TOKEN_AA }}
          WB_API_TOKEN_YV: ${{ secrets.WB_API_TOKEN_YV }}
          SEARCH_GITHUB_OUT: ${{ runner.temp }}/wb-search
        run: python wb_worker/github_search_snapshot_sync.py

      - name: Publish available factual snapshots to private Sellmonitor sheets
        if: always() && steps.collect.outcome != 'cancelled'
        env:
          SEARCH_GITHUB_OUT: ${{ runner.temp }}/wb-search
          GOOGLE_SHEETS_BRIDGE_URL: "https://script.google.com/macros/s/AKfycbyU_OXpFYqvBx0KDuGCgEHsnzkts_fnJzVe8DM8crRDD1A_fr5DqOfVfW_PYJriaXU_jw/exec"
          GOOGLE_SHEETS_BRIDGE_KEY: ${{ secrets.SELLMONITOR_GITHUB_WEBHOOK_SECRET }}
        run: python wb_worker/github_search_snapshot_sync.py --publish

      - name: Accept published factual snapshots and record unavailable sources
        if: always() && steps.collect.outcome != 'cancelled'
        env:
          SEARCH_GITHUB_OUT: ${{ runner.temp }}/wb-search
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib

          manifest_path = pathlib.Path(os.environ["SEARCH_GITHUB_OUT"]) / "manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          states = manifest.get("cabinets") or {}
          factual = [name for name, state in states.items() if state.get("status") == "FACTUAL"]
          if not factual:
              raise SystemExit("search acceptance failed: no factual cabinet snapshots were published")
          print("WB_SEARCH_FACTUAL_CABINETS=" + ",".join(sorted(factual)))
          for name, state in sorted(states.items()):
              if state.get("status") != "FACTUAL":
                  reason = str(state.get("reason_code") or "").strip()
                  if not reason:
                      raise SystemExit(f"search acceptance failed: {name} is unavailable without a reason")
                  print(f"WB_SEARCH_SOURCE_UNAVAILABLE={name}:{reason}")
          PY
