name: WB search snapshot sync

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"
  push:
    branches: [mainggg]
    paths:
      - "wb_worker/github_search_snapshot_sync.py"
      - ".github/workflows/wb-search-snapshot-sync.yml"

permissions:
  contents: write

concurrency:
  group: wb-search-snapshot-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mainggg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate factual WB search snapshots
        env:
          WB_API_TOKEN_AA: ${{ secrets.WB_API_TOKEN_AA }}
          WB_API_TOKEN_YV: ${{ secrets.WB_API_TOKEN_YV }}
          SEARCH_GITHUB_OUT: "${{ github.workspace }}/wb_data/search"
        run: |
          set -euo pipefail
          test -n "$WB_API_TOKEN_AA"
          test -n "$WB_API_TOKEN_YV"
          python wb_worker/github_search_snapshot_sync.py

      - name: Validate derived output
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path("wb_data/search")
          allowed_trust={"FACTUAL_WB_ANALYTICS","FACTUAL_PUBLIC_SERP"}
          allowed_sources={"wb_search_report","wb_public_search"}
          for name in ("air.json","hozyushka.json"):
              obj=json.loads((root/name).read_text(encoding="utf-8"))
              rows=obj.get("data") or {}
              assert obj.get("trust_status") in allowed_trust, obj
              assert len(rows)>=10, (name,len(rows))
              sources=set()
              for x in rows.values():
                  assert x.get("source") in allowed_sources
                  assert x.get("query")
                  assert isinstance(x.get("nm_id"), int)
                  assert float(x.get("position"))>=1
                  sources.add(x.get("source"))
              print(name, "rows=", len(rows), "trust=", obj.get("trust_status"), "sources=", sorted(sources), "period_end=", obj.get("period_end"))
          PY

      - name: Publish non-secret snapshots
        run: |
          set -euo pipefail
          git config user.name "wb-search-bot"
          git config user.email "wb-search-bot@users.noreply.github.com"
          git add wb_data/search/air.json wb_data/search/hozyushka.json wb_data/search/manifest.json
          if git diff --cached --quiet; then
            echo "No WB search changes"
            exit 0
          fi
          git commit -m "wb search: refresh factual snapshots"
          git push
