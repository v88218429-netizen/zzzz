name: WB search snapshot sync

on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"
  push:
    branches: [mainggg]
    paths:
      - "wb_worker/github_search_snapshot_sync.py"
      - ".github/workflows/wb-search-snapshot-sync.yml"

permissions:
  contents: read

concurrency:
  group: wb-search-snapshot-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mainggg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate factual WB search snapshots independently
        id: collect
        env:
          WB_API_TOKEN_AA: ${{ secrets.WB_API_TOKEN_AA }}
          WB_API_TOKEN_YV: ${{ secrets.WB_API_TOKEN_YV }}
          SEARCH_GITHUB_OUT: ${{ runner.temp }}/wb-search
        run: python wb_worker/github_search_snapshot_sync.py

      - name: Publish available factual snapshots to private Sellmonitor sheets
        if: always() && steps.collect.outcome != 'cancelled'
        env:
          SEARCH_GITHUB_OUT: ${{ runner.temp }}/wb-search
          GOOGLE_SHEETS_BRIDGE_URL: "https://script.google.com/macros/s/AKfycbyU_OXpFYqvBx0KDuGCgEHsnzkts_fnJzVe8DM8crRDD1A_fr5DqOfVfW_PYJriaXU_jw/exec"
          GOOGLE_SHEETS_BRIDGE_KEY: ${{ secrets.SELLMONITOR_GITHUB_WEBHOOK_SECRET }}
        run: python wb_worker/github_search_snapshot_sync.py --publish

      - name: Require factual search sources for both cabinets
        if: always() && steps.collect.outcome != 'cancelled'
        env:
          SEARCH_GITHUB_OUT: ${{ runner.temp }}/wb-search
        run: python wb_worker/github_search_snapshot_sync.py --require-all
