name: Repair AIR legacy FBS trigger loop

on:
  push:
    branches: [mainggg]
    paths:
      - ".github/workflows/repair-air-fbs-trigger-loop.yml"
      - "wb_worker/air_fbs_trigger_repair.py"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

# This repair changes only AIR script code, triggers and queue properties; it never writes order data.
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      AIR_SCRIPT_ID: 1snEntW5W9KZ_zKHP5bT4D-fmr-sbDdjV4-izjRxf46l8HWcrt3GJqU9V
      AIR_REPAIR_INGRESS_DEPLOYMENT_ID: AKfycbwU2bwpVsKrwD1ir_vRCCoGwQKB0pqRvl3r0q7Hr5Vro86EoCY40fx36kAQbVB5nTxx

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate clasp access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLASPRC_JSON"
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path.home()/'.clasprc.json'
          obj=json.loads(p.read_text())
          if not isinstance(obj,dict) or not obj:
              raise SystemExit('invalid CLASPRC_JSON')
          print('AIR_CLASP_AUTH=valid')
          PY

      - name: Install clasp and pull exact AIR project
        shell: bash
        run: |
          set -euo pipefail
          npm install -g @google/clasp
          rm -rf /tmp/air-bound-script
          mkdir -p /tmp/air-bound-script
          printf '{"scriptId":"%s","rootDir":"."}\n' "$AIR_SCRIPT_ID" > /tmp/air-bound-script/.clasp.json
          cd /tmp/air-bound-script
          clasp pull
          test -f 'Код.js'
          test -f GithubTokenIngress.js
          test -f appsscript.json
          echo "AIR_LIVE_SOURCE_PULL=ok"

      - name: Save pre-change recovery copy
        uses: actions/upload-artifact@v4
        with:
          name: air-apps-script-before-repair-${{ github.run_id }}
          path: /tmp/air-bound-script/
          include-hidden-files: true
          retention-days: 30

      - name: Apply the guarded AIR-only source patch
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          code='/tmp/air-bound-script/Код.js'
          ingress='/tmp/air-bound-script/GithubTokenIngress.js'
          manifest='/tmp/air-bound-script/appsscript.json'
          if grep -q 'AIR_FBS_GITHUB_TRIGGER_TIMER_CLEANUP_V1' "$code" &&
             grep -q 'AIR_FBS_GITHUB_TRIGGER_REPAIR_V1' "$ingress" &&
             grep -q 'repair-air-fbs-trigger-loop.yml' "$ingress" &&
             grep -q '"access": "ANYONE_ANONYMOUS"' "$manifest" &&
             grep -q '"executeAs": "USER_DEPLOYING"' "$manifest"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "AIR_PATCH_ALREADY_PRESENT=yes"
          else
            python wb_worker/air_fbs_trigger_repair.py /tmp/air-bound-script
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          grep -q 'AIR_FBS_GITHUB_TRIGGER_TIMER_CLEANUP_V1' "$code"
          grep -q 'AIR_FBS_GITHUB_TRIGGER_REPAIR_V1' "$ingress"
          grep -q 'repair-air-fbs-trigger-loop.yml' "$ingress"
          echo "AIR_PATCH_MARKERS=verified"

      - name: Check syntax of every AIR script file
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            tmp="$(mktemp --suffix=.js)"
            cp "$file" "$tmp"
            node --check "$tmp"
            rm -f "$tmp"
            count=$((count+1))
          done < <(find /tmp/air-bound-script -type f \( -name '*.js' -o -name '*.gs' \) -print0)
          test "$count" -gt 0
          echo "AIR_SYNTAX_OK=$count"

      - name: Push AIR source for cleanup by existing timers
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/air-bound-script
          clasp push -f
          echo "AIR_SOURCE_PUSHED_FOR_EXISTING_TIMER_CLEANUP=yes"
          clasp update-deployment "$AIR_REPAIR_INGRESS_DEPLOYMENT_ID" --description "AIR GitHub-only FBS trigger repair anonymous 2026-11-11"
          echo "AIR_REPAIR_INGRESS_REDEPLOYED=yes"

      - name: Read back deployed AIR source
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/air-bound-script
          clasp pull
          grep -q 'AIR_FBS_GITHUB_TRIGGER_TIMER_CLEANUP_V1' '/tmp/air-bound-script/Код.js'
          grep -A2 'function scheduledFastCheck()' '/tmp/air-bound-script/Код.js' | grep -q 'wbFbsCleanupLegacyFbsTriggersFromTimerV1_'
          grep -A2 'function scheduledFastCheckContinuationV293_()' '/tmp/air-bound-script/Код.js' | grep -q 'wbFbsCleanupLegacyFbsTriggersFromTimerV1_'
          grep -A2 'function scheduledFullSyncContinuationV292_()' '/tmp/air-bound-script/Код.js' | grep -q 'wbFbsCleanupLegacyFbsTriggersFromTimerV1_'
          grep -q 'AIR_FBS_GITHUB_TRIGGER_REPAIR_V1' /tmp/air-bound-script/GithubTokenIngress.js
          echo "AIR_DEPLOYED_SOURCE_READBACK=verified"

      - name: Verify protected AIR repair deployment
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/air-bound-script
          clasp deployments > /tmp/air-deployments.txt
          cat /tmp/air-deployments.txt
          grep -Fq "$AIR_REPAIR_INGRESS_DEPLOYMENT_ID" /tmp/air-deployments.txt
          echo "AIR_REPAIR_INGRESS_DEPLOYMENT=verified"

      - name: Stop retired AIR FBS triggers through the first working GitHub ingress
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          (async () => {
            const deployments = [
              "AKfycbwe6RKyfm0Gbr1sccfQRnAIwRUm5PAjfFbIp6t2anc",
              "AKfycbw91xwMuZ1-XqU2gMjGCj0Nc7bqoB57LLCQKR4tsJrRaJ_zjtHkolUBvYreIRn308BM",
              "AKfycbx45nZRar0QzaHxlG3iDThVLRU4tdrRE1hWPF-pWIHxQU6Du7zN89SNfG8suB1lr-Hb",
              process.env.AIR_REPAIR_INGRESS_DEPLOYMENT_ID,
              "AKfycbxyxnfxFl3GLkTukEDoM-n4gOnlslMv52Ghl2pGho9tQWpnSf6aSXAg7qZZFwtfnrKb",
              "AKfycbw92e1aJ7yUPkJR50gKqhlctnQC2rUYUH58-l6JgRAAfKSqY9v5sRpFbTo3otcjqP8",
              "AKfycbwGKBniZxxHrACCDuxQwfd-sAs8FMBxlDKvUbXCEAkZMAqeyynt9eRNpL-1ty3wZluw"
            ].filter((value,index,array)=>value&&array.indexOf(value)===index);
            const retired = new Set([
              "scheduledFastCheck",
              "scheduledFastCheckContinuationV293_",
              "scheduledFullSyncContinuationV292_"
            ]);
            const attempts = [];
            let verifiedState = null;
            for (const deploymentId of deployments) {
              try {
                const response = await fetch("https://script.google.com/macros/s/" +
                  deploymentId + "/exec", {
                    method: "POST",
                    headers: {"content-type":"application/json","cache-control":"no-store"},
                    body: JSON.stringify({
                      store:"AIR",
                      operation:"stop_legacy_fbs_triggers",
                      githubToken:process.env.GITHUB_TOKEN,
                      runId:process.env.GITHUB_RUN_ID,
                      runAttempt:process.env.GITHUB_RUN_ATTEMPT,
                      wbToken:""
                    }),
                    signal:AbortSignal.timeout(20000)
                  });
                const responseText = await response.text();
                let envelope = null;
                try { envelope = JSON.parse(responseText); } catch {}
                const state = envelope && (envelope.state || envelope.data || envelope.result || envelope);
                const after = state && state.after;
                const handlers = after && after.handlers;
                const validEnvelope = response.ok && envelope && envelope.ok === true &&
                  state && state.ok === true && state.action === "stop_legacy_fbs_triggers";
                if (validEnvelope && Array.isArray(handlers) &&
                    handlers.every(handler => !retired.has(handler)) &&
                    after.fastQueuePending === false && after.fullSyncQueuePending === false &&
                    state.retainedMaintenanceTrigger === true && state.dataSheetsChanged === false) {
                  verifiedState = state;
                  attempts.push({deployment:deploymentId.slice(0,12),httpStatus:response.status,verified:true});
                  break;
                }
                attempts.push({
                  deployment:deploymentId.slice(0,12),
                  httpStatus:response.status,
                  contentType:response.headers.get("content-type")||"",
                  envelopeOk:envelope&&envelope.ok===true,
                  action:state&&state.action||null,
                  verified:false
                });
              } catch (error) {
                attempts.push({deployment:deploymentId.slice(0,12),errorType:String(error&&error.name||"Error")});
              }
            }
            const after=(verifiedState||{}).after||{};
            console.log(JSON.stringify({
              verified:Boolean(verifiedState),
              attempts,
              removed:verifiedState&&verifiedState.removed||null,
              remainingLegacyHandlers:verifiedState&&verifiedState.remainingLegacyHandlers||null,
              retainedMaintenanceTrigger:verifiedState&&verifiedState.retainedMaintenanceTrigger===true,
              queuesCleared:Boolean(after.fastQueuePending===false&&after.fullSyncQueuePending===false),
              dataSheetsChanged:verifiedState&&verifiedState.dataSheetsChanged
            }));
            if(!verifiedState)throw new Error("AIR_TRIGGER_REPAIR_NOT_VERIFIED");
          })().catch(error=>{console.error(error.message);process.exit(1);});
          NODE
