name: Repair AIR legacy FBS trigger loop

on:
  push:
    branches: [mainggg]
    paths:
      - ".github/workflows/repair-air-fbs-trigger-loop.yml"
      - "wb_worker/air_fbs_trigger_repair.py"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

# This repair changes only AIR script code, triggers and queue properties; it never writes order data.
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      AIR_SCRIPT_ID: 1snEntW5W9KZ_zKHP5bT4D-fmr-sbDdjV4-izjRxf46l8HWcrt3GJqU9V
      AIR_REPAIR_INGRESS_DEPLOYMENT_ID: AKfycbwU2bwpVsKrwD1ir_vRCCoGwQKB0pqRvl3r0q7Hr5Vro86EoCY40fx36kAQbVB5nTxx

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate clasp access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLASPRC_JSON"
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path.home()/'.clasprc.json'
          obj=json.loads(p.read_text())
          if not isinstance(obj,dict) or not obj:
              raise SystemExit('invalid CLASPRC_JSON')
          print('AIR_CLASP_AUTH=valid')
          PY

      - name: Install clasp and pull exact AIR project
        shell: bash
        run: |
          set -euo pipefail
          npm install -g @google/clasp
          rm -rf /tmp/air-bound-script
          mkdir -p /tmp/air-bound-script
          printf '{"scriptId":"%s","rootDir":"."}\n' "$AIR_SCRIPT_ID" > /tmp/air-bound-script/.clasp.json
          cd /tmp/air-bound-script
          clasp pull
          test -f 'Код.js'
          test -f GithubTokenIngress.js
          test -f appsscript.json
          echo "AIR_LIVE_SOURCE_PULL=ok"

      - name: Save pre-change recovery copy
        uses: actions/upload-artifact@v4
        with:
          name: air-apps-script-before-repair-${{ github.run_id }}
          path: /tmp/air-bound-script/
          include-hidden-files: true
          retention-days: 30

      - name: Apply the guarded AIR-only source patch
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          code='/tmp/air-bound-script/Код.js'
          ingress='/tmp/air-bound-script/GithubTokenIngress.js'
          if grep -q 'AIR_FBS_GITHUB_TRIGGER_TIMER_CLEANUP_V1' "$code" &&
             grep -q 'AIR_FBS_GITHUB_TRIGGER_REPAIR_V1' "$ingress" &&
             grep -q 'repair-air-fbs-trigger-loop.yml' "$ingress"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "AIR_PATCH_ALREADY_PRESENT=yes"
          else
            python wb_worker/air_fbs_trigger_repair.py /tmp/air-bound-script
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          grep -q 'AIR_FBS_GITHUB_TRIGGER_TIMER_CLEANUP_V1' "$code"
          grep -q 'AIR_FBS_GITHUB_TRIGGER_REPAIR_V1' "$ingress"
          grep -q 'repair-air-fbs-trigger-loop.yml' "$ingress"
          echo "AIR_PATCH_MARKERS=verified"

      - name: Check syntax of every AIR script file
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            tmp="$(mktemp --suffix=.js)"
            cp "$file" "$tmp"
            node --check "$tmp"
            rm -f "$tmp"
            count=$((count+1))
          done < <(find /tmp/air-bound-script -type f \( -name '*.js' -o -name '*.gs' \) -print0)
          test "$count" -gt 0
          echo "AIR_SYNTAX_OK=$count"

      - name: Push AIR source for cleanup by existing timers
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/air-bound-script
          clasp push -f
          echo "AIR_SOURCE_PUSHED_FOR_EXISTING_TIMER_CLEANUP=yes"

      - name: Read back deployed AIR source
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/air-bound-script
          clasp pull
          grep -q 'AIR_FBS_GITHUB_TRIGGER_TIMER_CLEANUP_V1' '/tmp/air-bound-script/Код.js'
          grep -A2 'function scheduledFastCheck()' '/tmp/air-bound-script/Код.js' | grep -q 'wbFbsCleanupLegacyFbsTriggersFromTimerV1_'
          grep -A2 'function scheduledFastCheckContinuationV293_()' '/tmp/air-bound-script/Код.js' | grep -q 'wbFbsCleanupLegacyFbsTriggersFromTimerV1_'
          grep -A2 'function scheduledFullSyncContinuationV292_()' '/tmp/air-bound-script/Код.js' | grep -q 'wbFbsCleanupLegacyFbsTriggersFromTimerV1_'
          grep -q 'AIR_FBS_GITHUB_TRIGGER_REPAIR_V1' /tmp/air-bound-script/GithubTokenIngress.js
          echo "AIR_DEPLOYED_SOURCE_READBACK=verified"

      - name: Verify protected AIR repair deployment
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/air-bound-script
          clasp deployments > /tmp/air-deployments.txt
          cat /tmp/air-deployments.txt
          grep -Fq "$AIR_REPAIR_INGRESS_DEPLOYMENT_ID" /tmp/air-deployments.txt
          echo "AIR_REPAIR_INGRESS_DEPLOYMENT=verified"

      - name: Stop retired AIR FBS triggers and verify live state via Apps Script API
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/air-bound-script
          echo "AIR_APPS_SCRIPT_MANIFEST_BEGIN"
          cat appsscript.json
          echo "AIR_APPS_SCRIPT_MANIFEST_END"
          set +e
          clasp run-function scheduledFastCheck --json > /tmp/air-trigger-repair-result.txt 2>&1
          clasp_status=$?
          set -e
          echo "AIR_CLASP_RUN_EXIT=$clasp_status"
          cat /tmp/air-trigger-repair-result.txt
          test "$clasp_status" -eq 0
          python - <<'PY'
          import json, pathlib, sys
          raw=pathlib.Path('/tmp/air-trigger-repair-result.txt').read_text(errors='replace')
          print('AIR_TRIGGER_REPAIR_EXECUTION_OUTPUT_BEGIN')
          print(raw[-5000:])
          print('AIR_TRIGGER_REPAIR_EXECUTION_OUTPUT_END')
          candidates=[]
          for line in raw.splitlines():
              line=line.strip()
              for offset,char in enumerate(line):
                  if char!='{': continue
                  try:
                      obj=json.loads(line[offset:])
                  except Exception:
                      continue
                  stack=[obj]
                  while stack:
                      current=stack.pop()
                      if isinstance(current,dict):
                          if current.get('action')=='stop_legacy_fbs_triggers':
                              candidates.append(current)
                          stack.extend(current.values())
                      elif isinstance(current,list):
                          stack.extend(current)
          state=next((item for item in reversed(candidates) if item.get('ok') is True),None)
          after=(state or {}).get('after') or {}
          handlers=after.get('handlers') or []
          retired={'scheduledFastCheck','scheduledFastCheckContinuationV293_','scheduledFullSyncContinuationV292_'}
          verified=bool(state and not retired.intersection(handlers) and
              after.get('fastQueuePending') is False and after.get('fullSyncQueuePending') is False and
              state.get('retainedMaintenanceTrigger') is True and state.get('dataSheetsChanged') is False)
          print(json.dumps({
              'verified':verified,
              'removed':(state or {}).get('removed'),
              'remainingLegacyHandlers':(state or {}).get('remainingLegacyHandlers'),
              'retainedMaintenanceTrigger':(state or {}).get('retainedMaintenanceTrigger'),
              'queuesCleared':after.get('fastQueuePending') is False and after.get('fullSyncQueuePending') is False,
              'dataSheetsChanged':(state or {}).get('dataSheetsChanged')
          },ensure_ascii=False))
          if not verified:
              raise SystemExit('AIR_TRIGGER_REPAIR_NOT_VERIFIED')
          PY
