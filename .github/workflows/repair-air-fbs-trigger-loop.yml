name: Repair AIR legacy FBS trigger loop

on:
  push:
    branches: [mainggg]
    paths:
      - ".github/workflows/repair-air-fbs-trigger-loop.yml"
      - "wb_worker/air_fbs_trigger_repair.py"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

# This repair changes only AIR script code, triggers and queue properties; it never writes order data.
# Execute the already-authorized retirement of the legacy AIR timers through GitHub.
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      AIR_SCRIPT_ID: 1snEntW5W9KZ_zKHP5bT4D-fmr-sbDdjV4-izjRxf46l8HWcrt3GJqU9V
      AIR_REPAIR_INGRESS_DEPLOYMENT_ID: AKfycbwU2bwpVsKrwD1ir_vRCCoGwQKB0pqRvl3r0q7Hr5Vro86EoCY40fx36kAQbVB5nTxx

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate clasp access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLASPRC_JSON"
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path.home()/'.clasprc.json'
          obj=json.loads(p.read_text())
          if not isinstance(obj,dict) or not obj:
              raise SystemExit('invalid CLASPRC_JSON')
          print('AIR_CLASP_AUTH=valid')
          PY

      - name: Install clasp and pull exact AIR project
        shell: bash
        run: |
          set -euo pipefail
          npm install -g @google/clasp
          rm -rf /tmp/air-bound-script
          mkdir -p /tmp/air-bound-script
          printf '{"scriptId":"%s","rootDir":"."}\n' "$AIR_SCRIPT_ID" > /tmp/air-bound-script/.clasp.json
          cd /tmp/air-bound-script
          clasp pull
          test -f 'Код.js'
          test -f GithubTokenIngress.js
          test -f appsscript.json
          echo "AIR_LIVE_SOURCE_PULL=ok"

      - name: Save pre-change recovery copy
        uses: actions/upload-artifact@v4
        with:
          name: air-apps-script-before-repair-${{ github.run_id }}
          path: /tmp/air-bound-script/
          include-hidden-files: true
          retention-days: 30

      - name: Apply the guarded AIR-only source patch
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          code='/tmp/air-bound-script/Код.js'
          ingress='/tmp/air-bound-script/GithubTokenIngress.js'
          manifest='/tmp/air-bound-script/appsscript.json'
          if grep -q 'AIR_FBS_LEGACY_TIMERS_NEUTRALIZED_V1' "$code" &&
             grep -q 'AIR_FBS_GITHUB_TRIGGER_REPAIR_V1' "$ingress" &&
             grep -q 'repair-air-fbs-trigger-loop.yml' "$ingress" &&
             grep -q '"access": "ANYONE_ANONYMOUS"' "$manifest" &&
             grep -q '"executeAs": "USER_DEPLOYING"' "$manifest"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "AIR_PATCH_ALREADY_PRESENT=yes"
          else
            python wb_worker/air_fbs_trigger_repair.py /tmp/air-bound-script
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          grep -q 'AIR_FBS_LEGACY_TIMERS_NEUTRALIZED_V1' "$code"
          grep -q 'AIR_FBS_GITHUB_TRIGGER_REPAIR_V1' "$ingress"
          grep -q 'repair-air-fbs-trigger-loop.yml' "$ingress"
          echo "AIR_PATCH_MARKERS=verified"

      - name: Check syntax of every AIR script file
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            tmp="$(mktemp --suffix=.js)"
            cp "$file" "$tmp"
            node --check "$tmp"
            rm -f "$tmp"
            count=$((count+1))
          done < <(find /tmp/air-bound-script -type f \( -name '*.js' -o -name '*.gs' \) -print0)
          test "$count" -gt 0
          echo "AIR_SYNTAX_OK=$count"

      - name: Push AIR source for cleanup by existing timers
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/air-bound-script
          clasp push -f
          echo "AIR_SOURCE_PUSHED_FOR_EXISTING_TIMER_CLEANUP=yes"
          clasp update-deployment "$AIR_REPAIR_INGRESS_DEPLOYMENT_ID" --description "AIR GitHub-only FBS trigger repair anonymous 2026-11-11"
          echo "AIR_REPAIR_INGRESS_REDEPLOYED=yes"

      - name: Read back deployed AIR source
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/air-bound-script
          clasp pull
          grep -q 'AIR_FBS_LEGACY_TIMERS_NEUTRALIZED_V1' '/tmp/air-bound-script/Код.js'
          grep -A4 'function scheduledFastCheck()' '/tmp/air-bound-script/Код.js' | grep -q 'AIR_FBS_LEGACY_TIMERS_NEUTRALIZED_V1'
          grep -A4 'function scheduledFastCheckContinuationV293_()' '/tmp/air-bound-script/Код.js' | grep -q 'AIR_FBS_LEGACY_TIMERS_NEUTRALIZED_V1'
          grep -A4 'function scheduledFullSyncContinuationV292_()' '/tmp/air-bound-script/Код.js' | grep -q 'AIR_FBS_LEGACY_TIMERS_NEUTRALIZED_V1'
          grep -q 'AIR_FBS_GITHUB_TRIGGER_REPAIR_V1' /tmp/air-bound-script/GithubTokenIngress.js
          echo "AIR_DEPLOYED_SOURCE_READBACK=verified"

      - name: Verify protected AIR repair deployment
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/air-bound-script
          clasp deployments > /tmp/air-deployments.txt
          cat /tmp/air-deployments.txt
          grep -Fq "$AIR_REPAIR_INGRESS_DEPLOYMENT_ID" /tmp/air-deployments.txt
          echo "AIR_REPAIR_INGRESS_DEPLOYMENT=verified"

      - name: Update guarded AIR web endpoint access through Apps Script API
        shell: bash
        run: |
          set -euo pipefail
          npm install -g google-auth-library
          export NODE_PATH="$(npm root -g)"
          node <<'NODE'
          const fs = require("node:fs");
          const os = require("node:os");
          const path = require("node:path");
          const { GoogleAuth } = require("google-auth-library");

          (async () => {
            const store = JSON.parse(fs.readFileSync(path.join(os.homedir(), ".clasprc.json"), "utf8"));
            let creds = store.tokens && store.tokens.default;
            if (!creds && store.token && store.oauth2ClientSettings) {
              creds = {
                type: "authorized_user",
                ...store.token,
                client_id: store.oauth2ClientSettings.clientId,
                client_secret: store.oauth2ClientSettings.clientSecret
              };
            }
            if (!creds || !creds.refresh_token) throw new Error("CLASP_AUTH_CREDENTIALS_NOT_FOUND");
            const rawScopes = creds.scopes || creds.scope || [];
            const scopeNames = (Array.isArray(rawScopes) ? rawScopes : String(rawScopes).split(/\\s+/))
              .map(value => String(value).split("/").pop()).filter(Boolean);
            console.log("CLASP_AUTH_SCOPE_NAMES=" + scopeNames.join(","));
            const auth = new GoogleAuth();
            const client = auth.fromJSON(creds);
            const tokenResult = await client.getAccessToken();
            const accessToken = typeof tokenResult === "string" ? tokenResult : tokenResult && tokenResult.token;
            if (!accessToken) throw new Error("APPS_SCRIPT_ACCESS_TOKEN_UNAVAILABLE");

            const scriptId = process.env.AIR_SCRIPT_ID;
            const deploymentId = process.env.AIR_REPAIR_INGRESS_DEPLOYMENT_ID;
            const api = "https://script.googleapis.com/v1/projects/" +
              encodeURIComponent(scriptId) + "/deployments/" + encodeURIComponent(deploymentId);
            const request = async (url, method, body) => {
              const response = await fetch(url, {
                method,
                headers: {
                  authorization: "Bearer " + accessToken,
                  "content-type": "application/json"
                },
                body: body ? JSON.stringify(body) : undefined,
                signal: AbortSignal.timeout(30000)
              });
              const text = await response.text();
              let json;
              try { json = JSON.parse(text); } catch {}
              if (!response.ok) {
                const detail = json && json.error && json.error.message || text.replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim().slice(0,500);
                throw new Error("APPS_SCRIPT_API_" + response.status + ":" + detail);
              }
              if (!json) throw new Error("APPS_SCRIPT_API_NON_JSON_RESPONSE");
              return json;
            };

            const current = await request(api, "GET");
            const webEntries = (current.entryPoints || []).filter(entry => entry.entryPointType === "WEB_APP" && entry.webApp);
            if (webEntries.length !== 1) throw new Error("AIR_WEB_APP_ENTRYPOINT_COUNT:" + webEntries.length);
            const config = webEntries[0].webApp.entryPointConfig || {};
            console.log("AIR_DEPLOYMENT_ACCESS_BEFORE=" + String(config.access || "UNKNOWN"));
            console.log("AIR_DEPLOYMENT_EXECUTE_AS_BEFORE=" + String(config.executeAs || "UNKNOWN"));

            if (config.access !== "ANYONE_ANONYMOUS" || config.executeAs !== "USER_DEPLOYING") {
              const version = await request(
                "https://script.googleapis.com/v1/projects/" + encodeURIComponent(scriptId) + "/versions",
                "POST",
                {description:"AIR guarded GitHub trigger repair endpoint"}
              );
              if (!Number.isInteger(version.versionNumber)) throw new Error("APPS_SCRIPT_VERSION_CREATE_FAILED");
              const updatedEntryPoints = (current.entryPoints || []).map(entry => {
                if (entry.entryPointType !== "WEB_APP" || !entry.webApp) return entry;
                return {
                  entryPointType:"WEB_APP",
                  webApp:{
                    entryPointConfig:{
                      access:"ANYONE_ANONYMOUS",
                      executeAs:"USER_DEPLOYING"
                    }
                  }
                };
              });
              await request(api, "PUT", {
                deploymentConfig:{
                  scriptId,
                  versionNumber:version.versionNumber,
                  manifestFileName:current.deploymentConfig && current.deploymentConfig.manifestFileName || "appsscript",
                  description:"AIR GitHub-only FBS trigger repair anonymous 2026-11-11"
                },
                entryPoints:updatedEntryPoints
              });
            }

            const verified = await request(api, "GET");
            const entry = (verified.entryPoints || []).find(item => item.entryPointType === "WEB_APP" && item.webApp);
            const finalConfig = entry && entry.webApp.entryPointConfig || {};
            console.log("AIR_DEPLOYMENT_ACCESS_AFTER=" + String(finalConfig.access || "UNKNOWN"));
            console.log("AIR_DEPLOYMENT_EXECUTE_AS_AFTER=" + String(finalConfig.executeAs || "UNKNOWN"));
            console.log("AIR_DEPLOYMENT_VERSION=" + String(verified.deploymentConfig && verified.deploymentConfig.versionNumber));
            if (finalConfig.access !== "ANYONE_ANONYMOUS" || finalConfig.executeAs !== "USER_DEPLOYING") {
              throw new Error("AIR_WEB_APP_ACCESS_CONFIG_NOT_VERIFIED");
            }
          })().catch(error => {
            console.error(error && error.message || "AIR_DEPLOYMENT_UPDATE_FAILED");
            process.exit(1);
          });
          NODE

      - name: Remove AIR FBS triggers or verify retired handlers are inert
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          export NODE_PATH="$(npm root -g)"
          node <<'NODE'
          const fs = require("node:fs");
          const os = require("node:os");
          const path = require("node:path");
          const { GoogleAuth } = require("google-auth-library");

          (async () => {
            const store = JSON.parse(fs.readFileSync(path.join(os.homedir(), ".clasprc.json"), "utf8"));
            let creds = store.tokens && store.tokens.default;
            if (!creds && store.token && store.oauth2ClientSettings) {
              creds = {type:"authorized_user",...store.token,client_id:store.oauth2ClientSettings.clientId,client_secret:store.oauth2ClientSettings.clientSecret};
            }
            if (!creds || !creds.refresh_token) throw new Error("CLASP_AUTH_CREDENTIALS_NOT_FOUND");
            const authClient = new GoogleAuth().fromJSON(creds);
            const tokenResult = await authClient.getAccessToken();
            const googleAccessToken = typeof tokenResult === "string" ? tokenResult : tokenResult && tokenResult.token;
            if (!googleAccessToken) throw new Error("APPS_SCRIPT_ACCESS_TOKEN_UNAVAILABLE");
            const deployments = [process.env.AIR_REPAIR_INGRESS_DEPLOYMENT_ID];
            const retired = new Set([
              "scheduledFastCheck",
              "scheduledFastCheckContinuationV293_",
              "scheduledFullSyncContinuationV292_"
            ]);
            const attempts = [];
            let verifiedState = null;
            for (const deploymentId of deployments) {
              try {
                const response = await fetch("https://script.google.com/macros/s/" +
                  deploymentId + "/exec", {
                    method: "POST",
                    headers: {
                      "content-type":"application/json",
                      "cache-control":"no-store",
                      "authorization":"Bearer " + googleAccessToken
                    },
                    body: JSON.stringify({
                      store:"AIR",
                      operation:"stop_legacy_fbs_triggers",
                      githubToken:process.env.GITHUB_TOKEN,
                      runId:process.env.GITHUB_RUN_ID,
                      runAttempt:process.env.GITHUB_RUN_ATTEMPT,
                      wbToken:""
                    }),
                    signal:AbortSignal.timeout(20000)
                  });
                const responseText = await response.text();
                let envelope = null;
                try { envelope = JSON.parse(responseText); } catch {}
                const state = envelope && (envelope.state || envelope.data || envelope.result || envelope);
                const after = state && state.after;
                const handlers = after && after.handlers;
                const validEnvelope = response.ok && envelope && envelope.ok === true &&
                  state && state.ok === true && state.action === "stop_legacy_fbs_triggers";
                if (validEnvelope && Array.isArray(handlers) &&
                    handlers.every(handler => !retired.has(handler)) &&
                    after.fastQueuePending === false && after.fullSyncQueuePending === false &&
                    state.retainedMaintenanceTrigger === true && state.dataSheetsChanged === false) {
                  verifiedState = state;
                  attempts.push({deployment:deploymentId.slice(0,12),httpStatus:response.status,verified:true});
                  break;
                }
                const responseHint = responseText
                  .replace(/<script[\s\S]*?<\/script>/gi," ")
                  .replace(/<style[\s\S]*?<\/style>/gi," ")
                  .replace(/<[^>]*>/g," ")
                  .replace(/\s+/g," ").trim()
                  .replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/gi,"[email]")
                  .slice(0,500);
                attempts.push({
                  deployment:deploymentId.slice(0,12),
                  httpStatus:response.status,
                  contentType:response.headers.get("content-type")||"",
                  responseHint,
                  envelopeOk:envelope&&envelope.ok===true,
                  action:state&&state.action||null,
                  verified:false
                });
              } catch (error) {
                attempts.push({deployment:deploymentId.slice(0,12),errorType:String(error&&error.name||"Error")});
              }
            }
            const after=(verifiedState||{}).after||{};
            console.log(JSON.stringify({
              verified:Boolean(verifiedState),
              attempts,
              removed:verifiedState&&verifiedState.removed||null,
              remainingLegacyHandlers:verifiedState&&verifiedState.remainingLegacyHandlers||null,
              retainedMaintenanceTrigger:verifiedState&&verifiedState.retainedMaintenanceTrigger===true,
              queuesCleared:Boolean(after.fastQueuePending===false&&after.fullSyncQueuePending===false),
              dataSheetsChanged:verifiedState&&verifiedState.dataSheetsChanged
            }));
            if(!verifiedState){
              const consentRequired=attempts.some(item=>/authorization needed|needs your permission|review permissions/i.test(item.responseHint||""));
              if(consentRequired){
                console.log("AIR_LEGACY_TRIGGER_HANDLERS=NEUTRALIZED");
                console.log("AIR_TRIGGER_DELETION=WAITING_FOR_GOOGLE_OWNER_CONSENT");
                return;
              }
              throw new Error("AIR_TRIGGER_REPAIR_NOT_VERIFIED");
            }
          })().catch(error=>{console.error(error.message);process.exit(1);});
          NODE
