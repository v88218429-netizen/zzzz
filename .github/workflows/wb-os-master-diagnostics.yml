name: WB OS Master diagnostics deploy

on:
  push:
    branches: [mainggg]
    paths:
      - "wb_os/tools/diagnose_live_master.py"
      - "wb_os/tests/test_diagnose_live_master.py"
      - ".github/workflows/wb-os-master-diagnostics.yml"

permissions:
  contents: read

concurrency:
  group: wb-os-master-diagnostics-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, macOS, ozon-live]
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - name: Test narrow patch
        shell: bash
        run: python3 wb_os/tests/test_diagnose_live_master.py

      - name: Find exact live project and pull current source
        id: project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="$(python3 wb_os/tools/discover_clasp_project.py)"
          test -f "$PROJECT_DIR/.clasp.json"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          cd "$PROJECT_DIR"
          clasp pull

      - name: Back up and patch only the Master status renderer
        id: patch
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          SOURCE_ROOT="$(PROJECT_DIR="$PROJECT_DIR" python3 - <<'PY'
          import json, os, pathlib
          project=pathlib.Path(os.environ['PROJECT_DIR'])
          cfg=json.loads((project/'.clasp.json').read_text(encoding='utf-8'))
          root=str(cfg.get('rootDir') or '').strip()
          print((project/root).resolve() if root else project.resolve())
          PY
          )"
          TS="$(date +%Y%m%d-%H%M%S)"
          BACKUP="$HOME/.wb-os-backups/master-diagnostics-$TS"
          mkdir -p "$BACKUP"
          rsync -a "$PROJECT_DIR/" "$BACKUP/"
          chmod -R go-rwx "$BACKUP"
          python3 wb_os/tools/diagnose_live_master.py "$SOURCE_ROOT"
          echo "source_root=$SOURCE_ROOT" >> "$GITHUB_OUTPUT"
          echo "backup_dir=$BACKUP" >> "$GITHUB_OUTPUT"
          echo "backup_created=true" >> "$GITHUB_OUTPUT"

      - name: Validate source and confirm only Master changed
        shell: bash
        env:
          SOURCE_ROOT: ${{ steps.patch.outputs.source_root }}
          BACKUP_DIR: ${{ steps.patch.outputs.backup_dir }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, pathlib, sys
          current=pathlib.Path(os.environ['SOURCE_ROOT'])
          backup=pathlib.Path(os.environ['BACKUP_DIR'])
          cfg=__import__('json').loads((backup/'.clasp.json').read_text(encoding='utf-8'))
          root=str(cfg.get('rootDir') or '').strip()
          baseline=(backup/root).resolve() if root else backup
          def digest(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          def sources(base):
              return {p.relative_to(base).as_posix():p for p in base.rglob('*') if p.is_file() and p.suffix in {'.gs','.js'}}
          before,after=sources(baseline),sources(current)
          changed=sorted(p for p in set(before)|set(after) if p not in before or p not in after or digest(before[p])!=digest(after[p]))
          if len(changed)>1:
              raise SystemExit('More than one Apps Script source changed: '+repr(changed))
          if changed and ('WB_OS_MASTER_ERROR_DIAGNOSTICS_V1' not in after[changed[0]].read_text(encoding='utf-8')):
              raise SystemExit('The sole source change is not Master diagnostics: '+changed[0])
          print('Changed source files:',repr(changed))
          PY
          COUNT=0
          while IFS= read -r -d '' f; do
            TMP="$(mktemp -t wb-os-master.XXXXXX)"
            cp "$f" "$TMP"
            node --check "$TMP"
            rm -f "$TMP"
            COUNT=$((COUNT+1))
          done < <(find "$SOURCE_ROOT" -type f \( -name '*.gs' -o -name '*.js' \) -print0)
          test "$COUNT" -gt 0
          grep -Rqs "WB_OS_MASTER_ERROR_DIAGNOSTICS_V1" "$SOURCE_ROOT"
          echo "Syntax OK: $COUNT source files; changes limited to Master status code."

      - name: Push live and pull back for verification
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
          BACKUP_DIR: ${{ steps.patch.outputs.backup_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          clasp push -f
          VERIFY="$(mktemp -d "${TMPDIR:-/tmp}/wb-os-master-verify.XXXXXX")"
          trap 'rm -rf "$VERIFY"' EXIT
          cp .clasp.json "$VERIFY/.clasp.json"
          cd "$VERIFY"
          clasp pull
          grep -Rqs "WB_OS_MASTER_ERROR_DIAGNOSTICS_V1" "$VERIFY"
          VERIFY_DIR="$VERIFY" python3 - <<'PY'
          import hashlib, json, os, pathlib
          backup=pathlib.Path(os.environ['BACKUP_DIR'])
          verify=pathlib.Path(os.environ['VERIFY_DIR'])
          cfg=json.loads((backup/'.clasp.json').read_text(encoding='utf-8'))
          root=str(cfg.get('rootDir') or '').strip()
          before=(backup/root).resolve() if root else backup
          after=(verify/root).resolve() if root else verify
          def sources(base):
              return {p.relative_to(base).as_posix():p for p in base.rglob('*') if p.is_file() and p.suffix in {'.gs','.js'}}
          a,b=sources(before),sources(after)
          if set(a)!=set(b): raise SystemExit('Live source file set changed during Master-only deploy')
          changed=[name for name in sorted(a) if hashlib.sha256(a[name].read_bytes()).digest()!=hashlib.sha256(b[name].read_bytes()).digest()]
          if len(changed)>1 or (changed and 'WB_OS_MASTER_ERROR_DIAGNOSTICS_V1' not in b[changed[0]].read_text(encoding='utf-8')):
              raise SystemExit('Unexpected live source changes: '+repr(changed))
          print('Live source files changed:',repr(changed))
          PY
          COUNT=0
          while IFS= read -r -d '' f; do
            TMP="$(mktemp -t wb-os-master-verify.XXXXXX)"
            cp "$f" "$TMP"
            node --check "$TMP"
            rm -f "$TMP"
            COUNT=$((COUNT+1))
          done < <(find "$VERIFY" -type f \( -name '*.gs' -o -name '*.js' \) -print0)
          test "$COUNT" -gt 0
          echo "LIVE pull-back verified; no K2 sync or trigger mutation was invoked."
