name: WB AI Manager source sync

on:
  workflow_dispatch:
  push:
    branches: [mainggg]
    paths:
      - ".github/workflows/wb-ai-manager-source-sync.yml"

permissions:
  contents: write

jobs:
  extract-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract published v1.1.0 source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, shutil, zipfile
          from io import BytesIO
          from pathlib import Path

          src = Path("wb_ai_manager/releases/1.1.0/bundle.b64")
          dst = Path("wb_ai_manager/source")
          raw = base64.b64decode(src.read_text(encoding="ascii"), validate=True)

          if dst.exists():
              shutil.rmtree(dst)
          dst.mkdir(parents=True)

          with zipfile.ZipFile(BytesIO(raw)) as zf:
              base = dst.resolve()
              for info in zf.infolist():
                  target = (dst / info.filename).resolve()
                  if target != base and base not in target.parents:
                      raise SystemExit(f"unsafe bundle path: {info.filename}")
              zf.extractall(dst)

          print(f"extracted={len(list(dst.rglob('*')))}")
          PY

      - name: Validate canonical source completeness
        shell: bash
        run: |
          set -euo pipefail
          REQUIRED=(
            wb_ai_manager/source/src/wb_control_center/config.py
            wb_ai_manager/source/src/wb_control_center/models.py
            wb_ai_manager/source/src/wb_control_center/mcp_client.py
            wb_ai_manager/source/src/wb_control_center/policy.py
            wb_ai_manager/source/src/wb_control_center/agents/__init__.py
            wb_ai_manager/source/src/wb_control_center/agents/base.py
            wb_ai_manager/source/src/wb_control_center/source_discovery.py
            wb_ai_manager/source/src/wb_control_center/auto_sheets.py
          )
          for f in "${REQUIRED[@]}"; do
            test -f "$f" || { echo "MISSING_REQUIRED_SOURCE: $f"; exit 3; }
          done
          echo "Required canonical modules are present."

      - name: Commit canonical extracted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "wb-ai-manager-bot"
          git config user.email "wb-ai-manager-bot@users.noreply.github.com"
          # The release bundle contains runtime modules whose names may match
          # broad ignore rules elsewhere in the monorepo. Canonical source must
          # be materialized byte-for-byte, not only the non-ignored subset.
          git add -f wb_ai_manager/source
          if ! git diff --cached --quiet; then
            git commit -m "wb-ai-manager: materialize complete v1.1 source"
            git push
          fi

      - name: Install package and test dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd wb_ai_manager/source
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Verify extracted package
        shell: bash
        run: |
          set -euo pipefail
          cd wb_ai_manager/source
          python -m compileall -q src scripts
          pytest -q

