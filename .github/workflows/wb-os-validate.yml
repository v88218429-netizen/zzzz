name: WB OS validate

on:
  pull_request:
    paths:
      - "wb_os/**"
  push:
    branches:
      - "mainggg"
      - "wb-os-v0.1"
    paths:
      - "wb_os/**"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check Apps Script files
        shell: bash
        run: |
          set -euo pipefail
          for f in wb_os/apps_script/*.gs; do
            cp "$f" /tmp/check.js
            node --check /tmp/check.js
          done
      - name: Secret scan
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE '(K2_PASSWORD|TELEGRAM_BOT_TOKEN)[[:space:]]*[:=][[:space:]]*["'"'"'][^"'"'"']+["'"'"']' wb_os || {
            echo "Possible committed secret detected"
            exit 1
          }
