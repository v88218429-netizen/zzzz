name: WB OS validate

on:
  pull_request:
    paths:
      - "wb_os/**"
  push:
    branches:
      - "mainggg"
      - "wb-os-v0.1"
    paths:
      - "wb_os/**"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check Apps Script files
        shell: bash
        run: |
          set -euo pipefail
          for f in wb_os/apps_script/*.gs; do
            cp "$f" /tmp/check.js
            node --check /tmp/check.js
          done
      - name: Python compile
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile wb_os/tools/*.py wb_os/tests/*.py

      - name: Patcher regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 wb_os/tests/test_patch_live_master.py

      - name: Shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            echo "bash -n $f"
            bash -n "$f"
          done < <(find wb_os -type f \( -name '*.command' -o -name '*.sh' \) -print0)

      - name: Full-repair bundle integrity
        shell: bash
        run: |
          set -euo pipefail
          PART_DIR="wb_os/final_repair"
          OUT="/tmp/wb-os-final-repair"
          mkdir -p "$OUT"

          test -s "$PART_DIR/bundle.part00"
          test -s "$PART_DIR/bundle.part01"
          test -s "$PART_DIR/bundle.part02"
          test -s "$PART_DIR/bundle.part03"

          cat             "$PART_DIR/bundle.part00"             "$PART_DIR/bundle.part01"             "$PART_DIR/bundle.part02"             "$PART_DIR/bundle.part03"             > "$OUT/bundle.b64"

          python3 - "$OUT/bundle.b64" "$OUT/bundle.tar.gz" <<'PY'
          import base64
          from pathlib import Path
          import sys

          src = Path(sys.argv[1]).read_bytes()
          if len(src) % 4:
              raise SystemExit(
                  f"bundle base64 length is not divisible by 4: {len(src)}"
              )

          try:
              raw = base64.b64decode(src, validate=True)
          except Exception as exc:
              raise SystemExit(f"bundle base64 decode failed: {exc}")

          Path(sys.argv[2]).write_bytes(raw)
          print(f"bundle base64 OK: {len(src)} chars -> {len(raw)} bytes")
          PY

          tar -tzf "$OUT/bundle.tar.gz" >/dev/null
          mkdir -p "$OUT/extracted"
          tar -xzf "$OUT/bundle.tar.gz" -C "$OUT/extracted"

          count=0
          while IFS= read -r -d '' f; do
            tmp="$OUT/check-$count.js"
            cp "$f" "$tmp"
            node --check "$tmp"
            count=$((count + 1))
          done < <(find "$OUT/extracted" -type f \( -name '*.gs' -o -name '*.js' \) -print0)

          test "$count" -gt 0
          echo "Extracted Apps Script syntax OK: $count files"

      - name: Secret scan
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE '(K2_PASSWORD|TELEGRAM_BOT_TOKEN)[[:space:]]*[:=][[:space:]]*["'"'"'][^"'"'"']+["'"'"']' wb_os || {
            echo "Possible committed secret detected"
            exit 1
          }
