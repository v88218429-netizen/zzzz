name: WB OS validate

on:
  pull_request:
    paths:
      - "wb_os/**"
      - ".github/workflows/wb-os-validate.yml"
      - ".github/workflows/wb-os-deploy-k2.yml"
  push:
    branches:
      - "mainggg"
      - "wb-os-v0.1"
    paths:
      - "wb_os/**"
      - ".github/workflows/wb-os-validate.yml"
      - ".github/workflows/wb-os-deploy-k2.yml"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check Apps Script files
        shell: bash
        run: |
          set -euo pipefail
          for f in wb_os/apps_script/*.gs; do
            cp "$f" /tmp/check.js
            node --check /tmp/check.js
          done
      - name: Python compile
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile wb_os/tools/*.py wb_os/tests/*.py

      - name: Patcher regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 wb_os/tests/test_patch_live_master.py

      - name: Apps Script semantic logic tests
        shell: bash
        run: |
          set -euo pipefail
          node wb_os/tests/test_apps_script_logic.js

      - name: Whole-project collision repair tests
        shell: bash
        run: |
          set -euo pipefail
          python3 wb_os/tests/test_audit_and_repair_live.py

      - name: Shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            echo "bash -n $f"
            bash -n "$f"
          done < <(find wb_os -type f \( -name '*.command' -o -name '*.sh' \) -print0)

      - name: Quarantined legacy full-repair gate
        shell: bash
        run: |
          set -euo pipefail
          LEGACY="wb_os/final_repair/run_full_repair.command"
          if [ -f "$LEGACY" ]; then
            grep -q "DEPLOY_DISABLED_BUNDLE_INTEGRITY" "$LEGACY" || {
              echo "Legacy full-repair exists but is not quarantined"
              exit 1
            }
            echo "Legacy archive deploy is quarantined: OK"
          fi

      - name: Core repair end-to-end fake-live deploy
        shell: bash
        run: |
          set -euo pipefail
          bash wb_os/tests/test_run_core_repair.sh

      - name: Core repair deploy contract
        shell: bash
        run: |
          set -euo pipefail
          test -s wb_os/run_core_repair.command
          grep -q "K2 Evolution Engine v0.1.17" wb_os/apps_script/K2_EVOLUTION_ENGINE.gs
          grep -q "function k2EvolutionCleanupLegacyTriggers_" wb_os/apps_script/K2_EVOLUTION_ENGINE.gs
          grep -q "syncK2StocksOnly" wb_os/apps_script/K2_EVOLUTION_ENGINE.gs
          grep -q "K2_EV_CUTOVER_DONE" wb_os/apps_script/K2_EVOLUTION_ENGINE.gs
          grep -q "K2_EV_LOCK_BUSY" wb_os/apps_script/K2_EVOLUTION_ENGINE.gs
          grep -q "WB Public Customer Price Engine v0.1.19" wb_os/apps_script/WB_PUBLIC_PRICE_V4.gs
          grep -q "WB Seller Price Safe Refresh v0.1.0" wb_os/apps_script/WB_SELLER_PRICE_SAFE.gs
          grep -q "wbSellerPriceRefreshIfDue_" wb_os/apps_script/WB_SELLER_PRICE_SAFE.gs
          grep -q "WB_SELLER_PRICE_REFRESH_ROLLBACK" wb_os/apps_script/WB_SELLER_PRICE_SAFE.gs
          grep -q "function wbPriceV4CleanupLegacyTriggers_" wb_os/apps_script/WB_PUBLIC_PRICE_V4.gs
          grep -q "sppMonitorScheduledTick" wb_os/apps_script/WB_PUBLIC_PRICE_V4.gs
          grep -q "WB_PRICE_V4_LEGACY_MODE_CONFLICT" wb_os/apps_script/WB_PUBLIC_PRICE_V4.gs
          grep -q "WB_PRICE_V4_LAYOUT_MISMATCH" wb_os/apps_script/WB_PUBLIC_PRICE_V4.gs
          grep -q "FALLBACK_BATCH_SIZE" wb_os/apps_script/WB_PUBLIC_PRICE_V4.gs
          grep -q "wbPriceV4FetchMissingIndividually_" wb_os/apps_script/WB_PUBLIC_PRICE_V4.gs
          grep -q "wbPriceV4RepairMissingSellerPrices_" wb_os/apps_script/WB_PUBLIC_PRICE_V4.gs
          grep -q "K2_EVOLUTION_ENGINE.gs" wb_os/run_core_repair.command
          grep -q "WB_PUBLIC_PRICE_V4.gs" wb_os/run_core_repair.command
          grep -q "WB_SELLER_PRICE_SAFE.gs" wb_os/run_core_repair.command
          grep -q "patch_live_master.py" wb_os/run_core_repair.command
          grep -q "audit_and_repair_live.py" wb_os/run_core_repair.command
          grep -q "wbOsEnsureMasterTrigger" wb_os/run_core_repair.command
          grep -q "MASTER_TRIGGER_BOOTSTRAP" wb_os/tools/audit_and_repair_live.py
          grep -q "SOURCE_REF" wb_os/run_core_repair.command
          grep -q "40-символьный commit SHA" wb_os/run_core_repair.command
          grep -q "remote-verify" wb_os/run_core_repair.command
          grep -q "project_semantic_fingerprint_" wb_os/run_core_repair.command
          grep -q "rollback_live_" wb_os/run_core_repair.command
          grep -q "CORE REPAIR DEPLOYED + REMOTE VERIFIED" wb_os/run_core_repair.command
          grep -q "audit_and_repair_live.py" .github/workflows/wb-os-deploy-k2.yml
          grep -q "Pull back and verify actual LIVE" .github/workflows/wb-os-deploy-k2.yml
          grep -q "K2 Evolution Engine v0.1.17" .github/workflows/wb-os-deploy-k2.yml
          grep -q "getK2CredentialsWithFallback_" .github/workflows/wb-os-deploy-k2.yml
          grep -q "wbOsEnsureMasterTrigger" .github/workflows/wb-os-deploy-k2.yml
          ! grep -q "bundle.part" wb_os/run_core_repair.command
          echo "Core repair direct-file contract: OK"

      - name: Secret scan
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE '(K2_PASSWORD|TELEGRAM_BOT_TOKEN)[[:space:]]*[:=][[:space:]]*["'"'"'][^"'"'"']+["'"'"']' wb_os || {
            echo "Possible committed secret detected"
            exit 1
          }
