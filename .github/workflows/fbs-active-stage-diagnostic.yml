# Lightweight read-only diagnostics through the protected GitHub bridge; inspect active recovery stage.
name: WB FBS active stage diagnostic
# Read-only stage snapshots may run during production writes; they do not take the data lock. Refreshable by a GitHub commit.
# Refresh stage snapshot after the 90-day recovery queue started.
# Snapshot tick 1.
# Snapshot tick 2.
# Snapshot tick 3.
# Snapshot tick 4.
# Snapshot tick 5.
# Snapshot tick 6.
# Snapshot tick 7.
on:
  workflow_dispatch:
  push:
    branches: [mainggg]
    paths:
      - ".github/workflows/fbs-active-stage-diagnostic.yml"
      - "wb_worker/github_fbs_recovery.py"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BRIDGE_URL: https://script.google.com/macros/s/AKfycbyU_OXpFYqvBx0KDuGCgEHsnzkts_fnJzVe8DM8crRDD1A_fr5DqOfVfW_PYJriaXU_jw/exec
      BRIDGE_KEY: ${{ secrets.SELLMONITOR_GITHUB_WEBHOOK_SECRET }}
    steps:
      - name: Read only the active FBS stage through the protected bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          def post(payload,timeout):
              data=json.dumps(payload).encode()
              request=urllib.request.Request(os.environ["BRIDGE_URL"],data=data,
                  headers={"Content-Type":"application/json"},method="POST")
              with urllib.request.urlopen(request,timeout=timeout) as response:
                  return json.loads(response.read().decode("utf-8"))
          token=os.environ["BRIDGE_KEY"]
          stage=post({"token":token,"action":"fbs_stage_snapshot"},15)
          stage_result=stage.get("result") or {}
          stages=stage_result.get("fbs_ingest_stages") or {}
          if stage.get("ok") is not True or set(stages)-{"SANYCH","AIR","HOZYAYUSHKA"}:
              raise SystemExit("FBS_STAGE_SNAPSHOT_FAILED")
          print("FBS_STAGE_SNAPSHOT="+json.dumps({
              "checkedAt":stage_result.get("checkedAt"),
              "fbs_ingest_stages":stages,
              "fbs_supply_stage":stage_result.get("fbs_supply_stage")},
              ensure_ascii=False,separators=(",",":")),flush=True)

          runtime=post({"token":token,"action":"fbs_runtime_diagnostic"},60)
          runtime_result=runtime.get("result") or {}
          if runtime.get("ok") is not True or runtime_result.get("ok") is not True:
              raise SystemExit("FBS_RUNTIME_DIAGNOSTIC_FAILED")
          print("FBS_RUNTIME_DIAGNOSTIC="+json.dumps({
              "checkedAt":runtime_result.get("checkedAt"),
              "results":[{k:item.get(k) for k in (
                  "client","accessible","ordersTabExists","ordersLastRow","ordersMaxRows",
                  "ordersMaxColumns","ordersGridCells","technicalLogTabExists",
                  "technicalLogLastRow","technicalLogMaxRows","tabCount","errorType","error")}
                  for item in runtime_result.get("results",[])]},
              ensure_ascii=False,separators=(",",":")),flush=True)

          air_log=post({"token":token,"action":"fbs_technical_log_read","client":"AIR"},60)
          air_log_result=air_log.get("result") or {}
          if air_log.get("ok") is not True or air_log_result.get("ok") is not True:
              raise SystemExit("FBS_AIR_TECHNICAL_LOG_READ_FAILED")
          print("FBS_AIR_TECHNICAL_LOG="+json.dumps({
              "lastRow":air_log_result.get("lastRow"),
              "scannedRows":air_log_result.get("scannedRows"),
              "matchCount":air_log_result.get("matchCount"),
              "matches":(air_log_result.get("matches") or [])[-20:]},
              ensure_ascii=False,separators=(",",":")),flush=True)

          PY