# Read-only stage samples through the protected GitHub bridge, including supply sync lease state.
name: WB FBS active stage diagnostic
on:
  workflow_dispatch:
  push:
    branches: [mainggg]
    paths:
      - ".github/workflows/fbs-active-stage-diagnostic.yml"
      - "wb_worker/github_fbs_recovery.py"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BRIDGE_URL: https://script.google.com/macros/s/AKfycbyU_OXpFYqvBx0KDuGCgEHsnzkts_fnJzVe8DM8crRDD1A_fr5DqOfVfW_PYJriaXU_jw/exec
      BRIDGE_KEY: ${{ secrets.SELLMONITOR_GITHUB_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Validate FBS recovery Python syntax
        run: python3 -m py_compile wb_worker/github_fbs_recovery.py
      - name: Sample only the active FBS stage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request
          token=os.environ["BRIDGE_KEY"]
          log_payload=json.dumps({"token":token,"action":"fbs_technical_log_read","client":"AIR"}).encode()
          log_request=urllib.request.Request(os.environ["BRIDGE_URL"],data=log_payload,
              headers={"Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(log_request,timeout=60) as response:
              log_data=json.loads(response.read().decode("utf-8"))
          log_result=log_data.get("result") or {}
          if log_data.get("ok") is not True or log_result.get("ok") is not True:
              raise SystemExit("AIR_TECHNICAL_LOG_READ_FAILED")
          print("AIR_TECHNICAL_LOG="+json.dumps({
              "lastRow":log_result.get("lastRow"),"scannedRows":log_result.get("scannedRows"),
              "matchCount":log_result.get("matchCount"),"matches":(log_result.get("matches") or [])[-25:]},
              ensure_ascii=False,separators=(",",":")),flush=True)
          for sample in range(1,11):
              payload=json.dumps({"token":token,"action":"fbs_stage_snapshot"}).encode()
              request=urllib.request.Request(os.environ["BRIDGE_URL"],data=payload,
                  headers={"Content-Type":"application/json"},method="POST")
              with urllib.request.urlopen(request,timeout=20) as response:
                  data=json.loads(response.read().decode("utf-8"))
              result=data.get("result") or {}
              stages=result.get("fbs_ingest_stages") or {}
              supply=result.get("fbs_supply_stage") or {}
              if data.get("ok") is not True or set(stages)-{"SANYCH","AIR","HOZYAYUSHKA"}:
                  raise SystemExit("FBS_STAGE_SNAPSHOT_FAILED")
              safe={}
              for client,stage in stages.items():
                  safe[client]={key:stage.get(key) for key in
                      ("client","stage","lastCoreStage","previousStage","elapsedMs","at")}
              safe_supply={key:supply.get(key) for key in
                  ("leaseActive","leaseRemainingMs","currentClient","backfillRowsRemaining","stage","stageAt")}
              print("FBS_LIVE_STAGE_SAMPLE="+json.dumps({
                  "sample":sample,"checkedAt":result.get("checkedAt"),"stages":safe,
                  "supply":safe_supply},
                  ensure_ascii=False,separators=(",",":")),flush=True)
              if sample<10: time.sleep(20)
          PY
