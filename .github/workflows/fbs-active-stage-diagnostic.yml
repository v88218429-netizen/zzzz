# Lightweight read-only diagnostics through the protected GitHub bridge; inspect active recovery stage.
name: WB FBS active stage diagnostic

on:
  workflow_dispatch:
  push:
    branches: [mainggg]
    paths:
      - ".github/workflows/fbs-active-stage-diagnostic.yml"
      - "wb_worker/github_fbs_recovery.py"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BRIDGE_URL: https://script.google.com/macros/s/AKfycbyU_OXpFYqvBx0KDuGCgEHsnzkts_fnJzVe8DM8crRDD1A_fr5DqOfVfW_PYJriaXU_jw/exec
      BRIDGE_KEY: ${{ secrets.SELLMONITOR_GITHUB_WEBHOOK_SECRET }}
    steps:
      - name: Read FBS stage and sheet grid through the protected bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          payload=json.dumps({"token":os.environ["BRIDGE_KEY"],"action":"fbs_runtime_diagnostic"}).encode()
          request=urllib.request.Request(os.environ["BRIDGE_URL"],data=payload,
              headers={"Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(request,timeout=90) as response:
              body=json.loads(response.read().decode("utf-8"))
          result=body.get("result") or {}
          clients=result.get("results") or []
          expected={"SANYCH","AIR","HOZYAYUSHKA"}
          seen={str(item.get("client") or "") for item in clients}
          if body.get("ok") is not True or result.get("ok") is not True or seen!=expected:
              print("FBS_RUNTIME_DIAGNOSTIC_FAILED="+json.dumps(result,ensure_ascii=False)[:6000],flush=True)
              raise SystemExit("FBS_RUNTIME_DIAGNOSTIC_FAILED")
          summary={
              "checkedAt":result.get("checkedAt"),
              "books":[{key:item.get(key) for key in
                  ("client","spreadsheetName","accessible","ordersTabExists","ordersLastRow",
                   "ordersMaxRows","ordersMaxColumns","technicalLogTabExists","technicalLogLastRow",
                   "technicalLogMaxRows","tabCount")}
                  for item in clients],
              "fbs_ingest_stages":result.get("fbs_ingest_stages")}
          print("FBS_RUNTIME_DIAGNOSTIC="+json.dumps(summary,
              ensure_ascii=False,separators=(",",":")),flush=True)
          PY
