name: AI Video Monitor real smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-real:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet --upgrade requests yt-dlp youtube-transcript-api google-auth
      - name: Install CPU-local AI model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ai-video-ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          ollama pull qwen2.5:1.5b
      - name: Exercise real search, transcript and grounded model
        run: python ai_video_monitor_smoke.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
