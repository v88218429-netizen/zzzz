name: WB AI Manager production smoke

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["WB GitHub Runtime"]
    types: [completed]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mainggg
          fetch-depth: 1

      - name: Verify production snapshot publication and freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin runtime-state:refs/remotes/origin/runtime-state
          git show origin/runtime-state:state/health.json > /tmp/wb-health.json
          python - <<'PY'
          import json
          from datetime import datetime, timezone

          d=json.load(open("/tmp/wb-health.json",encoding="utf-8"))
          generated_at=datetime.fromisoformat(str(d.get("generated_at") or "").replace("Z","+00:00"))
          if generated_at.tzinfo is None:
              generated_at=generated_at.replace(tzinfo=timezone.utc)
          age_seconds=(datetime.now(timezone.utc)-generated_at.astimezone(timezone.utc)).total_seconds()
          assert -120 <= age_seconds <= 1800, {"generated_at": d.get("generated_at"), "age_minutes": age_seconds / 60}
          assert d.get("health") in {"ok","degraded"}, d
          assert d.get("acceptance_status") in {"ready","not_ready"}, d
          assert bool(d.get("acceptance_ready")) == (d.get("acceptance_status") == "ready"), d
          blockers=d.get("acceptance_blockers") or []
          assert d.get("acceptance_ready") is True or len(blockers) > 0, d
          assert d.get("connected_cabinets") == d.get("expected_cabinets") == 3, d
          assert d.get("clean_cabinets") == 3, d
          assert d.get("sheets_live") is True, d
          assert d.get("dashboard_published") is True, d
          query_rows=int(d.get("query_rows") or 0)
          fresh_rows=int(d.get("fresh_query_rows") or 0)
          blocked_rows=int(d.get("blocked_query_rows") or 0)
          assert query_rows > 0, d
          assert d.get("query_operational_ready") is True, d
          assert d.get("query_status") in {"ready","ready_guarded"}, d
          assert fresh_rows > 0, d
          assert fresh_rows + blocked_rows == query_rows, d
          print(json.dumps({
              "ok": True,
              "runtime": "github_only",
              "generated_at": d.get("generated_at"),
              "snapshot_age_minutes": round(age_seconds / 60, 1),
              "acceptance_status": d.get("acceptance_status"),
              "acceptance_blockers": len(blockers),
              "connected_cabinets": d.get("connected_cabinets"),
              "clean_cabinets": d.get("clean_cabinets"),
              "sheets_live": d.get("sheets_live"),
              "dashboard_published": d.get("dashboard_published"),
              "query_status": d.get("query_status"),
              "query_facts_status": d.get("query_facts_status"),
              "query_rows": query_rows,
              "fresh_query_rows": fresh_rows,
              "blocked_query_rows": blocked_rows,
              "ready_query_actions": d.get("ready_query_actions"),
          },ensure_ascii=False,indent=2))
          PY
