name: WB AI Manager production smoke

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["WB GitHub Runtime"]
    types: [completed]

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mainggg
          fetch-depth: 1

      - name: Verify GitHub-only production health
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin runtime-state:refs/remotes/origin/runtime-state
          git show origin/runtime-state:state/health.json > /tmp/wb-health.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/wb-health.json",encoding="utf-8"))
          assert d.get("health") == "ok", d
          assert d.get("connected_cabinets") == d.get("expected_cabinets") == 3, d
          assert d.get("clean_cabinets") == 3, d
          assert d.get("sheets_live") is True, d
          assert d.get("dashboard_published") is True, d
          query_rows=int(d.get("query_rows") or 0)
          fresh_rows=int(d.get("fresh_query_rows") or 0)
          blocked_rows=int(d.get("blocked_query_rows") or 0)
          assert query_rows > 0, d
          assert d.get("query_operational_ready") is True, d
          assert d.get("query_status") in {"ready","ready_guarded"}, d
          assert fresh_rows > 0, d
          assert fresh_rows + blocked_rows == query_rows, d
          print(json.dumps({
              "ok": True,
              "runtime": "github_only",
              "connected_cabinets": d.get("connected_cabinets"),
              "clean_cabinets": d.get("clean_cabinets"),
              "sheets_live": d.get("sheets_live"),
              "dashboard_published": d.get("dashboard_published"),
              "query_status": d.get("query_status"),
              "query_facts_status": d.get("query_facts_status"),
              "query_rows": query_rows,
              "fresh_query_rows": fresh_rows,
              "blocked_query_rows": blocked_rows,
              "ready_query_actions": d.get("ready_query_actions"),
          },ensure_ascii=False,indent=2))
          PY
