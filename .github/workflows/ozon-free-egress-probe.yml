name: Ozon free RU egress probe

on:
  push:
    branches: [mainggg]
    paths:
      - ".github/workflows/ozon-free-egress-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capability-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Existing secret capability presence
        env:
          HAS_TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY != '' }}
          HAS_TS_AUTHKEY: ${{ secrets.TS_AUTHKEY != '' }}
          HAS_TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TS_OAUTH_CLIENT_SECRET != '' }}
          HAS_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_CF_API_TOKEN: ${{ secrets.CF_API_TOKEN != '' }}
          HAS_CLASP_TOKEN: ${{ secrets.CLASP_TOKEN != '' }}
          HAS_CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS != '' }}
          HAS_CLASPRC_JSON: ${{ secrets.CLASPRC_JSON != '' }}
          HAS_GOOGLE_CLASP_CREDENTIALS: ${{ secrets.GOOGLE_CLASP_CREDENTIALS != '' }}
          HAS_GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS != '' }}
          HAS_GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT != '' }}
          HAS_GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY != '' }}
          HAS_GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON != '' }}
        run: |
          env | grep '^HAS_' | sort

  vpngate-ru:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: ozon_radar_server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install probe dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openvpn curl iproute2
          pip install -r requirements.txt

      - name: Download current VPN Gate RU OpenVPN relays
        run: |
          python - <<'PY'
          import base64, csv, io, json, urllib.request
          url='https://www.vpngate.net/api/iphone/'
          raw=urllib.request.urlopen(url, timeout=30).read().decode('utf-8', 'replace')
          lines=[x for x in raw.splitlines() if x and not x.startswith('*')]
          reader=csv.DictReader(lines)
          rows=[]
          for r in reader:
              if (r.get('CountryShort') or '').upper()!='RU':
                  continue
              b64=(r.get('OpenVPN_ConfigData_Base64') or '').strip()
              if not b64:
                  continue
              try:
                  speed=int(r.get('Speed') or 0)
              except Exception:
                  speed=0
              rows.append((speed,r))
          rows.sort(key=lambda x:x[0], reverse=True)
          chosen=[]
          for i,(_,r) in enumerate(rows[:6], start=1):
              cfg=base64.b64decode(r['OpenVPN_ConfigData_Base64']).decode('utf-8','replace')
              # Force non-interactive auth and avoid local DNS helper assumptions.
              cfg=cfg.replace('auth-user-pass\r\n','').replace('auth-user-pass\n','')
              cfg += '\nauth-user-pass /tmp/vpngate-auth\nauth-nocache\n'
              path=f'/tmp/vpngate-ru-{i}.ovpn'
              open(path,'w').write(cfg)
              chosen.append({
                  'path':path,
                  'ip':r.get('IP'),
                  'host':r.get('#HostName'),
                  'speed':r.get('Speed'),
                  'ping':r.get('Ping'),
                  'uptime':r.get('Uptime'),
              })
          open('/tmp/vpngate-servers.json','w').write(json.dumps(chosen,ensure_ascii=False,indent=2))
          print(json.dumps(chosen,ensure_ascii=False,indent=2))
          if not chosen:
              raise SystemExit('NO_RU_VPNGATE_OPENVPN_RELAYS')
          PY
          printf 'vpn\nvpn\n' | sudo tee /tmp/vpngate-auth >/dev/null
          sudo chmod 600 /tmp/vpngate-auth

      - name: Probe Ozon SERP through current RU volunteer exits
        run: |
          sudo python - <<'PY'
          import json, os, signal, subprocess, sys, time, urllib.request
          sys.path.insert(0,'.')
          import server

          servers=json.load(open('/tmp/vpngate-servers.json'))
          results=[]
          for idx,item in enumerate(servers, start=1):
              log=f'/tmp/openvpn-{idx}.log'
              fp=open(log,'w')
              p=subprocess.Popen(
                  ['openvpn','--config',item['path'],'--auth-user-pass','/tmp/vpngate-auth','--connect-retry-max','1','--connect-timeout','15'],
                  stdout=fp,stderr=subprocess.STDOUT,
              )
              connected=False
              deadline=time.time()+35
              while time.time()<deadline:
                  if p.poll() is not None:
                      break
                  try:
                      links=subprocess.check_output(['ip','link'],text=True,stderr=subprocess.DEVNULL)
                      routes=subprocess.check_output(['ip','route'],text=True,stderr=subprocess.DEVNULL)
                      if ('tun0' in links or 'tap0' in links) and ('0.0.0.0/1' in routes or 'default' in routes):
                          time.sleep(2)
                          connected=True
                          break
                  except Exception:
                      pass
                  time.sleep(1)
              rec={**item,'connected':connected}
              if connected:
                  try:
                      ipj=json.loads(urllib.request.urlopen('https://ipinfo.io/json',timeout=15).read().decode())
                      rec['exit_ip']=ipj.get('ip')
                      rec['exit_country']=ipj.get('country')
                      rec['exit_region']=ipj.get('region')
                      rec['exit_org']=ipj.get('org')
                  except Exception as e:
                      rec['ipinfo_error']=f'{type(e).__name__}: {e}'
                  try:
                      oz=server.OzonClient()
                      out=oz.position('лопата садовая','5094364543',100)
                      rec['ozon']=out
                      rec['serp_cards_extracted']=out.get('checked_depth',0)>0
                  except Exception as e:
                      rec['ozon_error']=f'{type(e).__name__}: {e}'
              results.append(rec)
              print('VPNGATE_RESULT',json.dumps(rec,ensure_ascii=False),flush=True)

              try:
                  p.send_signal(signal.SIGTERM)
                  p.wait(timeout=8)
              except Exception:
                  try: p.kill()
                  except Exception: pass
              fp.close()
              subprocess.run(['pkill','-9','openvpn'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              time.sleep(2)

              if rec.get('serp_cards_extracted'):
                  break

          print('VPNGATE_SUMMARY',json.dumps(results,ensure_ascii=False))
          if any(r.get('serp_cards_extracted') for r in results):
              raise SystemExit(0)
          raise SystemExit(3)
          PY
