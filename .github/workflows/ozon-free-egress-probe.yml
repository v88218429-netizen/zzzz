name: Ozon free RU egress probe

on:
  push:
    branches: [mainggg]
    paths:
      - ".github/workflows/ozon-free-egress-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capability-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Existing secret capability presence
        env:
          HAS_TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY != '' }}
          HAS_TS_AUTHKEY: ${{ secrets.TS_AUTHKEY != '' }}
          HAS_TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TS_OAUTH_CLIENT_SECRET != '' }}
          HAS_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_CF_API_TOKEN: ${{ secrets.CF_API_TOKEN != '' }}
          HAS_CLASP_TOKEN: ${{ secrets.CLASP_TOKEN != '' }}
          HAS_CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS != '' }}
          HAS_CLASPRC_JSON: ${{ secrets.CLASPRC_JSON != '' }}
          HAS_GOOGLE_CLASP_CREDENTIALS: ${{ secrets.GOOGLE_CLASP_CREDENTIALS != '' }}
          HAS_GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS != '' }}
          HAS_GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT != '' }}
          HAS_GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY != '' }}
          HAS_GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON != '' }}
        run: |
          env | grep '^HAS_' | sort

  vpngate-ru:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: ozon_radar_server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install probe dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openvpn curl iproute2
          pip install -r requirements.txt

      - name: Download current VPN Gate RU OpenVPN relays
        run: |
          python - <<'PY'
          import base64, csv, io, json, urllib.request
          url='https://www.vpngate.net/api/iphone/'
          raw=urllib.request.urlopen(url, timeout=30).read().decode('utf-8', 'replace')
          lines=[x for x in raw.splitlines() if x and not x.startswith('*')]
          reader=csv.DictReader(lines)
          rows=[]
          for r in reader:
              if (r.get('CountryShort') or '').upper()!='RU':
                  continue
              b64=(r.get('OpenVPN_ConfigData_Base64') or '').strip()
              if not b64:
                  continue
              try:
                  speed=int(r.get('Speed') or 0)
              except Exception:
                  speed=0
              rows.append((speed,r))
          rows.sort(key=lambda x:x[0], reverse=True)
          chosen=[]
          for i,(_,r) in enumerate(rows[:6], start=1):
              cfg=base64.b64decode(r['OpenVPN_ConfigData_Base64']).decode('utf-8','replace')
              # Force non-interactive auth and avoid local DNS helper assumptions.
              cfg=cfg.replace('auth-user-pass\r\n','').replace('auth-user-pass\n','')
              cfg += '\nauth-user-pass /tmp/vpngate-auth\nauth-nocache\n'
              path=f'/tmp/vpngate-ru-{i}.ovpn'
              open(path,'w').write(cfg)
              chosen.append({
                  'path':path,
                  'ip':r.get('IP'),
                  'host':r.get('#HostName'),
                  'speed':r.get('Speed'),
                  'ping':r.get('Ping'),
                  'uptime':r.get('Uptime'),
              })
          open('/tmp/vpngate-servers.json','w').write(json.dumps(chosen,ensure_ascii=False,indent=2))
          print(json.dumps(chosen,ensure_ascii=False,indent=2))
          if not chosen:
              raise SystemExit('NO_RU_VPNGATE_OPENVPN_RELAYS')
          PY
          printf 'vpn\nvpn\n' | sudo tee /tmp/vpngate-auth >/dev/null
          sudo chmod 600 /tmp/vpngate-auth

      - name: Probe Ozon SERP through current RU volunteer exits
        run: |
          python - <<'PY'
          import json, os, signal, subprocess, sys, time, urllib.request
          sys.path.insert(0,'.')
          import server

          servers=json.load(open('/tmp/vpngate-servers.json'))
          results=[]
          for idx,item in enumerate(servers, start=1):
              log=f'/tmp/openvpn-{idx}.log'
              fp=open(log,'w')
              p=subprocess.Popen(
                  ['sudo','openvpn','--config',item['path'],'--auth-user-pass','/tmp/vpngate-auth','--connect-retry-max','1','--connect-timeout','15'],
                  stdout=fp,stderr=subprocess.STDOUT,
              )
              connected=False
              deadline=time.time()+35
              while time.time()<deadline:
                  if p.poll() is not None:
                      break
                  try:
                      text=open(log,'r',errors='ignore').read()
                      if 'Initialization Sequence Completed' in text:
                          time.sleep(2)
                          connected=True
                          break
                  except Exception:
                      pass
                  time.sleep(1)
              rec={**item,'connected':connected}
              if not connected:
                  try:
                      rec['openvpn_log_tail']='\\n'.join(open(log,'r',errors='ignore').read().splitlines()[-35:])
                  except Exception:
                      pass
              if connected:
                  try:
                      ipj=json.loads(urllib.request.urlopen('https://ipinfo.io/json',timeout=15).read().decode())
                      rec['exit_ip']=ipj.get('ip')
                      rec['exit_country']=ipj.get('country')
                      rec['exit_region']=ipj.get('region')
                      rec['exit_org']=ipj.get('org')
                  except Exception as e:
                      rec['ipinfo_error']=f'{type(e).__name__}: {e}'
                  try:
                      oz=server.OzonClient()
                      out=oz.position('лопата садовая','5094364543',100)
                      rec['ozon']=out
                      rec['serp_cards_extracted']=out.get('checked_depth',0)>0
                  except Exception as e:
                      rec['ozon_error']=f'{type(e).__name__}: {e}'

                  # JSON composer can be stricter than the real storefront.
                  # Verify the visible browser SERP over the same RU ISP tunnel.
                  try:
                      import re, shutil
                      from urllib.parse import quote
                      chrome=(
                          shutil.which('google-chrome')
                          or shutil.which('google-chrome-stable')
                          or shutil.which('chromium')
                          or shutil.which('chromium-browser')
                      )
                      if not chrome:
                          rec['browser_error']='Chrome/Chromium not found on runner'
                      else:
                          url='https://www.ozon.ru/search/?text='+quote('лопата садовая')+'&from_global=true'
                          cp=subprocess.run(
                              [chrome,'--headless=new','--no-sandbox','--disable-gpu',
                               '--lang=ru-RU','--virtual-time-budget=15000','--dump-dom',url],
                              stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,timeout=45
                          )
                          html=cp.stdout or ''
                          ids=[]
                          seen=set()
                          for m in re.finditer(r'/product/(?:[^/?#]+-)?(\\d{6,})(?:[/?#]|$)',html):
                              x=m.group(1)
                              if x not in seen:
                                  seen.add(x); ids.append(x)
                          rec['browser_rc']=cp.returncode
                          rec['browser_product_count']=len(ids)
                          rec['browser_target_position']=(ids.index('5094364543')+1) if '5094364543' in ids else None
                          rec['browser_block_marker']=(
                              'Похоже, нет соединения' if 'Похоже, нет соединения' in html
                              else 'Доступ ограничен' if 'Доступ ограничен' in html
                              else 'captcha' if 'captcha' in html.lower()
                              else ''
                          )
                          if ids:
                              rec['serp_cards_extracted']=True
                              rec['browser_first_ids']=ids[:20]
                  except Exception as e:
                      rec['browser_error']=f'{type(e).__name__}: {e}'
              results.append(rec)
              print('VPNGATE_RESULT',json.dumps(rec,ensure_ascii=False),flush=True)

              try:
                  p.send_signal(signal.SIGTERM)
                  p.wait(timeout=8)
              except Exception:
                  try: p.kill()
                  except Exception: pass
              fp.close()
              subprocess.run(['pkill','-9','openvpn'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              time.sleep(2)

              if rec.get('serp_cards_extracted'):
                  break

          print('VPNGATE_SUMMARY',json.dumps(results,ensure_ascii=False))
          if any(r.get('serp_cards_extracted') for r in results):
              raise SystemExit(0)
          raise SystemExit(3)
          PY


  tor-ru:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: ozon_radar_server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tor and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tor tor-geoipdb curl
          pip install -r requirements.txt

      - name: Force Tor to Russian exits and probe Ozon SERP
        run: |
          sudo tee /etc/tor/torrc >/dev/null <<'EOF'
          SocksPort 19050
          ExitNodes {ru}
          StrictNodes 1
          GeoIPFile /usr/share/tor/geoip
          GeoIPv6File /usr/share/tor/geoip6
          Log notice stdout
          EOF
          sudo systemctl stop tor tor@default 2>/dev/null || true
          sudo pkill -9 tor || true
          sudo tor -f /etc/tor/torrc >/tmp/tor.log 2>&1 &
          for i in $(seq 1 90); do
            grep -q "Bootstrapped 100%" /tmp/tor.log && break
            sleep 1
          done
          tail -30 /tmp/tor.log
          python - <<'PY'
          import json, os, urllib.request
          import server

          proxy='socks5h://127.0.0.1:19050'
          try:
              import curl_cffi.requests as cr
              ipr=cr.get('https://ipinfo.io/json', proxies={'http':proxy,'https':proxy}, timeout=20)
              print('TOR_IPINFO',ipr.text[:1000])
          except Exception as e:
              print('TOR_IPINFO_ERROR',type(e).__name__,str(e))

          server.OZON_PROXY=proxy
          try:
              out=server.OzonClient().position('лопата садовая','5094364543',100)
              print('TOR_OZON_RESULT',json.dumps(out,ensure_ascii=False))
              if out.get('checked_depth',0)>0:
                  raise SystemExit(0)
          except Exception as e:
              print('TOR_OZON_ERROR',type(e).__name__,str(e))
          raise SystemExit(3)
          PY

  public-ru-http-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: ozon_radar_server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Probe current public RU HTTP proxy pool against Ozon SERP
        run: |
          python - <<'PY'
          import json, urllib.request
          import curl_cffi.requests as cr
          import server

          urls=[
            'https://api.proxyscrape.com/v2/?request=getproxies&protocol=http&timeout=5000&country=ru&ssl=all&anonymity=all',
            'https://raw.githubusercontent.com/proxifly/free-proxy-list/main/proxies/countries/RU/data.txt',
          ]
          pool=[]
          for url in urls:
              try:
                  raw=urllib.request.urlopen(url,timeout=20).read().decode('utf-8','replace')
              except Exception as e:
                  print('PROXY_SOURCE_ERROR',url,type(e).__name__,str(e))
                  continue
              for line in raw.splitlines():
                  line=line.strip()
                  if not line or ':' not in line:
                      continue
                  if '://' not in line:
                      line='http://'+line
                  if line not in pool:
                      pool.append(line)

          print('PUBLIC_RU_PROXY_COUNT',len(pool))
          results=[]
          for proxy in pool[:30]:
              rec={'proxy':proxy}
              try:
                  rr=cr.get('https://ipinfo.io/json',proxies={'http':proxy,'https':proxy},timeout=7)
                  ipj=rr.json()
                  rec['exit_ip']=ipj.get('ip')
                  rec['exit_country']=ipj.get('country')
                  rec['exit_region']=ipj.get('region')
                  rec['exit_org']=ipj.get('org')
              except Exception as e:
                  rec['ipinfo_error']=f'{type(e).__name__}: {e}'
                  print('PUBLIC_PROXY_RESULT',json.dumps(rec,ensure_ascii=False),flush=True)
                  results.append(rec)
                  continue

              server.OZON_PROXY=proxy
              try:
                  out=server.OzonClient().position('лопата садовая','5094364543',100)
                  rec['ozon']=out
                  rec['serp_cards_extracted']=out.get('checked_depth',0)>0
              except Exception as e:
                  rec['ozon_error']=f'{type(e).__name__}: {e}'
              print('PUBLIC_PROXY_RESULT',json.dumps(rec,ensure_ascii=False),flush=True)
              results.append(rec)
              if rec.get('serp_cards_extracted'):
                  break

          print('PUBLIC_PROXY_SUMMARY',json.dumps(results,ensure_ascii=False))
          if any(x.get('serp_cards_extracted') for x in results):
              raise SystemExit(0)
          raise SystemExit(3)
          PY
