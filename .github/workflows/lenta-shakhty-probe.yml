name: Lenta Shakhty catalog probe
on:
  push:
    paths: ['.github/workflows/lenta-shakhty-probe.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test catalog in real browser
        shell: bash
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps >/dev/null
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({locale:'ru-RU',timezoneId:'Europe/Moscow'});
            page.on('response',r=>{if(r.url().includes('lenta.com') && (r.status()===401||r.status()===403))console.log('BLOCKED_RESPONSE',r.status(),r.url().slice(0,180))});
            try{
              const r=await page.goto('https://lenta.com/catalog/',{waitUntil:'domcontentloaded',timeout:45000});
              await page.waitForTimeout(5000);
              console.log('BROWSER_RESULT',JSON.stringify({status:r?.status(),url:page.url(),title:await page.title(),body:(await page.locator('body').innerText()).slice(0,1200)}));
            }catch(e){console.log('BROWSER_ERROR',e.message)}
            await browser.close();
          })();
          JS
