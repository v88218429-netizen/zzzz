      FBS_END_DATE: ${{ matrix.end_date }}
      WB_API_TOKEN_YV: ${{ secrets.WB_API_TOKEN_YV }}
      GOOGLE_BRIDGE_KEY: ${{ secrets.SELLMONITOR_GITHUB_WEBHOOK_SECRET }}
      GOOGLE_BRIDGE_URL: https://script.google.com/macros/s/AKfycbyU_OXpFYqvBx0KDuGCgEHsnzkts_fnJzVe8DM8crRDD1A_fr5DqOfVfW_PYJriaXU_jw/exec
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mainggg
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check source and credentials
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile wb_worker/github_fbs_recovery.py
          test -n "$GOOGLE_BRIDGE_KEY"
          test -n "$WB_API_TOKEN_YV"
      - name: Reconcile HOZYAYUSHKA from official WB source with bounded retries
        shell: bash
        run: |
          set -uo pipefail
          for batch_size in 5 2 1; do
            echo "FBS_RETRY_ATTEMPT_START client=$FBS_CLIENT from=$FBS_START_DATE to=$FBS_END_DATE batch=$batch_size"
            set +e
            FBS_BATCH_SIZE="$batch_size" timeout --signal=TERM --kill-after=30s 20m python wb_worker/github_fbs_recovery.py
            result=$?
            set -e
            if [[ "$result" -eq 0 ]]; then
