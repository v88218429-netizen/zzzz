name: WB FBS retry failed recovery windows

on:
  workflow_run:
    workflows:
      - WB FBS GitHub recovery
      - WB FBS Sanych targeted recovery
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: wb-fbs-recovery-retry
  cancel-in-progress: false

jobs:
  discover:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'failure'
          && github.event.workflow_run.head_branch == 'mainggg'
          && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.failed.outputs.matrix }}
      count: ${{ steps.failed.outputs.count }}
    steps:
      - name: Find only failed dated recovery windows
        id: failed
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, re, urllib.request
          url = f"https://api.github.com/repos/{os.environ['REPOSITORY']}/actions/runs/{os.environ['RUN_ID']}/jobs?per_page=100"
          req = urllib.request.Request(url, headers={
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urllib.request.urlopen(req, timeout=30) as response:
              jobs = json.load(response).get("jobs", [])
          rows = []
          pattern = re.compile(r"^recover (AIR|HOZYAYUSHKA|SANYCH) (\d{4}-\d{2}-\d{2}).*(\d{4}-\d{2}-\d{2})$")
          for job in jobs:
              if job.get("conclusion") != "failure":
                  continue
              match = pattern.match(str(job.get("name") or ""))
              if not match:
                  continue
              client, start, end = match.groups()
              script = "wb_worker/sanych_fbs_recovery.py" if client == "SANYCH" else "wb_worker/github_fbs_recovery.py"
              rows.append({"client": client, "start_date": start, "end_date": end, "script": script})
          output = {"include": rows}
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write("matrix=" + json.dumps(output, separators=(",", ":")) + "\n")
              stream.write("count=" + str(len(rows)) + "\n")
          print("FAILED_RECOVERY_WINDOWS=" + str(len(rows)))
          PY

  retry:
    needs: discover
    if: ${{ needs.discover.outputs.count != '0' }}
    name: "retry ${{ matrix.client }} ${{ matrix.start_date }}–${{ matrix.end_date }}"
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FBS_CLIENT: ${{ matrix.client }}
      FBS_BATCH_SIZE: "10"
      FBS_LOOKBACK_DAYS: "7"
      FBS_START_DATE: ${{ matrix.start_date }}
      FBS_END_DATE: ${{ matrix.end_date }}
      WB_API_TOKEN_AP: ${{ secrets.WB_API_TOKEN_AP }}
      WB_API_TOKEN_AA: ${{ secrets.WB_API_TOKEN_AA }}
      WB_API_TOKEN_YV: ${{ secrets.WB_API_TOKEN_YV }}
      GOOGLE_BRIDGE_KEY: ${{ secrets.SELLMONITOR_GITHUB_WEBHOOK_SECRET }}
      GOOGLE_BRIDGE_URL: https://script.google.com/macros/s/AKfycbyU_OXpFYqvBx0KDuGCgEHsnzkts_fnJzVe8DM8crRDD1A_fr5DqOfVfW_PYJriaXU_jw/exec
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mainggg
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check source and credentials
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile "${{ matrix.script }}"
          test -n "$GOOGLE_BRIDGE_KEY"
          if [[ "$FBS_CLIENT" == "AIR" ]]; then
            test -n "$WB_API_TOKEN_AA"
          elif [[ "$FBS_CLIENT" == "HOZYAYUSHKA" ]]; then
            test -n "$WB_API_TOKEN_YV"
          elif [[ "$FBS_CLIENT" == "SANYCH" ]]; then
            test -n "$WB_API_TOKEN_AP"
          else
            exit 2
          fi
      - name: Reconcile ${{ matrix.client }} from official WB source
        run: python "${{ matrix.script }}"
