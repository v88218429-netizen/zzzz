name: WB FBS retry failed recovery windows

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "GitHub Actions run ID containing failed FBS windows"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: wb-fbs-data-mutations
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      air_matrix: ${{ steps.failed.outputs.air_matrix }}
      air_count: ${{ steps.failed.outputs.air_count }}
      hozy_matrix: ${{ steps.failed.outputs.hozy_matrix }}
      hozy_count: ${{ steps.failed.outputs.hozy_count }}
      sanych_matrix: ${{ steps.failed.outputs.sanych_matrix }}
      sanych_count: ${{ steps.failed.outputs.sanych_count }}
    steps:
      - name: Find only failed dated recovery windows
        id: failed
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import datetime as dt, json, os, re, urllib.request
          url = f"https://api.github.com/repos/{os.environ['REPOSITORY']}/actions/runs/{os.environ['RUN_ID']}/jobs?per_page=100"
          req = urllib.request.Request(url, headers={
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urllib.request.urlopen(req, timeout=30) as response:
              jobs = json.load(response).get("jobs", [])
          rows, split_count, exhausted = [], 0, 0
          pattern = re.compile(r"^(?:recover|retry) (AIR|HOZYAYUSHKA|SANYCH) (\d{4}-\d{2}-\d{2}).*?(\d{4}-\d{2}-\d{2})(?: \[batch=(\d+)\])?$")
          for job in jobs:
              if job.get("conclusion") not in ("failure", "cancelled", "timed_out"):
                  continue
              match = pattern.match(str(job.get("name") or ""))
              if not match:
                  continue
              client, start, end, prior_batch = match.groups()
              first, last = dt.date.fromisoformat(start), dt.date.fromisoformat(end)
              span = (last - first).days
              if span < 0:
                  continue
              script = "wb_worker/sanych_fbs_recovery.py" if client == "SANYCH" else "wb_worker/github_fbs_recovery.py"
              if span > 0:
                  for offset in range(span + 1):
                      day = (first + dt.timedelta(days=offset)).isoformat()
                      rows.append({"client": client, "start_date": day, "end_date": day,
                                   "script": script, "batch_size": 5})
                  split_count += span + 1
                  continue
              batch = int(prior_batch or 10)
              if batch > 5:
                  batch = 5
              elif batch > 2:
                  batch = 2
              elif batch > 1:
                  batch = 1
              else:
                  exhausted += 1
                  print("FBS_RETRY_LIMIT_REACHED client=" + client + " date=" + start, flush=True)
                  continue
              rows.append({"client": client, "start_date": start, "end_date": end,
                           "script": script, "batch_size": batch})
          rows.sort(key=lambda row: (row["start_date"], row["client"]))
          groups = {
              "air": [row for row in rows if row["client"] == "AIR"],
              "hozy": [row for row in rows if row["client"] == "HOZYAYUSHKA"],
              "sanych": [row for row in rows if row["client"] == "SANYCH"],
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              for name, items in groups.items():
                  stream.write(name + "_matrix=" + json.dumps({"include": items}, separators=(",", ":")) + "\n")
                  stream.write(name + "_count=" + str(len(items)) + "\n")
          print("FAILED_OR_CANCELLED_WINDOWS_REQUEUED=" + str(len(rows)), flush=True)
          print("MULTI_DAY_WINDOWS_SPLIT_TO_DAYS=" + str(split_count), flush=True)
          print("RETRY_LIMIT_REACHED=" + str(exhausted), flush=True)
          PY

  retry_air:
    needs: discover
    if: ${{ needs.discover.outputs.air_count != '0' }}
    name: "retry AIR ${{ matrix.start_date }}–${{ matrix.end_date }} [batch=${{ matrix.batch_size }}]"
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.discover.outputs.air_matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FBS_CLIENT: AIR
      FBS_BATCH_SIZE: ${{ matrix.batch_size }}
      FBS_LOOKBACK_DAYS: "7"
      FBS_START_DATE: ${{ matrix.start_date }}
      FBS_END_DATE: ${{ matrix.end_date }}
      WB_API_TOKEN_AA: ${{ secrets.WB_API_TOKEN_AA }}
      GOOGLE_BRIDGE_KEY: ${{ secrets.SELLMONITOR_GITHUB_WEBHOOK_SECRET }}
      GOOGLE_BRIDGE_URL: https://script.google.com/macros/s/AKfycbyU_OXpFYqvBx0KDuGCgEHsnzkts_fnJzVe8DM8crRDD1A_fr5DqOfVfW_PYJriaXU_jw/exec
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mainggg
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check source and credentials
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile wb_worker/github_fbs_recovery.py
          test -n "$GOOGLE_BRIDGE_KEY"
          test -n "$WB_API_TOKEN_AA"
      - name: Reconcile AIR from official WB source with bounded retries
        shell: bash
        run: |
          set -uo pipefail
          for batch_size in 5 2 1; do
            echo "FBS_RETRY_ATTEMPT_START client=$FBS_CLIENT from=$FBS_START_DATE to=$FBS_END_DATE batch=$batch_size"
            set +e
            FBS_BATCH_SIZE="$batch_size" timeout --signal=TERM --kill-after=30s 20m python wb_worker/github_fbs_recovery.py
            result=$?
            set -e
            if [[ "$result" -eq 0 ]]; then
              echo "FBS_RETRY_WINDOW_VERIFIED=yes client=$FBS_CLIENT from=$FBS_START_DATE to=$FBS_END_DATE batch=$batch_size"
              exit 0
            fi
            echo "FBS_RETRY_ATTEMPT_FAILED exit=$result batch=$batch_size"
            if [[ "$batch_size" -gt 1 ]]; then sleep 60; fi
          done
          exit 1

  retry_hozy:
    needs: discover
    if: ${{ needs.discover.outputs.hozy_count != '0' }}
