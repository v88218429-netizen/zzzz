              exit 0
            fi
            echo "FBS_RETRY_ATTEMPT_FAILED exit=$result batch=$batch_size"
            if [[ "$batch_size" -gt 1 ]]; then sleep 60; fi
          done
          exit 1

  retry_sanych:
    needs: discover
    if: ${{ needs.discover.outputs.sanych_count != '0' }}
    name: "retry SANYCH ${{ matrix.start_date }}–${{ matrix.end_date }} [batch=${{ matrix.batch_size }}]"
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.discover.outputs.sanych_matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FBS_CLIENT: SANYCH
      FBS_BATCH_SIZE: ${{ matrix.batch_size }}
      FBS_LOOKBACK_DAYS: "7"
      FBS_START_DATE: ${{ matrix.start_date }}
      FBS_END_DATE: ${{ matrix.end_date }}
      WB_API_TOKEN_AP: ${{ secrets.WB_API_TOKEN_AP }}
      GOOGLE_BRIDGE_KEY: ${{ secrets.SELLMONITOR_GITHUB_WEBHOOK_SECRET }}
      GOOGLE_BRIDGE_URL: https://script.google.com/macros/s/AKfycbyU_OXpFYqvBx0KDuGCgEHsnzkts_fnJzVe8DM8crRDD1A_fr5DqOfVfW_PYJriaXU_jw/exec
    steps:
      - uses: actions/checkout@v4
