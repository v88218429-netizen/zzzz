name: FF photo vision local

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [mainggg]
    paths:
      - "wb_os/tools/ff_photo_vision_local.py"
      - "wb_os/apps_script/WB_FF_PENALTIES_SYNC.gs"
      - ".github/workflows/ff-photo-vision-local.yml"

permissions:
  contents: read

concurrency:
  group: ff-photo-vision-local
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: [self-hosted, macOS, ozon-live]
    timeout-minutes: 45

    env:
      OLLAMA_MODEL: qwen2.5vl:3b
      MAX_CASES: "6"

    steps:
      - uses: actions/checkout@v4

      - name: Discover live Apps Script project
        id: discover
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="$(python3 wb_os/tools/discover_clasp_project.py)"
          test -f "$PROJECT_DIR/.clasp.json"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Live Apps Script project discovered."

      - name: Ensure Ollama is installed and running
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v ollama >/dev/null 2>&1; then
            if ! command -v brew >/dev/null 2>&1; then
              echo "Homebrew is required on the self-hosted Mac runner."
              exit 2
            fi
            brew install ollama
          fi

          if ! curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
            if command -v brew >/dev/null 2>&1; then
              brew services start ollama || true
            fi
            nohup ollama serve >"$HOME/.ollama/ff-vision-server.log" 2>&1 &
          fi

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
              echo "Ollama is ready."
              exit 0
            fi
            sleep 2
          done

          echo "Ollama did not become ready."
          exit 3

      - name: Ensure local vision model
        shell: bash
        run: |
          set -euo pipefail
          if ollama show "$OLLAMA_MODEL" >/dev/null 2>&1; then
            echo "Model already present: $OLLAMA_MODEL"
          else
            ollama pull "$OLLAMA_MODEL"
          fi
          ollama show "$OLLAMA_MODEL" >/dev/null

      - name: Pull pending photo cases from Google Sheets
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.discover.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if command -v clasp >/dev/null 2>&1; then
            clasp run ffVisionGetPendingJson --params "[$MAX_CASES]"               | tee /tmp/ff-vision-pending.out
          else
            npx --yes @google/clasp run ffVisionGetPendingJson               --params "[$MAX_CASES]"               | tee /tmp/ff-vision-pending.out
          fi

          test -s /tmp/ff-vision-pending.out

      - name: Analyze pending photos locally
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util, subprocess, sys
          if importlib.util.find_spec("requests") is None:
              subprocess.check_call([sys.executable, "-m", "pip", "install", "--user", "requests>=2.31"])
          PY

          python3 wb_os/tools/ff_photo_vision_local.py             --pending-output /tmp/ff-vision-pending.out             --results /tmp/ff-vision-results.json             --ollama-url http://127.0.0.1:11434             --model "$OLLAMA_MODEL"             --max-cases "$MAX_CASES"

          test -s /tmp/ff-vision-results.json
          python3 - <<'PY'
          import json
          rows=json.load(open("/tmp/ff-vision-results.json",encoding="utf-8"))
          print("VISION_RESULTS_COUNT="+str(len(rows)))
          PY

      - name: Write analysis back to Google Sheets
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.discover.outputs.project_dir }}
        run: |
          set -euo pipefail

          COUNT="$(python3 - <<'PY'
          import json
          print(len(json.load(open("/tmp/ff-vision-results.json",encoding="utf-8"))))
          PY
          )"

          if [ "$COUNT" = "0" ]; then
            echo "No pending cases; nothing to write."
            exit 0
          fi

          PARAMS="$(python3 - <<'PY'
          import json
          raw=open("/tmp/ff-vision-results.json",encoding="utf-8").read().strip()
          print(json.dumps([raw],ensure_ascii=False,separators=(",",":")))
          PY
          )"

          cd "$PROJECT_DIR"
          if command -v clasp >/dev/null 2>&1; then
            clasp run ffVisionApplyResultsJson --params "$PARAMS"
          else
            npx --yes @google/clasp run ffVisionApplyResultsJson --params "$PARAMS"
          fi

          echo "Photo analysis written back to the FF sheet."
