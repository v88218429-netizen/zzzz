name: WB FBS supply stage check

on:
  push:
    branches: [mainggg]
    paths:
      - ".github/workflows/wb-fbs-supply-stage-check.yml"

permissions:
  contents: read

concurrency:
  group: wb-fbs-supply-readonly-stage-check
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GOOGLE_BRIDGE_KEY: ${{ secrets.SELLMONITOR_GITHUB_WEBHOOK_SECRET }}
      GOOGLE_BRIDGE_URL: https://script.google.com/macros/s/AKfycbyU_OXpFYqvBx0KDuGCgEHsnzkts_fnJzVe8DM8crRDD1A_fr5DqOfVfW_PYJriaXU_jw/exec
    steps:
      - name: Read current FBS supply stage
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GOOGLE_BRIDGE_KEY"
          python3 - <<'PY'
          import json, os, urllib.request
          payload = json.dumps({
              "action": "fbs_supply_stage",
              "token": os.environ["GOOGLE_BRIDGE_KEY"],
          }).encode("utf-8")
          req = urllib.request.Request(
              os.environ["GOOGLE_BRIDGE_URL"],
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=75) as response:
              data = json.loads(response.read().decode("utf-8"))
          print("FBS_SUPPLY_STAGE_CHECK=" + json.dumps(data, ensure_ascii=False, separators=(",", ":")), flush=True)
          if data.get("ok") is not True:
              raise SystemExit("FBS_SUPPLY_STAGE_CHECK_FAILED")
          PY
