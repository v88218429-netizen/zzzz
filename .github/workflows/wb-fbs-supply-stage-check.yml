name: WB FBS supply stage check

on:
  push:
    branches: [mainggg]
    paths:
      - ".github/workflows/wb-fbs-supply-stage-check.yml"

permissions:
  contents: read

concurrency:
  group: wb-fbs-supply-readonly-stage-check
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_BRIDGE_KEY: ${{ secrets.SELLMONITOR_GITHUB_WEBHOOK_SECRET }}
      GOOGLE_BRIDGE_URL: https://script.google.com/macros/s/AKfycbyU_OXpFYqvBx0KDuGCgEHsnzkts_fnJzVe8DM8crRDD1A_fr5DqOfVfW_PYJriaXU_jw/exec
    steps:
      - name: Read current FBS supply stage until sync finishes
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GOOGLE_BRIDGE_KEY"
          python3 - <<'PY'
          import json, os, time, urllib.request
          deadline = time.monotonic() + 12 * 60
          while True:
              payload = json.dumps({
                  "action": "fbs_supply_stage",
                  "token": os.environ["GOOGLE_BRIDGE_KEY"],
              }).encode("utf-8")
              req = urllib.request.Request(
                  os.environ["GOOGLE_BRIDGE_URL"],
                  data=payload,
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=75) as response:
                  data = json.loads(response.read().decode("utf-8"))
              if data.get("ok") is not True:
                  raise SystemExit("FBS_SUPPLY_STAGE_CHECK_FAILED")
              stage = (data.get("result") or {}).get("fbs_supply_stage") or {}
              print("FBS_SUPPLY_STAGE_CHECK=" + json.dumps({
                  "checkedAt": (data.get("result") or {}).get("checkedAt"),
                  "leaseActive": stage.get("leaseActive"),
                  "currentClient": stage.get("currentClient"),
                  "backfillRowsRemaining": stage.get("backfillRowsRemaining"),
                  "stage": stage.get("stage"),
                  "stageAt": stage.get("stageAt"),
                  "detail": stage.get("detail"),
              }, ensure_ascii=False, separators=(",", ":")), flush=True)
              if not stage.get("leaseActive"):
                  break
              if time.monotonic() >= deadline:
                  raise SystemExit("FBS_SUPPLY_SYNC_STILL_ACTIVE_AFTER_12_MIN")
              time.sleep(30)
          PY
