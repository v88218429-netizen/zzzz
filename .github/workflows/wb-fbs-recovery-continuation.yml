name: WB FBS recovery continuation

on:
  workflow_run:
    workflows:
      - WB FBS retry failed recovery windows
      - WB FBS GitHub recovery
      - WB FBS Sanych targeted recovery
      - WB FBS production acceptance audit
      - WB FBS supply sync via GitHub
    types:
      - completed
    branches:
      - mainggg

permissions:
  actions: write

jobs:
  continue_failed_windows:
    if: ${{ github.event_name == 'workflow_run' && contains(fromJSON('["failure","timed_out"]'), github.event.workflow_run.conclusion) }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch next bounded pass for failed windows only
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_TITLE: ${{ github.event.workflow_run.display_title }}
          SOURCE_NAME: ${{ github.event.workflow_run.name }}
          SOURCE_PATH: ${{ github.event.workflow_run.path }}
          SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          python - <<'PY'
          import io
          import json
          import os
          import re
          import time
          import zipfile
          import urllib.error
          import urllib.parse
          import urllib.request

          class StripAuthRedirectHandler(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, hdrs, newurl):
                  redirected = super().redirect_request(req, fp, code, msg, hdrs, newurl)
                  if redirected is not None:
                      source_host = urllib.parse.urlsplit(req.full_url).netloc.lower()
                      target_host = urllib.parse.urlsplit(newurl).netloc.lower()
                      if source_host != target_host:
                          redirected.remove_header("Authorization")
                          redirected.remove_header("Proxy-Authorization")
                          redirected.remove_header("Cookie")
                  return redirected

          logs_opener = urllib.request.build_opener(StripAuthRedirectHandler())

          repository = os.environ["REPOSITORY"]
          source_run_id = int(os.environ["SOURCE_RUN_ID"])
          source_title = os.environ.get("SOURCE_TITLE", "")
          source_name = os.environ.get("SOURCE_NAME", "")
          source_path = os.environ.get("SOURCE_PATH", "")
          source_attempt = int(os.environ.get("SOURCE_ATTEMPT", "1"))
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }

          def post(url, body):
              request = urllib.request.Request(url, data=json.dumps(body).encode("utf-8"),
                                               headers=headers, method="POST")
              for attempt in range(1, 6):
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          return response.status
                  except urllib.error.HTTPError as error:
                      if error.code not in (408, 425, 429, 500, 502, 503, 504) or attempt == 5:
                          raise
                      time.sleep(min(60, attempt * 10))

          recovery_names = {"WB FBS GitHub recovery", "WB FBS Sanych targeted recovery"}
          if source_path in {".github/workflows/wb-fbs-github-recovery.yml",
                             ".github/workflows/wb-fbs-sanych-targeted-recovery.yml",
                             ".github/workflows/wb-fbs-auto-retry.yml"} or source_name in recovery_names or source_name == "WB FBS retry failed recovery windows":
              match = re.search(r"source +(\d+) +pass +(\d+)", source_title, re.IGNORECASE)
              source_root_id = int(match.group(1)) if match else source_run_id
              current_pass = int(match.group(2)) if match else 0
              if current_pass >= 3:
                  print("FBS_CONTINUATION_PASS_LIMIT_REACHED=" + str(current_pass), flush=True)
                  raise SystemExit(0)
              next_pass = current_pass + 1
              body = {
                  "ref": "mainggg",
                  "inputs": {
                      "run_id": str(source_run_id),
                      "source_run_id": str(source_root_id),
                      "pass": str(next_pass),
                  },
              }
              url = "https://api.github.com/repos/" + repository + "/actions/workflows/wb-fbs-auto-retry.yml/dispatches"
              status = post(url, body)
              if status != 204:
                  raise SystemExit("FBS_CONTINUATION_DISPATCH_HTTP_" + str(status))
              print("FBS_CONTINUATION_DISPATCHED pass=" + str(next_pass) +
                    " source=" + str(source_root_id) + " retry_source_run=" + str(source_run_id), flush=True)
          elif source_path == ".github/workflows/wb-fbs-production-acceptance-audit.yml" and os.environ.get("SOURCE_CONCLUSION") == "cancelled":
              print("FBS_CANCELLED_ACCEPTANCE_NOT_RERUN run=" + str(source_run_id), flush=True)
          elif source_path == ".github/workflows/wb-fbs-production-acceptance-audit.yml" and os.environ.get("SOURCE_CONCLUSION") == "failure":
              jobs_url = "https://api.github.com/repos/" + repository + "/actions/runs/" + str(source_run_id) + "/jobs?per_page=100"
              jobs_request = urllib.request.Request(jobs_url, headers=headers)
              with urllib.request.urlopen(jobs_request, timeout=30) as response:
                  failed_jobs = [job for job in json.load(response).get("jobs", [])
                                 if job.get("conclusion") == "failure"]
              quality_gate_failed = False
              writers_not_quiescent = False
              unreadable_logs = []
              for job in failed_jobs:
                  logs_url = "https://api.github.com/repos/" + repository + "/actions/jobs/" + str(job["id"]) + "/logs"
                  logs_request = urllib.request.Request(logs_url, headers=headers)
                  try:
                      with logs_opener.open(logs_request, timeout=60) as response:
                          raw_logs = response.read()
                      if zipfile.is_zipfile(io.BytesIO(raw_logs)):
                          with zipfile.ZipFile(io.BytesIO(raw_logs)) as archive:
                              log_chunks = [archive.read(log_name) for log_name in archive.namelist()]
                      else:
                          log_chunks = [raw_logs]
                      for chunk in log_chunks:
                          if b"FBS_PRODUCTION_ACCEPTANCE_FAILED:QUALITY_GATE" in chunk:
                              quality_gate_failed = True
                          if b"FBS_PRODUCTION_WRITERS_DID_NOT_QUIESCE" in chunk:
                              writers_not_quiescent = True
                  except (OSError, zipfile.BadZipFile, urllib.error.URLError) as error:
                      unreadable_logs.append(str(job["id"]) + ":" + type(error).__name__)
              if unreadable_logs:
                  print("FBS_ACCEPTANCE_LOGS_UNREADABLE_NOT_RERUN run=" + str(source_run_id) +
                        " jobs=" + ",".join(unreadable_logs), flush=True)
                  raise SystemExit(0)
              if quality_gate_failed:
                  print("FBS_QUALITY_GATE_FAILURE_NOT_RERUN run=" + str(source_run_id), flush=True)
                  raise SystemExit(0)
              if writers_not_quiescent:
                  print("FBS_WRITERS_NOT_QUIESCENT_NOT_RERUN run=" + str(source_run_id), flush=True)
                  raise SystemExit(0)
          elif source_path == ".github/workflows/wb-fbs-supply-sync.yml" and os.environ.get("SOURCE_CONCLUSION") == "cancelled":
              print("FBS_CANCELLED_SUPPLY_NOT_RERUN run=" + str(source_run_id), flush=True)
          elif source_path in {".github/workflows/wb-fbs-production-acceptance-audit.yml",
                               ".github/workflows/wb-fbs-supply-sync.yml"} or source_name in {"WB FBS production acceptance audit",
                               "WB FBS supply sync via GitHub"}:
              if source_attempt >= 3:
                  print("FBS_TRANSIENT_RETRY_LIMIT_REACHED run=" + str(source_run_id) +
                        " attempts=" + str(source_attempt), flush=True)
                  raise SystemExit(0)
              url = "https://api.github.com/repos/" + repository + "/actions/runs/" + str(source_run_id) + "/rerun-failed-jobs"
              status = post(url, {})
              if status != 201:
                  raise SystemExit("FBS_FAILED_JOB_RERUN_HTTP_" + str(status))
              print("FBS_FAILED_JOBS_RERUN_REQUESTED run=" + str(source_run_id) +
                    " next_attempt=" + str(source_attempt + 1), flush=True)
          else:
              print("FBS_CONTINUATION_NOT_APPLICABLE name=" + source_name, flush=True)
          PY
