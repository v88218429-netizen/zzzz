name: WB FBS recovery continuation

on:
  workflow_run:
    workflows:
      - WB FBS retry failed recovery windows
    types:
      - completed
    branches:
      - mainggg

permissions:
  actions: write

jobs:
  continue_failed_windows:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch next bounded pass for failed windows only
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_TITLE: ${{ github.event.workflow_run.display_title }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.request

          repository = os.environ["REPOSITORY"]
          source_run_id = int(os.environ["SOURCE_RUN_ID"])
          source_title = os.environ.get("SOURCE_TITLE", "")
          match = re.search(r"pass +([0-9]+)", source_title, re.IGNORECASE)
          current_pass = int(match.group(1)) if match else 1

          if current_pass >= 3:
              print("FBS_CONTINUATION_PASS_LIMIT_REACHED=" + str(current_pass), flush=True)
              raise SystemExit(0)

          next_pass = current_pass + 1
          body = json.dumps({
              "ref": "mainggg",
              "inputs": {
                  "run_id": str(source_run_id),
                  "pass": str(next_pass),
              },
          }).encode("utf-8")
          url = (
              "https://api.github.com/repos/"
              + repository
              + "/actions/workflows/wb-fbs-auto-retry.yml/dispatches"
          )
          request = urllib.request.Request(
              url,
              data=body,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
              method="POST",
          )

          for attempt in range(1, 6):
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      if response.status != 204:
                          raise RuntimeError("DISPATCH_HTTP_" + str(response.status))
                      print(
                          "FBS_CONTINUATION_DISPATCHED="
                          + str(next_pass)
                          + " SOURCE_RUN_ID="
                          + str(source_run_id),
                          flush=True,
                      )
                      break
              except urllib.error.HTTPError as error:
                  if error.code not in (429, 500, 502, 503, 504) or attempt == 5:
                      raise
                  time.sleep(min(60, attempt * 10))
          PY
