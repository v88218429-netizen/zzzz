name: WB Sheets bridge smoke

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["WB GitHub Runtime"]
    types: [completed]

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify authenticated portfolio bridge
        env:
          BRIDGE_KEY: ${{ secrets.SELLMONITOR_GITHUB_WEBHOOK_SECRET }}
          BRIDGE_URL: "https://script.google.com/macros/s/AKfycbyU_OXpFYqvBx0KDuGCgEHsnzkts_fnJzVe8DM8crRDD1A_fr5DqOfVfW_PYJriaXU_jw/exec"
        run: |
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request

          url=os.environ["BRIDGE_URL"]
          body=json.dumps({"key":os.environ["BRIDGE_KEY"],"action":"all"}).encode()
          d=None
          last_error=None
          # Run after the WB runtime has had a chance to publish current per-cabinet
          # search positions. Transient Apps Script transport errors are retryable;
          # content/assertion errors still fail closed.
          for attempt in range(1,5):
              req=urllib.request.Request(
                  url,
                  data=body,
                  headers={"Content-Type":"application/json"},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req,timeout=180) as r:
                      candidate=json.loads(r.read().decode("utf-8"))
                  # Immediately after a stable Apps Script redeploy Google can
                  # briefly serve the previous auth hash while the new revision
                  # is already visible to the deploy job. Retry that narrow
                  # consistency window, but still fail closed if it persists.
                  if candidate.get("ok") is False and candidate.get("error") == "UNAUTHORIZED":
                      last_error="UNAUTHORIZED during deployment propagation"
                  else:
                      d=candidate
                      break
              except urllib.error.HTTPError as exc:
                  last_error=exc
                  if exc.code not in {404,408,429,500,502,503,504}:
                      raise
              except (urllib.error.URLError, TimeoutError) as exc:
                  last_error=exc
              if attempt < 4:
                  print(f"bridge not ready (attempt {attempt}/4): {last_error}; retrying")
                  time.sleep(15)
          if d is None:
              raise RuntimeError(f"bridge did not become ready after retries: {last_error}")

          assert d.get("ok") is True, d
          sources=d.get("sources") or {}
          expected={"weekly_summary","own_27","sanych_sellmonitor","air_sellmonitor","hozyushka_sellmonitor"}
          assert expected.issubset(set(sources)), sorted(sources)
          counts={}
          for sid,source in sources.items():
              counts[sid]={k:len((v or {}).get("values") or []) for k,v in (source.get("ranges") or {}).items()}
          assert not (d.get("errors") or []), d.get("errors")

          # Hozyushka's official search feed is intentionally not Jam-dependent.
          # An empty positions sheet is acceptable to the bridge smoke only when
          # the source itself explicitly marks zero facts; missing/blank metadata
          # still fails so an unavailable source cannot be mistaken for success.
          hozy_positions=(sources["hozyushka_sellmonitor"].get("ranges") or {}).get("positions") or {}
          hozy_values=hozy_positions.get("values") or []
          hozy_marker=" ".join(str(cell) for row in hozy_values for cell in row if cell is not None)
          if len(hozy_values) <= 2:
              assert len(hozy_values) == 2 and "обновлено" in hozy_marker.lower() and "строк 0" in hozy_marker.lower(), {
                  "hozyushka_positions_rows": len(hozy_values),
                  "marker": hozy_marker,
              }
              hozy_positions_state="empty_marked"
          else:
              hozy_positions_state="populated"

          assert counts["sanych_sellmonitor"].get("positions",0)>2, counts
          assert counts["air_sellmonitor"].get("positions",0)>2, counts
          assert counts["sanych_sellmonitor"].get("stocks",0)>1, counts
          assert counts["air_sellmonitor"].get("stocks",0)>1, counts
          assert counts["hozyushka_sellmonitor"].get("stocks",0)>1, counts
          assert counts["own_27"].get("summary",0)>1, counts
          print(json.dumps({
              "ok":True,
              "sources":sorted(sources),
              "row_counts":counts,
              "hozyushka_positions_state":hozy_positions_state,
              "hozyushka_positions_marker":hozy_marker,
              "bridge_errors":d.get("errors") or []
          },ensure_ascii=False,indent=2))
          PY
