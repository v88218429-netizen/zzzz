name: WB GitHub Runtime

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Sellmonitor GitHub worker deploy"]
    types: [completed]
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches:
      - mainggg
    paths:
      - "wb_ai_manager/source/**"
      - "sellmonitor_github_worker/**"
      - ".github/workflows/wb-github-runtime.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' && format('wb-github-runtime-skip-{0}', github.run_id) || 'wb-github-runtime' }}
  cancel-in-progress: true

jobs:
  run:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore encrypted rolling runtime state
        shell: bash
        env:
          STATE_SECRET: ${{ secrets.SELLMONITOR_GITHUB_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p wb_ai_manager/source/data/github-runtime
          if git ls-remote --exit-code --heads origin runtime-state >/dev/null 2>&1; then
            git fetch --depth=1 origin runtime-state:refs/remotes/origin/runtime-state
            STATE_CIPHER="$RUNNER_TEMP/runtime.tar.gz.enc"
            if git cat-file -e "origin/runtime-state:state/runtime.tar.gz.enc" 2>/dev/null; then
              # Backward-compatible restore for the previous single-file format.
              git show "origin/runtime-state:state/runtime.tar.gz.enc" > "$STATE_CIPHER"
            else
              # Join encrypted parts before decrypting; each stored file stays below GitHub's 100 MB limit.
              STATE_PARTS=()
              while IFS= read -r part; do
                case "$part" in
                  state/runtime.tar.gz.enc.part-???) STATE_PARTS+=("$part") ;;
                esac
              done < <(git ls-tree -r --name-only origin/runtime-state)
              if (("${#STATE_PARTS[@]}" > 0)); then
                : > "$STATE_CIPHER"
                for part in "${STATE_PARTS[@]}"; do
                  git show "origin/runtime-state:$part" >> "$STATE_CIPHER"
                done
              fi
            fi
            if [[ -f "$STATE_CIPHER" ]]; then
              openssl enc -d -aes-256-cbc -pbkdf2 \
                -pass env:STATE_SECRET \
                -in "$STATE_CIPHER" \
                -out "$RUNNER_TEMP/runtime.tar.gz"
              tar -xzf "$RUNNER_TEMP/runtime.tar.gz" -C wb_ai_manager/source/data/github-runtime
            fi
          fi

      - name: Install runtime
        working-directory: wb_ai_manager/source
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps

      - name: Run three-cabinet WB audit and publish owner brief
        working-directory: wb_ai_manager/source
        env:
          DATA_DIR: data/github-runtime
          WB_API_TOKEN_AP: ${{ secrets.WB_API_TOKEN_AP }}
          WB_API_TOKEN_AA: ${{ secrets.WB_API_TOKEN_AA }}
          WB_API_TOKEN_YV: ${{ secrets.WB_API_TOKEN_YV }}
          GOOGLE_SHEETS_BRIDGE_URL: "https://script.google.com/macros/s/AKfycbyU_OXpFYqvBx0KDuGCgEHsnzkts_fnJzVe8DM8crRDD1A_fr5DqOfVfW_PYJriaXU_jw/exec"
          GOOGLE_SHEETS_BRIDGE_KEY: ${{ secrets.SELLMONITOR_GITHUB_WEBHOOK_SECRET }}
          FORCE_READ_ONLY: "true"
          OPERATION_MODE: shadow
          ENABLE_PUBLIC_WB_SEARCH: "true"
          MCP_START_TIMEOUT_SECONDS: "30"
          MCP_CALL_TIMEOUT_SECONDS: "60"
          AGENT_RUN_TIMEOUT_SECONDS: "180"
          STARTUP_AUDIT_ENABLED: "false"
          AUTO_UPDATE_ENABLED: "false"
          GITHUB_RUNTIME_OUTPUT: github_site
        run: python scripts/github_runtime.py

      - name: Encrypt full runtime state
        shell: bash
        env:
          STATE_SECRET: ${{ secrets.SELLMONITOR_GITHUB_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wb-runtime-publish/state"
          tar -czf "$RUNNER_TEMP/runtime.tar.gz" -C wb_ai_manager/source/data/github-runtime .
          STATE_CIPHER="$RUNNER_TEMP/wb-runtime-publish/state/runtime.tar.gz.enc"
          openssl enc -aes-256-cbc -salt -pbkdf2 \
            -pass env:STATE_SECRET \
            -in "$RUNNER_TEMP/runtime.tar.gz" \
            -out "$STATE_CIPHER"
          split -b 80m -d -a 3 "$STATE_CIPHER" "$STATE_CIPHER.part-"
          rm "$STATE_CIPHER"
          cp wb_ai_manager/source/github_site/data/health.json "$RUNNER_TEMP/wb-runtime-publish/state/health.json"

      - name: Publish encrypted optimizer data for the local panel
        shell: bash
        run: |
          set -euo pipefail
          test -s traffic_state_public.pem
          test -s wb_ai_manager/source/github_site/data/optimizer-state.json
          mkdir -p "$RUNNER_TEMP/wb-optimizer-publish/state"
          tar -czf "$RUNNER_TEMP/optimizer.tar.gz" -C wb_ai_manager/source/github_site/data optimizer-state.json
          openssl rand -hex 32 > "$RUNNER_TEMP/optimizer-dashboard.key"
          openssl enc -aes-256-cbc -salt -pbkdf2 \
            -pass file:"$RUNNER_TEMP/optimizer-dashboard.key" \
            -in "$RUNNER_TEMP/optimizer.tar.gz" \
            -out "$RUNNER_TEMP/wb-optimizer-publish/state/optimizer-dashboard.tar.gz.enc"
          openssl pkeyutl -encrypt -pubin -inkey traffic_state_public.pem \
            -in "$RUNNER_TEMP/optimizer-dashboard.key" \
            -out "$RUNNER_TEMP/wb-optimizer-publish/state/optimizer-dashboard.key.enc" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          printf '%s\n' '# WB optimizer encrypted state' '' 'Optimizer facts are AES-256 encrypted. The key is wrapped for the configured local private key.' > "$RUNNER_TEMP/wb-optimizer-publish/README.md"
          git worktree add --detach "$RUNNER_TEMP/wb-optimizer-state-branch" HEAD
          git -C "$RUNNER_TEMP/wb-optimizer-state-branch" switch --orphan optimizer-state-next
          git -C "$RUNNER_TEMP/wb-optimizer-state-branch" rm -rf . >/dev/null 2>&1 || true
          cp -R "$RUNNER_TEMP/wb-optimizer-publish/." "$RUNNER_TEMP/wb-optimizer-state-branch/"
          git -C "$RUNNER_TEMP/wb-optimizer-state-branch" config user.name "wb-ai-manager[bot]"
          git -C "$RUNNER_TEMP/wb-optimizer-state-branch" config user.email "wb-ai-manager[bot]@users.noreply.github.com"
          git -C "$RUNNER_TEMP/wb-optimizer-state-branch" add README.md state/optimizer-dashboard.tar.gz.enc state/optimizer-dashboard.key.enc
          git -C "$RUNNER_TEMP/wb-optimizer-state-branch" commit -m "optimizer: encrypted three-cabinet recommendations"
          git -C "$RUNNER_TEMP/wb-optimizer-state-branch" push origin HEAD:optimizer-state --force

      - name: Build non-sensitive GitHub status page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wb-runtime-publish"
          OUT="$RUNNER_TEMP/wb-runtime-publish/README.md" python - <<'PY'
          import json, os, pathlib
          p=pathlib.Path("wb_ai_manager/source/github_site/data/health.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          lines=[
            "# WB AI Manager · GitHub Runtime",
            "",
            "> Live business data is encrypted. This branch exposes only connection/health metadata.",
            "",
            f"- Generated: {d.get('generated_at','')}",
            f"- Overall: {d.get('health','unknown')}",
            f"- WB cabinets connected: {d.get('connected_cabinets',0)}/{d.get('expected_cabinets',3)}",
            f"- Google Sheets/Sellmonitor live: {d.get('sheets_live',False)}",
            f"- Private owner dashboard published: {d.get('dashboard_published',False)}",
            f"- Query Manager: {d.get('query_status','unknown')}",
            f"- Query rows: {d.get('query_rows',0)}",
            f"- Ready query actions: {d.get('ready_query_actions',0)}",
            "",
            "Runtime state is AES-256 encrypted and replaced on every successful run.",
          ]
          pathlib.Path(os.environ["OUT"]).write_text("\n".join(lines)+"\n",encoding="utf-8")
          PY

      - name: Replace runtime branch with encrypted state only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "wb-ai-manager[bot]"
          git config user.email "wb-ai-manager[bot]@users.noreply.github.com"
          git checkout --orphan runtime-state-next
          git rm -rf . >/dev/null 2>&1 || true
          cp -R "$RUNNER_TEMP/wb-runtime-publish/." .
          git add README.md state
          git commit -m "runtime: encrypted latest WB state"
          git push origin HEAD:runtime-state --force
