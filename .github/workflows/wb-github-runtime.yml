name: WB GitHub Runtime

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches:
      - mainggg
    paths:
      - "wb_ai_manager/source/**"
      - ".github/workflows/wb-github-runtime.yml"

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: wb-github-runtime
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/mainggg'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore latest runtime state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wb_ai_manager/source/data/github-runtime
          if git ls-remote --exit-code --heads origin runtime-state >/dev/null 2>&1; then
            git fetch --depth=1 origin runtime-state:refs/remotes/origin/runtime-state
            for f in control_center.sqlite3 portfolio_live.json remote_policy_cache.json; do
              if git cat-file -e "origin/runtime-state:state/$f" 2>/dev/null; then
                git show "origin/runtime-state:state/$f" > "wb_ai_manager/source/data/github-runtime/$f"
              fi
            done
          fi

      - name: Install focused runtime
        working-directory: wb_ai_manager/source
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps

      - name: Run WB audit and build static snapshot
        working-directory: wb_ai_manager/source
        env:
          DATA_DIR: data/github-runtime
          WB_MODE: live
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
          GOOGLE_SHEETS_BRIDGE_URL: ${{ secrets.GOOGLE_SHEETS_BRIDGE_URL }}
          GOOGLE_SHEETS_BRIDGE_KEY: ${{ secrets.GOOGLE_SHEETS_BRIDGE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_READ_ONLY: "true"
          OPERATION_MODE: shadow
          ENABLE_PUBLIC_WB_SEARCH: "true"
          STARTUP_AUDIT_ENABLED: "false"
          AUTO_UPDATE_ENABLED: "false"
          GITHUB_RUNTIME_OUTPUT: github_site
        run: python scripts/github_runtime.py

      - name: Upload GitHub Pages snapshot
        uses: actions/upload-pages-artifact@v4
        with:
          path: wb_ai_manager/source/github_site

      - name: Stage state outside worktree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wb-runtime-state"
          for f in control_center.sqlite3 portfolio_live.json remote_policy_cache.json; do
            src="wb_ai_manager/source/data/github-runtime/$f"
            [ -f "$src" ] && cp "$src" "$RUNNER_TEMP/wb-runtime-state/$f"
          done
          mkdir -p "$RUNNER_TEMP/wb-runtime-state/site-data"
          cp -f wb_ai_manager/source/github_site/data/*.json "$RUNNER_TEMP/wb-runtime-state/site-data/" 2>/dev/null || true

      - name: Persist one rolling GitHub state snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "wb-ai-manager[bot]"
          git config user.email "wb-ai-manager[bot]@users.noreply.github.com"
          git checkout --orphan runtime-state-next
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p state
          cp -f "$RUNNER_TEMP"/wb-runtime-state/* state/ 2>/dev/null || true
          mkdir -p state/site-data
          cp -f "$RUNNER_TEMP"/wb-runtime-state/site-data/* state/site-data/ 2>/dev/null || true
          printf '%s\n' "generated_at=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" > state/README.txt
          git add state
          git commit -m "runtime: latest WB state"
          git push origin HEAD:runtime-state --force

  deploy:
    if: github.ref == 'refs/heads/mainggg'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
