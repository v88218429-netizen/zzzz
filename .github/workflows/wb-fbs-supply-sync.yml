name: WB FBS supply sync via GitHub

on:
  push:
    branches: [mainggg]
    paths:
      - ".github/workflows/wb-fbs-supply-sync.yml"
      - "wb_os/apps_script/WB_FBS_SUPPLY_DIRECT.gs"
  schedule:
    - cron: "57 */3 * * *"
  workflow_run:
    workflows: ["Sellmonitor GitHub worker deploy"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wb-fbs-supply-sync
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_BRIDGE_KEY: ${{ secrets.SELLMONITOR_GITHUB_WEBHOOK_SECRET }}
      GOOGLE_BRIDGE_URL: https://script.google.com/macros/s/AKfycbyU_OXpFYqvBx0KDuGCgEHsnzkts_fnJzVe8DM8crRDD1A_fr5DqOfVfW_PYJriaXU_jw/exec
    steps:
      - name: Reconcile supply lists and order timings
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GOOGLE_BRIDGE_KEY"
          python - <<'PY'
          import json, os, sys, urllib.request
          payload = json.dumps({
              "action": "fbs_supply_sync",
              "key": os.environ["GOOGLE_BRIDGE_KEY"],
          }).encode("utf-8")
          request = urllib.request.Request(
              os.environ["GOOGLE_BRIDGE_URL"],
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=840) as response:
              result = json.loads(response.read().decode("utf-8"))
          if result.get("ok") is not True:
              print("FBS_SUPPLY_SYNC_FAILED " + json.dumps(result, ensure_ascii=False, separators=(",", ":")))
              sys.exit(1)
          stores = (result.get("result") or {}).get("stores") or []
          for store in stores:
              print("FBS_SUPPLY_SYNC_STORE " + json.dumps({
                  key: store.get(key) for key in (
                      "client", "apiPages", "apiSupplies", "suppliesWritten",
                      "preservedNotReturned", "preservedDuplicateRows",
                      "orderRowsChecked", "orderRowsMatched",
                      "orderSupplyIdsNotInCurrentApi", "sortedBackfilled"
                  )
              }, ensure_ascii=False, separators=(",", ":")))
          print("FBS_SUPPLY_SYNC_OK stores=" + str(len(stores)))
          PY
