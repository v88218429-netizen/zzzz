name: WB FBS supply sync via GitHub

on:
  push:
    branches: [mainggg]
    paths:
      - "wb_os/apps_script/WB_FBS_SUPPLY_DIRECT.gs"
  schedule:
    - cron: "57 */3 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: wb-fbs-data-mutations
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GOOGLE_BRIDGE_KEY: ${{ secrets.SELLMONITOR_GITHUB_WEBHOOK_SECRET }}
      GOOGLE_BRIDGE_URL: https://script.google.com/macros/s/AKfycbyU_OXpFYqvBx0KDuGCgEHsnzkts_fnJzVe8DM8crRDD1A_fr5DqOfVfW_PYJriaXU_jw/exec
    steps:
      - name: Wait for the matching Apps Script deployment
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys, time, urllib.request
          repository = os.environ['REPOSITORY']
          commit = os.environ['COMMIT_SHA']
          url = 'https://api.github.com/repos/' + repository + '/actions/runs?per_page=100'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'Accept': 'application/vnd.github+json',
                     'X-GitHub-Api-Version': '2022-11-28'}
          for _ in range(90):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as response:
                  runs = json.load(response).get('workflow_runs', [])
              matches = [run for run in runs
                         if run.get('name') == 'Sellmonitor GitHub worker deploy'
                         and run.get('head_sha') == commit]
              if matches:
                  run = max(matches, key=lambda item: item.get('run_number', 0))
                  if run.get('status') == 'completed':
                      if run.get('conclusion') == 'success':
                          print('FBS_SUPPLY_DEPLOY_CONFIRMED=' + run.get('html_url', ''))
                          sys.exit(0)
                      raise SystemExit('FBS_SUPPLY_DEPLOY_FAILED:' + str(run.get('conclusion')))
              time.sleep(10)
          raise SystemExit('FBS_SUPPLY_DEPLOY_WAIT_TIMEOUT')
          PY
      - name: Reconcile supply lists and order timings
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GOOGLE_BRIDGE_KEY"
          python - <<'PY'
          import json, os, sys, time, urllib.request
          payload = json.dumps({
              "action": "fbs_supply_sync",
              "key": os.environ["GOOGLE_BRIDGE_KEY"],
          }).encode("utf-8")
          expected = {"SANYCH", "AIR", "HOZYAYUSHKA"}
          seen = {}
          failures = []
          for attempt in range(1, 61):
              request = urllib.request.Request(
                  os.environ["GOOGLE_BRIDGE_URL"],
                  data=payload,
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=420) as response:
                      result = json.loads(response.read().decode("utf-8"))
              except Exception as error:
                  print("FBS_SUPPLY_SYNC_RETRY attempt=" + str(attempt) +
                        " type=" + type(error).__name__, flush=True)
                  if attempt < 60:
                      time.sleep(60)
                      continue
                  failures.append("NO_VALID_RESPONSE")
                  break
              if result.get("ok") is not True:
                  details = json.dumps(result, ensure_ascii=False, separators=(",", ":"))
                  print("FBS_SUPPLY_SYNC_RESPONSE_ERROR " + details, flush=True)
                  if "already running" in details.lower() or "credential store is busy" in details.lower():
                      if attempt < 60:
                          time.sleep(75)
                          continue
                  failures.append("BRIDGE_REJECTED")
                  break
              stores = (result.get("result") or {}).get("stores") or []
              if len(stores) != 1:
                  print("FBS_SUPPLY_SYNC_INVALID_STORE_COUNT=" + str(len(stores)), flush=True)
                  failures.append("EXPECTED_ONE_STORE_PER_CALL")
                  break
              store = stores[0]
              client = str(store.get("client") or "")
              if client not in expected:
                  print("FBS_SUPPLY_SYNC_UNKNOWN_CLIENT=" + client, flush=True)
                  failures.append("UNKNOWN_CLIENT")
                  break
              if store.get("ok") is not True:
                  summary = {key: store.get(key) for key in ("client", "error")}
                  print("FBS_SUPPLY_SYNC_STORE_FAILED " +
                        json.dumps(summary, ensure_ascii=False, separators=(",", ":")), flush=True)
                  failures.append(client)
                  break
              complete = store.get("backfillComplete") is True
              if complete:
                  seen[client] = True
              print("FBS_SUPPLY_SYNC_STORE " + json.dumps({
                  key: store.get(key) for key in (
                      "client", "apiPages", "apiSupplies", "suppliesWritten",
                      "preservedNotReturned", "preservedDuplicateRows",
                      "orderRowsChecked", "orderRowsMatched",
                      "orderSupplyIdsNotInCurrentApi", "sortedBackfilled"
                  )
              }, ensure_ascii=False, separators=(",", ":")), flush=True)
              if complete:
                  print("FBS_SUPPLY_BACKFILL_COMPLETE client=" + client, flush=True)
              else:
                  print("FBS_SUPPLY_BACKFILL_CONTINUE client=" + client +
                        " next_row=" + str(store.get("backfillStartRow")) +
                        " processed=" + str(store.get("orderRowsChecked")), flush=True)
              if set(seen) == expected:
                  break
          missing = sorted(expected - set(seen))
          if failures or missing:
              print("FBS_SUPPLY_SYNC_INCOMPLETE missing=" + ",".join(missing), flush=True)
              sys.exit(1)
          print("FBS_SUPPLY_SYNC_OK stores=" + str(len(seen)))
          PY
