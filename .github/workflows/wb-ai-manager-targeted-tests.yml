name: WB optimizer targeted tests

on:
  pull_request:
    branches:
      - mainggg
    paths:
      - "wb_ai_manager/source/**"
      - "sellmonitor_github_worker/**"
      - ".github/workflows/wb-ai-manager-targeted-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wb-optimizer-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: wb_ai_manager/source/requirements.txt

      - name: Install the application and test tools
        working-directory: wb_ai_manager/source
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ".[dev]" --no-deps

      - name: Check optimizer acceptance, portfolio mapping, and campaign diagnostics
        working-directory: wb_ai_manager/source
        run: |
          python -m pytest -q \
            tests/test_optimizer_acceptance.py \
            tests/test_portfolio.py \
            tests/test_advertising_sweep.py
