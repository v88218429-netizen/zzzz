name: WB AI Manager live inspect

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mainggg
          fetch-depth: 1
      - name: Inspect GitHub-only runtime health
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin runtime-state:refs/remotes/origin/runtime-state
          git show origin/runtime-state:state/health.json | python -m json.tool
