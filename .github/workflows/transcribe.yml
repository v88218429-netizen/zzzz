name: Transcribe videos

on:
  push:
    paths:
      - 'requests/**.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
      YTDLP_PROXY: ${{ secrets.YTDLP_PROXY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install lightweight tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install yt-dlp

      - name: Run primary transcriber
        id: primary
        continue-on-error: true
        run: python transcribe.py

      - name: Run no-key YouTube transcript fallback
        run: python youtube_public_fallback.py

      - name: Commit generated results
        if: always()
        run: |
          git config user.name "video-transcriber-bot"
          git config user.email "actions@users.noreply.github.com"
          git add transcripts/ collections/ processed/
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Add generated video transcripts"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
