name: Ozon Radar Server CI

on:
  push:
    branches: [mainggg]
    paths:
      - "ozon_radar_server/**"
      - ".github/workflows/ozon-radar-server-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ozon_radar_server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile server.py

      - name: Check residential proxy channel
        shell: bash
        env:
          OZON_PROXY_PROVIDER: decodo
          OZON_PROXY_HOST: gate.decodo.com
          OZON_PROXY_PORT: "7000"
          OZON_PROXY_USER: ${{ secrets.OZON_PROXY_USER }}
          OZON_PROXY_PASS: ${{ secrets.OZON_PROXY_PASS }}
        run: |
          set +e
          if [ -z "$OZON_PROXY_USER" ] || [ -z "$OZON_PROXY_PASS" ]; then
            echo "PROXY_SECRETS_PRESENT=no"
            exit 0
          fi
          echo "PROXY_SECRETS_PRESENT=yes"
          cd ..
          pip install -q -r ozon_live/requirements.txt
          python ozon_live/proxy_preflight.py
          echo "PROXY_PREFLIGHT_RC=$?"

      - name: Live Ozon storefront HTTP probe
        run: |
          python - <<'PY'
          from server import OzonClient
          c = OzonClient()
          try:
              r = c.position("лопата садовая", "5094364543", 30)
              print("LIVE_PROBE_OK", r)
          except Exception as e:
              print("LIVE_PROBE_ERROR", type(e).__name__, str(e))
          PY

      - name: Live Ozon Chrome probe
        shell: bash
        run: |
          set +e
          google-chrome --version || true
          URL='https://www.ozon.ru/search/?text=%D0%BB%D0%BE%D0%BF%D0%B0%D1%82%D0%B0%20%D1%81%D0%B0%D0%B4%D0%BE%D0%B2%D0%B0%D1%8F&from_global=true'
          timeout 45s google-chrome \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-blink-features=AutomationControlled \
            --lang=ru-RU \
            --user-agent='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36' \
            --dump-dom "$URL" > /tmp/ozon-chrome.html 2>/tmp/ozon-chrome.err
          RC=$?
          echo "CHROME_RC=$RC"
          echo "PRODUCT_LINKS=$(grep -o '/product/' /tmp/ozon-chrome.html | wc -l | tr -d ' ')"
          echo "BLOCK_MARKERS=$(grep -Eio 'доступ ограничен|access denied|captcha|похоже, нет соединения' /tmp/ozon-chrome.html | head -10 | tr '\n' ' ' || true)"
          echo '--- body sample ---'
          sed -n '1,20p' /tmp/ozon-chrome.html | head -c 3000 || true
          echo
          echo '--- chrome stderr ---'
          tail -30 /tmp/ozon-chrome.err || true

      - name: Live Ozon mobile-web API probe
        shell: bash
        run: |
          set +e
          cd ..
          python ozon_web/probe.py
          RC=$?
          echo "MOBILE_PROBE_RC=$RC"
          cat ozon_web/results/latest.json | head -c 12000 || true
          echo

      - name: Start service
        env:
          RADAR_SECRET: ci-secret
          RADAR_TASKS_JSON: '{"tasks":[{"article":"test","sku":"5094364543","query":"лопата садовая","interval_min":60,"drop_threshold":3,"top_boundary":10,"max_position":20,"baseline_position":7}]}'
        run: |
          uvicorn server:app --host 127.0.0.1 --port 8080 > /tmp/ozon-radar.log 2>&1 &
          echo $! > /tmp/ozon-radar.pid
          sleep 3
          curl -fsS http://127.0.0.1:8080/health
          curl -fsS -H 'Authorization: Bearer ci-secret' http://127.0.0.1:8080/state
          curl -fsS -X POST \
            -H 'Authorization: Bearer ci-secret' \
            -H 'Content-Type: application/json' \
            -d '{"query":"лопата садовая","sku":"5094364543","max_position":20}' \
            http://127.0.0.1:8080/probe

      - name: Show service log
        if: always()
        run: cat /tmp/ozon-radar.log || true
