name: WB FBS Sanych targeted recovery

on:
  push:
    branches: [mainggg]
    paths:
      - "wb_worker/sanych_fbs_recovery.py"
  workflow_dispatch:
    inputs:
      start_date:
        description: "Начало периода UTC, YYYY-MM-DD"
        required: true
        type: string
      end_date:
        description: "Конец периода UTC, YYYY-MM-DD"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: wb-fbs-google-adapter
  cancel-in-progress: false

jobs:
  recover:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[FBS-90D-SLICED]') }}
    name: "recover SANYCH ${{ matrix.start_date }}–${{ matrix.end_date }}"
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
        - slice: 1
          start_date: "2026-07-30"
          end_date: "2026-08-05"
        - slice: 2
          start_date: "2026-08-06"
          end_date: "2026-08-12"
        - slice: 3
          start_date: "2026-08-13"
          end_date: "2026-08-19"
        - slice: 4
          start_date: "2026-08-20"
          end_date: "2026-08-26"
        - slice: 5
          start_date: "2026-08-27"
          end_date: "2026-09-02"
        - slice: 6
          start_date: "2026-09-03"
          end_date: "2026-09-09"
        - slice: 7
          start_date: "2026-09-10"
          end_date: "2026-09-16"
        - slice: 8
          start_date: "2026-09-17"
          end_date: "2026-09-23"
        - slice: 9
          start_date: "2026-09-24"
          end_date: "2026-09-30"
        - slice: 10
          start_date: "2026-10-01"
          end_date: "2026-10-07"
        - slice: 11
          start_date: "2026-10-08"
          end_date: "2026-10-14"
        - slice: 12
          start_date: "2026-10-15"
          end_date: "2026-10-21"
        - slice: 13
          start_date: "2026-10-22"
          end_date: "2026-10-27"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FBS_CLIENT: SANYCH
      WB_API_TOKEN_AP: ${{ secrets.WB_API_TOKEN_AP }}
      GOOGLE_BRIDGE_KEY: ${{ secrets.SELLMONITOR_GITHUB_WEBHOOK_SECRET }}
      GOOGLE_BRIDGE_URL: https://script.google.com/macros/s/AKfycbyU_OXpFYqvBx0KDuGCgEHsnzkts_fnJzVe8DM8crRDD1A_fr5DqOfVfW_PYJriaXU_jw/exec
      FBS_START_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.start_date || matrix.start_date }}
      FBS_END_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.end_date || matrix.end_date }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check source and credentials
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile wb_worker/sanych_fbs_recovery.py
          test -n "$GOOGLE_BRIDGE_KEY"
          test -n "$WB_API_TOKEN_AP"
          if [[ ${#WB_API_TOKEN_AP} -lt 30 ]]; then
            echo "SANYCH_WB_TOKEN_MISSING"
            exit 2
          fi
      - name: Reconcile SANYCH from WB to its production FBS book
        shell: bash
        run: python wb_worker/sanych_fbs_recovery.py
  recover_manual:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: "recover SANYCH manual range"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FBS_CLIENT: SANYCH
      WB_API_TOKEN_AP: ${{ secrets.WB_API_TOKEN_AP }}
      GOOGLE_BRIDGE_KEY: ${{ secrets.SELLMONITOR_GITHUB_WEBHOOK_SECRET }}
      GOOGLE_BRIDGE_URL: https://script.google.com/macros/s/AKfycbyU_OXpFYqvBx0KDuGCgEHsnzkts_fnJzVe8DM8crRDD1A_fr5DqOfVfW_PYJriaXU_jw/exec
      FBS_START_DATE: ${{ inputs.start_date }}
      FBS_END_DATE: ${{ inputs.end_date }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check source and credentials
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile wb_worker/sanych_fbs_recovery.py
          test -n "$GOOGLE_BRIDGE_KEY"
          test -n "$WB_API_TOKEN_AP"
      - name: Reconcile SANYCH manual range
        shell: bash
        run: python wb_worker/sanych_fbs_recovery.py
