name: WB FBS Sanych targeted recovery

on:
  schedule:
    - cron: "17 */3 * * *"
  push:
    branches: [mainggg]
    paths:
      - "wb_worker/sanych_fbs_recovery.py"
      - ".github/workflows/wb-fbs-sanych-targeted-recovery.yml"
  workflow_dispatch:
    inputs:
      start_date:
        description: "Начало периода UTC, YYYY-MM-DD"
        required: true
        type: string
      end_date:
        description: "Конец периода UTC, YYYY-MM-DD"
        required: true
        type: string
      include_live:
        description: "Добавить текущие активные заказы WB к сверке"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: wb-fbs-data-mutations
  cancel-in-progress: false

jobs:
  recover:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[FBS-90D-SLICED]') }}
    name: "recover SANYCH ${{ matrix.start_date }}–${{ matrix.end_date }}"
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
        - slice: 1
          start_date: "2026-07-30"
          end_date: "2026-08-04"
        - slice: 2
          start_date: "2026-08-05"
          end_date: "2026-08-11"
        - slice: 3
          start_date: "2026-08-12"
          end_date: "2026-08-18"
        - slice: 4
          start_date: "2026-08-19"
          end_date: "2026-08-25"
        - slice: 5
          start_date: "2026-08-26"
          end_date: "2026-09-01"
        - slice: 6
          start_date: "2026-09-02"
          end_date: "2026-09-08"
        - slice: 7
          start_date: "2026-09-09"
          end_date: "2026-09-15"
        - slice: 8
          start_date: "2026-09-16"
          end_date: "2026-09-22"
        - slice: 9
          start_date: "2026-09-23"
          end_date: "2026-09-29"
        - slice: 10
          start_date: "2026-09-30"
          end_date: "2026-10-06"
        - slice: 11
          start_date: "2026-10-07"
          end_date: "2026-10-13"
        - slice: 12
          start_date: "2026-10-14"
          end_date: "2026-10-20"
        - slice: 13
          start_date: "2026-10-21"
          end_date: "2026-10-27"
        - slice: 14
          start_date: "2026-10-28"
          end_date: "2026-10-30"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FBS_CLIENT: SANYCH
      FBS_INCLUDE_LIVE: "false"
      FBS_BATCH_SIZE: "100"
      WB_API_TOKEN_AP: ${{ secrets.WB_API_TOKEN_AP }}
      GOOGLE_BRIDGE_KEY: ${{ secrets.SELLMONITOR_GITHUB_WEBHOOK_SECRET }}
      GOOGLE_BRIDGE_URL: https://script.google.com/macros/s/AKfycbyU_OXpFYqvBx0KDuGCgEHsnzkts_fnJzVe8DM8crRDD1A_fr5DqOfVfW_PYJriaXU_jw/exec
      FBS_START_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.start_date || matrix.start_date }}
      FBS_END_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.end_date || matrix.end_date }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check source and credentials
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile wb_worker/sanych_fbs_recovery.py
          test -n "$GOOGLE_BRIDGE_KEY"
          test -n "$WB_API_TOKEN_AP"
          if [[ ${#WB_API_TOKEN_AP} -lt 30 ]]; then
            echo "SANYCH_WB_TOKEN_MISSING"
            exit 2
          fi
      - name: Reconcile SANYCH from WB to its production FBS book
        shell: bash
        run: python wb_worker/sanych_fbs_recovery.py
  recover_manual:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: "recover SANYCH manual range"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FBS_CLIENT: SANYCH
      WB_API_TOKEN_AP: ${{ secrets.WB_API_TOKEN_AP }}
      GOOGLE_BRIDGE_KEY: ${{ secrets.SELLMONITOR_GITHUB_WEBHOOK_SECRET }}
      GOOGLE_BRIDGE_URL: https://script.google.com/macros/s/AKfycbyU_OXpFYqvBx0KDuGCgEHsnzkts_fnJzVe8DM8crRDD1A_fr5DqOfVfW_PYJriaXU_jw/exec
      FBS_START_DATE: ${{ inputs.start_date }}
      FBS_END_DATE: ${{ inputs.end_date }}
      FBS_BATCH_SIZE: "50"
      FBS_LOOKBACK_DAYS: "3"
      FBS_INCLUDE_LIVE: ${{ inputs.include_live }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check source and credentials
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile wb_worker/sanych_fbs_recovery.py
          test -n "$GOOGLE_BRIDGE_KEY"
          test -n "$WB_API_TOKEN_AP"
      - name: Reconcile SANYCH manual range
        shell: bash
        run: python wb_worker/sanych_fbs_recovery.py

  recover_scheduled:
    if: ${{ github.event_name == 'schedule' }}
    name: "scheduled SANYCH FBS refresh"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FBS_CLIENT: SANYCH
      WB_API_TOKEN_AP: ${{ secrets.WB_API_TOKEN_AP }}
      GOOGLE_BRIDGE_KEY: ${{ secrets.SELLMONITOR_GITHUB_WEBHOOK_SECRET }}
      GOOGLE_BRIDGE_URL: https://script.google.com/macros/s/AKfycbyU_OXpFYqvBx0KDuGCgEHsnzkts_fnJzVe8DM8crRDD1A_fr5DqOfVfW_PYJriaXU_jw/exec
      FBS_LOOKBACK_DAYS: "3"
      FBS_BATCH_SIZE: "50"
      FBS_INCLUDE_LIVE: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check source and credentials
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile wb_worker/sanych_fbs_recovery.py
          test -n "$GOOGLE_BRIDGE_KEY"
          test -n "$WB_API_TOKEN_AP"
          if [[ ${#WB_API_TOKEN_AP} -lt 30 ]]; then
            echo "SANYCH_WB_TOKEN_MISSING"
            exit 2
          fi
      - name: Refresh the latest SANYCH orders and statuses
        shell: bash
        run: python wb_worker/sanych_fbs_recovery.py
