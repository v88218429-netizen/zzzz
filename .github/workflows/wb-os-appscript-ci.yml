name: WB OS Apps Script CI

on:
  push:
    branches: [mainggg]
    paths:
      - "wb_os/apps_script/**"
      - ".github/workflows/wb-os-appscript-ci.yml"
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check Apps Script sources
        shell: bash
        run: |
          set -euo pipefail
          COUNT=0
          while IFS= read -r -d '' f; do
            TMP="$(mktemp --suffix=.js)"
            cp "$f" "$TMP"
            node --check "$TMP"
            rm -f "$TMP"
            COUNT=$((COUNT+1))
          done < <(find wb_os/apps_script -type f \( -name '*.gs' -o -name '*.js' \) -print0)
          test "$COUNT" -gt 0
          echo "Syntax OK: $COUNT Apps Script files"
