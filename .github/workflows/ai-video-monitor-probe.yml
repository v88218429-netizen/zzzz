name: AI Video Monitor connectivity probe
on:
  workflow_dispatch:
permissions:
  contents: read
  models: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet google-auth requests
      - run: python ai_video_monitor_probe.py
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          GITHUB_TOKEN: ${{ github.token }}
