      - name: Verify protected bridge auth
        if: github.event_name != 'push' || !contains(fromJSON('["Run Ozon export continuation via GitHub","Diagnose Ozon export status via GitHub"]'), github.event.head_commit.message)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request

          url=f"https://script.google.com/macros/s/{os.environ['WEBAPP_DEPLOYMENT_ID']}/exec"
          body=json.dumps({"token":os.environ["WEBHOOK_SECRET"],"action":"health"}).encode()
          last=None
          health=None
          for attempt in range(1,9):
              req=urllib.request.Request(url,data=body,headers={"Content-Type":"application/json"},method="POST")
              try:
                  with urllib.request.urlopen(req,timeout=120) as r:
                      obj=json.loads(r.read().decode("utf-8"))
                  last=obj
                  if obj.get("ok") is True and obj.get("action")=="health":
                      candidate=obj.get("result") or {}
                      if candidate.get("version")==os.environ["EXPECTED_WORKER_VERSION"]:
                          health=candidate
                          break
                      last="WORKER_VERSION_PROPAGATION:" + str(candidate.get("version"))
                      print(f"WORKER_VERSION_WAIT attempt={attempt}/8 observed={candidate.get('version')}")
                  elif obj.get("error")=="UNAUTHORIZED":
                      last="UNAUTHORIZED during Apps Script deployment propagation"
                  else:
                      raise AssertionError(obj)
              except urllib.error.HTTPError as exc:
                  last=f"HTTP {exc.code}"
                  if exc.code not in {404,408,429,500,502,503,504}:
                      raise
              except (urllib.error.URLError, TimeoutError) as exc:
                  last=str(exc)
              if attempt < 8:
                  print(f"PROTECTED_BRIDGE_WAIT attempt={attempt}/8 reason={last}")
                  time.sleep(10)
          if health is None or health.get("version")!=os.environ["EXPECTED_WORKER_VERSION"]:
              raise AssertionError(last)
          if health.get("trigger_ok") is not True:
              raise AssertionError("TRIGGER_HEALTH_FAILED")
          print("PROTECTED_BRIDGE_AUTH=ok")
          print("WORKER_VERSION=" + str(health.get("version")))
          print("TRIGGER_OK=" + str(health.get("trigger_ok")))
          print("TRIGGER_COUNT=" + str(health.get("trigger_count")))
          print("PROJECT_TRIGGER_HANDLERS=" + ",".join(str(x) for x in (health.get("project_trigger_handlers") or [])))
          for client, stage in sorted((health.get("fbs_ingest_stages") or {}).items()):
              print("FBS_STAGE=" + str(client) + "," + str(stage.get("stage")) + ",elapsed_ms=" + str(stage.get("elapsedMs")) + ",at=" + str(stage.get("at")))
          for client in health.get("clients") or []:
              print("CLIENT=" + str(client.get("store_id")) + ",status=" + str(client.get("status")) + ",last_seen=" + str(client.get("last_seen")))
          PY

