name: Sellmonitor GitHub worker deploy

on:
  push:
    branches: [mainggg]
    paths:
      - "sellmonitor_github_worker/SELLMONITOR_GITHUB_WORKER.gs"
      - "sellmonitor_github_worker/patch_master.py"
      - ".github/workflows/sellmonitor-github-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sellmonitor-github-worker-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SCRIPT_ID: "15tH3jwOa5hKJFahIyPX5AIXO7KRf1O4jusfDfPIdX6KeH_GqMUC71hNT"
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      WEBHOOK_SECRET: ${{ secrets.SELLMONITOR_GITHUB_WEBHOOK_SECRET }}
      WB_API_TOKEN_AP: ${{ secrets.WB_API_TOKEN_AP }}
      WB_API_TOKEN_AA: ${{ secrets.WB_API_TOKEN_AA }}
      WB_API_TOKEN_YV: ${{ secrets.WB_API_TOKEN_YV }}
      WEBAPP_DEPLOYMENT_ID: AKfycbyU_OXpFYqvBx0KDuGCgEHsnzkts_fnJzVe8DM8crRDD1A_fr5DqOfVfW_PYJriaXU_jw # also used by the WB FBS recovery workflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Require GitHub-hosted auth
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLASPRC_JSON"
          test -n "$WEBHOOK_SECRET"
          test -n "$WB_API_TOKEN_AP"
          test -n "$WB_API_TOKEN_AA"
          test -n "$WB_API_TOKEN_YV"
          test -n "$WEBAPP_DEPLOYMENT_ID"

      - name: Probe direct Google Sheets API access
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request
          cfg=json.loads(os.environ['CLASPRC_JSON'])
          settings=cfg.get('oauth2ClientSettings') or {}
          token=cfg.get('token') or {}
          form=urllib.parse.urlencode({
              'client_id':settings.get('clientId',''),
              'client_secret':settings.get('clientSecret',''),
              'refresh_token':token.get('refresh_token',''),
              'grant_type':'refresh_token'
          }).encode()
          try:
              req=urllib.request.Request('https://oauth2.googleapis.com/token',data=form,method='POST')
              with urllib.request.urlopen(req,timeout=30) as response:
                  auth=json.loads(response.read().decode())
              scopes=auth.get('scope','')
              print('DIRECT_SHEETS_TOKEN_REFRESH=ok')
              print('DIRECT_SHEETS_SCOPE_PRESENT=' + str('https://www.googleapis.com/auth/spreadsheets' in scopes))
              sheet='1qJvhEOIku7sOMydfrUz0PR5dkcU0sLjv433pa1MFBcM'
              url='https://sheets.googleapis.com/v4/spreadsheets/'+sheet+'?fields=spreadsheetId,properties.title'
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+auth['access_token']})
              with urllib.request.urlopen(req,timeout=30) as response:
                  obj=json.loads(response.read().decode())
              print('DIRECT_SHEETS_READ=ok')
              print('DIRECT_SHEETS_TITLE=' + str((obj.get('properties') or {}).get('title','')))
          except urllib.error.HTTPError as exc:
              detail=exc.read().decode('utf-8','replace')[:300].replace('\n',' ')
              print('DIRECT_SHEETS_READ=no')
              print('DIRECT_SHEETS_ERROR=' + str(exc.code) + ':' + detail)
          except Exception as exc:
              print('DIRECT_SHEETS_PROBE_ERROR=' + type(exc).__name__ + ':' + str(exc)[:180])
          PY

      - name: Install clasp and auth
        shell: bash
        run: |
          set -euo pipefail
          npm install -g @google/clasp
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"

      - name: Pull authorized adapter project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/sellmonitor-gh-worker
          mkdir -p /tmp/sellmonitor-gh-worker
          printf '{"scriptId":"%s","rootDir":"."}\n' "$SCRIPT_ID" > /tmp/sellmonitor-gh-worker/.clasp.json
          cd /tmp/sellmonitor-gh-worker
          clasp pull
          test -f appsscript.json
          mkdir -p /tmp/sellmonitor-gh-live
          cp appsscript.json /tmp/sellmonitor-gh-live/appsscript.json
          if [ -f SELLMONITOR_GITHUB_WORKER.gs ]; then
            cp SELLMONITOR_GITHUB_WORKER.gs /tmp/sellmonitor-gh-live/live-worker
            echo "gs" > /tmp/sellmonitor-gh-live/worker-extension
          elif [ -f SELLMONITOR_GITHUB_WORKER.js ]; then
            cp SELLMONITOR_GITHUB_WORKER.js /tmp/sellmonitor-gh-live/live-worker
            echo "js" > /tmp/sellmonitor-gh-live/worker-extension
          else
            echo "LIVE_WORKER_FILE_MISSING"
            exit 1
          fi
          python - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path("/tmp/sellmonitor-gh-worker")
          suffixes={".gs",".js",".ts",".html",".json"}
          baseline={}
          for p in root.rglob("*"):
              if p.is_file() and p.suffix in suffixes:
                  baseline[str(p.relative_to(root))]=hashlib.sha256(p.read_bytes()).hexdigest()
          pathlib.Path("/tmp/sellmonitor-gh-live/baseline.json").write_text(json.dumps(baseline))
          print("LIVE_PROJECT_BASELINE_FILES=" + str(len(baseline)))
          PY

      - name: Install worker and master hook
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/sellmonitor-gh-worker/SELLMONITOR_GITHUB_WORKER.js /tmp/sellmonitor-gh-worker/SELLMONITOR_GITHUB_WORKER.gs
          cp sellmonitor_github_worker/SELLMONITOR_GITHUB_WORKER.gs /tmp/sellmonitor-gh-worker/SELLMONITOR_GITHUB_WORKER.gs
          python - <<'PY'
          import hashlib, json, os, pathlib
          root=pathlib.Path('/tmp/sellmonitor-gh-worker')
          p=root/'SELLMONITOR_GITHUB_WORKER.gs'
          s=p.read_text(encoding='utf-8')
          marker='__SELLMONITOR_GITHUB_WEBHOOK_SECRET_SHA256__'
          if marker not in s:
              raise SystemExit('webhook hash placeholder missing')
          digest=hashlib.sha256(os.environ['WEBHOOK_SECRET'].encode('utf-8')).hexdigest()
          p.write_text(s.replace(marker, digest), encoding='utf-8')
          m=root/'appsscript.json'
          obj=json.loads(m.read_text(encoding='utf-8'))
          obj['webapp']={'executeAs':'USER_DEPLOYING','access':'ANYONE_ANONYMOUS'}
          obj['executionApi']={'access':'MYSELF'}
          dependencies=obj.setdefault('dependencies',{})
          services=dependencies.setdefault('enabledAdvancedServices',[])
          if not any(x.get('serviceId')=='sheets' for x in services):
              services.append({'userSymbol':'Sheets','serviceId':'sheets','version':'v4'})
          m.write_text(json.dumps(obj, ensure_ascii=False, indent=2), encoding='utf-8')
          match=__import__('re').search(r"VERSION:\s*'([^']+)'", s)
          if not match:
              raise SystemExit('worker version missing')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write('EXPECTED_WORKER_VERSION=' + match.group(1) + '\n')
          PY
          python sellmonitor_github_worker/patch_master.py /tmp/sellmonitor-gh-worker

      - name: Syntax check full live project
        shell: bash
        run: |
          set -euo pipefail
          COUNT=0
          while IFS= read -r -d '' f; do
            T="$(mktemp --suffix=.js)"
            cp "$f" "$T"
            node --check "$T"
            rm -f "$T"
            COUNT=$((COUNT+1))
          done < <(find /tmp/sellmonitor-gh-worker -type f \( -name '*.gs' -o -name '*.js' \) -print0)
          test "$COUNT" -gt 0
          echo "SYNTAX_OK=$COUNT"

      - name: Read-only Ozon continuation diagnostic
        if: github.event_name == 'push' && github.event.head_commit.message == 'Diagnose Ozon export status via GitHub'
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/sellmonitor-gh-worker
          live=/tmp/sellmonitor-gh-live
          rm -f "$root/SELLMONITOR_GITHUB_WORKER.gs" "$root/SELLMONITOR_GITHUB_WORKER.js"
          ext="$(cat "$live/worker-extension")"
          cp "$live/live-worker" "$root/SELLMONITOR_GITHUB_WORKER.$ext"
          cp "$live/appsscript.json" "$root/appsscript.json"
          python - <<'PY'
          import hashlib, json, pathlib, sys
          root=pathlib.Path("/tmp/sellmonitor-gh-worker")
          baseline=json.loads(pathlib.Path("/tmp/sellmonitor-gh-live/baseline.json").read_text())
          suffixes={".gs",".js",".ts",".html",".json"}
          current={}
          for p in root.rglob("*"):
              if p.is_file() and p.suffix in suffixes:
                  current[str(p.relative_to(root))]=hashlib.sha256(p.read_bytes()).hexdigest()
          changed=sorted(p for p,h in baseline.items() if current.get(p)!=h)
          changed += sorted(p for p in current if p not in baseline)
          marker="SELLMONITOR_OZON_EXPORT_DIAGNOSTIC_V1"
          masters=[p for p in root.rglob("*") if p.is_file() and p.suffix in (".gs",".js") and marker in p.read_text(errors="ignore")]
          if len(changed)>1 or (changed and not changed[0].endswith(("Код.js","Code.js"))):
              print("DIAGNOSTIC_PUSH_CHANGED_FILES=" + ",".join(changed))
              raise SystemExit("DIAGNOSTIC_PUSH_SCOPE_CHECK_FAILED")
          if len(masters)!=1:
              raise SystemExit("OZON_DIAGNOSTIC_SOURCE_MISSING")
          pathlib.Path("/tmp/ozon-diagnostic-needs-push").write_text("1" if changed else "0")
          print("DIAGNOSTIC_PUSH_CHANGED_FILES=" + (changed[0] if changed else "already_present"))
          PY
          cd "$root"
          if [ "$(cat /tmp/ozon-diagnostic-needs-push)" = "1" ]; then
            clasp push -f
          else
            echo "OZON_DIAGNOSTIC_PUSH=already_present"
          fi
          python - <<'PY'
          import json, os, urllib.request
          url="https://script.google.com/macros/s/"+os.environ["WEBAPP_DEPLOYMENT_ID"]+"/exec"
          body=json.dumps({"token":os.environ["WEBHOOK_SECRET"],"action":"health"}).encode()
          req=urllib.request.Request(url,data=body,headers={"Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(req,timeout=120) as response:
              health=json.loads(response.read().decode("utf-8"))
          if health.get("ok") is not True:
              raise SystemExit("OZON_WORKER_HEALTH_READ_FAILED")
          result=health.get("result") or {}
          handlers=result.get("project_trigger_handlers") or []
          print("OZON_WORKER_HEALTH_VERSION="+str(result.get("version") or ""))
          print("OZON_WORKER_TRIGGER_OK="+str(result.get("trigger_ok")))
          print("OZON_PROJECT_HAS_EXPORT_CONTINUATION="+str("exportDOM_continue" in handlers))
          print("OZON_PROJECT_TRIGGER_HANDLERS="+",".join(str(x) for x in handlers if "exportDOM" in str(x) or "Marketplace" in str(x)))
          PY
          set +e
          clasp logs --json >/tmp/ozon-apps-script-logs.json 2>/tmp/ozon-apps-script-logs.stderr
          log_status=$?
          set -e
          echo "OZON_APPS_SCRIPT_LOGS_EXIT=$log_status"
          python - <<'PY'
          import json, pathlib, re
          raw=pathlib.Path("/tmp/ozon-apps-script-logs.json").read_text(errors="replace").strip()
          print("OZON_APPS_SCRIPT_LOGS_BYTES="+str(len(raw)))
          try:
              payload=json.loads(raw)
          except Exception:
              safe=re.sub(r"[A-Za-z0-9_-]{32,}","[ID_REDACTED]",raw)
              print("OZON_APPS_SCRIPT_LOGS_RESPONSE="+safe[:180].replace("\\n"," "))
              raise SystemExit(0)
          items=payload if isinstance(payload,list) else payload.get("entries",payload.get("results",[]))
          selected=[]
          for item in items if isinstance(items,list) else []:
              text=json.dumps(item,ensure_ascii=False)
              if any(term.lower() in text.lower() for term in ("exportDOM_continue","OZON_FBS","dom.job","ошибк")):
                  safe=re.sub(r"(?i)(token|secret|authorization)\\s*[:=]\\s*\\S+",r"\\1=[REDACTED]",text)
                  safe=re.sub(r"[A-Za-z0-9_-]{32,}","[ID_REDACTED]",safe)
                  selected.append(safe[:320])
          print("OZON_APPS_SCRIPT_RELEVANT_LOGS="+str(len(selected)))
          for item in selected[-8:]:
              print("OZON_APPS_SCRIPT_LOG="+item)
          PY
          clasp pull
          python - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path("/tmp/sellmonitor-gh-worker")
          baseline=json.loads(pathlib.Path("/tmp/sellmonitor-gh-live/baseline.json").read_text())
          marker="SELLMONITOR_OZON_EXPORT_DIAGNOSTIC_V1"
          masters=[p for p in root.rglob("*") if p.is_file() and p.suffix in (".gs",".js") and marker in p.read_text(errors="ignore")]
          if len(masters)!=1:
              raise SystemExit("OZON_DIAGNOSTIC_SOURCE_READBACK_FAILED")
          suffixes={".gs",".js",".ts",".html",".json"}
          current={}
          for p in root.rglob("*"):
              if p.is_file() and p.suffix in suffixes:
                  current[str(p.relative_to(root))]=hashlib.sha256(p.read_bytes()).hexdigest()
          changed=sorted(p for p,h in baseline.items() if current.get(p)!=h)
          changed += sorted(p for p in current if p not in baseline)
          if len(changed)>1 or (changed and not changed[0].endswith(("Код.js","Code.js"))):
              raise SystemExit("OZON_DIAGNOSTIC_READBACK_SCOPE_FAILED")
          print("OZON_DIAGNOSTIC_SOURCE_READBACK=verified")
          print("OZON_DIAGNOSTIC_CHANGED_FILE=" + (changed[0] if changed else "already_present"))
          PY

      - name: Audit Apps Script version capacity
        if: github.event_name == 'push' && github.event.head_commit.message == 'Audit Apps Script version capacity'
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/sellmonitor-gh-worker
          version_log="$(mktemp)"
          deployment_log="$(mktemp)"
          clasp list-versions >"$version_log" 2>&1
          clasp list-deployments >"$deployment_log" 2>&1
          python - "$version_log" "$deployment_log" <<'PY'
          import pathlib, re, sys
          versions = pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines()
          deployments = pathlib.Path(sys.argv[2]).read_text(errors="replace").splitlines()
          numbers = [int(m.group(1)) for line in versions if (m := re.match(r"\s*(\d+)\s+-", line))]
          active = []
          for line in deployments:
              m = re.search(r"@\s*(\d+)", line) or re.search(r"version(?:Number)?\s*[:=]\s*(\d+)", line, re.I)
              if m:
                  active.append(int(m.group(1)))
          print("APPS_SCRIPT_VERSION_COUNT=" + str(len(numbers)))
          if numbers:
              print("APPS_SCRIPT_VERSION_RANGE=" + str(min(numbers)) + ".." + str(max(numbers)))
          print("APPS_SCRIPT_DEPLOYMENT_COUNT=" + str(len(active)))
          print("APPS_SCRIPT_ACTIVE_VERSION_REFERENCES=" + ",".join(map(str, sorted(set(active)))) if active else "APPS_SCRIPT_ACTIVE_VERSION_REFERENCES=unparsed_or_none")
          PY

      - name: Diagnose and resume Ozon continuation
        if: github.event_name == 'push' && github.event.head_commit.message == 'Run Ozon export continuation via GitHub'
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/sellmonitor-gh-worker
          python - <<'PY'
          import json, os, pathlib, subprocess, urllib.error, urllib.request

          source_file = None
          for path in pathlib.Path(".").rglob("*"):
              if path.suffix not in (".gs", ".js", ".ts"):
                  continue
              try:
                  content = path.read_text(encoding="utf-8")
              except Exception:
                  continue
              index = content.find("function exportDOM_continue")
              if index >= 0:
                  source_file = str(path)
                  snippet = content[index:index+800].replace(chr(10), " ")
                  print("OZON_CONTINUATION_SOURCE_FILE=" + source_file)
                  print("OZON_CONTINUATION_SOURCE_SNIPPET=" + snippet)
                  break
          if not source_file:
              print("OZON_CONTINUATION_SOURCE=not_found_in_project_files")

          proc = subprocess.run(
              ["clasp", "run", "exportDOM_continue", "--json"],
              stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True, check=False
          )
          raw = proc.stdout.lstrip(chr(0xfeff)).strip()
          parsed = None
          decoder = json.JSONDecoder()
          for offset, char in enumerate(raw):
              if char != "{":
                  continue
              try:
                  parsed, _ = decoder.raw_decode(raw, offset)
                  break
              except Exception:
                  continue
          if parsed is None:
              safe = raw.replace(os.environ.get("WEBHOOK_SECRET",""), "[REDACTED]")
              safe = __import__("re").sub(r"(?i)(token|secret|authorization)\\s*[:=]\\s*\\S+", r"\\1=[REDACTED]", safe)
              safe = __import__("re").sub(r"[A-Za-z0-9_-]{32,}", "[ID_REDACTED]", safe)
              print("OZON_DIAGNOSTIC_STDOUT_LENGTH=" + str(len(raw)))
              print("OZON_DIAGNOSTIC_STDOUT_PREFIX=" + safe[:220].replace(chr(10)," "))
              stderr = proc.stderr.strip()
              if stderr:
                  stderr = __import__("re").sub(r"[A-Za-z0-9_-]{32,}", "[ID_REDACTED]", stderr)
                  print("OZON_DIAGNOSTIC_STDERR_PREFIX=" + stderr[:220].replace(chr(10)," "))
              raise SystemExit("OZON_DIAGNOSTIC_RESPONSE_INVALID")
          if not isinstance(parsed, dict):
              raise SystemExit("OZON_DIAGNOSTIC_RESPONSE_NOT_OBJECT")
          error = parsed.get("error") or {}
          if error:
              print("OZON_DIAGNOSTIC_ERROR_CODE=" + str(error.get("code") or "unknown"))
              details = error.get("details") or []
              if details and isinstance(details[0], dict):
                  message = str(details[0].get("errorMessage") or "")
                  message = message.replace(os.environ.get("WEBHOOK_SECRET",""), "[REDACTED]")
                  message = __import__("re").sub(r"[A-Za-z0-9_-]{32,}", "[ID_REDACTED]", message)
                  print("OZON_DIAGNOSTIC_SCRIPT_ERROR=" + message.replace(chr(10)," ")[:240])
              raise SystemExit("OZON_DIAGNOSTIC_FUNCTION_FAILED")
          result = parsed.get("response", {}).get("result") if isinstance(parsed.get("response"), dict) else parsed
          if isinstance(result, str):
              try:
                  result = json.loads(result)
              except Exception:
                  pass
          if not isinstance(result, dict) or result.get("ok") is not True:
              print("OZON_DIAGNOSTIC_RESULT_TYPE=" + type(result).__name__)
              print("OZON_DIAGNOSTIC_RESULT_KEYS=" + ",".join(sorted(result.keys())[:15]) if isinstance(result,dict) else "OZON_DIAGNOSTIC_RESULT_KEYS=none")
              raise SystemExit("OZON_DIAGNOSTIC_RESULT_INVALID")
          print("OZON_EXPORT_JOB=" + str(result.get("job") or ""))
          print("OZON_EXPORT_IN_PROGRESS=" + str(result.get("in_progress") or ""))
          print("OZON_EXPORT_LAST_ATTEMPT_AT=" + str(result.get("last_attempt_at") or ""))
          print("OZON_CONTINUATION_PENDING=" + str(result.get("continuation_pending")))
          message = str(result.get("last_error") or "").replace(os.environ.get("WEBHOOK_SECRET",""), "[REDACTED]")
          message = __import__("re").sub(r"[A-Za-z0-9_-]{32,}", "[ID_REDACTED]", message)
          print("OZON_EXPORT_LAST_ERROR=" + message.replace(chr(10)," ")[:400])
          if proc.returncode:
              print("OZON_DIAGNOSTIC_EXIT=" + str(proc.returncode))
              raise SystemExit("OZON_DIAGNOSTIC_COMMAND_FAILED")

          url = "https://script.google.com/macros/s/" + os.environ["WEBAPP_DEPLOYMENT_ID"] + "/exec"
          payload = json.dumps({"token":os.environ["WEBHOOK_SECRET"],"action":"publish_ozon_summary_orders"}).encode()
          req = urllib.request.Request(url, data=payload, headers={"Content-Type":"application/json"}, method="POST")
          try:
              with urllib.request.urlopen(req, timeout=90) as response:
                  published = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as exc:
              print("OZON_PUBLICATION_HTTP_STATUS=" + str(exc.code))
              raise SystemExit("OZON_PUBLICATION_CHECK_FAILED")
          except urllib.error.URLError as exc:
              print("OZON_PUBLICATION_NETWORK_ERROR=" + type(exc.reason).__name__)
              raise SystemExit("OZON_PUBLICATION_CHECK_FAILED")
          if published.get("ok") is not True:
              state = str(published.get("source_status") or "").lower()
              print("OZON_EXPORT_STATE=" + ("running" if "выгрузка продолжается" in state else "no_success_yet"))
              raise SystemExit("OZON_SOURCE_EXPORT_NOT_VERIFIED")
          stores = published.get("stores") or []
          actual = {x.get("store") for x in stores if x.get("ok") is True and x.get("readback") is True}
          if actual != {"ДОМ", "Хозяюшка"}:
              raise SystemExit("OZON_SUMMARY_READBACK_ACCEPTANCE_FAILED")
          print("OZON_SOURCE_UPDATED=" + str(published.get("source_updated")))
          print("OZON_SOURCE_ROWS=" + str(published.get("source_rows")))
          for store in stores:
              print("OZON_STORE=" + str(store.get("store"))
                    + " SOURCE_ROWS=" + str(store.get("source_rows"))
                    + " PERIOD=" + str(store.get("source_min")) + ".." + str(store.get("source_max"))
                    + " DAILY_ROWS=" + str(store.get("daily_rows"))
                    + " SKU_ROWS=" + str(store.get("sku_rows"))
                    + " ARCHIVED_ROWS=" + str(store.get("archived_rows"))
                    + " READBACK=" + str(store.get("readback"))
                    + " SHA256=" + str(store.get("sha256")))
          PY


      - name: Push and redeploy stable adapter
        if: github.event_name != 'push' || !contains(fromJSON('["Run Ozon export continuation via GitHub","Diagnose Ozon export status via GitHub"]'), github.event.head_commit.message)
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/sellmonitor-gh-worker
          clasp push -f
          clasp redeploy "$WEBAPP_DEPLOYMENT_ID" -d "Sellmonitor GitHub Central Worker Web"

      - name: Verify protected bridge auth
        if: github.event_name != 'push' || !contains(fromJSON('["Run Ozon export continuation via GitHub","Diagnose Ozon export status via GitHub"]'), github.event.head_commit.message)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request

          url=f"https://script.google.com/macros/s/{os.environ['WEBAPP_DEPLOYMENT_ID']}/exec"
          body=json.dumps({"token":os.environ["WEBHOOK_SECRET"],"action":"health"}).encode()
          last=None
          health=None
          for attempt in range(1,9):
              req=urllib.request.Request(url,data=body,headers={"Content-Type":"application/json"},method="POST")
              try:
                  with urllib.request.urlopen(req,timeout=120) as r:
                      obj=json.loads(r.read().decode("utf-8"))
                  last=obj
                  if obj.get("ok") is True and obj.get("action")=="health":
                      candidate=obj.get("result") or {}
                      if candidate.get("version")==os.environ["EXPECTED_WORKER_VERSION"]:
                          health=candidate
                          break
                      last="WORKER_VERSION_PROPAGATION:" + str(candidate.get("version"))
                      print(f"WORKER_VERSION_WAIT attempt={attempt}/8 observed={candidate.get('version')}")
                  elif obj.get("error")=="UNAUTHORIZED":
                      last="UNAUTHORIZED during Apps Script deployment propagation"
                  else:
                      raise AssertionError(obj)
              except urllib.error.HTTPError as exc:
                  last=f"HTTP {exc.code}"
                  if exc.code not in {404,408,429,500,502,503,504}:
                      raise
              except (urllib.error.URLError, TimeoutError) as exc:
                  last=str(exc)
              if attempt < 8:
                  print(f"PROTECTED_BRIDGE_WAIT attempt={attempt}/8 reason={last}")
                  time.sleep(10)
          if health is None or health.get("version")!=os.environ["EXPECTED_WORKER_VERSION"]:
              raise AssertionError(last)
          if health.get("trigger_ok") is not True:
              raise AssertionError("TRIGGER_HEALTH_FAILED")
          print("PROTECTED_BRIDGE_AUTH=ok")
          print("WORKER_VERSION=" + str(health.get("version")))
          print("TRIGGER_OK=" + str(health.get("trigger_ok")))
          print("TRIGGER_COUNT=" + str(health.get("trigger_count")))
          print("PROJECT_TRIGGER_HANDLERS=" + ",".join(str(x) for x in (health.get("project_trigger_handlers") or [])))
          for client, stage in sorted((health.get("fbs_ingest_stages") or {}).items()):
              print("FBS_STAGE=" + str(client) + "," + str(stage.get("stage")) + ",elapsed_ms=" + str(stage.get("elapsedMs")) + ",at=" + str(stage.get("at")))
          for client in health.get("clients") or []:
              print("CLIENT=" + str(client.get("store_id")) + ",status=" + str(client.get("status")) + ",last_seen=" + str(client.get("last_seen")))
          PY

