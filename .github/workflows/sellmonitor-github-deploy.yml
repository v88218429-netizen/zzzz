      - name: Run one authenticated worker tick
        if: github.event_name != 'push' # Scheduled separately; avoid lock contention on code pushes.["Run Ozon export continuation via GitHub","Diagnose Ozon export status via GitHub","Repair and resume Ozon export via GitHub"]'), github.event.head_commit.message)
        id: operational_tick
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request

          url=f"https://script.google.com/macros/s/{os.environ['WEBAPP_DEPLOYMENT_ID']}/exec"
          body=json.dumps({"token":os.environ["WEBHOOK_SECRET"],"action":"tick"}).encode()
          last=None
          busy_count=0
          for attempt in range(1,9):
              req=urllib.request.Request(url,data=body,headers={"Content-Type":"application/json"},method="POST")
              try:
                  with urllib.request.urlopen(req,timeout=180) as r:
                      obj=json.loads(r.read().decode("utf-8"))
                  last=obj
                  if obj.get("ok") is False and obj.get("error")=="UNAUTHORIZED":
                      print(f"WORKER_TICK_PROPAGATION attempt={attempt}/8 unauthorized")
                  elif obj.get("ok") is True and obj.get("action")=="tick":
                      tick=obj.get("tick") or {}
                      if tick.get("skipped") and tick.get("reason")=="worker_lock_busy":
                          busy_count += 1
                          print(f"WORKER_TICK_BUSY attempt={attempt}/8")
                      else:
                          assert tick.get("ok") is True, tick
                          print("WORKER_TICK_OK=yes")
                          print("WORKER_TICK_PROCESSED_CLIENTS=", tick.get("processedClients"))
                          print("WORKER_TICK_PROCESSED_COMMANDS=", tick.get("processedCommands"))
                          break
                  else:
                      raise AssertionError(obj)
              except urllib.error.HTTPError as exc:
                  last=f"HTTP {exc.code}"
                  if exc.code not in {404,408,429,500,502,503,504}:
                      raise
                  print(f"WORKER_TICK_PROPAGATION attempt={attempt}/8 http={exc.code}")
              except (urllib.error.URLError, TimeoutError) as exc:
                  last=str(exc)
                  print(f"WORKER_TICK_PROPAGATION attempt={attempt}/8 network={exc}")
              if attempt < 8:
                  time.sleep(10)
          else:
              if busy_count:
                  # A healthy minute-trigger worker may own the global lock for the
                  # whole acceptance window. Code/auth/live pull verification below
                  # is authoritative; do not create a false-red deploy for lock busy.
                  print("WORKER_TICK_DEFERRED_BUSY=yes")
              else:
                  raise AssertionError(last)
          PY

