      - name: Invoke one authorized Ozon continuation through GitHub
        if: github.event_name == 'push' && contains(fromJSON('["Run Ozon export continuation via GitHub","Repair and resume Ozon export via GitHub"]'), github.event.head_commit.message)
        shell: bash
        run: |
          set -euo pipefail
          # One bounded invocation; the installed timer handles any remaining chunks.
          python - <<'PY'
          import json, os, urllib.request
          url="https://script.google.com/macros/s/"+os.environ["WEBAPP_DEPLOYMENT_ID"]+"/exec"
          payload=json.dumps({"token":os.environ["WEBHOOK_SECRET"],"action":"resume_ozon_export"}).encode()
          req=urllib.request.Request(url,data=payload,headers={"Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(req,timeout=420) as response:
              result=json.loads(response.read().decode("utf-8"))
          body=result.get("result") or {}
          print("OZON_CONTINUATION_ACTION_OK="+str(result.get("ok") is True))
          print("OZON_CONTINUATION_CALLED="+str(body.get("called")))
          print("OZON_CONTINUATION_RETURN_TYPE="+str(body.get("return_type")))
          outcome=body.get("continuation_result") or {}
          allowed=("ok","started_fresh_export","continuation_pending","continued_existing_export","result_type","skipped","error_code","reason")
          safe={key:outcome.get(key) for key in allowed if key in outcome}
          print("OZON_CONTINUATION_OUTCOME="+json.dumps(safe,ensure_ascii=False)[:700])
          for label,key in (("BEFORE","diagnostic_before"),("AFTER","diagnostic_after")):
              diagnostic=body.get(key) or {}
              print("OZON_"+label+"_JOB="+str(diagnostic.get("job") or ""))
              print("OZON_"+label+"_IN_PROGRESS="+str(diagnostic.get("in_progress") or ""))
              print("OZON_"+label+"_LAST_ATTEMPT="+str(diagnostic.get("last_attempt_at") or ""))
              print("OZON_"+label+"_CONTINUATION_PENDING="+str(diagnostic.get("continuation_pending")))
              print("OZON_"+label+"_LAST_ERROR="+str(diagnostic.get("last_error") or "").replace("\\n"," ")[:400])
          outcome=body.get("continuation_result") or {}
          resumed=(outcome.get("started_fresh_export") is True or outcome.get("continued_existing_export") is True)
          print("OZON_CONTINUATION_ACCEPTED="+str(outcome.get("ok") is True and resumed))
          if result.get("ok") is not True or body.get("called") is not True or outcome.get("ok") is not True or not resumed:
              print("OZON_CONTINUATION_ERROR="+str(result.get("error") or result.get("message") or "action_failed")[:300])
              raise SystemExit("OZON_CONTINUATION_ACTION_FAILED")
          PY

      - name: Verify protected bridge auth
        if: github.event_name != 'push' || !contains(fromJSON('["Run Ozon export continuation via GitHub","Diagnose Ozon export status via GitHub","Repair and resume Ozon export via GitHub"]'), github.event.head_commit.message)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request

          url=f"https://script.google.com/macros/s/{os.environ['WEBAPP_DEPLOYMENT_ID']}/exec"
          body=json.dumps({"token":os.environ["WEBHOOK_SECRET"],"action":"health"}).encode()
          last=None
          health=None
          for attempt in range(1,9):
              req=urllib.request.Request(url,data=body,headers={"Content-Type":"application/json"},method="POST")
              try:
                  with urllib.request.urlopen(req,timeout=120) as r:
                      obj=json.loads(r.read().decode("utf-8"))
                  last=obj
                  if obj.get("ok") is True and obj.get("action")=="health":
                      candidate=obj.get("result") or {}
                      if candidate.get("version")==os.environ["EXPECTED_WORKER_VERSION"]:
                          health=candidate
                          break
                      last="WORKER_VERSION_PROPAGATION:" + str(candidate.get("version"))
                      print(f"WORKER_VERSION_WAIT attempt={attempt}/8 observed={candidate.get('version')}")
                  elif obj.get("error")=="UNAUTHORIZED":
                      last="UNAUTHORIZED during Apps Script deployment propagation"
                  else:
                      raise AssertionError(obj)
              except urllib.error.HTTPError as exc:
                  last=f"HTTP {exc.code}"
                  if exc.code not in {404,408,429,500,502,503,504}:
                      raise
              except (urllib.error.URLError, TimeoutError) as exc:
                  last=str(exc)
              if attempt < 8:
                  print(f"PROTECTED_BRIDGE_WAIT attempt={attempt}/8 reason={last}")
                  time.sleep(10)
          if health is None or health.get("version")!=os.environ["EXPECTED_WORKER_VERSION"]:
              raise AssertionError(last)
          if health.get("trigger_ok") is not True:
              raise AssertionError("TRIGGER_HEALTH_FAILED")
          print("PROTECTED_BRIDGE_AUTH=ok")
          print("WORKER_VERSION=" + str(health.get("version")))
          print("TRIGGER_OK=" + str(health.get("trigger_ok")))
          print("TRIGGER_COUNT=" + str(health.get("trigger_count")))
          print("PROJECT_TRIGGER_HANDLERS=" + ",".join(str(x) for x in (health.get("project_trigger_handlers") or [])))
          for client, stage in sorted((health.get("fbs_ingest_stages") or {}).items()):
              print("FBS_STAGE=" + str(client) + "," + str(stage.get("stage")) + ",elapsed_ms=" + str(stage.get("elapsedMs")) + ",at=" + str(stage.get("at")))
          for client in health.get("clients") or []:
              print("CLIENT=" + str(client.get("store_id")) + ",status=" + str(client.get("status")) + ",last_seen=" + str(client.get("last_seen")))
          PY

