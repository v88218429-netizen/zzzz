name: Sellmonitor GitHub worker deploy

on:
  push:
    branches: [mainggg]
    paths:
      - "sellmonitor_github_worker/SELLMONITOR_GITHUB_WORKER.gs"
      - "sellmonitor_github_worker/patch_master.py"
      - ".github/workflows/sellmonitor-github-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sellmonitor-github-worker-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SCRIPT_ID: "15tH3jwOa5hKJFahIyPX5AIXO7KRf1O4jusfDfPIdX6KeH_GqMUC71hNT"
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      WEBHOOK_SECRET: ${{ secrets.SELLMONITOR_GITHUB_WEBHOOK_SECRET }}
      WEBAPP_DEPLOYMENT_ID: AKfycbyU_OXpFYqvBx0KDuGCgEHsnzkts_fnJzVe8DM8crRDD1A_fr5DqOfVfW_PYJriaXU_jw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Require GitHub-hosted auth
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLASPRC_JSON"
          test -n "$WEBHOOK_SECRET"
          test -n "$WEBAPP_DEPLOYMENT_ID"

      - name: Install clasp and auth
        shell: bash
        run: |
          set -euo pipefail
          npm install -g @google/clasp
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"

      - name: Pull authorized adapter project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/sellmonitor-gh-worker
          mkdir -p /tmp/sellmonitor-gh-worker
          printf '{"scriptId":"%s","rootDir":"."}\n' "$SCRIPT_ID" > /tmp/sellmonitor-gh-worker/.clasp.json
          cd /tmp/sellmonitor-gh-worker
          clasp pull
          test -f appsscript.json

      - name: Install worker and master hook
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/sellmonitor-gh-worker/SELLMONITOR_GITHUB_WORKER.js /tmp/sellmonitor-gh-worker/SELLMONITOR_GITHUB_WORKER.gs
          cp sellmonitor_github_worker/SELLMONITOR_GITHUB_WORKER.gs /tmp/sellmonitor-gh-worker/SELLMONITOR_GITHUB_WORKER.gs
          python - <<'PY'
          import hashlib, json, os, pathlib
          root=pathlib.Path('/tmp/sellmonitor-gh-worker')
          p=root/'SELLMONITOR_GITHUB_WORKER.gs'
          s=p.read_text(encoding='utf-8')
          marker='__SELLMONITOR_GITHUB_WEBHOOK_SECRET_SHA256__'
          if marker not in s:
              raise SystemExit('webhook hash placeholder missing')
          digest=hashlib.sha256(os.environ['WEBHOOK_SECRET'].encode('utf-8')).hexdigest()
          p.write_text(s.replace(marker, digest), encoding='utf-8')
          m=root/'appsscript.json'
          obj=json.loads(m.read_text(encoding='utf-8'))
          obj['webapp']={'executeAs':'USER_DEPLOYING','access':'ANYONE_ANONYMOUS'}
          obj['executionApi']={'access':'MYSELF'}
          m.write_text(json.dumps(obj, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
          python sellmonitor_github_worker/patch_master.py /tmp/sellmonitor-gh-worker

      - name: Syntax check full live project
        shell: bash
        run: |
          set -euo pipefail
          COUNT=0
          while IFS= read -r -d '' f; do
            T="$(mktemp --suffix=.js)"
            cp "$f" "$T"
            node --check "$T"
            rm -f "$T"
            COUNT=$((COUNT+1))
          done < <(find /tmp/sellmonitor-gh-worker -type f \( -name '*.gs' -o -name '*.js' \) -print0)
          test "$COUNT" -gt 0
          echo "SYNTAX_OK=$COUNT"

      - name: Push and redeploy stable adapter
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/sellmonitor-gh-worker
          clasp push -f
          clasp redeploy "$WEBAPP_DEPLOYMENT_ID" -d "Sellmonitor GitHub Central Worker Web"

      - name: Verify protected bridge auth
        shell: bash
        run: |
          set -euo pipefail
          URL="https://script.google.com/macros/s/$WEBAPP_DEPLOYMENT_ID/exec"
          PAYLOAD="$(python - <<'PY'
          import json, os
          print(json.dumps({"token":os.environ["WEBHOOK_SECRET"],"action":"health"}))
          PY
          )"
          RESP="$(curl -fsSL --retry 3 --retry-delay 3 -H 'Content-Type: application/json' -d "$PAYLOAD" "$URL")"
          python - "$RESP" <<'PY'
          import json, sys
          obj=json.loads(sys.argv[1])
          assert obj.get("ok") is True, obj
          assert obj.get("action") == "health", obj
          health=obj.get("result") or {}
          print("PROTECTED_BRIDGE_AUTH=ok")
          print(json.dumps({
              "worker_version": health.get("version"),
              "clients": health.get("clients") or [],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Run one authenticated worker tick
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.request

          url=f"https://script.google.com/macros/s/{os.environ['WEBAPP_DEPLOYMENT_ID']}/exec"
          body=json.dumps({"token":os.environ["WEBHOOK_SECRET"],"action":"tick"}).encode()
          last=None
          for attempt in range(1,7):
              req=urllib.request.Request(url,data=body,headers={"Content-Type":"application/json"},method="POST")
              with urllib.request.urlopen(req,timeout=180) as r:
                  obj=json.loads(r.read().decode("utf-8"))
              last=obj
              assert obj.get("ok") is True, obj
              assert obj.get("action") == "tick", obj
              tick=obj.get("tick") or {}
              if tick.get("skipped") and tick.get("reason")=="worker_lock_busy":
                  print(f"WORKER_TICK_BUSY attempt={attempt}/6")
                  if attempt < 6:
                      time.sleep(10)
                      continue
                  # A healthy minute-trigger worker may legitimately own the lock.
                  # Deployment acceptance is code/auth based; the live worker can
                  # complete the next tick instead of making CI falsely red.
                  print("WORKER_TICK_DEFERRED_BUSY=yes")
                  break
              assert tick.get("ok") is True, tick
              print("WORKER_TICK_OK=yes")
              print("WORKER_TICK_PROCESSED_CLIENTS=", tick.get("processedClients"))
              print("WORKER_TICK_PROCESSED_COMMANDS=", tick.get("processedCommands"))
              break
          else:
              raise AssertionError(last)
          PY

      - name: Pull back and verify live code
        shell: bash
        run: |
          set -euo pipefail
          V="$(mktemp -d)"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$SCRIPT_ID" > "$V/.clasp.json"
          cd "$V"
          clasp pull
          grep -Rqs "SELLMONITOR_GITHUB_MASTER_HOOK_V1" .
          grep -Rqs "function sellmonitorGithubEnsureTrigger_()" .
          grep -Rqs "github-worker-1.3.11" .
          grep -Rqs "SELLMONITOR_WEBHOOK_HASH_NOT_COMPILED" .
          python - <<'PY'
          import json
          obj=json.load(open('appsscript.json'))
          assert obj.get('executionApi',{}).get('access') == 'MYSELF'
          print('EXECUTION_API_MANIFEST=ok')
          PY
          echo "LIVE_CODE_VERIFIED=yes"
