name: Sellmonitor GitHub worker deploy

on:
  push:
    branches: [mainggg]
    paths:
      - "sellmonitor_github_worker/SELLMONITOR_GITHUB_WORKER.gs"
      - "sellmonitor_github_worker/patch_master.py"
      - ".github/workflows/sellmonitor-github-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sellmonitor-github-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SCRIPT_ID: "15tH3jwOa5hKJFahIyPX5AIXO7KRf1O4jusfDfPIdX6KeH_GqMUC71hNT"
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      WEBHOOK_SECRET: ${{ secrets.SELLMONITOR_GITHUB_WEBHOOK_SECRET }}
      WB_API_TOKEN_AP: ${{ secrets.WB_API_TOKEN_AP }}
      WB_API_TOKEN_AA: ${{ secrets.WB_API_TOKEN_AA }}
      WB_API_TOKEN_YV: ${{ secrets.WB_API_TOKEN_YV }}
      WEBAPP_DEPLOYMENT_ID: AKfycbyU_OXpFYqvBx0KDuGCgEHsnzkts_fnJzVe8DM8crRDD1A_fr5DqOfVfW_PYJriaXU_jw # also used by the WB FBS recovery workflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Require GitHub-hosted auth
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLASPRC_JSON"
          test -n "$WEBHOOK_SECRET"
          test -n "$WB_API_TOKEN_AP"
          test -n "$WB_API_TOKEN_AA"
          test -n "$WB_API_TOKEN_YV"
          test -n "$WEBAPP_DEPLOYMENT_ID"

      - name: Probe direct Google Sheets API access
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request
          cfg=json.loads(os.environ['CLASPRC_JSON'])
          token_map=cfg.get('tokens') or {}
          credentials=list(token_map.values()) if isinstance(token_map,dict) else (token_map if isinstance(token_map,list) else [])
          print('CLASPRC_TOP_LEVEL_FIELDS='+','.join(sorted(cfg.keys())))
          print('CLASPRC_CREDENTIAL_COUNT='+str(len(credentials)))
          def find(obj,names):
              wanted={x.lower().replace('_','') for x in names}
              if isinstance(obj,dict):
                  for key,value in obj.items():
                      if str(key).lower().replace('_','') in wanted and isinstance(value,str) and value:return value
                  for value in obj.values():
                      found=find(value,names)
                      if found:return found
              elif isinstance(obj,list):
                  for value in obj:
                      found=find(value,names)
                      if found:return found
              return ''
          def probe(access):
              sheet='1qJvhEOIku7sOMydfrUz0PR5dkcU0sLjv433pa1MFBcM'
              url='https://sheets.googleapis.com/v4/spreadsheets/'+sheet+'?fields=spreadsheetId,properties.title'
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+access})
              with urllib.request.urlopen(req,timeout=20) as response:return json.loads(response.read().decode())
          result=None; access=''
          candidates=sorted(credentials,key=lambda x:0 if 'spreadsheets' in str((x or {}).get('scope') or '').lower() else 1)
          for index,cred in enumerate(candidates):
              if not isinstance(cred,dict):continue
              scopes=str(cred.get('scope') or '')
              print('CLASPRC_PROFILE_'+str(index)+'_SHEETS_SCOPE='+str('spreadsheets' in scopes.lower()))
              access=find(cred,['access_token','accessToken'])
              refresh=find(cred,['refresh_token','refreshToken'])
              if access:
                  try:
                      result=probe(access)
                  except urllib.error.HTTPError as exc:
                      detail=exc.read().decode('utf-8','replace')[:240].replace(chr(10),' ')
                      print('DIRECT_SHEETS_PROFILE_'+str(index)+'_HTTP='+str(exc.code)+':'+detail)
                      result=None
                      if exc.code==403:continue
                      if exc.code!=401:raise
              if result is None and refresh:
                  client_id=find(cred,['client_id','clientId']) or find(cfg,['client_id','clientId'])
                  client_secret=find(cred,['client_secret','clientSecret']) or find(cfg,['client_secret','clientSecret'])
                  if client_id and client_secret:
                      form=urllib.parse.urlencode({'client_id':client_id,'client_secret':client_secret,'refresh_token':refresh,'grant_type':'refresh_token'}).encode()
                      req=urllib.request.Request('https://oauth2.googleapis.com/token',data=form,method='POST')
                      try:
                          with urllib.request.urlopen(req,timeout=30) as response: auth=json.loads(response.read().decode())
                          access=auth['access_token'];result=probe(access)
                          print('DIRECT_SHEETS_TOKEN_REFRESH=ok')
                      except urllib.error.HTTPError as exc:
                          detail=exc.read().decode('utf-8','replace')[:240].replace(chr(10),' ')
                          print('DIRECT_SHEETS_PROFILE_'+str(index)+'_REFRESH_HTTP='+str(exc.code)+':'+detail)
              if result is not None:break
          if result is None or not access:
              raise SystemExit('CLASPRC_USABLE_SHEETS_TOKEN_UNAVAILABLE')
          print('::add-mask::'+access)
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as env:
              env.write('SHEETS_ACCESS_TOKEN='+access+chr(10))
          print('DIRECT_SHEETS_READ=ok')
          print('DIRECT_SHEETS_TITLE='+str((result.get('properties') or {}).get('title','')))
          PY

      - name: Install clasp and auth
        shell: bash
        run: |
          set -euo pipefail
          npm install -g @google/clasp
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"

      - name: Pull authorized adapter project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/sellmonitor-gh-worker
          mkdir -p /tmp/sellmonitor-gh-worker
          printf '{"scriptId":"%s","rootDir":"."}\n' "$SCRIPT_ID" > /tmp/sellmonitor-gh-worker/.clasp.json
          cd /tmp/sellmonitor-gh-worker
          clasp pull
          test -f appsscript.json
          mkdir -p /tmp/sellmonitor-gh-live
          cp appsscript.json /tmp/sellmonitor-gh-live/appsscript.json
          if [ -f SELLMONITOR_GITHUB_WORKER.gs ]; then
            cp SELLMONITOR_GITHUB_WORKER.gs /tmp/sellmonitor-gh-live/live-worker
            echo "gs" > /tmp/sellmonitor-gh-live/worker-extension
          elif [ -f SELLMONITOR_GITHUB_WORKER.js ]; then
            cp SELLMONITOR_GITHUB_WORKER.js /tmp/sellmonitor-gh-live/live-worker
            echo "js" > /tmp/sellmonitor-gh-live/worker-extension
          else
            echo "LIVE_WORKER_FILE_MISSING"
            exit 1
          fi
          python - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path("/tmp/sellmonitor-gh-worker")
          suffixes={".gs",".js",".ts",".html",".json"}
          baseline={}
          for p in root.rglob("*"):
              if p.is_file() and p.suffix in suffixes:
                  baseline[str(p.relative_to(root))]=hashlib.sha256(p.read_bytes()).hexdigest()
          pathlib.Path("/tmp/sellmonitor-gh-live/baseline.json").write_text(json.dumps(baseline))
          print("LIVE_PROJECT_BASELINE_FILES=" + str(len(baseline)))
          PY

      - name: Install worker and master hook
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/sellmonitor-gh-worker/SELLMONITOR_GITHUB_WORKER.js /tmp/sellmonitor-gh-worker/SELLMONITOR_GITHUB_WORKER.gs
          cp sellmonitor_github_worker/SELLMONITOR_GITHUB_WORKER.gs /tmp/sellmonitor-gh-worker/SELLMONITOR_GITHUB_WORKER.gs
          python - <<'PY'
          import hashlib, json, os, pathlib
          root=pathlib.Path('/tmp/sellmonitor-gh-worker')
          p=root/'SELLMONITOR_GITHUB_WORKER.gs'
          s=p.read_text(encoding='utf-8')
          marker='__SELLMONITOR_GITHUB_WEBHOOK_SECRET_SHA256__'
          if marker not in s:
              raise SystemExit('webhook hash placeholder missing')
          digest=hashlib.sha256(os.environ['WEBHOOK_SECRET'].encode('utf-8')).hexdigest()
          p.write_text(s.replace(marker, digest), encoding='utf-8')
          m=root/'appsscript.json'
          obj=json.loads(m.read_text(encoding='utf-8'))
          obj['webapp']={'executeAs':'USER_DEPLOYING','access':'ANYONE_ANONYMOUS'}
          obj['executionApi']={'access':'MYSELF'}
          dependencies=obj.setdefault('dependencies',{})
          services=dependencies.setdefault('enabledAdvancedServices',[])
          if not any(x.get('serviceId')=='sheets' for x in services):
              services.append({'userSymbol':'Sheets','serviceId':'sheets','version':'v4'})
          m.write_text(json.dumps(obj, ensure_ascii=False, indent=2), encoding='utf-8')
          match=__import__('re').search(r"VERSION:\s*'([^']+)'", s)
          if not match:
              raise SystemExit('worker version missing')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write('EXPECTED_WORKER_VERSION=' + match.group(1) + '\n')
          PY
          python sellmonitor_github_worker/patch_master.py /tmp/sellmonitor-gh-worker

      - name: Syntax check full live project
        shell: bash
        run: |
          set -euo pipefail
          COUNT=0
          while IFS= read -r -d '' f; do
            T="$(mktemp --suffix=.js)"
            cp "$f" "$T"
            node --check "$T"
            rm -f "$T"
            COUNT=$((COUNT+1))
          done < <(find /tmp/sellmonitor-gh-worker -type f \( -name '*.gs' -o -name '*.js' \) -print0)
          test "$COUNT" -gt 0
          echo "SYNTAX_OK=$COUNT"

      - name: Ozon continuation diagnostic through scheduled worker
        if: github.event_name == 'push' && github.event.head_commit.message == 'Diagnose Ozon export status via GitHub'
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/sellmonitor-gh-worker
          live=/tmp/sellmonitor-gh-live
          rm -f "$root/SELLMONITOR_GITHUB_WORKER.gs" "$root/SELLMONITOR_GITHUB_WORKER.js"
          ext="$(cat "$live/worker-extension")"
          cp "$live/live-worker" "$root/SELLMONITOR_GITHUB_WORKER.$ext"
          cp "$live/appsscript.json" "$root/appsscript.json"
          python - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path("/tmp/sellmonitor-gh-worker")
          baseline=json.loads(pathlib.Path("/tmp/sellmonitor-gh-live/baseline.json").read_text())
          marker="SELLMONITOR_OZON_EXPORT_DIAGNOSTIC_V1"
          masters=[p for p in root.rglob("*") if p.is_file() and p.suffix in (".gs",".js") and marker in p.read_text(errors="ignore")]
          if len(masters)!=1:
              raise SystemExit("OZON_DIAGNOSTIC_SOURCE_MISSING")
          workers=[p for p in root.rglob("SELLMONITOR_GITHUB_WORKER.*") if p.is_file() and p.suffix in (".gs",".js")]
          if len(workers)!=1:
              raise SystemExit("OZON_DIAGNOSTIC_WORKER_SOURCE_MISSING")
          worker=workers[0]; source=worker.read_text(encoding="utf-8")
          worker_marker="SELLMONITOR_OZON_EXPORT_STATUS_SNAPSHOT_V1"
          if worker_marker not in source:
              tick_anchor="function sellmonitorGithubTick() {"
              if source.count(tick_anchor)!=1:
                  raise SystemExit("OZON_DIAGNOSTIC_TICK_ANCHOR_MISSING")
              source=source.replace(tick_anchor,tick_anchor+"\n  try { sellmonitorGithubOzonExportDiagnosticTick_(); } catch (diagError) { Logger.log('OZON_DIAGNOSTIC_TICK_FAILED:' + String(diagError && diagError.message || diagError).slice(0,180)); }",1)
              source += r"""
          /* SELLMONITOR_OZON_EXPORT_STATUS_SNAPSHOT_V1 */
          function sellmonitorGithubOzonExportDiagnosticTick_() {
            var props=PropertiesService.getScriptProperties();
            var job=String(props.getProperty('dom.job')||'');
            var inProgress=String(props.getProperty('OZON_FBS_IN_PROGRESS')||'');
            var lastAttempt=String(props.getProperty('OZON_FBS_LAST_ATTEMPT_AT')||'');
            var lastError=String(props.getProperty('OZON_FBS_LAST_ERROR')||'');
            try { if(typeof sanitizeAutomationError_==='function') lastError=sanitizeAutomationError_(lastError); } catch(ignored) {}
            lastError=lastError.replace(/Bearer\s+\S+/ig,'Bearer [REDACTED]')
              .replace(/(token|secret|authorization)\s*[:=]\s*\S+/ig,'$1=[REDACTED]')
              .replace(/[A-Za-z0-9_-]{32,}/g,'[ID_REDACTED]').slice(0,500);
            var handlers=ScriptApp.getProjectTriggers().map(function(t){return String(t.getHandlerFunction()||'');});
            var pending=handlers.indexOf('exportDOM_continue')>=0;
            var state=[job,inProgress,lastAttempt,pending?'да':'нет',lastError];
            var stores=(typeof SMC_OZON_SUMMARY==='object'&&SMC_OZON_SUMMARY.stores)?SMC_OZON_SUMMARY.stores:{};
            Object.keys(stores).forEach(function(storeId){
              var cfg=stores[storeId],sig=JSON.stringify(state),sigKey='SMC_OZON_EXPORT_DIAG_SIG_'+storeId,atKey='SMC_OZON_EXPORT_DIAG_AT_'+storeId;
              var now=Date.now(),last=Number(props.getProperty(atKey)||0);
              if(props.getProperty(sigKey)===sig&&now-last<300000)return;
              try {
                var ss=SpreadsheetApp.openById(cfg.id),name='15_API_Экспорт_Диагностика_GH';
                var sh=ss.getSheetByName(name)||ss.insertSheet(name);
                var header=['Время наблюдения','Магазин','Задание экспорта','В процессе','Последняя попытка','Триггер продолжения','Последняя ошибка'];
                if(sh.getLastRow()===0){
                  sh.getRange(1,1,1,7).setValues([header]);sh.setFrozenRows(1);
                  sh.getRange(1,1,1,7).setFontWeight('bold').setBackground('#17365D').setFontColor('#FFFFFF');
                  sh.setColumnWidth(1,170);sh.setColumnWidth(2,130);sh.setColumnWidth(7,520);
                  sh.getRange('A:A').setNumberFormat('yyyy-mm-dd hh:mm:ss');
                } else if(JSON.stringify(sh.getRange(1,1,1,7).getDisplayValues()[0])!==JSON.stringify(header)) {
                  throw new Error('OZON_DIAGNOSTIC_HEADER_MISMATCH');
                }
                var at=new Date(),row=[at,cfg.name,job,inProgress,lastAttempt,pending?'да':'нет',lastError],dst=sh.getLastRow()+1;
                sh.getRange(dst,1,1,7).setValues([row]);SpreadsheetApp.flush();
                var rb=sh.getRange(dst,1,1,7).getValues()[0];
                var stamp=rb[0] instanceof Date?Utilities.formatDate(rb[0],ss.getSpreadsheetTimeZone(),'yyyy-MM-dd HH:mm:ss'):'';
                if(!stamp||String(rb[1])!==cfg.name||JSON.stringify(rb.slice(2).map(String))!==JSON.stringify(row.slice(2).map(String)))throw new Error('OZON_DIAGNOSTIC_ROW_READBACK_MISMATCH');
                var updates={};updates[sigKey]=sig;updates[atKey]=String(now);props.setProperties(updates,false);
                Logger.log('OZON_DIAGNOSTIC_SNAPSHOT_OK:'+cfg.name+':'+stamp);
              } catch(writeError) {
                Logger.log('OZON_DIAGNOSTIC_SNAPSHOT_ERROR:'+cfg.name+':'+String(writeError&&writeError.message||writeError).slice(0,200));
              }
            });
          }
          """
              worker.write_text(source,encoding="utf-8")
              print("OZON_DIAGNOSTIC_WORKER_PATCH=added")
          else:
              print("OZON_DIAGNOSTIC_WORKER_PATCH=already_present")
          suffixes={".gs",".js",".ts",".html",".json"}
          current={}
          for p in root.rglob("*"):
              if p.is_file() and p.suffix in suffixes:
                  current[str(p.relative_to(root))]=hashlib.sha256(p.read_bytes()).hexdigest()
          changed=sorted(p for p,h in baseline.items() if current.get(p)!=h)
          changed += sorted(p for p in current if p not in baseline)
          allowed=lambda x: x.endswith(("Код.js","Code.js")) or pathlib.Path(x).name.startswith("SELLMONITOR_GITHUB_WORKER.")
          if len(changed)>2 or any(not allowed(x) for x in changed):
              print("DIAGNOSTIC_PUSH_CHANGED_FILES="+",".join(changed))
              raise SystemExit("DIAGNOSTIC_PUSH_SCOPE_CHECK_FAILED")
          pathlib.Path("/tmp/ozon-diagnostic-needs-push").write_text("1" if changed else "0")
          print("DIAGNOSTIC_PUSH_CHANGED_FILES="+(",".join(changed) if changed else "already_present"))
          PY
          cd "$root"
          if [ "$(cat /tmp/ozon-diagnostic-needs-push)" = "1" ]; then
            clasp push -f
          else
            echo "OZON_DIAGNOSTIC_PUSH=already_present"
          fi
          python - <<'PY'
          import concurrent.futures, json, os, time, urllib.error, urllib.parse, urllib.request
          access=os.environ.get('SHEETS_ACCESS_TOKEN','')
          if not access: print('OZON_DIAGNOSTIC_SHEET_READBACK=unavailable_google_sheets_api_disabled'); raise SystemExit(0)
          ids={'ДОМ':'1g57et2zqlVfbs0_BoRobb5G-4Z2MTXZd028V7u4Kd-Q','Хозяюшка':'1Rl-IVihrZ56wKwDsf76wspZ53a8ntN3hCVN1gd4Tguo'}
          tab='15_API_Экспорт_Диагностика_GH'; last={}
          def read_store(store,sid):
              rng=urllib.parse.quote("'"+tab+"'!A1:G100",safe='')
              url='https://sheets.googleapis.com/v4/spreadsheets/'+sid+'/values/'+rng+'?majorDimension=ROWS'
              request=urllib.request.Request(url,headers={'Authorization':'Bearer '+access})
              try:
                  with urllib.request.urlopen(request,timeout=12) as response: payload=json.loads(response.read().decode())
                  rows=payload.get('values') or []; row=rows[-1] if len(rows)>1 else []
                  return store,row if len(row)>=7 and str(row[1])==store else 'no_verified_row'
              except urllib.error.HTTPError as error:
                  return store,'HTTP_'+str(error.code)
              except Exception as error:
                  return store,type(error).__name__
          for attempt in range(1,13):
              with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
                  for store,result in pool.map(lambda item:read_store(*item),ids.items()): last[store]=result
              if all(isinstance(last.get(store),list) for store in ids): break
              if attempt<12: time.sleep(8)
          for store in ids:
              row=last.get(store)
              if not isinstance(row,list) or len(row)<7 or str(row[1])!=store:
                  raise SystemExit('OZON_DIAGNOSTIC_SHEET_READBACK_FAILED:'+store+':'+str(row))
              print('OZON_DIAGNOSTIC_STORE='+store+' OBSERVED='+str(row[0])+' JOB='+str(row[2])+' IN_PROGRESS='+str(row[3])+' LAST_ATTEMPT='+str(row[4])+' CONTINUATION='+str(row[5]))
              print('OZON_DIAGNOSTIC_LAST_ERROR='+str(row[6]).replace('\\n',' ')[:500])
          PY
          clasp pull
          python - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path("/tmp/sellmonitor-gh-worker")
          baseline=json.loads(pathlib.Path("/tmp/sellmonitor-gh-live/baseline.json").read_text())
          marker="SELLMONITOR_OZON_EXPORT_DIAGNOSTIC_V1"
          masters=[p for p in root.rglob("*") if p.is_file() and p.suffix in (".gs",".js") and marker in p.read_text(errors="ignore")]
          if len(masters)!=1:
              raise SystemExit("OZON_DIAGNOSTIC_SOURCE_READBACK_FAILED")
          suffixes={".gs",".js",".ts",".html",".json"}
          current={}
          for p in root.rglob("*"):
              if p.is_file() and p.suffix in suffixes:
                  current[str(p.relative_to(root))]=hashlib.sha256(p.read_bytes()).hexdigest()
          changed=sorted(p for p,h in baseline.items() if current.get(p)!=h)
          changed += sorted(p for p in current if p not in baseline)
          allowed=lambda x: x.endswith(("Код.js","Code.js")) or pathlib.Path(x).name.startswith("SELLMONITOR_GITHUB_WORKER.")
          if len(changed)>2 or any(not allowed(x) for x in changed):
              raise SystemExit("OZON_DIAGNOSTIC_READBACK_SCOPE_FAILED")
          print("OZON_DIAGNOSTIC_SOURCE_READBACK=verified")
          print("OZON_DIAGNOSTIC_CHANGED_FILES=" + (",".join(changed) if changed else "already_present"))
          PY

      - name: Audit Apps Script version capacity
        if: github.event_name == 'push' && github.event.head_commit.message == 'Audit Apps Script version capacity'
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/sellmonitor-gh-worker
          version_log="$(mktemp)"
          deployment_log="$(mktemp)"
          clasp list-versions >"$version_log" 2>&1
          clasp list-deployments >"$deployment_log" 2>&1
          python - "$version_log" "$deployment_log" <<'PY'
          import pathlib, re, sys
          versions = pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines()
          deployments = pathlib.Path(sys.argv[2]).read_text(errors="replace").splitlines()
          numbers = [int(m.group(1)) for line in versions if (m := re.match(r"\s*(\d+)\s+-", line))]
          active = []
          for line in deployments:
              m = re.search(r"@\s*(\d+)", line) or re.search(r"version(?:Number)?\s*[:=]\s*(\d+)", line, re.I)
              if m:
                  active.append(int(m.group(1)))
          print("APPS_SCRIPT_VERSION_COUNT=" + str(len(numbers)))
          if numbers:
              print("APPS_SCRIPT_VERSION_RANGE=" + str(min(numbers)) + ".." + str(max(numbers)))
          print("APPS_SCRIPT_DEPLOYMENT_COUNT=" + str(len(active)))
          print("APPS_SCRIPT_ACTIVE_VERSION_REFERENCES=" + ",".join(map(str, sorted(set(active)))) if active else "APPS_SCRIPT_ACTIVE_VERSION_REFERENCES=unparsed_or_none")
          PY

      - name: Inspect the existing Ozon continuation wrapper
        if: github.event_name == 'push' && contains(fromJSON('["Run Ozon export continuation via GitHub","Repair and resume Ozon export via GitHub"]'), github.event.head_commit.message)
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/sellmonitor-gh-worker
          python - <<'PY'
          import pathlib
          files=[]
          for path in pathlib.Path(".").rglob("*"):
              if path.suffix not in (".gs",".js",".ts"):
                  continue
              try:
                  content=path.read_text(encoding="utf-8")
              except Exception:
                  continue
              index=content.find("function exportDOM_continue")
              if index>=0:
                  snippet=content[index:index+380].replace(chr(10)," ")
                  files.append((str(path),snippet))
          if files:
              print("OZON_CONTINUATION_SOURCE_FILE="+files[0][0])
              print("OZON_CONTINUATION_SOURCE_SNIPPET="+files[0][1])
          else:
              print("OZON_CONTINUATION_SOURCE=not_found_as_global_wrapper; authenticated endpoint will check the installed library entry")
          PY

      - name: Prune only unassigned Apps Script versions
        if: github.event_name != 'push' || github.event.head_commit.message != 'Run Ozon export continuation via GitHub' && !contains(fromJSON('["Diagnose Ozon export status via GitHub","Repair and resume Ozon export via GitHub"]'), github.event.head_commit.message)
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/sellmonitor-gh-worker
          versions_file="$(mktemp)"
          deployments_file="$(mktemp)"
          clasp list-versions >"$versions_file" 2>&1
          clasp list-deployments >"$deployments_file" 2>&1
          python - "$versions_file" "$deployments_file" <<'PY'
          import pathlib, re, sys
          version_lines=pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines()
          deployment_lines=pathlib.Path(sys.argv[2]).read_text(errors="replace").splitlines()
          versions=[]
          for line in version_lines:
              match=re.match(r"\s*(\d+)\s+-",line)
              if match: versions.append(int(match.group(1)))
          active=set()
          for line in deployment_lines:
              match=re.search(r"@\s*(\d+)",line) or re.search(r"version(?:Number)?\s*[:=]\s*(\d+)",line,re.I)
              if match: active.add(int(match.group(1)))
          if not versions: raise SystemExit("APPS_SCRIPT_VERSION_LIST_UNPARSED")
          if not active: raise SystemExit("APPS_SCRIPT_ACTIVE_DEPLOYMENTS_UNPARSED")
          if 185 not in active or max(versions) not in active:
              raise SystemExit("APPS_SCRIPT_ACTIVE_VERSION_GUARD_FAILED:"+",".join(map(str,sorted(active))))
          eligible=sorted(set(versions)-active)
          print("APPS_SCRIPT_VERSION_COUNT="+str(len(versions)))
          print("APPS_SCRIPT_ACTIVE_VERSIONS="+",".join(map(str,sorted(active))))
          print("APPS_SCRIPT_PRUNE_CANDIDATES="+",".join(map(str,eligible)))
          if len(versions)>=200 and not eligible:
              raise SystemExit("APPS_SCRIPT_NO_UNASSIGNED_VERSION_TO_PRUNE")
          pathlib.Path("/tmp/sellmonitor-unassigned-versions.txt").write_text("\n".join(map(str,eligible)))
          PY
          while IFS= read -r version; do
            test -n "$version" || continue
            echo "PRUNING_UNASSIGNED_APPS_SCRIPT_VERSION=$version"
            clasp delete-version "$version"
            # One freed slot is sufficient; preserve every other historical version.
            break
          done < /tmp/sellmonitor-unassigned-versions.txt
          clasp list-versions >"$versions_file" 2>&1
          python - "$versions_file" <<'PY'
          import pathlib,re,sys
          lines=pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines()
          nums=[int(m.group(1)) for line in lines if (m:=re.match(r"\s*(\d+)\s+-",line))]
          print("APPS_SCRIPT_VERSION_COUNT_AFTER_PRUNE="+str(len(nums)))
          if len(nums)>=200: raise SystemExit("APPS_SCRIPT_VERSION_CAPACITY_NOT_FREED")
          PY

