name: Video research task worker

on:
  push:
    paths:
      - 'monitor_requests/**.json'
      - 'video_task_monitor.py'
      - '.github/workflows/video_task_monitor.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: video-research-task-worker
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install search tool
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp

      - name: Process queued research tasks
        run: python video_task_monitor.py

      - name: Commit results
        run: |
          git config user.name "video-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add monitor_tasks/ transcripts/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Process video research tasks"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
