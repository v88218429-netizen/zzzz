    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate SANYCH recovery prerequisites
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile wb_worker/sanych_fbs_recovery.py
          test -n "$GOOGLE_BRIDGE_KEY"
          test -n "$WB_API_TOKEN_AP"
          test "${#WB_API_TOKEN_AP}" -ge 30
      - name: Reconcile the SANYCH gap from WB into both books
        shell: bash
        run: python wb_worker/sanych_fbs_recovery.py

