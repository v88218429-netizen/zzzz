name: Oldest channel videos transcripts
on:
  push:
    paths:
      - 'channel_requests/**.json'
      - 'channel_oldest_transcripts.py'
      - '.github/workflows/channel-oldest-transcripts.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: oldest-channel-transcripts
  cancel-in-progress: false
jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mainggg
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -U yt-dlp
      - name: Transcribe oldest videos
        id: worker
        continue-on-error: true
        run: python channel_oldest_transcripts.py
      - name: Save results
        if: always()
        run: |
          git config user.name "video-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add transcripts/ monitor_tasks/results/
          if ! git diff --cached --quiet; then
            git commit -m "Save oldest channel transcripts and evidence"
            git pull --rebase origin mainggg
            git push origin HEAD:mainggg
          fi
      - name: Verify
        if: steps.worker.outcome != 'success'
        run: exit 1
