name: WB FBS GitHub recovery

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Период сверки с WB (дней)"
        required: false
        default: "7"
        type: choice
        options: ["7", "30", "60", "90"]
      start_date:
        description: "Начало точечного восстановления (UTC, YYYY-MM-DD)"
        required: false
        type: string
      end_date:
        description: "Конец точечного восстановления (UTC, YYYY-MM-DD)"
        required: false
        type: string
  # Periodic recovery is re-enabled only after verified end-to-end acceptance.

permissions:
  contents: read

jobs:
  recover:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        client: [AIR, HOZYAYUSHKA]
    concurrency:
      group: wb-fbs-github-recovery-${{ matrix.client }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FBS_CLIENT: ${{ matrix.client }}
      WB_API_TOKEN_AA: ${{ secrets.WB_API_TOKEN_AA }}
      WB_API_TOKEN_YV: ${{ secrets.WB_API_TOKEN_YV }}
      GOOGLE_BRIDGE_KEY: ${{ secrets.SELLMONITOR_GITHUB_WEBHOOK_SECRET }}
      GOOGLE_BRIDGE_URL: https://script.google.com/macros/s/AKfycbyU_OXpFYqvBx0KDuGCgEHsnzkts_fnJzVe8DM8crRDD1A_fr5DqOfVfW_PYJriaXU_jw/exec
      FBS_LOOKBACK_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.lookback_days || (github.event_name == 'push' && contains(github.event.head_commit.message, '[FBS-90D-ONCE]') && '90') || '7' }}
      FBS_START_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.start_date || '' }}
      FBS_END_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.end_date || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check source and credentials
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile wb_worker/github_fbs_recovery.py
          test -n "$GOOGLE_BRIDGE_KEY"
          if [[ "$FBS_CLIENT" == "AIR" ]]; then
            test -n "$WB_API_TOKEN_AA"
          elif [[ "$FBS_CLIENT" == "HOZYAYUSHKA" ]]; then
            test -n "$WB_API_TOKEN_YV"
          else
            exit 2
          fi
      - name: Reconcile ${{ matrix.client }} from WB to its FBS book
        shell: bash
        run: python wb_worker/github_fbs_recovery.py
