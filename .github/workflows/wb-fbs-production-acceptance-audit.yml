name: WB FBS production acceptance audit

on:
  workflow_dispatch:
    inputs:
      inspect_live_stage:
        description: "Read the last active Apps Script FBS write stage"
        required: false
        default: false
        type: boolean
  workflow_run:
    workflows:
      - WB FBS retry failed recovery windows
      - WB FBS GitHub recovery
      - WB FBS Sanych targeted recovery
      - WB FBS supply sync via GitHub
    types: [completed]
    branches: [mainggg]

permissions:
  actions: read
  contents: read

concurrency:
  group: wb-fbs-production-acceptance-audit
  cancel-in-progress: false
  queue: max

jobs:
  audit:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      BRIDGE_KEY: ${{ secrets.SELLMONITOR_GITHUB_WEBHOOK_SECRET }}
      BRIDGE_URL: https://script.google.com/macros/s/AKfycbyU_OXpFYqvBx0KDuGCgEHsnzkts_fnJzVe8DM8crRDD1A_fr5DqOfVfW_PYJriaXU_jw/exec
    steps:
      - name: Wait until production writers are idle
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.inspect_live_stage != true }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          repo=os.environ["REPOSITORY"]
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
                   "Accept":"application/vnd.github+json",
                   "X-GitHub-Api-Version":"2022-11-28"}
          names={"WB FBS recovery pass 1","WB FBS recovery pass 2","WB FBS recovery pass 3",
                 "WB FBS GitHub recovery","WB FBS automatic freshness repair",
                 "WB FBS Sanych targeted recovery",
                 "WB FBS retry failed recovery windows","WB FBS supply sync via GitHub",
                 "WB Sellmonitor finance summaries"}
          url="https://api.github.com/repos/"+repo+"/actions/runs?per_page=100"
          for attempt in range(180):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as response:
                  runs=json.load(response).get("workflow_runs",[])
              active=[r for r in runs if r.get("name") in names and
                      r.get("status") in {"queued","in_progress","pending","waiting","requested"}]
              if not active:
                  print("FBS_PRODUCTION_WRITERS_IDLE=yes")
                  break
              print("FBS_PRODUCTION_WRITERS_ACTIVE="+str(len(active))+
                    " oldest="+str(min(r.get("created_at","") for r in active)),flush=True)
              time.sleep(30)
          else:
              raise SystemExit("FBS_PRODUCTION_WRITERS_DID_NOT_QUIESCE")
          PY
      - name: Read active Apps Script stage only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.inspect_live_stage == true }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          payload=json.dumps({"token":os.environ["BRIDGE_KEY"],"action":"health"}).encode("utf-8")
          request=urllib.request.Request(os.environ["BRIDGE_URL"],data=payload,
                headers={"Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(request,timeout=480) as response:
              body=json.loads(response.read().decode("utf-8"))
          result=body.get("result") or {}
          if body.get("ok") is not True or result.get("ok") is not True:
              print("FBS_RUNTIME_HEALTH_FAILED "+json.dumps(body,ensure_ascii=False)[:6000],flush=True)
              raise SystemExit("FBS_RUNTIME_HEALTH_FAILED")
          print("FBS_LIVE_RUNTIME_STAGE="+json.dumps({
              "version":result.get("version"),
              "runtime":result.get("runtime"),
              "trigger_ok":result.get("trigger_ok"),
              "trigger_count":result.get("trigger_count"),
              "inner_finance_trigger_count":result.get("inner_finance_trigger_count"),
              "fbs_ingest_stages":result.get("fbs_ingest_stages"),
              "fbs_supply_stage":result.get("fbs_supply_stage")},
              ensure_ascii=False,separators=(",",":")),flush=True)
          PY
      - name: Read acceptance metrics from production books and archives
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.inspect_live_stage != true }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          url=os.environ["BRIDGE_URL"]
          key=os.environ["BRIDGE_KEY"]
          if not key:
              raise SystemExit("FBS_AUDIT_BRIDGE_SECRET_MISSING")
          runtime_payload=json.dumps({"token":key,"action":"health"}).encode("utf-8")
          runtime_request=urllib.request.Request(url,data=runtime_payload,
                headers={"Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(runtime_request,timeout=480) as response:
              runtime=json.loads(response.read().decode("utf-8"))
          runtime_result=runtime.get("result") or {}
          if runtime.get("ok") is not True or runtime_result.get("ok") is not True or runtime_result.get("trigger_ok") is not True:
              print("FBS_RUNTIME_HEALTH_FAILED "+json.dumps(runtime,ensure_ascii=False)[:6000],flush=True)
              raise SystemExit("FBS_RUNTIME_HEALTH_FAILED")
          print("FBS_RUNTIME_HEALTH="+json.dumps({k:runtime_result.get(k) for k in
                ("version","runtime","trigger","trigger_count","inner_finance_trigger_count",
                 "project_trigger_handlers","trigger_ok","fbs_ingest_stages","fbs_supply_stage")},
                ensure_ascii=False,separators=(",",":")),flush=True)
          health_payload=json.dumps({"token":key,"action":"fbs_targets_health"}).encode("utf-8")
          health_request=urllib.request.Request(url,data=health_payload,
                headers={"Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(health_request,timeout=480) as response:
              health=json.loads(response.read().decode("utf-8"))
          if health.get("ok") is not True or (health.get("result") or {}).get("ok") is not True:
              print("FBS_TARGET_HEALTH_FAILED "+json.dumps(health,ensure_ascii=False)[:6000],flush=True)
              raise SystemExit("FBS_TARGET_HEALTH_FAILED")
          print("FBS_TARGET_HEALTH="+json.dumps(health["result"],ensure_ascii=False,separators=(",",":")),flush=True)
          quality_issues=[]
          expected_charts={"SANYCH":27,"AIR":2,"HOZYAYUSHKA":22}
          for client in ("SANYCH","AIR","HOZYAYUSHKA","ARCHIVES"):
              payload=json.dumps({"token":key,"action":"fbs_acceptance_audit","client":client},
                                 ensure_ascii=False).encode("utf-8")
              request=urllib.request.Request(url,data=payload,
                    headers={"Content-Type":"application/json"},method="POST")
              with urllib.request.urlopen(request,timeout=480) as response:
                  raw=response.read().decode("utf-8")
              result=json.loads(raw)
              if result.get("ok") is not True or (result.get("result") or {}).get("ok") is not True:
                  print("FBS_AUDIT_FAILED client="+client+" response="+
                        json.dumps(result,ensure_ascii=False,separators=(",",":"))[:6000],flush=True)
                  raise SystemExit("FBS_PRODUCTION_ACCEPTANCE_FAILED:"+client)
              audit_data=result["result"]
              print("FBS_AUDIT_RESULT client="+client+" data="+
                    json.dumps(audit_data,ensure_ascii=False,separators=(",",":")),flush=True)
              if client=="ARCHIVES":
                  for archive in audit_data.get("archives") or []:
                      if not archive.get("accessible"):
                          quality_issues.append("ARCHIVE_UNAVAILABLE:"+str(archive.get("name")))
                      if not archive.get("ownerTargetMatches"):
                          quality_issues.append("ARCHIVE_OWNER_MISMATCH:"+str(archive.get("name")))
                      if (archive.get("archiveOrders") or {}).get("duplicateRows",0):
                          quality_issues.append("ARCHIVE_DUPLICATE_ORDERS:"+str(archive.get("name")))
              else:
                  client_data=(audit_data.get("clients") or {}).get(client) or {}
                  orders=client_data.get("orders") or {}
                  for field in ("duplicateRows","invalidIds","missingSupplierStatus","missingWbStatus","missingBothStatuses"):
                      if orders.get(field,0):
                          quality_issues.append(client+":"+field+"="+str(orders.get(field)))
                  analytics=client_data.get("analytics") or []
                  formula_errors=sum(int(sheet.get("formulaErrorCount") or 0) for sheet in analytics)
                  if formula_errors:
                      quality_issues.append(client+":formulaErrors="+str(formula_errors))
                  chart_total=int((client_data.get("charts") or {}).get("total") or 0)
                  if chart_total!=expected_charts[client]:
                      quality_issues.append(client+":charts="+str(chart_total)+" expected="+str(expected_charts[client]))
                  supply=client_data.get("supply") or {}
                  if not supply.get("exists"):
                      quality_issues.append(client+":SUPPLY_SHEET_MISSING")
              if client=="SANYCH":
                  alt=((audit_data.get("clients") or {}).get("SANYCH") or {}).get("alternate") or {}
                  if not alt.get("accessible"):
                      quality_issues.append("SANYCH_ALTERNATE_BOOK_UNAVAILABLE")
          if quality_issues:
              print("FBS_ACCEPTANCE_QUALITY_ISSUES="+json.dumps(quality_issues,ensure_ascii=False),flush=True)
              raise SystemExit("FBS_PRODUCTION_ACCEPTANCE_FAILED:QUALITY_GATE")
          print("FBS_PRODUCTION_ACCEPTANCE_AUDIT=PASS")
          PY
