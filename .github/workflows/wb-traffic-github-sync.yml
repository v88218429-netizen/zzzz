name: WB traffic GitHub sync

on:
  workflow_dispatch:
  schedule:
    - cron: "37 * * * *"
  push:
    branches: [mainggg]
    paths:
      - "wb_worker/traffic_sync.py"
      - "wb_worker/github_traffic_sync.py"
      - ".github/workflows/wb-traffic-github-sync.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: sellmonitor-summary-publish-serial
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mainggg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore GitHub traffic history
        shell: bash
        env:
          STATE_SECRET: ${{ secrets.SELLMONITOR_GITHUB_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          test -n "$STATE_SECRET"
          mkdir -p "$RUNNER_TEMP/wb-traffic/data"
          if git ls-remote --exit-code --heads origin traffic-state >/dev/null 2>&1; then
            git fetch --depth=1 origin traffic-state
            if git cat-file -e "FETCH_HEAD:state/traffic.tar.gz.enc" 2>/dev/null; then
              git show "FETCH_HEAD:state/traffic.tar.gz.enc" > "$RUNNER_TEMP/traffic.tar.gz.enc"
              openssl enc -d -aes-256-cbc -pbkdf2 \
                -pass env:STATE_SECRET \
                -in "$RUNNER_TEMP/traffic.tar.gz.enc" \
                -out "$RUNNER_TEMP/traffic.tar.gz"
              tar -xzf "$RUNNER_TEMP/traffic.tar.gz" -C "$RUNNER_TEMP/wb-traffic/data"
            fi
          fi

      - name: Install collector dependency
        run: python -m pip install --disable-pip-version-check httpx

      - name: Collect advertising and funnel facts from WB
        id: collect
        env:
          DATA_DIR: ${{ runner.temp }}/wb-traffic/data
          WB_API_TOKEN_AP: ${{ secrets.WB_API_TOKEN_AP }}
          WB_API_TOKEN_AA: ${{ secrets.WB_API_TOKEN_AA }}
          WB_API_TOKEN_YV: ${{ secrets.WB_API_TOKEN_YV }}
        run: python wb_worker/github_traffic_sync.py

      - name: Validate and save encrypted GitHub traffic history
        id: archive
        if: steps.collect.outcome == 'success'
        shell: bash
        env:
          STATE_SECRET: ${{ secrets.SELLMONITOR_GITHUB_WEBHOOK_SECRET }}
          DATA_DIR: ${{ runner.temp }}/wb-traffic/data
        run: |
          set -euo pipefail
          test -n "$STATE_SECRET"
          test -d "$DATA_DIR/traffic"
          python wb_worker/github_traffic_sync.py --publish
          test -s traffic_state_public.pem
          mkdir -p "$RUNNER_TEMP/wb-traffic-publish/state"
          tar -czf "$RUNNER_TEMP/traffic.tar.gz" -C "$DATA_DIR" .
          openssl enc -aes-256-cbc -salt -pbkdf2 \
            -pass env:STATE_SECRET \
            -in "$RUNNER_TEMP/traffic.tar.gz" \
            -out "$RUNNER_TEMP/wb-traffic-publish/state/traffic.tar.gz.enc"
          DASHBOARD_KEY="$(openssl rand -hex 32)"
          printf '%s' "$DASHBOARD_KEY" > "$RUNNER_TEMP/traffic-dashboard.key"
          openssl enc -aes-256-cbc -salt -pbkdf2 \
            -pass file:"$RUNNER_TEMP/traffic-dashboard.key" \
            -in "$RUNNER_TEMP/traffic.tar.gz" \
            -out "$RUNNER_TEMP/wb-traffic-publish/state/traffic-dashboard.tar.gz.enc"
          openssl pkeyutl -encrypt -pubin -inkey traffic_state_public.pem \
            -in "$RUNNER_TEMP/traffic-dashboard.key" \
            -out "$RUNNER_TEMP/wb-traffic-publish/state/traffic-dashboard.key.enc" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          python - <<'PY'
          import csv, json, os, pathlib
          root=pathlib.Path(os.environ['DATA_DIR'])/'traffic'
          status_path=root/'status.json'
          status=json.loads(status_path.read_text(encoding='utf-8')) if status_path.exists() else {}
          lines=[
              '# WB traffic encrypted state',
              '',
              '> Business rows and bid values are encrypted. This branch exposes only aggregate coverage counts and source status.',
              '',
              f"- Last collector finish: {status.get('finishedAt','unknown')}",
              f"- Last collector complete: {status.get('complete',status.get('ok',False))}",
              f"- Advertising window: {status.get('period','unknown')}",
              f"- Funnel window: {status.get('funnel_period','unknown')}",
          ]
          def row_count(path):
              if not path.is_file(): return 0
              with path.open('r',encoding='utf-8-sig',newline='') as stream:
                  return max(0,sum(1 for _ in stream)-1)
          def nonempty_count(path, field):
              if not path.is_file(): return 0
              with path.open('r',encoding='utf-8-sig',newline='') as stream:
                  return sum(1 for row in csv.DictReader(stream) if str(row.get(field) or '').strip())
          def state_for(filename, shop):
              path=root/filename
              if not path.is_file(): return 'UNAVAILABLE'
              value=json.loads(path.read_text(encoding='utf-8'))
              return 'OK' if (value.get('shops') or {}).get(shop,{}).get('ok') is True else 'PARTIAL'
          for shop, detail in sorted((status.get('shops') or {}).items()):
              folder=root/shop
              source='OK' if detail.get('ok') is True else 'FAILED'
              ads=row_count(folder/'campaign_sku_day.csv')
              funnel=row_count(folder/'funnel_sku_day.csv')
              organic=row_count(folder/'organic_sku_day.csv')
              clusters=folder/'ad_clusters_day.csv'
              settings=folder/'campaign_settings_current.csv'
              lines.append(
                  f"- {shop}: source={source}; ads={ads}; funnel={funnel}; organic={organic}; "
                  f"clusters={row_count(clusters)} ({state_for('clusters_status.json',shop)}); "
                  f"exact_cluster_bids={nonempty_count(clusters,'cluster_bid_kopecks')}; "
                  f"campaign_skus={row_count(settings)} ({state_for('campaign_settings_status.json',shop)}); "
                  f"exact_search_bids={nonempty_count(settings,'search_bid_kopecks')}"
              )
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'wb-traffic-publish'/'README.md').write_text(
              '\n'.join(lines)+'\n', encoding='utf-8')
          PY
          git worktree add --detach "$RUNNER_TEMP/wb-traffic-state-branch" HEAD
          git -C "$RUNNER_TEMP/wb-traffic-state-branch" switch --orphan traffic-state-next
          git -C "$RUNNER_TEMP/wb-traffic-state-branch" rm -rf . >/dev/null 2>&1 || true
          cp -R "$RUNNER_TEMP/wb-traffic-publish/." "$RUNNER_TEMP/wb-traffic-state-branch/"
          git -C "$RUNNER_TEMP/wb-traffic-state-branch" config user.name "wb-traffic-bot"
          git -C "$RUNNER_TEMP/wb-traffic-state-branch" config user.email "wb-traffic-bot@users.noreply.github.com"
          git -C "$RUNNER_TEMP/wb-traffic-state-branch" add README.md state/traffic.tar.gz.enc state/traffic-dashboard.tar.gz.enc state/traffic-dashboard.key.enc
          git -C "$RUNNER_TEMP/wb-traffic-state-branch" commit -m "traffic: encrypted collected history"
          git -C "$RUNNER_TEMP/wb-traffic-state-branch" push origin HEAD:traffic-state --force

