name: WB traffic GitHub sync

on:
  workflow_dispatch:
  schedule:
    - cron: "37 * * * *"
  push:
    branches: [mainggg]
    paths:
      - "wb_worker/traffic_sync.py"
      - "wb_worker/github_traffic_sync.py"
      - ".github/workflows/wb-traffic-github-sync.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: sellmonitor-summary-publish-serial
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mainggg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore GitHub traffic history
        shell: bash
        env:
          STATE_SECRET: ${{ secrets.SELLMONITOR_GITHUB_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          test -n "$STATE_SECRET"
          mkdir -p "$RUNNER_TEMP/wb-traffic/data"
          if git ls-remote --exit-code --heads origin traffic-state >/dev/null 2>&1; then
            git fetch --depth=1 origin traffic-state
            if git cat-file -e "FETCH_HEAD:state/traffic.tar.gz.enc" 2>/dev/null; then
              git show "FETCH_HEAD:state/traffic.tar.gz.enc" > "$RUNNER_TEMP/traffic.tar.gz.enc"
              openssl enc -d -aes-256-cbc -pbkdf2 \
                -pass env:STATE_SECRET \
                -in "$RUNNER_TEMP/traffic.tar.gz.enc" \
                -out "$RUNNER_TEMP/traffic.tar.gz"
              tar -xzf "$RUNNER_TEMP/traffic.tar.gz" -C "$RUNNER_TEMP/wb-traffic/data"
            fi
          fi

      - name: Install collector dependency
        run: python -m pip install --disable-pip-version-check httpx

      - name: Collect advertising and funnel facts from WB
        id: collect
        env:
          DATA_DIR: ${{ runner.temp }}/wb-traffic/data
          WB_API_TOKEN_AP: ${{ secrets.WB_API_TOKEN_AP }}
          WB_API_TOKEN_AA: ${{ secrets.WB_API_TOKEN_AA }}
          WB_API_TOKEN_YV: ${{ secrets.WB_API_TOKEN_YV }}
        run: python wb_worker/github_traffic_sync.py

      - name: Validate and save encrypted GitHub traffic history
        id: archive
        if: steps.collect.outcome == 'success'
        shell: bash
        env:
          STATE_SECRET: ${{ secrets.SELLMONITOR_GITHUB_WEBHOOK_SECRET }}
          DATA_DIR: ${{ runner.temp }}/wb-traffic/data
        run: |
          set -euo pipefail
          test -n "$STATE_SECRET"
          test -d "$DATA_DIR/traffic"
          python wb_worker/github_traffic_sync.py --publish
          test -s traffic_state_public.pem
          mkdir -p "$RUNNER_TEMP/wb-traffic-publish/state"
          tar -czf "$RUNNER_TEMP/traffic.tar.gz" -C "$DATA_DIR" .
          openssl enc -aes-256-cbc -salt -pbkdf2 \
            -pass env:STATE_SECRET \
            -in "$RUNNER_TEMP/traffic.tar.gz" \
            -out "$RUNNER_TEMP/wb-traffic-publish/state/traffic.tar.gz.enc"
          DASHBOARD_KEY="$(openssl rand -hex 32)"
          printf '%s' "$DASHBOARD_KEY" > "$RUNNER_TEMP/traffic-dashboard.key"
          openssl enc -aes-256-cbc -salt -pbkdf2 \
            -pass file:"$RUNNER_TEMP/traffic-dashboard.key" \
            -in "$RUNNER_TEMP/traffic.tar.gz" \
            -out "$RUNNER_TEMP/wb-traffic-publish/state/traffic-dashboard.tar.gz.enc"
          openssl pkeyutl -encrypt -pubin -inkey traffic_state_public.pem \
            -in "$RUNNER_TEMP/traffic-dashboard.key" \
            -out "$RUNNER_TEMP/wb-traffic-publish/state/traffic-dashboard.key.enc" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          python - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ['DATA_DIR'])/'traffic'
          status_path=root/'status.json'
          status=json.loads(status_path.read_text(encoding='utf-8')) if status_path.exists() else {}
          lines=[
              '# WB traffic encrypted state',
              '',
              '> Business rows are AES-256 encrypted. This branch contains no plain traffic rows or API tokens.',
              '',
              f"- Last collector finish: {status.get('finishedAt','unknown')}",
              f"- Last collector complete: {status.get('complete',status.get('ok',False))}",
              f"- Advertising window: {status.get('period','unknown')}",
              f"- Funnel window: {status.get('funnel_period','unknown')}",
          ]
          for shop, detail in sorted((status.get('shops') or {}).items()):
              state='OK' if detail.get('ok') else 'FAILED'
              lines.append(f"- {shop}: {state}")
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'wb-traffic-publish'/'README.md').write_text(
              '\n'.join(lines)+'\n', encoding='utf-8')
          PY
          git worktree add --detach "$RUNNER_TEMP/wb-traffic-state-branch" HEAD
          git -C "$RUNNER_TEMP/wb-traffic-state-branch" switch --orphan traffic-state-next
          git -C "$RUNNER_TEMP/wb-traffic-state-branch" rm -rf . >/dev/null 2>&1 || true
          cp -R "$RUNNER_TEMP/wb-traffic-publish/." "$RUNNER_TEMP/wb-traffic-state-branch/"
          git -C "$RUNNER_TEMP/wb-traffic-state-branch" config user.name "wb-traffic-bot"
          git -C "$RUNNER_TEMP/wb-traffic-state-branch" config user.email "wb-traffic-bot@users.noreply.github.com"
          git -C "$RUNNER_TEMP/wb-traffic-state-branch" add README.md state/traffic.tar.gz.enc state/traffic-dashboard.tar.gz.enc state/traffic-dashboard.key.enc
          git -C "$RUNNER_TEMP/wb-traffic-state-branch" commit -m "traffic: encrypted collected history"
          git -C "$RUNNER_TEMP/wb-traffic-state-branch" push origin HEAD:traffic-state --force

      - name: Publish verified traffic to the three store summaries
        if: steps.archive.outcome == 'success'
        shell: bash
        env:
          DATA_DIR: ${{ runner.temp }}/wb-traffic/data
          WEBAPP_DEPLOYMENT_ID: AKfycbyU_OXpFYqvBx0KDuGCgEHsnzkts_fnJzVe8DM8crRDD1A_fr5DqOfVfW_PYJriaXU_jw
          WEBHOOK_SECRET: ${{ secrets.SELLMONITOR_GITHUB_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          test -n "$WEBHOOK_SECRET"
          echo "::add-mask::$WEBHOOK_SECRET"
          python - <<'PY'
          import csv, json, os, pathlib, time, urllib.error, urllib.request

          root=pathlib.Path(os.environ["DATA_DIR"])/"traffic"
          status=json.loads((root/"status.json").read_text(encoding="utf-8"))
          expected=("ap","aa","yv")
          shops=status.get("shops") or {}
          if status.get("ok") is not True or not status.get("finishedAt") or any((shops.get(x) or {}).get("ok") is not True for x in expected):
              raise SystemExit("WB_TRAFFIC_SOURCE_GATE_FAILED")
          datasets={
              "ads":("campaign_sku_day.csv",["shop","date","advert_id","nm_id","views","clicks","atbs","orders","spend_rub","order_sum_rub","source","quality","seller_article"]),
              "funnel":("funnel_sku_day.csv",["shop","date","nm_id","vendor_code","open_count","cart_count","order_count","order_sum_rub","source"]),
              "organic":("organic_sku_day.csv",["shop","date","nm_id","vendor_code","total_open_count","paid_clicks","organic_clicks","source_total","source_paid","formula","coverage_status","campaigns_checked","campaigns_without_period_statistics","campaigns_with_null_payload"]),
              "ads_poll":("ads_poll_snapshot.csv",["shop","observed_at","date","campaign_sku_rows","campaigns_with_rows","views","clicks","cart_adds","orders","spend_rub","order_sum_rub","ctr","cpc_rub","drr","roas","source","measurement_grain"]),
              "funnel_poll":("funnel_poll_snapshot.csv",["shop","observed_at","date","sku_rows","open_count","cart_count","order_count","order_sum_rub","open_to_cart","cart_to_order","open_to_order","source","measurement_grain"]),
          }
          all_rows={}
          for name,(filename,headers) in datasets.items():
              with (root/filename).open("r",encoding="utf-8-sig",newline="") as fh:
                  reader=csv.DictReader(fh)
                  if reader.fieldnames!=headers: raise SystemExit("WB_TRAFFIC_HEADER_MISMATCH:"+name)
                  all_rows[name]=[[row[h] for h in headers] for row in reader]
          names={"ap":"Саныч","aa":"AIR","yv":"Хозяюшка"}
          url="https://script.google.com/macros/s/"+os.environ["WEBAPP_DEPLOYMENT_ID"]+"/exec"
          token=os.environ["WEBHOOK_SECRET"]
          def post(payload):
              body=json.dumps(dict(payload,token=token),ensure_ascii=False,separators=(",",":")).encode("utf-8")
              req=urllib.request.Request(url,data=body,headers={"Content-Type":"application/json"},method="POST")
              last=None
              for attempt in range(1,6):
                  try:
                      with urllib.request.urlopen(req,timeout=360) as response:
                          return json.loads(response.read().decode("utf-8"))
                  except urllib.error.HTTPError as exc:
                      last="HTTP_"+str(exc.code)
                      if exc.code<500 and exc.code!=429: break
                  except (urllib.error.URLError,TimeoutError,OSError,json.JSONDecodeError) as exc:
                      last=type(exc).__name__+":"+str(exc)[:180]
                  if attempt<5: time.sleep(min(60,15*(2**(attempt-1))))
              raise RuntimeError("WB_TRAFFIC_PUBLISH_REQUEST_FAILED:"+str(last))
          errors=[]
          for alias in expected:
              data={name:[row for row in rows if str(row[0]).strip()==alias] for name,rows in all_rows.items()}
              print("WB_TRAFFIC_STORE_INPUT="+alias+" "+json.dumps({k:len(v) for k,v in data.items()},sort_keys=True))
              common={"action":"publish_wb_traffic","sync_status":status,"datasets":data}
              failed=[]
              for dataset_name,rows in data.items():
                  if not rows: continue
                  try:
                      payload=dict(common,datasets={dataset_name:rows},partition_only=True,skip_daily_view=True)
                      partition=post(payload)
                      parts=partition.get("partitions") or {}
                      actual=(parts.get("datasets") or {}).get(dataset_name) or {}
                      if partition.get("ok") is not True or parts.get("ok") is not True or actual.get("skipped") is True or not actual.get("parts"):
                          raise RuntimeError("partition_readback_failed:"+json.dumps(partition,ensure_ascii=False)[:700])
                      print("WB_TRAFFIC_DATASET_PARTITION_OK="+alias+" "+dataset_name+" "+json.dumps({"input":len(rows),"written":actual.get("written"),"added":actual.get("added"),"updated":actual.get("updated"),"parts":len(actual.get("parts") or [])},ensure_ascii=False,sort_keys=True))
                  except Exception as exc:
                      failed.append(dataset_name+":"+str(exc)[:700])
                      print("WB_TRAFFIC_DATASET_FAILED="+alias+" "+dataset_name+" "+str(exc)[:700])
              if failed:
                  errors.append(alias+":partition:"+json.dumps(failed,ensure_ascii=False))
                  print("WB_TRAFFIC_STORE_FAILED="+alias+" partition failed; visible summary preserved")
                  continue
              try:
                  view=post(dict(common,daily_view_store=True,store_name=names[alias]))
                  daily=((view.get("partitions") or {}).get("daily_view") or {})
                  lite=daily.get("lite_tables") or {}
                  if view.get("ok") is not True or daily.get("ok") is not True or lite.get("ok") is not True or names[alias] not in (lite.get("stores") or []):
                      raise RuntimeError("summary_readback_failed:"+json.dumps(view,ensure_ascii=False)[:900])
                  print("WB_TRAFFIC_SUMMARY_READBACK_OK="+alias+" "+json.dumps({"store":names[alias],"fresh_rows":daily.get("fresh_rows"),"rows":daily.get("rows"),"added":daily.get("added"),"updated":daily.get("updated"),"max_date":daily.get("max_date"),"written":lite.get("stores")},ensure_ascii=False))
              except Exception as exc:
                  errors.append(alias+":summary:"+str(exc)[:1000])
                  print("WB_TRAFFIC_STORE_FAILED="+alias+" "+str(exc)[:1000])
          if errors: raise SystemExit("WB_TRAFFIC_SUMMARY_PUBLICATION_FAILED:"+json.dumps(errors,ensure_ascii=False))
          PY

