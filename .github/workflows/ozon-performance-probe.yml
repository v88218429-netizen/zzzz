name: Ozon Performance API probe
on:
  push:
    branches: [mainggg]
    paths:
      - "ozon_performance_radar/**"
      - ".github/workflows/ozon-performance-probe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - store: DOM
            client_id: "104833953-1790097620618@advertising.performance.ozon.ru"
            secret_name: OZON_PERF_DOM_SECRET
          - store: HOZYAIKA
            client_id: "104833980-1790097716038@advertising.performance.ozon.ru"
            secret_name: OZON_PERF_HOZYAIKA_SECRET
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OZON_STORE: ${{ matrix.store }}
      OZON_PERF_CLIENT_ID: ${{ matrix.client_id }}
      OZON_PERF_CLIENT_SECRET: ${{ matrix.secret_name == 'OZON_PERF_DOM_SECRET' && secrets.OZON_PERF_DOM_SECRET || secrets.OZON_PERF_HOZYAIKA_SECRET }}
      TEST_SKU: "5094364543"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Credential capability
        shell: bash
        run: |
          test -n "$OZON_PERF_CLIENT_SECRET" || { echo "STORE=$OZON_STORE PERFORMANCE_CREDENTIALS=missing"; exit 2; }
          echo "::add-mask::$OZON_PERF_CLIENT_SECRET"
          echo "STORE=$OZON_STORE PERFORMANCE_CREDENTIALS=present"\n          echo "STORE=$OZON_STORE SECRET_LENGTH=${#OZON_PERF_CLIENT_SECRET}"
      - run: pip install requests
      - name: Live Performance probe
        run: python ozon_performance_radar/worker.py
