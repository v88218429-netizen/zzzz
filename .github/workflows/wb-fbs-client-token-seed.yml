name: WB FBS client token seed

on:
  push:
    branches: [mainggg]
    paths:
      - ".github/workflows/wb-fbs-client-token-seed.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      WB_API_TOKEN_AA: \${{ secrets.WB_API_TOKEN_AA }}
      WB_API_TOKEN_YV: \${{ secrets.WB_API_TOKEN_YV }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate configured credentials without displaying them
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLASPRC_JSON"
          test -n "$WB_API_TOKEN_AA"
          test -n "$WB_API_TOKEN_YV"

      - name: Seed WB keys into AIR and Hozyayushka
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const root = JSON.parse(process.env.CLASPRC_JSON);
          const nestedTokens = root && root.tokens && typeof root.tokens === 'object' ? Object.values(root.tokens) : [];
          const entries = [root, ...Object.values(root).filter(x => x && typeof x === 'object'), ...nestedTokens];
          let auth = null;
          for (const entry of entries) {
            const token = entry.token && typeof entry.token === 'object' ? entry.token : entry;
            const settings = entry.oauth2ClientSettings || entry.oauth2Client || root.oauth2ClientSettings || {};
            const refreshToken = token.refresh_token || entry.refresh_token;
            const clientId = settings.clientId || settings.client_id || entry.client_id;
            const clientSecret = settings.clientSecret || settings.client_secret || entry.client_secret;
            if (refreshToken && clientId && clientSecret) {
              auth = {refreshToken, clientId, clientSecret};
              break;
            }
          }
          if (!auth) {
            process.stderr.write('CLASPRC_SHAPE_INVALID\n');
            process.exit(1);
          }

          const expectedProject = '435346549124';
          const clientProject = (auth.clientId.match(/^(\d+)-[^.]+\.apps\.googleusercontent\.com$/) || [])[1] || '';
          if (clientProject !== expectedProject) {
            process.stderr.write('BLOCKED_OAUTH_CLIENT_PROJECT_MISMATCH: expected ' + expectedProject +
              ', found ' + (clientProject || 'UNPARSEABLE') + '. Replace CLASPRC_JSON with authorization from WB FBS Clients.\n');
            process.exit(1);
          }

          (async () => {
            const refresh = await fetch('https://oauth2.googleapis.com/token', {
              method: 'POST',
              headers: {'content-type': 'application/x-www-form-urlencoded'},
              body: new URLSearchParams({
                client_id: auth.clientId,
                client_secret: auth.clientSecret,
                refresh_token: auth.refreshToken,
                grant_type: 'refresh_token',
              }),
            });
            if (!refresh.ok) {
              process.stderr.write('GOOGLE_OAUTH_REFRESH_HTTP=' + refresh.status + '\n');
              process.exit(1);
            }
            const refreshed = await refresh.json();
            if (!refreshed.access_token) {
              process.stderr.write('GOOGLE_OAUTH_REFRESH_NO_ACCESS_TOKEN\n');
              process.exit(1);
            }

            const requiredScopes = [
              'https://www.googleapis.com/auth/script.projects',
              'https://www.googleapis.com/auth/script.deployments',
              'https://www.googleapis.com/auth/spreadsheets',
              'https://www.googleapis.com/auth/drive',
              'https://www.googleapis.com/auth/script.scriptapp',
              'https://www.googleapis.com/auth/script.external_request',
              'https://www.googleapis.com/auth/script.storage',
            ];
            if (!refreshed.scope) {
              process.stderr.write('BLOCKED_OAUTH_SCOPE_CLAIM_UNAVAILABLE\n');
              process.exit(1);
            }
            const granted = new Set(String(refreshed.scope).split(/\s+/).filter(Boolean));
            const missing = requiredScopes.filter(scope => !granted.has(scope)).map(scope => scope.split('/').pop());
            if (missing.length) {
              process.stderr.write('BLOCKED_OAUTH_SCOPES_MISSING=' + missing.join(',') + '\n');
              process.exit(1);
            }

            const clients = [
              {name: 'AIR', scriptId: '1snEntW5W9KZ_zKHP5bT4D-fmr-sbDdjV4-izjRxf46l8HWcrt3GJqU9V', token: process.env.WB_API_TOKEN_AA},
              {name: 'HOZYAYUSHKA', scriptId: '1c7CIF9OE-PSVYpj9d9c6LuzsORWVV13o7AuAq6Ds6LlogoLX69gmisZi', token: process.env.WB_API_TOKEN_YV},
            ];

            for (const client of clients) {
              const list = await fetch('https://script.googleapis.com/v1/projects/' + client.scriptId + '/deployments?pageSize=100', {
                headers: {'authorization': 'Bearer ' + refreshed.access_token},
              });
              let listed = {};
              try { listed = await list.json(); } catch (_) {}
              if (!list.ok) {
                const status = String(listed.error && listed.error.status || 'UNKNOWN').replace(/[^A-Z0-9_]/g, '').slice(0, 40);
                process.stderr.write(client.name + ': DEPLOYMENT_LIST_HTTP=' + list.status + ' STATUS=' + status + '\n');
                process.exit(1);
              }
              const executables = (Array.isArray(listed.deployments) ? listed.deployments : [])
                .filter(d => Array.isArray(d.entryPoints) && d.entryPoints.some(e => e.entryPointType === 'EXECUTION_API'))
                .sort((a, b) => {
                  const av = Number(a.deploymentConfig && a.deploymentConfig.versionNumber || 0);
                  const bv = Number(b.deploymentConfig && b.deploymentConfig.versionNumber || 0);
                  if (av !== bv) return bv - av;
                  return String(b.updateTime || '').localeCompare(String(a.updateTime || ''));
                });
              if (!executables.length) {
                process.stderr.write(client.name + ': API_EXECUTABLE_NOT_FOUND\n');
                process.exit(1);
              }

              const deploymentId = executables[0].deploymentId;
              const response = await fetch('https://script.googleapis.com/v1/scripts/' + deploymentId + ':run', {
                method: 'POST',
                headers: {
                  'authorization': 'Bearer ' + refreshed.access_token,
                  'content-type': 'application/json',
                },
                body: JSON.stringify({
                  function: 'setWbApiTokenFromGitHubV1',
                  parameters: [client.token],
                  devMode: true,
                }),
              });
              let result = {};
              try { result = await response.json(); } catch (_) {}
              if (!response.ok) {
                const code = Number(result.error && result.error.code || response.status);
                const reason = String(result.error && result.error.status || 'UNKNOWN').replace(/[^A-Z0-9_]/g, '').slice(0, 40);
                process.stderr.write(client.name + ': APPS_SCRIPT_HTTP=' + response.status +
                  ' API_CODE=' + (Number.isFinite(code) ? code : 0) + ' REASON=' + reason + '\n');
                process.exit(1);
              }
              const value = result.response && result.response.result || {};
              if (result.error || value.ok !== true || value.tokenStored !== true || value.apiVerified !== true) {
                process.stderr.write(client.name + ': SCRIPT_EXECUTION_OR_WB_API_CHECK_FAILED\n');
                process.exit(1);
              }
              process.stdout.write(client.name + ': WB API token stored and accepted\n');
            }
          })().catch(() => {
            process.stderr.write('APPS_SCRIPT_CALL_FAILED\n');
            process.exit(1);
          });
          NODE
