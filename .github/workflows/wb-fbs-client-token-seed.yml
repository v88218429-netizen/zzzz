name: WB FBS client token seed

on:
  push:
    branches: [mainggg]
    paths:
      - ".github/workflows/wb-fbs-client-token-seed.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      WB_API_TOKEN_AA: ${{ secrets.WB_API_TOKEN_AA }}
      WB_API_TOKEN_YV: ${{ secrets.WB_API_TOKEN_YV }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate configured credentials without displaying them
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLASPRC_JSON"
          test -n "$WB_API_TOKEN_AA"
          test -n "$WB_API_TOKEN_YV"

      - name: Transfer keys through the private Apps Script API
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const root = JSON.parse(process.env.CLASPRC_JSON);
          const nestedTokens = root && root.tokens && typeof root.tokens === 'object' ? Object.values(root.tokens) : [];
          const entries = [root, ...Object.values(root).filter(x => x && typeof x === 'object'), ...nestedTokens];
          let auth = null;
          for (const entry of entries) {
            const token = entry.token && typeof entry.token === 'object' ? entry.token : entry;
            const settings = entry.oauth2ClientSettings || entry.oauth2Client || root.oauth2ClientSettings || {};
            const refreshToken = token.refresh_token || entry.refresh_token;
            const clientId = settings.clientId || settings.client_id || entry.client_id;
            const clientSecret = settings.clientSecret || settings.client_secret || entry.client_secret;
            if (refreshToken && clientId && clientSecret) {
              auth = {refreshToken, clientId, clientSecret};
              break;
            }
          }
          if (!auth) {
            process.stderr.write('CLASPRC_SHAPE_INVALID\n');
            process.exit(1);
          }
          (async () => {
            const refresh = await fetch('https://oauth2.googleapis.com/token', {
              method:'POST',
              headers:{'content-type':'application/x-www-form-urlencoded'},
              body:new URLSearchParams({
                client_id:auth.clientId,
                client_secret:auth.clientSecret,
                refresh_token:auth.refreshToken,
                grant_type:'refresh_token',
              }),
            });
            if (!refresh.ok) {
              process.stderr.write('GOOGLE_OAUTH_REFRESH_HTTP=' + refresh.status + '\n');
              process.exit(1);
            }
            const refreshed = await refresh.json();
            if (!refreshed.access_token) {
              process.stderr.write('GOOGLE_OAUTH_REFRESH_NO_ACCESS_TOKEN\n');
              process.exit(1);
            }
            const clients = [
              {name:'AIR', deployment:'AKfycbwGKBniZxxHrACCDuxQwfd-sAs8FMBxlDKvUbXCEAkZMAqeyynt9eRNpL-1ty3wZluw', token:process.env.WB_API_TOKEN_AA},
              {name:'HOZYAYUSHKA', deployment:'AKfycbzcu_Y1hQnq5BPGz5eTzc0D9hXbNwVeeQXB_q86Qd3F5xRTM7IbzUjOxSIfZyZnRCYr3Q', token:process.env.WB_API_TOKEN_YV},
            ];
            for (const client of clients) {
              const response = await fetch('https://script.googleapis.com/v1/scripts/' + client.deployment + ':run', {
                method:'POST',
                headers:{
                  'authorization':'Bearer ' + refreshed.access_token,
                  'content-type':'application/json',
                },
                body:JSON.stringify({
                  function:'setWbApiTokenFromGitHubV1',
                  parameters:[client.token],
                  devMode:true,
                }),
              });
              let result = {};
              try { result = await response.json(); } catch (_) {}
              if (!response.ok) {
                const code = Number(result.error && result.error.code || response.status);
                process.stderr.write(client.name + ': APPS_SCRIPT_HTTP=' + response.status + ' API_CODE=' + (Number.isFinite(code) ? code : 0) + '\n');
                process.exit(1);
              }
              const value = result.response && result.response.result || {};
              if (result.error || value.ok !== true || value.tokenStored !== true || value.apiVerified !== true) {
                process.stderr.write(client.name + ': SCRIPT_EXECUTION_OR_WB_API_CHECK_FAILED\n');
                process.exit(1);
              }
              process.stdout.write(client.name + ': WB token stored; WB API accepted it\n');
            }
          })().catch(() => {
            process.stderr.write('APPS_SCRIPT_CALL_FAILED\n');
            process.exit(1);
          });
          NODE
