name: WB FBS client token seed

on:
  push:
    branches: [mainggg]
    paths:
      - ".github/workflows/wb-fbs-client-token-seed.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Send GitHub-held WB keys to the verified client ingresses
        env:
          WB_API_TOKEN_AA: ${{ secrets.WB_API_TOKEN_AA }}
          WB_API_TOKEN_YV: ${{ secrets.WB_API_TOKEN_YV }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const inputs = [
            {
              store: "AIR",
              url: "https://script.google.com/macros/s/AKfycbw92e1aJ7yUPkJR50gKqhlctnQC2rUYUH58-l6JgRAAfKSqY9v5sRpFbTo3otcjqP8/exec",
              wbToken: process.env.WB_API_TOKEN_AA
            },
            {
              store: "HOZYAYUSHKA",
              url: "https://script.google.com/macros/s/AKfycbye-H-ZcFT76FQy--RaHQ5tUboiVS5RzUaY3K1FLkb1IGtvwMZIlWuwl2IwiENr1t08oQ/exec",
              wbToken: process.env.WB_API_TOKEN_YV
            }
          ];
          const githubToken = process.env.GITHUB_TOKEN;
          const runId = process.env.GITHUB_RUN_ID;
          const runAttempt = process.env.GITHUB_RUN_ATTEMPT;

          if (!githubToken || !runId || !runAttempt) {
            throw new Error("GitHub run credentials are not available.");
          }
          for (const input of inputs) {
            if (!input.wbToken) {
              console.error(input.store + ": WB key secret is not configured.");
              process.exitCode = 1;
            }
          }
          if (process.exitCode) process.exit(1);

          async function send(input) {
            try {
              const response = await fetch(input.url, {
                method: "POST",
                headers: { "content-type": "application/json", "cache-control": "no-store" },
                body: JSON.stringify({
                  store: input.store,
                  wb_token: input.wbToken,
                  github_token: githubToken,
                  run_id: runId,
                  run_attempt: runAttempt
                }),
                signal: AbortSignal.timeout(30000)
              });
              let result = null;
              try { result = await response.json(); } catch {}
              const verified = Boolean(
                result &&
                result.ok === true &&
                result.tokenStored === true &&
                result.apiVerified === true
              );
              console.log(JSON.stringify({
                store: input.store,
                httpStatus: response.status,
                verified,
                duplicate: Boolean(result && result.duplicate === true)
              }));
              return verified;
            } catch (error) {
              console.error(input.store + ": ingress request failed (" + error.name + ").");
              return false;
            }
          }

          (async () => {
            const results = [];
            for (const input of inputs) results.push(await send(input));
            if (results.some(value => !value)) process.exitCode = 1;
          })().catch(() => {
            console.error("Ingress step failed.");
            process.exitCode = 1;
          });
          NODE
