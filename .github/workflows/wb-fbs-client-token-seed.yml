name: WB FBS client token seed

on:
  push:
    branches: [mainggg]
    paths:
      - ".github/workflows/wb-fbs-client-token-seed.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Diagnose OAuth project, scopes, and API deployments without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLASPRC_JSON"
          node <<'NODE'
          const root = JSON.parse(process.env.CLASPRC_JSON);
          const nestedTokens = root && root.tokens && typeof root.tokens === 'object' ? Object.values(root.tokens) : [];
          const entries = [root, ...Object.values(root).filter(x => x && typeof x === 'object'), ...nestedTokens];
          let auth = null;
          for (const entry of entries) {
            const token = entry.token && typeof entry.token === 'object' ? entry.token : entry;
            const settings = entry.oauth2ClientSettings || entry.oauth2Client || root.oauth2ClientSettings || {};
            const refreshToken = token.refresh_token || entry.refresh_token;
            const clientId = settings.clientId || settings.client_id || entry.client_id;
            const clientSecret = settings.clientSecret || settings.client_secret || entry.client_secret;
            if (refreshToken && clientId && clientSecret) {
              auth = {refreshToken, clientId, clientSecret};
              break;
            }
          }
          if (!auth) {
            process.stderr.write('CLASPRC_SHAPE_INVALID\n');
            process.exit(1);
          }
          const clientProject = (auth.clientId.match(/^(\d+)-[^.]+\.apps\.googleusercontent\.com$/) || [])[1] || 'UNPARSEABLE';
          process.stdout.write('OAUTH_CLIENT_PROJECT_NUMBER=' + clientProject + '\n');
          (async () => {
            const refresh = await fetch('https://oauth2.googleapis.com/token', {
              method: 'POST',
              headers: {'content-type': 'application/x-www-form-urlencoded'},
              body: new URLSearchParams({
                client_id: auth.clientId,
                client_secret: auth.clientSecret,
                refresh_token: auth.refreshToken,
                grant_type: 'refresh_token',
              }),
            });
            if (!refresh.ok) {
              process.stdout.write('GOOGLE_OAUTH_REFRESH_HTTP=' + refresh.status + '\n');
              return;
            }
            const refreshed = await refresh.json();
            if (!refreshed.access_token) {
              process.stdout.write('GOOGLE_OAUTH_REFRESH_NO_ACCESS_TOKEN\n');
              return;
            }
            const scopeSet = new Set(String(refreshed.scope || '').split(/\s+/).filter(Boolean));
            const scopes = [
              'https://www.googleapis.com/auth/script.projects',
              'https://www.googleapis.com/auth/script.deployments',
              'https://www.googleapis.com/auth/spreadsheets',
              'https://www.googleapis.com/auth/drive',
              'https://www.googleapis.com/auth/script.scriptapp',
              'https://www.googleapis.com/auth/script.external_request',
              'https://www.googleapis.com/auth/script.storage',
            ];
            for (const scope of scopes) {
              const key = scope.split('/').pop();
              process.stdout.write('OAUTH_SCOPE_' + key.toUpperCase() + '=' + (refreshed.scope ? (scopeSet.has(scope) ? 'YES' : 'NO') : 'CLAIM_UNAVAILABLE') + '\n');
            }
            const clients = [
              {name: 'AIR', scriptId: '1snEntW5W9KZ_zKHP5bT4D-fmr-sbDdjV4-izjRxf46l8HWcrt3GJqU9V'},
              {name: 'HOZYAYUSHKA', scriptId: '1c7CIF9OE-PSVYpj9d9c6LuzsORWVV13o7AuAq6Ds6LlogoLX69gmisZi'},
            ];
            for (const client of clients) {
              const response = await fetch('https://script.googleapis.com/v1/projects/' + client.scriptId + '/deployments?pageSize=100', {
                headers: {'authorization': 'Bearer ' + refreshed.access_token},
              });
              let data = {};
              try { data = await response.json(); } catch (_) {}
              if (!response.ok) {
                const status = String(data.error && data.error.status || 'UNKNOWN').replace(/[^A-Z0-9_]/g, '').slice(0, 40);
                process.stdout.write(client.name + ': DEPLOYMENT_LIST_HTTP=' + response.status + ' STATUS=' + status + '\n');
                continue;
              }
              const deployments = Array.isArray(data.deployments) ? data.deployments : [];
              const executables = deployments.filter(d => Array.isArray(d.entryPoints) &&
                d.entryPoints.some(e => e.entryPointType === 'EXECUTION_API'));
              process.stdout.write(client.name + ': DEPLOYMENTS=' + deployments.length +
                ' API_EXECUTABLES=' + executables.length +
                ' API_DEPLOYMENT_IDS=' + (executables.map(d => d.deploymentId).join(',') || 'NONE') + '\n');
            }
          })().catch(() => {
            process.stderr.write('DIAGNOSTIC_REQUEST_FAILED\n');
            process.exit(1);
          });
          NODE
