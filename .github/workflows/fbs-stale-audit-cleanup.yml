name: WB FBS stale audit cleanup

on:
  push:
    branches: [mainggg]
    paths:
      - ".github/workflows/fbs-stale-audit-cleanup.yml"

permissions:
  actions: write
  contents: read

jobs:
  cancel-stale-read-only-audits:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel only verified stale acceptance runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime as dt, json, os, urllib.request
          repo=os.environ["REPOSITORY"]
          token=os.environ["GH_TOKEN"]
          headers={"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json",
                   "X-GitHub-Api-Version":"2022-11-28"}
          targets={41430855567,41431714138}
          for run_id in sorted(targets):
              url=f"https://api.github.com/repos/{repo}/actions/runs/{run_id}"
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=20) as response:
                  run=json.load(response)
              if run.get("path")!=".github/workflows/wb-fbs-production-acceptance-audit.yml":
                  raise SystemExit(f"REFUSED unexpected workflow run {run_id}")
              created=dt.datetime.fromisoformat(run["created_at"].replace("Z","+00:00"))
              age=(dt.datetime.now(dt.timezone.utc)-created).total_seconds()
              if age<7200:
                  raise SystemExit(f"REFUSED run {run_id} is not older than two hours")
              if run.get("status") not in {"queued","in_progress","pending","waiting","requested"}:
                  print(f"FBS_STALE_AUDIT_ALREADY_FINISHED run={run_id} status={run.get('status')}")
                  continue
              cancel=f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/cancel"
              request=urllib.request.Request(cancel,data=b"{}",headers={**headers,"Content-Type":"application/json"},method="POST")
              with urllib.request.urlopen(request,timeout=20) as response:
                  if response.status not in (202,200):
                      raise SystemExit(f"CANCEL_HTTP_{response.status} run={run_id}")
              print(f"FBS_STALE_AUDIT_CANCEL_REQUESTED run={run_id} age_seconds={int(age)}")
          PY
