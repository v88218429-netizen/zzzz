name: WB FBS stale audit cleanup

on:
  push:
    branches: [mainggg]
    paths:
      - ".github/workflows/fbs-stale-audit-cleanup.yml"

permissions:
  actions: write
  contents: read

jobs:
  cancel-stale-read-only-audits:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel only the stale read-only audit retry
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime as dt, json, os, urllib.request
          repo=os.environ["REPOSITORY"]; token=os.environ["GH_TOKEN"]
          headers={"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json",
                   "X-GitHub-Api-Version":"2022-11-28"}
          for run_id in (41430855567,):
              url=f"https://api.github.com/repos/{repo}/actions/runs/{run_id}"
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=20) as response:
                  run=json.load(response)
              if (run.get("path")!=".github/workflows/wb-fbs-production-acceptance-audit.yml"
                  or run.get("run_attempt")!=2):
                  raise SystemExit(f"REFUSED unexpected run state id={run_id} attempt={run.get('run_attempt')} path={run.get('path')}")
              created=dt.datetime.fromisoformat(run["created_at"].replace("Z","+00:00"))
              age=(dt.datetime.now(dt.timezone.utc)-created).total_seconds()
              if age<7200:
                  raise SystemExit(f"REFUSED run {run_id} is not stale")
              if run.get("status") in {"queued","in_progress","pending","waiting","requested"}:
                  cancel=f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/cancel"
                  request=urllib.request.Request(cancel,data=b"{}",headers={**headers,"Content-Type":"application/json"},method="POST")
                  with urllib.request.urlopen(request,timeout=20) as response:
                      if response.status not in (202,200):
                          raise SystemExit(f"CANCEL_HTTP_{response.status}")
                  print(f"FBS_STALE_AUDIT_CANCEL_REQUESTED run={run_id} attempt=2",flush=True)
              else:
                  print(f"FBS_STALE_AUDIT_ALREADY_FINISHED run={run_id} status={run.get('status')}",flush=True)
          PY
