name: WB content manager read-only sync

on:
  push:
    branches:
      - mainggg
    paths:
      - "wb_worker/github_content_manager_sync.py"
      - ".github/workflows/wb-content-manager-sync.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: wb-content-manager-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WB_API_TOKEN_AP: ${{ secrets.WB_API_TOKEN_AP }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      TARGET_SPREADSHEET_ID: "1--8PzvW7quVjolA5FmMS9tBNHA-IXGtFJyadWbt3eSA"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check configured credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WB_API_TOKEN_AP"
          test -n "$CLASPRC_JSON"
      - name: Read WB Content API and refresh the sheet
        run: python wb_worker/github_content_manager_sync.py
