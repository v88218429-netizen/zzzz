name: WB content manager sync

on:
  push:
    branches: [mainggg]
    paths:
      - "wb_worker/github_content_manager_sync.py"
      - ".github/workflows/wb-content-manager-sync.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  workflow_run:
    workflows:
      - Sellmonitor GitHub worker deploy
    branches:
      - mainggg
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: wb-content-manager-sync
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WB_API_TOKEN_AP: ${{ secrets.WB_API_TOKEN_AP }}
      WB_API_TOKEN_AP_WRITE: ${{ secrets.WB_API_TOKEN_AP_WRITE || secrets.WB_API_TOKEN_AP }}
      WEBHOOK_SECRET: ${{ secrets.SELLMONITOR_GITHUB_WEBHOOK_SECRET }}
      WEBAPP_DEPLOYMENT_ID: "AKfycbyU_OXpFYqvBx0KDuGCgEHsnzkts_fnJzVe8DM8crRDD1A_fr5DqOfVfW_PYJriaXU_jw"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mainggg
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image converter
        run: python -m pip install --disable-pip-version-check "Pillow>=10,<13"
      - name: Check configured credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WB_API_TOKEN_AP"
          test -n "$WB_API_TOKEN_AP_WRITE"
          test -n "$WEBHOOK_SECRET"
          test -n "$WEBAPP_DEPLOYMENT_ID"
      - name: Read WB Content API and publish through authenticated bridge
        run: python wb_worker/github_content_manager_sync.py
