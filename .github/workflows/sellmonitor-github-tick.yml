name: Sellmonitor GitHub central tick

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sellmonitor-github-central-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      WEBHOOK_SECRET: ${{ secrets.SELLMONITOR_GITHUB_WEBHOOK_SECRET }}
      WEBAPP_DEPLOYMENT_ID: ${{ secrets.SELLMONITOR_WEBAPP_DEPLOYMENT_ID }}
    steps:
      - name: Require web worker secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WEBHOOK_SECRET"
          test -n "$WEBAPP_DEPLOYMENT_ID"

      - name: Execute central worker
        shell: bash
        run: |
          set -euo pipefail
          URL="https://script.google.com/macros/s/$WEBAPP_DEPLOYMENT_ID/exec"
          BODY="$(python - <<'PY'
          import json, os
          print(json.dumps({'token': os.environ['WEBHOOK_SECRET'], 'action': 'tick'}))
          PY
          )"
          RESP="$(curl -fsSL --max-time 120 -H 'Content-Type: application/json' --data-binary "$BODY" "$URL")"
          RESP="$RESP" python - <<'PY'
          import json, os
          obj=json.loads(os.environ['RESP'])
          if not obj.get('ok'):
              raise SystemExit('central tick failed: ' + str(obj.get('error') or obj))
          tick=obj.get('tick') or {}
          if tick.get('ok') is not True:
              raise SystemExit('worker returned failure: ' + str(tick))
          print(json.dumps({
              'ok': True,
              'processedClients': tick.get('processedClients'),
              'processedCommands': tick.get('processedCommands'),
              'version': tick.get('version'),
          }, ensure_ascii=False))
          PY
