name: Sellmonitor GitHub worker source check

on:
  workflow_dispatch:
  push:
    branches: [mainggg]
    paths:
      - "sellmonitor_github_worker/**"
      - ".github/workflows/sellmonitor-github-tick.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify worker source
        shell: bash
        run: |
          set -euo pipefail
          cd sellmonitor_github_worker
          python -m unittest -v test_core.py
          cd ..
          cp sellmonitor_github_worker/SELLMONITOR_GITHUB_WORKER.gs /tmp/sellmonitor_worker.js
          node --check /tmp/sellmonitor_worker.js
          python -m py_compile sellmonitor_github_worker/patch_master.py
