name: Sellmonitor GitHub central tick

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sellmonitor-github-central-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SCRIPT_ID: "15tH3jwOa5hKJFahIyPX5AIXO7KRf1O4jusfDfPIdX6KeH_GqMUC71hNT"
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Require GitHub-hosted Google auth
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLASPRC_JSON" || {
            echo "::error::CLASPRC_JSON missing; add one Google OAuth credential to GitHub Secrets. Make and Mac are not used."
            exit 20
          }

      - name: Materialize authorized adapter
        shell: bash
        run: |
          set -euo pipefail
          npm install -g @google/clasp
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          D="$(mktemp -d)"
          echo "WORKER_DIR=$D" >> "$GITHUB_ENV"
          cd "$D"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$SCRIPT_ID" > .clasp.json
          clasp pull
          test -f appsscript.json

      - name: Self-heal deployed worker from GitHub
        shell: bash
        run: |
          set -euo pipefail
          cp sellmonitor_github_worker/SELLMONITOR_GITHUB_WORKER.gs "$WORKER_DIR/SELLMONITOR_GITHUB_WORKER.gs"
          cp "$WORKER_DIR/SELLMONITOR_GITHUB_WORKER.gs" /tmp/sellmonitor_worker.js
          node --check /tmp/sellmonitor_worker.js
          cd "$WORKER_DIR"
          clasp push -f

      - name: Health and platform READY
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKER_DIR"
          clasp run sellmonitorGithubHealth
          clasp run sellmonitorGithubPlatformReady

      - name: Run central queue
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKER_DIR"
          clasp run sellmonitorGithubTick
