name: Diagnose AIR Apps Script through GitHub

on:
  push:
    branches: [mainggg]
    paths:
      - ".github/workflows/diagnose-air-bound-apps-script.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Pull AIR Apps Script source read-only
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          AIR_SCRIPT_ID: 1snEntW5W9KZ_zKHP5bT4D-fmr-sbDdjV4-izjRxf46l8HWcrt3GJqU9V
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          mkdir -p /tmp/air-bound-script
          printf '{"scriptId":"%s","rootDir":"."}\n' "$AIR_SCRIPT_ID" > /tmp/air-bound-script/.clasp.json
          cd /tmp/air-bound-script
          clasp pull

      - name: Report deployed web app access
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/air-bound-script
          clasp deployments --json > /tmp/air-deployments.json
          python3 - <<'PY'
          import json, pathlib
          data=json.loads(pathlib.Path('/tmp/air-deployments.json').read_text())
          items=data.get('deployments',[]) if isinstance(data,dict) else data
          target='AKfycbxyxnfxFl3GLkTukEDoM-n4gOnlslMv52Ghl2pGho9tQWpnSf6aSXAg7qZZFwtfnrKb'
          api_count=0
          api_access=[]
          entry_types=[]
          target_found=False
          for item in items:
              entry=item.get('entryPoints',[])
              entry_types.extend(str(x.get('entryPointType','unknown')) for x in entry)
              executable=[x.get('executionApi',{}) for x in entry if x.get('entryPointType')=='EXECUTION_API']
              api_count+=len(executable)
              api_access.extend(x.get('access') for x in executable if x.get('access'))
              if item.get('deploymentId')==target:
                  target_found=True
                  web=[x.get('webApp',{}) for x in entry if x.get('entryPointType')=='WEB_APP']
                  access=(web[0] or {}).get('access','unknown') if web else 'no_web_app_entry_point'
                  print('AIR_TARGET_DEPLOYMENT_KEYS='+','.join(sorted(item.keys())))
                  print('AIR_TARGET_ENTRY_POINT_COUNT='+str(len(entry)))
                  print('AIR_TARGET_ENTRY_POINT_TYPES='+','.join(str(x.get('entryPointType','unknown')) for x in entry))
                  print('AIR_TARGET_HAS_WEBAPP_FIELD='+str(bool(item.get('webApp'))).lower())
                  print('AIR_TARGET_HAS_EXECUTIONAPI_FIELD='+str(bool(item.get('executionApi'))).lower())
                  print('AIR_WEB_DEPLOYMENT_ACCESS='+str(access))
          print('AIR_TARGET_DEPLOYMENT_FOUND='+str(target_found).lower())
          print('AIR_ALL_DEPLOYMENT_ENTRY_TYPES='+','.join(entry_types or ['none']))
          config=json.loads(pathlib.Path('/tmp/air-bound-script/appsscript.json').read_text(encoding='utf-8'))
          clasp=json.loads(pathlib.Path('/tmp/air-bound-script/.clasp.json').read_text(encoding='utf-8'))
          print('AIR_API_EXECUTABLE_DEPLOYMENTS='+str(api_count))
          print('AIR_API_EXECUTABLE_ACCESS='+','.join(api_access or ['none']))
          print('AIR_MANIFEST_EXECUTION_API_ACCESS='+str((config.get('executionApi') or {}).get('access','unset')))
          print('AIR_CLASP_PROJECT_ID_PRESENT='+str(bool(clasp.get('projectId'))).lower())
          PY

      - name: Report deployment access configuration
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('/tmp/air-bound-script/appsscript.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          print(json.dumps({
            'webapp': data.get('webapp'),
            'executionApi': data.get('executionApi'),
            'oauthScopes': data.get('oauthScopes',[])
          },ensure_ascii=False,sort_keys=True))
          PY

      - name: Report Apps Script API deployment entry points
        env:
          AIR_SCRIPT_ID: 1snEntW5W9KZ_zKHP5bT4D-fmr-sbDdjV4-izjRxf46l8HWcrt3GJqU9V
          AIR_DEPLOYMENT_ID: AKfycbxyxnfxFl3GLkTukEDoM-n4gOnlslMv52Ghl2pGho9tQWpnSf6aSXAg7qZZFwtfnrKb
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.parse, urllib.request
          creds=json.load(open(os.path.expanduser('~/.clasprc.json'),encoding='utf-8'))
          credential=(creds.get('tokens') or {}).get('default') or {}
          if not credential and isinstance(creds.get('token'),dict):
              credential=dict(creds['token'])
              settings=creds.get('oauth2ClientSettings') or {}
              credential.setdefault('client_id',settings.get('clientId'))
              credential.setdefault('client_secret',settings.get('clientSecret'))
          access=credential.get('access_token')
          expiry=float(credential.get('expiry_date') or 0)/1000
          if not access or expiry < time.time()+60:
              form=urllib.parse.urlencode({
                  'client_id':credential.get('client_id') or '',
                  'client_secret':credential.get('client_secret') or '',
                  'refresh_token':credential.get('refresh_token') or '',
                  'grant_type':'refresh_token'
              }).encode()
              request=urllib.request.Request('https://oauth2.googleapis.com/token',data=form,
                  headers={'Content-Type':'application/x-www-form-urlencoded'},method='POST')
              with urllib.request.urlopen(request,timeout=30) as response:
                  access=json.load(response).get('access_token')
          if not access:
              raise SystemExit('AIR_SCRIPT_API_ACCESS_TOKEN_UNAVAILABLE')
          base='https://script.googleapis.com/v1/projects/'+urllib.parse.quote(os.environ['AIR_SCRIPT_ID'],safe='')+'/deployments'
          deployments=[]
          page=''
          while True:
              url=base+'?pageSize=100'+('&pageToken='+urllib.parse.quote(page,safe='') if page else '')
              request=urllib.request.Request(url,headers={'Authorization':'Bearer '+access,'Accept':'application/json'})
              with urllib.request.urlopen(request,timeout=30) as response:
                  data=json.load(response)
              deployments.extend(data.get('deployments') or [])
              page=data.get('nextPageToken') or ''
              if not page: break
          types={}
          target=None
          for deployment in deployments:
              for entry in deployment.get('entryPoints') or []:
                  kind=entry.get('entryPointType') or 'unknown'
                  types[kind]=types.get(kind,0)+1
              if deployment.get('deploymentId')==os.environ['AIR_DEPLOYMENT_ID']:
                  target=deployment
          safe_target=[]
          if target:
              for entry in target.get('entryPoints') or []:
                  kind=entry.get('entryPointType') or 'unknown'
                  config=entry.get({'WEB_APP':'webApp','EXECUTION_API':'executionApi'}.get(kind,'') or '',{})
                  safe_target.append({'type':kind,'access':config.get('access'),'executeAs':config.get('executeAs')})
          print('AIR_SCRIPT_DEPLOYMENT_COUNT='+str(len(deployments)))
          print('AIR_SCRIPT_ENTRY_POINT_COUNTS='+json.dumps(types,sort_keys=True))
          print('AIR_TARGET_DEPLOYMENT_PRESENT='+str(target is not None).lower())
          print('AIR_TARGET_ENTRY_POINTS='+json.dumps(safe_target,sort_keys=True))
          PY

      - name: Report trigger lifecycle code
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re
          root=pathlib.Path('/tmp/air-bound-script')
          names='doPost|continueFullSyncV292_|repairAutomationV404|createTriggers|createMinimalTriggersV301_|deleteOperationalTriggersV292_|ensureOperationalTriggersV361_|continueFastCheckV293_|scheduledFastCheckContinuationV293_|scheduledFullSyncContinuationV292_|scheduledFastCheck|ensureWatchdogTriggerV361_|clearFastCheckStateV293_|clearFullSyncStateV292_|isFastCheckPendingV293_|isFullSyncPendingV292_|clearFullSync|clearFastCheck|scheduledDailyMaintenance|runLiveCycleV320_|requestFastCheckV293_|githubTokenIngress|handleGithub|verifyGithub|validateGithub'
          pattern=re.compile(r'^\s*function\s+('+names+r')\s*\(',re.M)
          secret=re.compile(r'(?i)(token|secret|password|authorization|bearer)(\s*[:=]\s*|\s+)[^\s,;]+')
          count=0
          for path in sorted(p for p in root.rglob('*') if p.suffix in ('.gs','.js')):
              lines=path.read_text(encoding='utf-8',errors='replace').splitlines()
              for i,line in enumerate(lines):
                  match=pattern.search(line)
                  if not match: continue
                  end=min(len(lines),i+(120 if match.group(1) in ('continueFastCheckV293_','continueFullSyncV292_','scheduledDailyMaintenance') else 55))
                  for j in range(i+1,min(len(lines),i+500)):
                      if re.match(r'^\s*function\s+[A-Za-z0-9_$]+\s*\(',lines[j]):
                          end=min(end,j); break
                  print('SOURCE_FILE='+path.name+' FUNCTION='+match.group(1)+' LINE='+str(i+1))
                  for n in range(i,end):
                      safe=secret.sub(r'\1=[redacted]',lines[n])
                      safe=re.sub(r'[A-Za-z0-9_-]{40,}','[opaque]',safe)
                      print('CODE '+str(n+1)+':'+safe[:260])
                  count+=1
          print('TRIGGER_FUNCTIONS_FOUND='+str(count))
          if count==0: raise SystemExit('AIR_TRIGGER_FUNCTIONS_NOT_FOUND')
          PY
