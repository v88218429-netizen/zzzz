name: WB traffic collector checks
on:
  pull_request:
    paths:
      - 'wb_worker/**'
      - '.github/workflows/wb-traffic-check.yml'
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wb_worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install httpx
      - run: python -m py_compile traffic_sync.py main.py
      - run: python -m unittest -v test_traffic_sync.py
