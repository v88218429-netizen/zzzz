name: WB AI Manager v1.1.5 verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "wb_ai_manager/source/**"
      - ".github/workflows/wb-ai-manager-release-verify.yml"
  push:
    branches: [mainggg]
    paths:
      - "wb_ai_manager/source/**"
      - ".github/workflows/wb-ai-manager-release-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        shell: bash
        run: |
          set -euo pipefail
          cd wb_ai_manager/source
          test "$(cat VERSION)" = "1.1.5"
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio

      - name: Clean run 1
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/wb-ai-run1"
          cp -a wb_ai_manager/source "$RUNNER_TEMP/wb-ai-run1"
          cd "$RUNNER_TEMP/wb-ai-run1"
          python -m compileall -q src scripts
          node --check src/wb_control_center/ui/dashboard.js
          pytest -q

      - name: Clean run 2
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/wb-ai-run2"
          cp -a wb_ai_manager/source "$RUNNER_TEMP/wb-ai-run2"
          cd "$RUNNER_TEMP/wb-ai-run2"
          python -m compileall -q src scripts
          pytest -q

      - name: Agent surface
        shell: bash
        run: |
          set -euo pipefail
          cd wb_ai_manager/source
          python - <<'PY'
          from wb_control_center.agents import AGENT_CLASSES
          assert {"portal_news", "seller_services"}.issubset(AGENT_CLASSES), sorted(AGENT_CLASSES)
          print(f"agents={len(AGENT_CLASSES)}")
          PY

      - name: Build final archive
        shell: bash
        run: |
          set -euo pipefail
          cd wb_ai_manager/source
          zip -qr "$RUNNER_TEMP/WB_AI_Manager_v1.1.5_CANONICAL.zip" . -x ".venv/*" "__pycache__/*" "*.pyc" ".pytest_cache/*"
          sha256sum "$RUNNER_TEMP/WB_AI_Manager_v1.1.5_CANONICAL.zip" > "$RUNNER_TEMP/WB_AI_Manager_v1.1.5_CANONICAL.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: WB_AI_Manager_v1.1.5_CANONICAL
          path: |
            ${{ runner.temp }}/WB_AI_Manager_v1.1.5_CANONICAL.zip
            ${{ runner.temp }}/WB_AI_Manager_v1.1.5_CANONICAL.zip.sha256
          retention-days: 30

