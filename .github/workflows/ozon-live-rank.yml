name: Ozon live rank scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"
  push:
    branches: [mainggg]
    paths:
      - "ozon_live/scanner.py"
      - "ozon_live/config.json"
      - "ozon_live/requirements.txt"
      - ".github/workflows/ozon-live-rank.yml"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mainggg
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r ozon_live/requirements.txt
      - name: Show Chrome
        run: google-chrome --version || chromium --version
      - name: Proxy geo preflight
        env:
          OZON_PROXY_PROVIDER: decodo
          OZON_PROXY_HOST: gate.decodo.com
          OZON_PROXY_PORT: "7000"
          OZON_PROXY_USER: ${{ secrets.OZON_PROXY_USER }}
          OZON_PROXY_PASS: ${{ secrets.OZON_PROXY_PASS }}
        run: |
          test -n "$OZON_PROXY_USER" || { echo "Missing OZON_PROXY_USER secret"; exit 2; }
          test -n "$OZON_PROXY_PASS" || { echo "Missing OZON_PROXY_PASS secret"; exit 2; }
          python ozon_live/proxy_preflight.py
      - name: Run live scanner
        env:
          OZON_PROXY_PROVIDER: decodo
          OZON_PROXY_HOST: gate.decodo.com
          OZON_PROXY_PORT: "7000"
          OZON_PROXY_USER: ${{ secrets.OZON_PROXY_USER }}
          OZON_PROXY_PASS: ${{ secrets.OZON_PROXY_PASS }}
        run: xvfb-run -a python ozon_live/scanner.py --config ozon_live/config.json --out ozon_live/results/latest.json
      - name: Commit latest result
        if: always()
        run: |
          git config user.name "ozon-live-bot"
          git config user.email "actions@users.noreply.github.com"
          test -f ozon_live/results/latest.json || exit 0
          git add ozon_live/results/latest.json ozon_live/results/proxy_health.json 2>/dev/null || true
          git add -f ozon_live/debug 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Ozon live positions [skip ci]"
          git push
