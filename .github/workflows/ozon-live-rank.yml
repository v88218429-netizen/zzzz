name: Ozon live rank scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"
  push:
    branches: [mainggg]
    paths:
      - "ozon_live/scanner.py"
      - "ozon_live/config.json"
      - "ozon_live/requirements.txt"
      - ".github/workflows/ozon-live-rank.yml"

permissions:
  contents: write

jobs:
  scan:
    runs-on: [self-hosted, macOS, ozon-live]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mainggg
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r ozon_live/requirements.txt
      - name: Show Chrome
        run: /Applications/Google\\ Chrome.app/Contents/MacOS/Google\\ Chrome --version || true
      - name: Run live scanner
        run: python3 ozon_live/scanner.py --config ozon_live/config.json --out ozon_live/results/latest.json
      - name: Commit latest result
        if: always()
        run: |
          git config user.name "ozon-live-bot"
          git config user.email "actions@users.noreply.github.com"
          test -f ozon_live/results/latest.json || exit 0
          git add ozon_live/results/latest.json
          git add -f ozon_live/debug 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Ozon live positions [skip ci]"
          git push
