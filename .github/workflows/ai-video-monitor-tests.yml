name: AI Video Monitor regression tests
on:
  push:
    branches: [mainggg]
    paths:
      - 'ai_video_monitor_autonomous.py'
      - 'test_ai_video_monitor_autonomous.py'
      - '.github/workflows/ai-video-monitor-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal test dependencies
        run: python -m pip install --quiet requests
      - name: Validate syntax and regression tests
        run: |
          python -m py_compile ai_video_monitor_autonomous.py
          python -m unittest -v test_ai_video_monitor_autonomous.py
