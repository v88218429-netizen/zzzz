version: 5

safety:
  # Read-only release: nothing executes automatically and the build fuse blocks WB writes.
  auto_execute_tools: []

  always_require_approval:
    - wb_prices_set
    - wb_promotion_exit
    - wb_cards_update
    - wb_cards_create
    - wb_cards_move_to_trash
    - wb_media_upload
    - wb_media_upload_file
    - wb_advert_bids_set
    - wb_advert_cluster_bids
    - wb_advert_deposit
    - wb_advert_stop
    - wb_advert_delete
    - wb_supply_deliver
    - wb_order_cancel
    - wb_return_answer
    - wb_stocks_delete
    - wb_warehouse_delete

  # TECHNICAL EMERGENCY CAPS. These are not recommended bids.
  # A client-specific policy should usually set lower limits during onboarding.
  limits:
    absolute_bid_cap_rub: 1000
    absolute_cluster_bid_cap_rub: 1000
    max_bid_change_pct: 10
    max_price_change_pct: 5
    max_daily_ad_budget_change_pct: 15
    max_single_ad_deposit_rub: 5000

thresholds:
  advertising:
    # These are defaults for ALERTING only, never universal WB benchmarks.
    # Client/category baselines must supersede them once enough history exists.
    target_drr_pct: 8
    warn_drr_pct: 12
    critical_drr_pct: 20
    zero_orders_spend_rub: 1500
    min_spend_for_drr_rub: 1000
    ctr_drop_pct: 30
    cpc_growth_pct: 35
    min_clicks_for_decision: 30
    min_orders_for_scaling_decision: 5
    cooldown_hours_after_bid_change: 4

  search:
    position_drop_warn: 5
    position_drop_critical: 12

  inventory:
    critical_days_cover: 2
    warning_days_cover: 5
    overstock_days_cover: 75
    target_days_cover: 14

  funnel:
    conversion_drop_pct: 25
    orders_drop_pct: 30

  returns:
    open_claims_warn: 3

  reviews:
    unanswered_warn: 5
    rating_alert_below: 4

  finance:
    penalty_alert_rub: 1000

schedules:
  api_health: 10
  cards: 20
  advertising_monitor: 15
  advertising_optimizer: 30
  search_positions: 60
  inventory: 30
  supply: 120
  funnel: 60
  price_margin: 30
  finance: 360
  reviews_questions: 15
  orders_fbs: 10
  returns_quality: 30
  competitors: 120
  experiments: 60
  cost_guard: 360
  buyer_chats: 15
  documents: 720
  supervisor: 15


# Runtime strategy is editable live from Policy Studio and persisted in SQLite.
# Hard safety caps above remain authoritative and cannot be loosened there.
runtime_defaults:
  advertising: policy_studio_hot_reload
