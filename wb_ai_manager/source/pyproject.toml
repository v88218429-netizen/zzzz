[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wb-ai-control-center"
version = "1.1.4"
description = "Self-updating read-only WB AI operating system with cohort analytics and safe rollback"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
  "mcp>=1.12,<2",
  "wb-mcp-server>=2.6.1,<3",
  "tenacity>=9.0",
  "openpyxl>=3.1",
  "safetensors>=0.4",
  "accelerate>=1.0",
  "transformers>=4.55",
  "torch>=2.4",
  "pillow>=10.4",
]

[project.optional-dependencies]
cloud-llm = ["anthropic>=0.64", "openai>=1.50"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
wb-control = "wb_control_center.cli:main"
wb-ai-manager-mcp = "wb_control_center.plugin_gateway:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.package-data]
wb_control_center = ["ui/*.html", "ui/*.css", "ui/*.js"]
